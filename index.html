    <div class="modal-msg" style="margin-bottom:10px;font-weight:700;">계약 데이터 붙여넣기</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6;">
      스프레드시트에서 헤더 행을 포함해 복사한 표를 아래에 붙여넣어주세요.<br>
      (계약내용, 계약일, 계약기간, 고시원 명, 방이름, 계약자, 계약자 연락처, 입실자, 입실료, 결제금액, 계약구분, 결제구분, 보증금, 보증금 안내)
    </div>
  `;
  const textarea = document.createElement('textarea');
  textarea.rows = 10;
  textarea.style.cssText = 'width:100%;font-family:monospace;font-size:11.5px;';
  textarea.placeholder = '계약내용\t계약일\t계약기간\t고시원 명\t방이름\t계약자\t계약자 연락처\t입실자\t...';
  box.appendChild(textarea);

  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소'; cancelBtn.onclick = close;
  const importBtn = document.createElement('button');
  importBtn.className = 'btn primary'; importBtn.textContent = '가져오기';
  importBtn.onclick = ()=> parseAndImportContracts(textarea.value, close);
  btnRow.appendChild(cancelBtn); btnRow.appendChild(importBtn);
  box.appendChild(btnRow);

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> textarea.focus(), 0);
}

function parseAndImportContracts(text, onImported){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=> l.trim()!=='');
  if(lines.length < 2){
    showAlert('헤더 행과 데이터 행이 포함된 표를 붙여넣어주세요.');
    return;
  }
  const headerCells = lines[0].split('\t');
  const dataRows = lines.slice(1).map(l=> l.split('\t'));
  importContractGrid(headerCells, dataRows, onImported);
}

function handleContractExcelFile(file, onImported){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let grid;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
    }catch(err){
      showAlert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      return;
    }
    if(!grid || grid.length < 2){
      showAlert('헤더 행과 데이터 행이 포함된 엑셀 파일을 업로드해주세요.');
      return;
    }
    const headerCells = grid[0].map(v=> v==null ? '' : String(v));
    const dataRows = grid.slice(1).map(row=> row.map(v=> v==null ? '' : v));
    importContractGrid(headerCells, dataRows, onImported);
  };
  reader.readAsArrayBuffer(file);
}

function contractSignature(c){
  // 계약현황 팝업에 실제로 노출되는 항목(계약일/계약기간/계약자/입실료/결제금액/계약구분)만으로
  // 중복 여부를 판단한다. 나머지 항목(입실자/계약상태/보증금 등)까지 모두 같아야 한다고 보면
  // 스프레드시트 원본의 사소한 차이 때문에 눈에 보이는 완전 중복도 못 잡는 경우가 있었다.
  // 날짜는 "2026-01-15"와 "26.01.15"처럼 표기 형식만 다를 뿐 같은 날짜인 경우가 있어서,
  // 문자열을 그대로 비교하지 않고 정규화한 값으로 비교해야 진짜 중복을 놓치지 않는다.
  const normDate = normalizeFlexDate(c.contractDate) || (c.contractDate || '').trim();
  const range = parseContractPeriodRange(c.contractPeriod);
  const normPeriod = range ? `${range.start}~${range.end}` : (c.contractPeriod || '').trim();
  return [c.roomId, normDate, normPeriod, c.contractor, c.rent, c.paymentAmount, c.contractCategory].join('|');
}
function importContractGrid(headerCells, dataRows, onImported){
  const idx = {};
  headerCells.forEach((h, i)=>{
    const key = CONTRACT_FIELD_BY_HEADER[cleanKeyLoose(h).replace(/\s+/g,'')];
    if(key) idx[key] = i;
  });
  if(idx.branchName==null || idx.roomName==null){
    showAlert('헤더 행에서 "고시원 명"과 "방이름" 열을 찾을 수 없습니다. 첫 줄이 헤더인지 확인해주세요.');
    return;
  }

  const existingSigs = new Set(DB.contracts.map(contractSignature));

  const newContracts = [];
  const unmatched = [];
  let duplicateCount = 0;
  dataRows.forEach((cells, i)=>{
    // "계약내용"처럼 버튼/아이콘만 있고 텍스트가 없는 첫 열은, 표에서 복사할 때 해당 칸의
    // 탭 문자까지 함께 누락되는 경우가 있다. 그러면 데이터 행의 칸 수가 헤더보다 모자라면서
    // 뒤 열들이 통째로 한 칸씩 앞으로 밀려 엉뚱한 값이 매칭된다. 모자란 칸 수만큼 뒤에서부터
    // 맞춰(오른쪽 정렬) 실제 값이 원래 있어야 할 헤더 열에 들어가도록 보정한다.
    const shortBy = Math.max(0, headerCells.length - cells.length);
    const get = (key)=>{
      if(idx[key]==null) return '';
      const pos = idx[key] - shortBy;
      return pos>=0 && cells[pos]!=null ? String(cells[pos]).trim() : '';
    };
    const branchRaw = cleanKeyLoose(get('branchName'));
    const roomRaw = cleanKeyLoose(get('roomName')).replace(/호$/,'');
    if(!branchRaw && !roomRaw) return;

    const resolvedBranchName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
    let branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedBranchName.toLowerCase());
    let roomSearchName = roomRaw;
    if(!branch){
      // 고시원 명은 동 구분 없이 공통으로 쓰고, 방이름 앞에 "A동"처럼 건물 구분이 붙어 있는 경우
      // (예: "A동 309호 블레스+룸 / 원룸 / 외창") 지점명에 동을 붙인 이름("...A동")으로 다시 찾는다.
      const buildingMatch = roomRaw.match(/^([A-Za-z0-9가-힣]{1,4}동)\s+(.*)$/);
      if(buildingMatch){
        const withBuilding = cleanKeyLoose(`${resolvedBranchName} ${buildingMatch[1]}`);
        const branchWithBuilding = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===withBuilding.toLowerCase());
        if(branchWithBuilding){
          branch = branchWithBuilding;
          roomSearchName = buildingMatch[2];
        }
      }
    }
    let room = branch ? DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomSearchName)) : null;
    if(!room && branch){
      // 방이름에 호실번호 외의 상세 명칭이 붙어 있어도(예: "304 그레이스"), 지점명과 호실번호 앞자리 숫자만 일치하면 매칭
      const prefix = roomNumberPrefix(roomSearchName);
      if(prefix) room = DB.rooms.find(r=> r.branchId===branch.id && roomNumberPrefix(r.number)===prefix);
    }
    if(!room){
      unmatched.push(`[${i+2}행] ${branchRaw} ${roomRaw}호 (${!branch ? '지점' : '호실'} 못 찾음)`);
      return;
    }

    const candidate = {
      id: uid('ct'), roomId: room.id,
      contractDate: get('contractDate'), contractPeriod: get('contractPeriod'), district: get('district'),
      branchName: branchRaw, roomName: roomRaw, contractor: get('contractor'), contractorPhone: get('contractorPhone'), resident: get('resident'),
      rent: get('rent'), paymentAmount: get('paymentAmount'), contractStatus: get('contractStatus'),
      contractType: get('contractType'), contractCategory: get('contractCategory'), paymentCategory: get('paymentCategory'),
      deposit: get('deposit'), depositNote: get('depositNote'), contractContent: get('contractContent')
    };
    const sig = contractSignature(candidate);
    if(existingSigs.has(sig)){ duplicateCount++; return; }
    existingSigs.add(sig);
    newContracts.push(candidate);
  });

  if(newContracts.length===0){
    showAlert(`가져올 수 있는 계약 데이터가 없습니다.`
      + (duplicateCount ? `\n(이미 등록된 중복 데이터 ${duplicateCount}건 제외)` : '')
      + (unmatched.length ? `\n\n${unmatched.slice(0,20).join('\n')}` : ''));
    return;
  }

  // 호실별로 계약일이 가장 최신인 건 하나만 골라, 빈 방이면 그 계약 정보로 입실자를 새로 등록한다.
  // (한 번에 여러 건의 계약 이력이 붙여넣기 될 수 있으므로, 입실자 등록은 호실당 최신 계약 1건에만 적용)
  // 이미 입실자가 있는 방은 정보를 건드리지 않는다 — 계약 이력만 저장하고, 담당자가 확인할 수 있도록
  // "계약 확인 필요" 표시만 남긴다(최신 계약의 종료일과 퇴실예정일이 다르면 "계약현황" 버튼의
  // 기존 하이라이트도 함께 뜬다). 신규 등록이든 기존 입실자든 지점별로 한 곳에서 모아 볼 수 있다.
  const latestByRoom = new Map();
  newContracts.forEach(c=>{
    const prev = latestByRoom.get(c.roomId);
    if(!prev || (c.contractDate||'') >= (prev.contractDate||'')) latestByRoom.set(c.roomId, c);
  });
  const residentSyncActions = [];
  const existingResidentsToFlag = [];
  let residentSkipCount = 0;
  latestByRoom.forEach(c=>{
    const room = DB.rooms.find(r=>r.id===c.roomId);
    if(!room) return;
    const roomResidents = DB.residents.filter(p=>p.roomId===room.id);
    if(roomResidents.length > 0){
      // 기존 입실자가 있으면 정보를 자동으로 덮어쓰지 않고 "계약 확인 필요"로만 표시한다.
      // 담당자가 카드를 열면 해당 호실의 최신 계약(DB.contracts)에서 이름/연락처/입실일/퇴실일을
      // 그때그때 다시 계산해 기존 값과 비교해서 보여주므로, 여기서 따로 값을 저장해둘 필요는 없다.
      existingResidentsToFlag.push(...roomResidents);
      return;
    }
    const range = parseContractPeriodRange(c.contractPeriod);
    const residentName = c.resident || c.contractor;
    if(!range || !residentName){ residentSkipCount++; return; }
    const newResident = {
      id: uid('p'), roomId: room.id, name: residentName, phone: c.contractorPhone || '',
      channel: '독립생활', resStatus:'', contractType: c.contractCategory || '신규',
      moveIn: range.start, moveOut: range.end, originalMoveIn: range.start, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex:0, justImported:true
    };
    newResident.resStatus = computeResStatus(newResident);
    residentSyncActions.push({ room, newResident });
  });

  showConfirm(
    `계약 데이터 ${newContracts.length}건을 가져올까요?`
      + (duplicateCount ? `\n(이미 등록된 중복 ${duplicateCount}건은 제외됩니다)` : '')
      + (unmatched.length ? `\n(호실을 찾지 못한 ${unmatched.length}건은 제외됩니다)` : '')
      + (residentSyncActions.length ? `\n\n빈 호실 ${residentSyncActions.length}곳에 새 계약자 정보로 입실자를 등록합니다.` : '')
      + (existingResidentsToFlag.length ? `\n기존 입실자가 있는 호실 ${existingResidentsToFlag.length}곳은 계약 이력만 저장하고 "계약 확인 필요"로 표시합니다.` : '')
      + (residentSkipCount ? `\n(계약기간·입실자 정보가 불명확해 입실자 등록을 건너뛴 호실: ${residentSkipCount}곳)` : ''),
    ()=>{
      DB.contracts.push(...newContracts);
      batchWriteDocs(CONTRACTS_COL, newContracts).catch(e=> console.error('계약 데이터 저장 실패:', e));
      residentSyncActions.forEach(action=> DB.residents.push(action.newResident));
      existingResidentsToFlag.forEach(p=> p.justImported = true);
      logChange(`계약 데이터 가져오기: ${newContracts.length}건 추가${duplicateCount ? ` (중복 ${duplicateCount}건 제외)` : ''}${unmatched.length ? ` (미매칭 ${unmatched.length}건)` : ''}${residentSyncActions.length ? ` / 빈 호실 입실자 등록 ${residentSyncActions.length}건` : ''}${existingResidentsToFlag.length ? ` / 계약 확인 필요 표시 ${existingResidentsToFlag.length}건` : ''}`);
      scheduleSave(); render();
      if(typeof onImported === 'function') onImported();
      showAlert(`${newContracts.length}건을 가져왔습니다.`
        + ((residentSyncActions.length || existingResidentsToFlag.length) ? `\n확인이 필요한 곳: ${residentSyncActions.length + existingResidentsToFlag.length}곳 (신규 등록 ${residentSyncActions.length}곳 + 기존 입실자 ${existingResidentsToFlag.length}곳)\n각 지점 화면의 "계약 확인 필요" 탭 또는 대시보드에서 모아볼 수 있고, 정보를 수정하면 목록에서 사라집니다.` : '')
        + (duplicateCount ? `\n이미 등록되어 제외된 중복 데이터: ${duplicateCount}건` : '')
        + (unmatched.length ? `\n\n호실을 찾지 못한 항목:\n${unmatched.slice(0,20).join('\n')}${unmatched.length>20 ? `\n...외 ${unmatched.length-20}건` : ''}` : ''));
    }
  );
}

const CONTRACT_HISTORY_PAGE_SIZE = 10;
function showContractHistoryModal(room){
  const contracts = DB.contracts.filter(c=>c.roomId===room.id)
    .slice()
    .sort((a,b)=> (b.contractDate||'').localeCompare(a.contractDate||''));
  const totalPages = Math.max(1, Math.ceil(contracts.length / CONTRACT_HISTORY_PAGE_SIZE));
  let page = 1;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.style.maxWidth = '820px';
  const close = ()=> overlay.remove();
  const roomResidents = DB.residents.filter(p=>p.roomId===room.id);
  const latestContract = contracts[0] || null; // 가장 나중에 생성된(계약일 기준 최신) 계약만 대상
  const canApplyUpdate = canEdit() && !!latestContract;

  function buildResidentFromContract(pu, range, c){
    const newResident = {
      id: uid('p'), roomId: room.id, name: pu.name, phone: pu.phone,
      channel: '독립생활', resStatus:'', contractType: c.contractCategory || '신규',
      moveIn: range.start, moveOut: range.end, originalMoveIn: range.start, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex:0
    };
    newResident.resStatus = computeResStatus(newResident);
    return newResident;
  }

  function replaceResidentsWithContract(c){
    const pu = contractProposedResidentData(c);
    const range = parseContractPeriodRange(c.contractPeriod);
    if(!pu.name || !range){
      showAlert('이 계약에는 입실자 이름 또는 계약기간 정보가 없어 처리할 수 없습니다.');
      return;
    }
    const detail = `이름: ${pu.name}\n연락처: ${pu.phone || '-'}\n입실일: ${pu.moveIn || '-'}\n퇴실일: ${pu.moveOut || '-'}`;

    if(roomResidents.length===0){
      // 기존 입실자가 없는 빈 방: 새 계약자 정보로 바로 입실 처리
      showConfirm(
        `이 계약 내용으로 신규 입실자를 등록할까요?\n\n${detail}`,
        ()=>{
          DB.residents.push(buildResidentFromContract(pu, range, c));
          logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 신규 입실자 등록: ${pu.name}`);
          scheduleSave(); render(); close();
        }
      );
      return;
    }

    const oldNames = roomResidents.map(p=> p.name || '(이름 미입력)').join(', ');
    const anyNotYetDue = roomResidents.some(p=> !isOverdue(p));

    if(anyNotYetDue){
      // 기존 입실자의 퇴실일이 아직 지나지 않은 경우: 기존 입실자는 퇴실예정으로 두고, 신규 계약자는 입실예정자로 등록
      showConfirm(
        `기존 입실자(${oldNames})의 퇴실일이 아직 지나지 않았습니다.\n`
        + `기존 입실자는 퇴실예정으로 표시하고, 새 계약 내용으로 입실예정자를 등록할까요?\n\n${detail}`,
        ()=>{
          roomResidents.forEach(p=>{ p.scheduledToLeave = true; });
          DB.residents.push(buildResidentFromContract(pu, range, c));
          logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 입실예정자 등록 (기존 입실자 ${oldNames} 퇴실예정 처리)`);
          scheduleSave(); render(); close();
        }
      );
      return;
    }

    // 기존 입실자의 퇴실일이 이미 지난 경우: 즉시 퇴실 처리 후 신규 입실자 등록
    showConfirm(
      `기존 입실자(${oldNames})를 퇴실 처리하고, 새 계약 내용으로 신규 입실자를 등록할까요?\n\n${detail}`,
      ()=>{
        roomResidents.forEach(p=> moveResidentToHistory(p));
        DB.residents.push(buildResidentFromContract(pu, range, c));
        logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 입실자 교체: ${oldNames} → ${pu.name}`);
        scheduleSave(); render(); close();
      }
    );
  }

  function renderBody(){
    box.innerHTML = '';

function toISODateStr(v){
  if(v == null || v==='') return '';
  if(v instanceof Date){
    // 엑셀/구글시트 날짜 직렬값에 부동소수점 오차가 섞여 있어(예: 자정이 아닌 23:59:xx)
    // 하루 전날로 잘못 계산되는 경우가 있어, 가장 가까운 날짜로 반올림해 보정합니다.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth()+1).padStart(2,'0'), d = String(rounded.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'number'){
    // 엑셀 날짜 직렬번호(문자열이 아닌 순수 숫자로 남은 경우) 보정
    const parsed = XLSX.SSF && XLSX.SSF.parse_date_code ? XLSX.SSF.parse_date_code(Math.round(v)) : null;
    if(parsed){
      const y = parsed.y, m = String(parsed.m).padStart(2,'0'), d = String(parsed.d).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
  }
  return String(v).trim();
}

function renderUserManagePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>사용자 관리</h3>`;
  const body = document.createElement('div');
  body.textContent = '불러오는 중…';

  USERS_COL.get().then(snap=>{
    body.innerHTML = '';
    const users = [];
    snap.forEach(doc=> users.push({ id: doc.id, ...doc.data() }));
    const order = { pending:0, viewer:1, editor:2, superadmin:3 };
    users.sort((a,b)=> (order[a.role] ?? 9) - (order[b.role] ?? 9) || (a.email||'').localeCompare(b.email||''));
    if(users.length===0){ body.textContent = '등록된 사용자가 없습니다.'; return; }

    users.forEach(u=>{
      const isPending = u.role === 'pending';
      const entryWrap = document.createElement('div');

      const row = document.createElement('div');
      row.className = 'user-row';

      const emailSpan = document.createElement('span');
      emailSpan.className = 'user-email';

      row.appendChild(emailSpan);

      if(isPending){
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.style.background = 'var(--st-leaving-bg)'; badge.style.color = 'var(--st-leaving)';
        badge.textContent = '승인 대기';
        row.appendChild(badge);
      }

      if(u.name || u.phone){
        const info = document.createElement('span');
        info.style.cssText = 'font-size:11.5px;color:var(--ink-soft);';
        const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[u.requestedRole];
        info.textContent = [u.name, u.phone, isPending && roleLabel ? `희망: ${roleLabel}` : null].filter(Boolean).join(' · ');
        row.appendChild(info);
      }

      const roleSel = document.createElement('select');
      const defaultRole = isPending ? (u.requestedRole || 'viewer') : u.role;
      [['viewer','조회 전용'], ['editor','수정 가능'], ['superadmin','슈퍼어드민']].forEach(([val,label])=>{
        const o = document.createElement('option');
        o.value = val; o.textContent = label; o.selected = defaultRole === val;
        roleSel.appendChild(o);
      });
      row.appendChild(roleSel);

      const scopeSel = document.createElement('select');
      scopeSel.title = '이 계정이 접근할 수 있는 지점 범위';
      [['all','전체 지점'], ['selected','지점 선택']].forEach(([val,label])=>{
        const o = document.createElement('option');
        o.value = val; o.textContent = label; o.selected = (u.branchScope || 'all') === val;
        scopeSel.appendChild(o);
      });
      row.appendChild(scopeSel);

      const branchChecks = document.createElement('div');
      branchChecks.className = 'user-branch-checks';
      const checkInputs = DB.branches.map(b=>{
        const lbl = document.createElement('label');
        lbl.className = 'user-branch-check-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = b.id;
        cb.checked = Array.isArray(u.branchIds) && u.branchIds.includes(b.id);
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(branchLabel(b)));
        branchChecks.appendChild(lbl);
        return cb;
      });

      function syncScopeVisibility(){
        const isSuper = roleSel.value === 'superadmin';
        scopeSel.style.display = isSuper ? 'none' : '';
        branchChecks.style.display = (!isSuper && scopeSel.value === 'selected') ? '' : 'none';
      }
      roleSel.addEventListener('change', syncScopeVisibility);
      scopeSel.addEventListener('change', syncScopeVisibility);
      syncScopeVisibility();

      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn small primary';
      approveBtn.textContent = isPending ? '승인' : '역할 변경';
      approveBtn.onclick = ()=>{
        const newRole = roleSel.value;
        const branchScope = newRole === 'superadmin' ? 'all' : scopeSel.value;
        const branchIds = branchScope === 'selected' ? checkInputs.filter(cb=>cb.checked).map(cb=>cb.value) : [];
        if(branchScope === 'selected' && branchIds.length===0){
          showAlert('지점을 1개 이상 선택해주세요.');
          return;
        }
        USERS_COL.doc(u.id).set({ email: u.email, role: newRole, branchScope, branchIds, approvedBy: CURRENT_USER.email, approvedAt: new Date().toISOString() }, { merge:true })
          .then(()=>{
            const scopeLabel = branchScope === 'selected'
              ? ` (${branchIds.map(id=> DB.branches.find(b=>b.id===id)?.name || id).join(', ')})`
              : '';
            writeChangeLog(`${u.email} 계정 권한을 "${newRole}"(으)로 설정${scopeLabel}`);
            render();
          })
          .catch(e=> showAlert('처리 실패: ' + e.message));
      };
      row.appendChild(approveBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'iconbtn del';
      delBtn.innerHTML = '&times;';
      delBtn.title = isPending ? '요청 거절' : '계정 접근 차단 (대기 상태로 전환)';
      delBtn.onclick = ()=>{
        showConfirm(isPending ? `${u.email} 계정 요청을 거절할까요?` : `${u.email} 계정의 접근을 차단할까요? (승인 대기 상태로 전환됩니다)`, ()=>{
          USERS_COL.doc(u.id).set({ email: u.email, role:'pending' }, { merge:true })
            .then(()=>{ writeChangeLog(`${u.email} 계정 접근 차단/거절`); render(); });
        });
      };
      row.appendChild(delBtn);

      entryWrap.appendChild(row);
      entryWrap.appendChild(branchChecks);
      body.appendChild(entryWrap);
    });
  }).catch(e=>{ body.textContent = '사용자 목록을 불러오지 못했습니다: ' + e.message; });

  return box;
}

const CHANGELOG_PAGE_SIZE = 10;
function renderChangeLogPanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>변경 로그</h3>`;

  const toolbar = document.createElement('div');
  toolbar.className = 'log-toolbar';
  const dateWrap = document.createElement('div');
  const dateLabel = document.createElement('label');
  dateLabel.className = 'field-label'; dateLabel.textContent = '날짜 조회 (하루 단위)';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateWrap.appendChild(dateLabel); dateWrap.appendChild(dateInput);
  const searchBtn = document.createElement('button');
  searchBtn.className = 'btn small primary'; searchBtn.textContent = '조회';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn small'; resetBtn.textContent = '최근 50건 보기';
  toolbar.appendChild(dateWrap); toolbar.appendChild(searchBtn); toolbar.appendChild(resetBtn);
  box.appendChild(toolbar);

  const body = document.createElement('div');
  body.style.cssText = 'font-size:12px;color:var(--ink-soft);';
  box.appendChild(body);
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  box.appendChild(pager);

  let currentLogs = [];
  let currentPage = 1;

  function renderPage(){
    body.innerHTML = '';
    pager.innerHTML = '';
    if(currentLogs.length === 0){ body.textContent = '기록된 변경 로그가 없습니다.'; return; }
    const totalPages = Math.ceil(currentLogs.length / CHANGELOG_PAGE_SIZE);
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * CHANGELOG_PAGE_SIZE;
    currentLogs.slice(start, start + CHANGELOG_PAGE_SIZE).forEach(d=>{
      const time = (d.timestamp || '').replace('T',' ').slice(0,16);
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <span class="log-time">${esc(time)}</span>
        <span class="log-email">${esc(d.email || '-')}</span>
        <span class="log-summary">${esc(d.summary || '')}</span>
      `;
      body.appendChild(row);
    });
    if(currentLogs.length > CHANGELOG_PAGE_SIZE){
      for(let p=1; p<=totalPages; p++){
        const pBtn = document.createElement('button');
        pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
        pBtn.textContent = String(p);
        pBtn.onclick = ()=>{ currentPage = p; renderPage(); };
        pager.appendChild(pBtn);
      }
    }
  }

  function loadDefault(){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    CHANGELOG_COL.orderBy('timestamp','desc').limit(50).get().then(snap=>{
      currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
      currentPage = 1;
      renderPage();
    }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  function loadByDate(dateStr){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    const dayStart = dateStr + 'T00:00:00.000Z';
    const dayEnd = dateStr + 'T23:59:59.999Z';
    CHANGELOG_COL.where('timestamp','>=',dayStart).where('timestamp','<=',dayEnd)
      .orderBy('timestamp','desc').limit(500).get().then(snap=>{
        currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
        currentPage = 1;
        renderPage();
      }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  searchBtn.onclick = ()=>{
    if(!dateInput.value){ showAlert('조회할 날짜를 선택해주세요.'); return; }
    loadByDate(dateInput.value);
  };
  resetBtn.onclick = ()=>{ dateInput.value = ''; loadDefault(); };

  loadDefault();
  return box;
}

function renderStatsView(){

    wrap.appendChild(renderOverdueStatsCard());
    wrap.appendChild(renderPendingMoveStatsCard());

  }

  const branchSection = document.createElement('div');
  branchSection.className = 'stat-section';
  branchSection.innerHTML = `<h3>지점별 현황</h3>`;
  const table = document.createElement('table');
  table.className = 'branch-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>호실수</th><th>이용중</th><th>판매중</th><th>입실율</th><th>예약</th><th>판매보류</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  const totals = { total:0, occupied:0, forSale:0, hold:0, reserved:0, activeCount:0 };
  allowedBranches().forEach(b=>{
    const rms = DB.rooms.filter(r=>r.branchId===b.id);
    const total = rms.length;
    let occupied=0, forSale=0, activeCount=0;
    const holdRooms = [];
    rms.forEach(r=>{
      const tabs = roomTabs(r);
      if(tabs.includes('이용중')) occupied++;
      if(tabs.includes('판매중')) forSale++;
      if(tabs.includes('판매보류')) holdRooms.push(r);
      if(roomHasActiveResident(r)) activeCount++;
    });
    const reserved = rms.filter(r=> r.reserved).length;
    const occRate = total ? Math.round((activeCount/total)*100) : 0;
    totals.total += total; totals.occupied += occupied; totals.forSale += forSale;
    totals.hold += holdRooms.length; totals.reserved += reserved; totals.activeCount += activeCount;
    const occColor = occRate >= 90 ? 'var(--ink)' : (occRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
    const holdText = holdRooms.length
      ? holdRooms.map(r=> esc(r.note ? `${r.number}: ${r.note}` : `${r.number}`)).join('<br>')
      : '-';
    const tabCell = (tab, content)=> `<td><a href="#" data-goto="${b.id}" data-tab="${tab}" class="stat-cell-link">${content}</a></td>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="#" data-goto="${b.id}" data-tab="이용중" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(b))}</a></td>
      <td>${total}</td>${tabCell('이용중', occupied)}${tabCell('판매중', forSale)}<td style="color:${occColor};font-weight:700;">${occRate}%</td>${tabCell('예약', reserved)}${tabCell('판매보류', holdText)}`;
    tbody.appendChild(tr);
  });
  const totalOccRate = totals.total ? Math.round((totals.activeCount/totals.total)*100) : 0;
  const totalOccColor = totalOccRate >= 90 ? 'var(--ink)' : (totalOccRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
  const totalTr = document.createElement('tr');
  totalTr.className = 'branch-table-total';
  totalTr.innerHTML = `<td>전체</td>
    <td>${totals.total}</td><td>${totals.occupied}</td><td>${totals.forSale}</td><td style="color:${totalOccColor};font-weight:700;">${totalOccRate}%</td><td>${totals.reserved}</td><td>${totals.hold}</td>`;
  tbody.insertBefore(totalTr, tbody.firstChild);
  table.appendChild(tbody);
  branchSection.appendChild(table);
  wrap.appendChild(branchSection);

  wrap.querySelectorAll('[data-goto]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); UI.view='branch'; UI.branchId = a.dataset.goto; UI.branchTab='rooms'; UI.roomStatusFilter=a.dataset.tab || '이용중'; render(); });
  });

  return wrap;
}

/* 지점/호실/입실자 등 핵심 데이터만 하루 1건씩 자동 스냅샷으로 남긴다. 계약·퇴실 이력은
   제외한다 — 이미 건별 문서로 저장되어 있어 별도 백업 없이도 안전하고, 통째로 백업하면
   예전처럼 문서 용량 제한에 다시 걸릴 수 있다. 최근 3일치만 남기고 오래된 건 정리한다. */
async function maybeCreateDailyBackup(){
  const today = todayISO();
  try{
    const existing = await BACKUPS_COL.doc(today).get();
    if(existing.exists) return;
    const core = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
    await BACKUPS_COL.doc(today).set({ json: JSON.stringify(core), backedUpAt: new Date().toISOString() });
    const allBackups = await BACKUPS_COL.get();
    const dates = allBackups.docs.map(d=>d.id).sort(); // 오래된 날짜부터
    const toDelete = dates.slice(0, Math.max(0, dates.length - 3));
    if(toDelete.length) await batchDeleteDocs(BACKUPS_COL, toDelete);
  }catch(e){ console.error('자동 백업 실패:', e); }
}

function downloadFullBackup(){
  const backup = {
    branches: DB.branches, rooms: DB.rooms, residents: DB.residents,
    contracts: DB.contracts, residentHistory: DB.residentHistory,
    channelList: DB.channelList, shortcuts: DB.shortcuts,
    backedUpAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `monthliv_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function restoreLatestBackup(){
  let snap;
  try{
    snap = await BACKUPS_COL.get();
  }catch(e){
    console.error(e);
    showAlert('백업 목록을 불러오지 못했습니다: ' + e.message);
    return;
  }
  if(snap.empty){ showAlert('저장된 자동 백업이 없습니다.'); return; }
  const docs = snap.docs.map(d=>({ id:d.id, data:d.data() })).sort((a,b)=> b.id.localeCompare(a.id));
  const latest = docs[0];
  let core;
  try{ core = JSON.parse(latest.data.json); }catch(e){ showAlert('백업 데이터를 읽지 못했습니다.'); return; }

  showConfirm(
    `"${latest.id}" 날짜 백업을 가져올까요?\n\n` +
    `백업 데이터: 지점 ${core.branches.length}개 · 호실 ${core.rooms.length}개 · 입실자 ${core.residents.length}명\n` +
    `현재 데이터: 지점 ${DB.branches.length}개 · 호실 ${DB.rooms.length}개 · 입실자 ${DB.residents.length}명\n\n` +
    `⚠ 현재 화면의 지점·호실·입실자 정보가 백업 시점 내용으로 완전히 대체됩니다(계약·퇴실 이력은 영향 없음). 되돌릴 수 없으니 신중히 확인해주세요.`,
    async ()=>{
      DB.branches = core.branches;
      DB.rooms = core.rooms;
      DB.residents = core.residents;
      if(Array.isArray(core.channelList)) DB.channelList = core.channelList;
      if(Array.isArray(core.shortcuts)) DB.shortcuts = core.shortcuts;
      try{
        const newCore = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
        await FIRESTORE_DOC.set({ json: JSON.stringify(newCore), updatedAt: new Date().toISOString() });
        logChange(`"${latest.id}" 백업으로 복원`);
        render();
        showAlert('백업 데이터로 복원되었습니다.');
      }catch(e){
        console.error(e);
        showAlert('복원 중 저장에 실패했습니다: ' + e.message);
      }
    }
  );
}

function renderBranchOrderBody(){
  const box = document.createElement('div');
  box.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
      드래그해서 순서를 바꾸면 지점 선택 목록, 지점별 현황 표 등 모든 화면에 반영됩니다.
    </div>`;

  const list = document.createElement('div');
  list.className = 'branch-order-list';
  let dragRow = null;

  DB.branches.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'branch-order-row';
    row.draggable = true;
    row.dataset.id = b.id;
    row.innerHTML = `<span class="branch-order-handle">&#9776;</span><span class="branch-order-name" title="클릭 시 해당 지점으로 이동">${b.shortName ? esc(b.shortName)+' · ' : ''}${esc(b.name)}</span>`;
    row.querySelector('.branch-order-name').addEventListener('click', ()=>{
      UI.view = 'branch'; UI.branchId = b.id; UI.branchTab = 'rooms'; UI.roomStatusFilter = '이용중'; render();
    });
    const editBtn = document.createElement('button');
    editBtn.className = 'btn small';
    editBtn.textContent = '수정';
    editBtn.draggable = false;
    editBtn.onclick = ()=>{ UI.editingBranchId = b.id; UI.addingBranch=false; UI.addingRoom=false; UI.managingRoom=false; render(); };
    row.appendChild(editBtn);

    row.addEventListener('dragstart', ()=>{
      dragRow = row;
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      dragRow = null;
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!dragRow || dragRow===row) return;
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      list.insertBefore(dragRow, before ? row : row.nextSibling);
    });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      const newOrder = [...list.children].map(el=>el.dataset.id);
      DB.branches.sort((a,b2)=> newOrder.indexOf(a.id) - newOrder.indexOf(b2.id));
      logChange('지점 노출 순서 변경');
      scheduleSave(); render();
    });

    list.appendChild(row);
  });

  box.appendChild(list);
  return box;
}

function renderOverdueStatsCard(){
  const items = [];
  DB.rooms.filter(room=> hasBranchAccess(room.branchId)).forEach(room=>{
    const branch = DB.branches.find(b=>b.id===room.branchId);
    DB.residents.filter(p=>p.roomId===room.id && isOverdue(p)).forEach(p=>{
      items.push({ room, branch, resident:p });
    });
  });

  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card overdue-stats-card';

  if(items.length===0){
    card.innerHTML = `<h3>연체 중인 호실 <span class="cnt-badge overdue-cnt-badge">${items.length}</span></h3>`;
    card.appendChild(el('div','cleaning-empty','전체 지점에 연체 중인 호실이 없습니다.'));
    return card;
  }

  const groupMap = new Map();
  items.forEach(item=>{
    const key = item.branch ? item.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { key, branch: item.branch, entries: [] });
    groupMap.get(key).entries.push(item);
  });
  const groups = [...groupMap.values()];
  groups.forEach(g=> g.entries.sort((a,b)=> a.room.number.localeCompare(b.room.number,'ko',{numeric:true})));
  groups.sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  if(!groups.some(g=> g.key===UI.overdueTabKey)) UI.overdueTabKey = groups[0].key;
  const activeGroup = groups.find(g=> g.key===UI.overdueTabKey);

  card.innerHTML = `<h3>연체 중인 호실 <span class="cnt-badge overdue-cnt-badge">${items.length}</span></h3>`;

  const tabs = document.createElement('div');
  tabs.className = 'subnav';
  tabs.style.margin = '0 0 12px';
  groups.forEach(group=>{
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = group.key===UI.overdueTabKey ? 'active' : '';
    tab.textContent = `${group.branch ? branchLabel(group.branch) : '(지점 정보 없음)'} (${group.entries.length})`;
    tab.onclick = ()=>{ UI.overdueTabKey = group.key; render(); };
    tabs.appendChild(tab);
  });
  card.appendChild(tabs);

  const today = todayISO();
  const chipRow = document.createElement('div');
  chipRow.className = 'overdue-room-chips overdue-tab-chips';
  activeGroup.entries.forEach(item=>{
    const days = Math.max(1, Math.round((new Date(today) - new Date(item.resident.moveOut)) / 86400000));
    const chip = document.createElement('span');
    chip.className = 'badge overdue-badge overdue-room-chip';
    chip.textContent = `${item.room.number}호 ${days}일 연체`;
    chip.title = '해당 호실로 이동';
    chip.onclick = ()=>{
      if(!item.branch) return;
      UI.view = 'branch';
      UI.branchId = item.branch.id;
      scrollToRoomCard(item.room);
    };
    chipRow.appendChild(chip);
  });
  card.appendChild(chipRow);

  return card;
}

/* 청소 관리 대시보드(상단 카드·주간표)가 공유하는 단일 데이터 소스.
   퇴실청소: 계약만기일 등으로 퇴실이 확정된(scheduledToLeave) 입실자는, 청소 인력이
   나오는 월/수/금 중 퇴실일 이후 가장 빠른 날짜를 청소일로 잡는다(예: 8/9(일) 만기 →
   8/10(월)). 이미 퇴실청소가 필요로 표시된 호실은 그 날짜를 그대로 쓴다. 리터치/추가청소는
   수동 관리이며 예정일을 입력하지 않았으면 date를 null로 둔다(카드 목록엔 "오늘"로
   표시되지만, 날짜가 없어 주간표에는 올릴 수 없음 — 소비하는 쪽에서 구분해서 처리한다). */
function collectCleaningEntries(){
  const entries = [];
  DB.rooms.filter(r=> (r.needsCleaning || r.needsRetouch || r.needsExtraCleaning) && hasBranchAccess(r.branchId)).forEach(r=>{
    const branch = DB.branches.find(b=>b.id===r.branchId);
    const kind = roomMaintKind(r);
    entries.push({ type:kind, branch, room:r, date: r.maintenanceDate || (kind==='moveout' ? todayISO() : null) });
  });
  DB.residents.filter(p=> p.scheduledToLeave && p.moveOut).forEach(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room || roomMaintKind(room) || !hasBranchAccess(room.branchId)) return;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    entries.push({ type:'moveout', branch, room, date: nextMonWedFri(p.moveOut) });
  });
  return entries;
}

function completeCleaningEntry(room, type){
  const field = MAINT_KIND_FIELD[type];
  if(!field || !room[field]) return;
  const label = MAINT_KIND_META[type].label;
  room[field] = false;
  room.maintenanceDate = '';
  room.maintenanceMemo = '';
  logChange(`${room.number}호 ${label} 완료 처리`);
  scheduleSave(); render();
}

function goToBranchRooms(branchId){
  UI.view='branch'; UI.branchId = branchId; UI.branchTab='rooms'; UI.roomStatusFilter='이용중'; render();
}

function mondayOf(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function renderCleaningWeekMatrix(){
  if(!UI.cleanWeekStart) UI.cleanWeekStart = mondayOf(todayISO());

  const box = document.createElement('div');
  box.className = 'stat-section';

  const weekDates = [0,1,2,3,4,5,6].map(i=> addDaysISO(UI.cleanWeekStart, i));
  const today = todayISO();

  const head = document.createElement('div');
  head.className = 'cal-head';
  const spacer = document.createElement('div');
  spacer.className = 'cal-head-spacer';
  const nav = document.createElement('div');
  nav.className = 'cal-head-nav';
  const prevBtn = document.createElement('button'); prevBtn.className='btn small'; prevBtn.textContent='◀';
  const nextBtn = document.createElement('button'); nextBtn.className='btn small'; nextBtn.textContent='▶';
  const title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = `${weekDates[0].slice(0,4)}년 ${Number(weekDates[0].slice(5,7))}월 청소 필요 현황`;
  prevBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, -7); render(); };
  nextBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, 7); render(); };
  nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
  head.appendChild(spacer); head.appendChild(nav);
  box.appendChild(head);

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML = `<span class="cal-legend-item">클릭 시 계약/입실관리의 해당 지점으로 이동 · 해당 없는 항목은 표시하지 않음</span>`;
  box.appendChild(legend);

  const branches = allowedBranches();
  if(branches.length===0){
    box.appendChild(el('div','cleaning-empty','지점이 없습니다.'));
    return box;
  }

  const entries = collectCleaningEntries().filter(e=> e.date && weekDates.includes(e.date));
  const grid = new Map(); // branchId -> date -> {moveout:[room번호...], retouch:[...], extra:[...]}
  entries.forEach(e=>{
    const bkey = e.branch ? e.branch.id : '__none__';
    if(!grid.has(bkey)) grid.set(bkey, new Map());
    const dmap = grid.get(bkey);
    if(!dmap.has(e.date)) dmap.set(e.date, { moveout:[], retouch:[], extra:[] });
    dmap.get(e.date)[e.type].push(e.room.number);
  });

  function chipsHtml(dayEntry, branchName, dateLabel){
    return Object.keys(MAINT_KIND_META).filter(k=> dayEntry[k] && dayEntry[k].length).map(k=>{
      const rooms = dayEntry[k];
      const roomsText = rooms.map(n=> n+'호').join(', ');
      const tip = `${branchName} · ${roomsText} · ${MAINT_KIND_META[k].label} · 청소예정일 ${dateLabel}`;
      return `<span class="cal-chip ${k}" title="${esc(tip)}">${MAINT_KIND_META[k].label}(${rooms.length})</span>`;
    }).join('');
  }

  const DOW = ['월','화','수','목','금','토','일'];
  const table = document.createElement('table');
  table.className = 'branch-table week-matrix';
  const theadCells = weekDates.map((d,i)=> `<th${d===today?' class="wk-today"':''}>${DOW[i]}<br><span class="wk-date">${d.slice(5)}</span></th>`).join('');
  table.innerHTML = `<thead><tr><th>지점</th>${theadCells}</tr></thead>`;
  const tbody = document.createElement('tbody');

  branches.forEach(branch=>{
    const dmap = grid.get(branch.id);
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.innerHTML = `<a href="#" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(branch))}</a>`;
    nameTd.querySelector('a').onclick = (e)=>{ e.preventDefault(); goToBranchRooms(branch.id); };
    tr.appendChild(nameTd);

    weekDates.forEach(d=>{
      const counts = dmap ? dmap.get(d) : null;
      const td = document.createElement('td');
      td.className = 'wk-cell' + (d===today?' wk-today':'') + (counts ? '' : ' wk-empty');
      td.innerHTML = counts ? `<div class="wk-chips">${chipsHtml(counts, branchLabel(branch), d.slice(5))}</div>` : '-';
      if(counts){
        td.style.cursor = 'pointer';
        td.onclick = ()=> goToBranchRooms(branch.id);
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  scrollWrap.appendChild(table);
  box.appendChild(scrollWrap);
  return box;
}

function renderCleaningCards(){
  const wrap = document.createElement('div');
  wrap.className = 'cleaning-cards-grid';

  const today = todayISO();
  const weekAhead = addDaysISO(today, 7);
  const entries = collectCleaningEntries();
  const todayList = entries.filter(x=> !x.date || x.date<=today)
    .sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));
  const futureList = entries.filter(x=> x.date && x.date>today && x.date<=weekAhead)
    .sort((a,b)=> a.date.localeCompare(b.date));

  wrap.appendChild(renderTodayCleaningCard(todayList));
  wrap.appendChild(renderCleaningCard('청소 예정방 (7일 이내)', futureList, true));
  return wrap;
}

const CLEANING_CARD_PAGE_SIZE = 4;
function paginateCleaningList(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / CLEANING_CARD_PAGE_SIZE));
  const clamped = Math.min(Math.max(page, 1), totalPages);
  const start = (clamped - 1) * CLEANING_CARD_PAGE_SIZE;
  return { pageList: list.slice(start, start + CLEANING_CARD_PAGE_SIZE), totalPages, page: clamped };
}
function appendCleaningPager(header, totalPages, currentPage, onPage){
  if(totalPages <= 1) return;
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  pager.style.marginTop = '0';
  for(let p=1; p<=totalPages; p++){
    const pBtn = document.createElement('button');
    pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
    pBtn.textContent = String(p);
    pBtn.onclick = ()=> onPage(p);
    pager.appendChild(pBtn);
  }
  header.appendChild(pager);
}

function renderTodayCleaningCard(list){
  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card';

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;';
  header.innerHTML = `<h3 style="margin:0;">오늘 청소방 <span class="cnt-badge">${list.length}</span></h3>`;
  card.appendChild(header);

  if(list.length===0){
    card.appendChild(el('div','cleaning-empty','해당하는 호실이 없습니다.'));
    return card;
  }

  const { pageList, totalPages, page } = paginateCleaningList(list, UI.cleanTodayPage);
  UI.cleanTodayPage = page;
  appendCleaningPager(header, totalPages, page, (p)=>{ UI.cleanTodayPage = p; render(); });

  const groupMap = new Map();
  pageList.forEach(x=>{
    const key = x.branch ? x.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { branch: x.branch, entries: [] });
    groupMap.get(key).entries.push(x);
  });
  const groups = [...groupMap.values()].sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  groups.forEach(group=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'cleaning-branch-group';

    const head = document.createElement('div');
    head.className = 'cleaning-branch-head';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'cleaning-branch-name';
    nameSpan.textContent = group.branch ? branchLabel(group.branch) : '(지점 정보 없음)';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'iconbtn';
    copyBtn.innerHTML = '&#10697;';
    copyBtn.title = '이 지점의 청소방·메모를 클립보드에 복사';
    copyBtn.onclick = ()=>{
      const lines = [`[${group.branch ? branchLabel(group.branch) : ''} 청소방]`];
      group.entries.forEach(x=>{
        const kind = MAINT_KIND_META[x.type].label;
        lines.push(`${x.room.number}호 (${kind})${x.room.maintenanceMemo ? ' - ' + x.room.maintenanceMemo : ''}`);
      });
      navigator.clipboard.writeText(lines.join('\n')).then(()=>{
        const origTitle = copyBtn.title;
        copyBtn.innerHTML = '&#10003;';
        copyBtn.classList.add('active');
        copyBtn.title = '복사됨';
        setTimeout(()=>{ copyBtn.innerHTML = '&#10697;'; copyBtn.classList.remove('active'); copyBtn.title = origTitle; }, 1500);
      }).catch(()=>{
        showAlert('복사에 실패했습니다. 브라우저 권한을 확인해주세요.');
      });
    };
    head.appendChild(nameSpan); head.appendChild(copyBtn);
    groupWrap.appendChild(head);

    group.entries.forEach(x=>{
      const entry = document.createElement('div');
      entry.className = 'cleaning-entry';
      const row = document.createElement('div');
      row.className = 'cleaning-row';
      const kindBadge = maintBadgeHtml(x.type);
      row.innerHTML = `<span class="rm">${esc(x.room.number)}호</span>`;
      const kindSpan = document.createElement('span');
      kindSpan.className = 'kind';
      kindSpan.innerHTML = kindBadge;
      if(canEdit() && x.room[MAINT_KIND_FIELD[x.type]]){
        const doneBtn = document.createElement('button');
        doneBtn.className = 'btn small primary';
        doneBtn.textContent = '청소완료';
        doneBtn.onclick = (e)=>{ e.stopPropagation(); completeCleaningEntry(x.room, x.type); };
        kindSpan.appendChild(doneBtn);
      }
      row.appendChild(kindSpan);
      row.style.cursor = 'pointer';
      row.title = '해당 지점으로 이동';
      row.onclick = ()=>{
        if(!x.branch) return;
        goToBranchRooms(x.branch.id);
      };
      entry.appendChild(row);
      if(x.room.maintenanceMemo){
        entry.appendChild(el('div','cleaning-memo', x.room.maintenanceMemo));
      }
      groupWrap.appendChild(entry);
    });

    card.appendChild(groupWrap);
  });

  return card;
}

    UI.cleanFuturePage = page;

/* ---------------- custom alert/confirm (샌드박스 iframe에서 window.alert/confirm이
   막히는 경우를 대비해 네이티브 다이얼로그 대신 사용) ---------------- */
function showAlert(message){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.style.color = 'var(--st-hold)';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  okBtn.onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}
function showConfirm(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn';
  cancelBtn.textContent = '취소';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn danger';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  cancelBtn.onclick = close;
  okBtn.onclick = ()=>{ close(); onConfirm(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}

function executeRoomMove(p, fromRoom, toRoom, moveDate){
  moveResidentToHistory(p, moveDate);
  const carriedMoveOut = (p.moveOut && p.moveOut > moveDate) ? p.moveOut : '';
  const newP = {
    id: uid('p'), roomId: toRoom.id, name: p.name, channel: p.channel, resStatus:'', contractType:'이동',
    moveIn: moveDate, moveOut: carriedMoveOut, originalMoveIn: moveDate, scheduledToLeave:false,
    phone: p.phone, memo: p.memo, carNumber: p.carNumber, firstSaveDone:true, slotIndex:0
  };
  newP.resStatus = computeResStatus(newP);
  DB.residents.push(newP);
  logChange(`${fromRoom.number}호 → ${toRoom.number}호 방이동 처리 ("${p.name}")`);
}

function processPendingRoomMoves(){
  const today = todayISO();
  const due = DB.residents.filter(p => p.pendingRoomMove && p.pendingRoomMove.date <= today);
  if(due.length===0) return;
  due.forEach(p=>{
    const fromRoom = DB.rooms.find(r=>r.id===p.roomId);
    const toRoom = DB.rooms.find(r=>r.id===p.pendingRoomMove.toRoomId);
    if(!fromRoom || !toRoom){ delete p.pendingRoomMove; return; }
    if(roomHasActiveResident(toRoom)) return; // 대상 방이 그 사이 다시 채워졌으면 보류
    const moveDate = p.pendingRoomMove.date;
    delete p.pendingRoomMove;
    executeRoomMove(p, fromRoom, toRoom, moveDate);
  });
  scheduleSave();
}

function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  try{
    roleDoc = await USERS_COL.doc(user.uid).get();
  }catch(e){
    console.error('사용자 권한 조회 실패:', e);
    showAlert('사용자 정보를 불러오지 못했습니다. 네트워크를 확인하거나 관리자에게 문의해주세요.');
    firebase.auth().signOut();
    return;
  }

  if(!roleDoc.exists){
    // 이전 방식으로 만든 계정 등, users 문서가 없는 경우 안전하게 대기 상태로 생성
    await USERS_COL.doc(user.uid).set({ email: user.email, role:'pending', createdAt: new Date().toISOString() });
    USER_ROLE = 'pending';
  } else {
    const roleData = roleDoc.data();
    USER_ROLE = roleData.role || 'pending';
    USER_BRANCH_SCOPE = roleData.branchScope || 'all';
    USER_BRANCH_IDS = Array.isArray(roleData.branchIds) ? roleData.branchIds : null;
  }

  if(USER_ROLE === 'pending'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'flex';
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[USER_ROLE] || USER_ROLE;
  const loggedInAs = document.getElementById('loggedInAs');
  if(loggedInAs) loggedInAs.textContent = `${user.email} (${roleLabel})`;

  DB = await loadState();
  DB.shortcuts = DB.shortcuts || [];
  DB.channelList = (DB.channelList && DB.channelList.length) ? DB.channelList : [...DEFAULT_CHANNEL_LIST];
  // 과거 버전에서 "완료" 없이 새로고침 등으로 남겨졌을 수 있는 미확정 입실자(이름 미입력 등) 정리
  const beforeCount = DB.residents.length;
  DB.residents = DB.residents.filter(p => p.firstSaveDone !== false);
  if(canEdit() && DB.residents.length !== beforeCount) scheduleSave();
  DB.residents.forEach(p => {
    if(p.originalMoveIn == null) p.originalMoveIn = p.moveIn || '';
    if(p.scheduledToLeave == null) p.scheduledToLeave = false;
    p.resStatus = computeResStatus(p);
  });
  if(canEdit()) processScheduledLeaves();
  if(canEdit()) processPendingRoomMoves();
  let statusFixed = false;
  DB.rooms.forEach(room=>{
    if(!roomHasActiveResident(room) && !STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
      statusFixed = true;
    }
  });
  if(canEdit() && statusFixed) scheduleSave();
  let typePricesFilled = false;
  DB.branches.forEach(branch=>{
    if(!branch.typePrices){
      branch.typePrices = computeTypePriceDefaults(branch);
      typePricesFilled = true;
    }
  });
  if(canEdit() && typePricesFilled) scheduleSave();
  if(canEdit()) maybeCreateDailyBackup();
  UI.branchId = allowedBranches()[0] ? allowedBranches()[0].id : null;
  if(USER_ROLE === 'editor') UI.view = 'branch'; // 수정 권한 계정은 전체 통계 대신 지점 대시보드로 바로 진입
  // 조회 전용(viewer) 계정과 슈퍼어드민은 기본값인 전체 통계 대시보드로 진입
  render();
  document.getElementById('savedNote').textContent = '자동 저장됨 · 이 대시보드를 사용하는 모든 사람에게 공유됩니다';

  if(isSuperAdmin()) checkPendingRequests();
}

async function checkPendingRequests(){
  try{
    const snap = await USERS_COL.where('role','==','pending').get();
    if(snap.empty) return;
    showAlert(`승인 대기 중인 계정 요청이 ${snap.size}건 있습니다.\n"관리자 설정" 화면의 "사용자 관리"에서 확인해주세요.`);
  }catch(e){ console.error('승인 대기 확인 실패:', e); }
}

function showLoginScreen(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

document.getElementById('loginBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!email || !password){ errBox.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
  firebase.auth().signInWithEmailAndPassword(email, password)
    .catch(err=>{
      const map = {
        'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
        'auth/user-not-found': '등록되지 않은 계정입니다. 관리자에게 계정 생성을 요청해주세요.',
        'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
        'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
        'auth/too-many-requests': '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.'
      };
      errBox.textContent = map[err.code] || ('로그인 실패: ' + err.message);
    });
});
document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('loginBtn').click();
});
document.getElementById('requestAccountLink').addEventListener('click', (e)=>{
  e.preventDefault();
  showRequestAccountModal();
});
document.getElementById('pendingLogoutBtn').addEventListener('click', ()=> firebase.auth().signOut());

function showRequestAccountModal(prefillEmail){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:12px;font-weight:700;">계정 요청</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
      가입 즉시 사용은 불가하며, 관리자 승인 후 로그인할 수 있습니다.
    </div>
    <label class="field-label">이메일</label>
    <input type="email" id="reqEmail" style="width:100%;margin-bottom:10px;" value="${esc(prefillEmail||'')}">
    <label class="field-label">비밀번호 (6자 이상)</label>
    <input type="password" id="reqPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">비밀번호 확인</label>
    <input type="password" id="reqPw2" style="width:100%;margin-bottom:10px;">
    <label class="field-label">이름</label>
    <input type="text" id="reqName" style="width:100%;margin-bottom:10px;">
    <label class="field-label">연락처</label>
    <input type="tel" id="reqPhone" placeholder="010-0000-0000" style="width:100%;margin-bottom:10px;">
    <label class="field-label">희망 권한</label>
    <select id="reqRole" style="width:100%;">
      <option value="viewer">조회 전용</option>
      <option value="editor">수정 가능</option>
    </select>
    <div class="login-error" id="reqError"></div>
  `;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  btnRow.style.marginTop = '14px';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = ()=> overlay.remove();
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '계정 요청';
  okBtn.onclick = ()=>{
    const email = document.getElementById('reqEmail').value.trim();
    const pw = document.getElementById('reqPw').value;
    const pw2 = document.getElementById('reqPw2').value;
    const name = document.getElementById('reqName').value.trim();
    const phone = document.getElementById('reqPhone').value.trim();
    const requestedRole = document.getElementById('reqRole').value;
    const err = document.getElementById('reqError');
    err.style.color = 'var(--st-hold)';
    if(!email || !pw || !pw2 || !name || !phone){ err.textContent = '모든 항목을 입력해주세요.'; return; }
    if(pw.length < 6){ err.textContent = '비밀번호는 6자 이상이어야 합니다.'; return; }
    if(pw !== pw2){ err.textContent = '비밀번호가 서로 일치하지 않습니다.'; return; }
    suppressAuthHandling = true;
    firebase.auth().createUserWithEmailAndPassword(email, pw)
      .then(cred=> USERS_COL.doc(cred.user.uid).set({ email, role:'pending', requestedRole, name, phone, createdAt: new Date().toISOString() })
        .then(()=> indexEmail(email))
        .then(()=> firebase.auth().signOut()))
      .then(()=>{
        suppressAuthHandling = false;
        overlay.remove();
        showLoginScreen();
        showAlert('계정 요청이 접수되었습니다. 관리자 승인 후 로그인해주세요.');
      })
      .catch(e=>{
        suppressAuthHandling = false;
        const map = {
          'auth/email-already-in-use': '이미 등록된 이메일입니다.',
          'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
          'auth/weak-password': '비밀번호가 너무 약합니다.'
        };
        err.textContent = map[e.code] || ('오류: ' + e.message);
      });
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
document.getElementById('forgotPwLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('loginError');
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ errBox.style.color = 'var(--st-hold)'; errBox.textContent = '먼저 이메일을 입력한 뒤 눌러주세요.'; return; }
  errBox.style.color = 'var(--ink-soft)';
  errBox.textContent = '계정 확인 중…';
  // Firebase의 "이메일 열거 보호"가 켜져 있으면 sendPasswordResetEmail이 존재하지 않는
  // 이메일에도 에러 없이 성공 처리되어(메일은 실제로 발송되지 않음) 혼란을 줍니다.
  // 그래서 자체 emailIndex 컬렉션으로 가입 여부를 먼저 확인합니다.
  EMAIL_INDEX_COL.doc(normalizeEmailKey(email)).get().then(snap=>{
    if(!snap.exists){
      errBox.style.color = 'var(--st-hold)';
      errBox.textContent = `등록되지 않은 이메일입니다. 먼저 "계정 요청"으로 사용 신청을 해주세요.`;
      showRequestAccountModal(email);
      return;
    }
    return firebase.auth().sendPasswordResetEmail(email).then(()=>{
      errBox.style.color = 'var(--st-occupied)';
      errBox.textContent = `${email} 주소로 비밀번호 재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해주세요.`;
    }).catch(err=>{
      errBox.style.color = 'var(--st-hold)';
      errBox.textContent = '오류: ' + err.message;
    });
  }).catch(err=>{
    errBox.style.color = 'var(--st-hold)';
    errBox.textContent = '계정 확인 중 오류가 발생했습니다: ' + err.message;
  });
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  showConfirm('로그아웃할까요?', ()=> firebase.auth().signOut());
});
document.getElementById('changePwBtn').addEventListener('click', showChangePasswordModal);
document.getElementById('homeLink').addEventListener('click', ()=>{ UI.view = 'stats'; render(); });

(function(){
  const searchInput = document.getElementById('globalSearchInput');
  const searchWrap = document.getElementById('headerSearchWrap');
  searchInput.addEventListener('input', ()=> renderGlobalSearchResults(searchInput.value));
  searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim()) renderGlobalSearchResults(searchInput.value); });
  searchInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      searchInput.value = '';
      document.getElementById('globalSearchResults').style.display = 'none';
      searchInput.blur();
    }
  });
  document.addEventListener('click', (e)=>{
    if(!searchWrap.contains(e.target)) document.getElementById('globalSearchResults').style.display = 'none';
  });
})();

function showChangePasswordModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:12px;font-weight:700;">비밀번호 변경</div>
    <label class="field-label">현재 비밀번호</label>
    <input type="password" id="curPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">새 비밀번호 (6자 이상)</label>
    <input type="password" id="newPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">새 비밀번호 확인</label>
    <input type="password" id="newPw2" style="width:100%;">
    <div class="login-error" id="pwChangeError"></div>
  `;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  btnRow.style.marginTop = '14px';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = ()=> overlay.remove();
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '변경';
  okBtn.onclick = ()=>{
    const curPw = document.getElementById('curPw').value;
    const newPw = document.getElementById('newPw').value;
    const newPw2 = document.getElementById('newPw2').value;
    const err = document.getElementById('pwChangeError');
    err.style.color = 'var(--st-hold)';
    if(!curPw || !newPw || !newPw2){ err.textContent = '모든 항목을 입력해주세요.'; return; }
    if(newPw.length < 6){ err.textContent = '새 비밀번호는 6자 이상이어야 합니다.'; return; }
    if(newPw !== newPw2){ err.textContent = '새 비밀번호가 서로 일치하지 않습니다.'; return; }
    const user = firebase.auth().currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, curPw);
    user.reauthenticateWithCredential(cred)
      .then(()=> user.updatePassword(newPw))
      .then(()=>{
        overlay.remove();
        showAlert('비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용해주세요.');
      })
      .catch(e=>{
        err.textContent = e.code === 'auth/wrong-password' ? '현재 비밀번호가 올바르지 않습니다.' : ('오류: ' + e.message);
      });
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

let suppressAuthHandling = false;
firebase.auth().onAuthStateChanged(user=>{
  if(suppressAuthHandling) return;
  if(user){ initApp(user); }
  else { showLoginScreen(); }
});
// PC를 계속 켜둔 채 로그인 화면을 새로고침 없이 며칠씩 열어두면 initApp()이 다시 실행되지
// 않아 날짜가 바뀌어도 자동 백업이 안 생긴다. 그래서 별도로 주기적으로(1시간마다) 오늘
// 백업이 있는지 확인해서, 탭을 계속 켜둔 세션에서도 날짜가 바뀌면 자동으로 새 백업을 만든다.
setInterval(()=>{ if(canEdit()) maybeCreateDailyBackup(); }, 60*60*1000);
</script>
