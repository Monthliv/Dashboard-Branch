<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONTHLIV 운영 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --panel:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5B6B72;
    --line:#E1DCCF;
    --accent:#10767A;
    --accent-ink:#0B5457;
    --accent-soft:#E1F1F1;

    --st-vacant:#8B96A0;   --st-vacant-bg:#EEF0F2;
    --st-forsale:#2F6FED;  --st-forsale-bg:#E8EFFD;
    --st-occupied:#10767A; --st-occupied-bg:#E1F1F1;
    --st-leaving:#C98A2C;  --st-leaving-bg:#FBF0DD;
    --st-hold:#C0473F;     --st-hold-bg:#FBE7E5;
    --st-presell:#6C5FC7;  --st-presell-bg:#EDEBFA;

    --ch-indep:#5B4FCF; --ch-33m2:#B5459A; --ch-liveany:#D6673E; --ch-etc:#7A8790;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  #app{ max-width:1320px; margin:0 auto; padding:0 20px 60px; }
  header.top{ position:sticky; top:0; z-index:20; background:var(--paper); padding:20px 0 16px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; }
  .brand h1{ font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .brand h1 .tag{
    display:inline-block; margin-left:10px; font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:600; color:var(--accent-ink);
    background:var(--accent-soft); padding:2px 8px; border-radius:20px; vertical-align:middle;
  }
  .brand .sub{ font-size:12px; color:var(--ink-soft); }
  .home-link{ cursor:pointer; display:flex; align-items:center; }
  .home-link:hover{ color:var(--accent-ink); }
  .home-icon{ font-size:20px; margin-right:8px; line-height:1; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .branch-picker{ display:flex; align-items:center; gap:8px; }
  .branch-picker select{
    font-family:inherit; font-weight:700; font-size:14px; padding:9px 34px 9px 12px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235B6B72'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:8px; padding:7px 12px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); color:#fff; }
  .btn.pill{ border-radius:999px; }
  .btn.danger{ color:var(--st-hold); }
  .btn.danger:hover{ border-color:var(--st-hold); color:var(--st-hold); }
  .btn.small{ padding:4px 9px; font-size:11.5px; border-radius:6px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .iconbtn{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1; padding:0; flex:none;
  }
  .iconbtn:hover{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .iconbtn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .iconbtn.del:hover{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); }

  .subnav{ display:inline-flex; gap:3px; background:#EFEAE0; padding:3px; border-radius:10px; margin:16px 0 16px; }
  .subnav button{
    border:none; background:none; cursor:pointer; font-family:inherit; font-weight:700;
    font-size:12.5px; padding:7px 14px; border-radius:8px; color:var(--ink-soft);
  }
  .subnav button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  main{ padding-top:6px; }

  select, input[type=text], input[type=date], input[type=tel], input[type=number], textarea{
    font-family:inherit; font-size:12.5px; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff;
  }
  textarea{ width:100%; resize:vertical; min-height:38px; }
  label.field-label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:3px; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.overdue-badge{ background:#C0473F; color:#fff; font-weight:800; animation:overduePulse 1.8s ease-in-out infinite; }
  @keyframes overduePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.65; } }
  .badge.muted{ background:#F1EFE8; color:var(--ink-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .empty-hint{ padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px; border:1px dashed var(--line); border-radius:12px; background:var(--panel); }

  .branch-bar{
    position:relative;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:18px; display:flex; flex-direction:column; gap:14px;
  }
  .branch-bar .branch-edit-pencil{ position:absolute; top:14px; right:14px; }
  .branch-bar .col h3{ margin:0 0 6px; font-size:11px; color:var(--ink-soft); font-weight:700; letter-spacing:.02em; }
  .branch-bar input, .branch-bar textarea{ width:100%; }
  .branch-bar .namewrap{ display:flex; gap:8px; align-items:center; }
  .branch-bar .namewrap input{ font-size:19px; font-weight:800; border:none; background:transparent; padding:2px 0; }
  .branch-bar .namewrap input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .parking-cap-row select{ width:100px; }
  .parking-cap-row{ margin-bottom:8px; }
  .parking-summary{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .parking-summary.parking-unavailable{ font-size:14px; font-weight:800; color:var(--st-hold); margin-bottom:0; }
  .parking-active-toggle{ color:var(--accent-ink); font-weight:700; text-decoration:underline; cursor:pointer; }
  .parking-active-toggle:hover{ color:var(--accent); }
  .parking-list{ background:#F4F1E9; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .parking-list-row{ display:flex; gap:8px; font-size:12px; padding:3px 0; }
  .parking-list-row .rm{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .parking-list-row .nm{ font-weight:600; }
  .parking-list-row .car{ color:var(--ink-soft); margin-left:auto; font-family:'JetBrains Mono',monospace; }
  .parking-list-empty{ font-size:12px; color:var(--ink-soft); }

  .room-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .room-toolbar .legend{ display:flex; gap:10px; flex-wrap:wrap; }
  .legend-btn{ border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .legend-btn:hover{ border-color:currentColor; }
  .legend-btn.active{ border-color:currentColor; box-shadow:0 0 0 1px currentColor inset; }

  .add-room-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-room-form .fld{ display:flex; flex-direction:column; }
  .add-room-form input, .add-room-form select{ width:100%; }

  .add-branch-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:2fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-branch-form .fld{ display:flex; flex-direction:column; }
  .add-branch-form input, .add-branch-form select{ width:100%; }

  .admin-add-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; align-items:end;
  }
  .admin-add-form .fld{ display:flex; flex-direction:column; }
  .admin-add-form input, .admin-add-form select{ width:100%; }
  .admin-add-form .btn-row{ display:flex; gap:8px; }
  .branch-address{ font-size:13px; font-weight:400; color:var(--ink-soft); margin-left:10px; }

  .branch-view-text{ font-size:14px; font-weight:600; padding:2px 0; }
  .branch-view-text.title{ font-size:19px; font-weight:800; }
  .branch-view-text.small{ font-size:12.5px; font-weight:400; color:var(--ink-soft); white-space:pre-wrap; }

  .overdue-banner{
    display:flex; align-items:flex-start; gap:12px; background:var(--st-hold-bg);
    border:1.5px solid var(--st-hold); border-radius:12px; padding:14px 16px; margin-bottom:18px;
  }
  .overdue-banner-icon{ font-size:20px; line-height:1; flex:none; }
  .overdue-banner-title{ font-weight:800; font-size:13.5px; color:var(--st-hold); margin-bottom:8px; }
  .overdue-banner-rooms{ display:flex; flex-wrap:wrap; gap:6px; }
  .overdue-room-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    background:#fff; color:var(--st-hold); border:1px solid var(--st-hold); border-radius:6px; padding:3px 9px;
    cursor:pointer;
  }
  .overdue-room-chip:hover{ background:var(--st-hold); color:#fff; }
  .room-card.flash-highlight{
    animation:cardFlash 2.2s ease-out;
  }
  @keyframes cardFlash{
    0%{ box-shadow:0 0 0 4px var(--st-hold); }
    70%{ box-shadow:0 0 0 4px var(--st-hold); }
    100%{ box-shadow:0 0 0 0 transparent; }
  }

  .status-section{ margin-bottom:22px; }
  .status-section .sec-head{
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:6px;
    border-bottom:2px solid; cursor:pointer; user-select:none;
  }
  .status-section .sec-head:hover .name{ text-decoration:underline; }
  .status-section .sec-head .name{ font-weight:800; font-size:14px; }
  .status-section .sec-head .count-badge{
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:800;
    padding:3px 11px; border-radius:20px;
  }
  .status-section .sec-head .sec-toggle-caret{ margin-left:auto; color:var(--ink-soft); font-size:13px; }
  .status-section .sec-head.collapsed{ margin-bottom:0; border-bottom-style:dashed; opacity:.85; }
  .status-section .sec-empty{ font-size:12px; color:var(--ink-soft); padding:8px 2px; }

  .grid-rooms{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; align-items:start; }

  /* ---- room card (view layout, matches reference mockup) ---- */
  .room-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; border-left:5px solid var(--st-vacant); }
  .rc-header{ display:flex; flex-direction:column; gap:6px; padding:12px 14px 8px; }
  .rc-header-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rc-title{ display:flex; align-items:baseline; gap:6px; min-width:0; flex:1; }
  .rc-title .roomno{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap; }
  .rc-title .roomtype{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rc-title .room-price{ font-size:11.5px; color:var(--accent-ink); font-weight:700; white-space:nowrap; }
  .rc-header-badges{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .history-btn{
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex:none;
  }
  .history-btn:hover, .history-btn.active{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .history-panel{ margin:0 14px 10px; background:#F4F1E9; border-radius:8px; padding:8px 10px; }
  .history-entry{ padding:6px 0; border-bottom:1px dashed #E1DCCF; }
  .history-entry:last-child{ border-bottom:none; }
  .history-top{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .history-top .nm{ font-weight:700; }
  .history-top .ph{ color:var(--ink-soft); }
  .history-top .btn{ margin-left:auto; }
  .history-period{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .history-empty{ font-size:12px; color:var(--ink-soft); }
  .rc-header-right{ display:flex; align-items:center; gap:6px; flex:none; }

  .rc-note-chip{
    margin:0 14px 8px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:8px;
    padding:6px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rc-divider{ border:none; border-top:1px solid var(--line); margin:0; }

  .rc-body{ padding:12px 14px 14px; }

  .resident-block{ padding:9px 0; border-bottom:1px dashed #EAE5D8; }
  .resident-block:last-child{ border-bottom:none; }
  .resident-flags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .resident-name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; }
  .resident-name-row .nm{ font-weight:700; font-size:13.5px; }
  .resident-name-row .acts{ display:flex; gap:5px; flex:none; }
  .badge.tag-new{ background:#F1EFE8; color:var(--ink-soft); border:1px solid var(--line); }
  .badge.tag-ext{ background:#FBF0DD; color:#8A5F14; border:1px solid #E3B25C; }
  .badge.res-status{ background:#EEF0F2; color:var(--ink-soft); }
  .badge.res-status.leaving{ background:var(--st-leaving-bg); color:var(--st-leaving); }
  .badge.res-status.upcoming{ background:var(--st-forsale-bg); color:var(--st-forsale); }
  .resident-period{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .resident-car{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .resident-memo{
    margin-top:5px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:6px;
    padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .empty-residents{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 4px; }
  .empty-residents .msg{ font-size:12.5px; color:var(--ink-soft); }

  /* ---- edit mode ---- */
  .edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .edit-grid input, .edit-grid select{ width:100%; }
  .maint-chips{ display:flex; gap:6px; }
  .flagchip{
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px;
    border:1px solid var(--line); background:#fbfaf7; color:var(--ink-soft); cursor:pointer;
  }
  .flagchip.on.clean{ background:#FBEFD8; border-color:#E3B25C; color:#8A5F14; }
  .flagchip.on.retouch{ background:#E3E8FD; border-color:#8B9FEE; color:#2E3F9E; }
  .flagchip.on.presell{ background:var(--st-forsale-bg); border-color:var(--st-forsale); color:var(--st-forsale); }
  .edit-section-label{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; margin:14px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .edit-section-label:first-child{ margin-top:0; }

  .resident-edit-card{ border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:#FCFBF8; }
  .resident-edit-card .redit-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .resident-edit-card .redit-title{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; }
  .resident-edit-card input[type=text], .resident-edit-card input[type=tel]{ width:100%; }
  .resident-edit-card .redit-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .resident-edit-card .redit-grid2 select, .resident-edit-card .redit-grid2 input{ width:100%; }
  .resident-edit-card .redit-inline-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .resident-edit-card .redit-inline-row > div:first-child{ flex:1; min-width:0; }
  .resident-edit-card .redit-inline-row input{ width:100%; }
  .resident-edit-card input.invalid, .resident-edit-card input.invalid:focus{ border-color:var(--st-hold); background:#FFF6F5; }
  .field-label .req{ color:var(--st-hold); }

  .tl-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .tl-month-nav{ display:flex; align-items:center; gap:10px; }
  .tl-month-nav .m-label{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; min-width:110px; text-align:center; }
  .tl-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto; }
  .tl-grid{ display:grid; min-width:900px; }
  .tl-headrow, .tl-row{ display:grid; grid-template-columns:220px 1fr; border-bottom:1px solid var(--line); }
  .tl-headrow{ position:sticky; top:0; background:var(--panel); z-index:2; }
  .tl-row:last-child{ border-bottom:none; }
  .tl-legend{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tl-label{ padding:10px 12px; font-size:12px; border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .tl-label .tl-status-dot{ width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:3px; }
  .tl-label .rm{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .tl-label .nm{ color:var(--ink-soft); font-size:11px; }
  .tl-days{ position:relative; display:grid; }
  .tl-headrow .tl-days{ height:34px; }
  .tl-row .tl-days{ height:44px; }
  .tl-daycell{ border-right:1px solid #EFEBE0; }
  .tl-headrow .tl-daycell{ display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
  .tl-daycell.weekend{ background:#FBF8F1; }
  .tl-bar{ position:absolute; top:8px; height:28px; border-radius:7px; display:flex; align-items:center; padding:0 8px; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-bar .tl-bar-name{ font-weight:700; flex:none; }
  .tl-bar .tl-bar-memo{ font-weight:400; opacity:.9; margin-left:5px; overflow:hidden; text-overflow:ellipsis; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat-card .num{ font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:800; }
  .stat-card .lbl{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .stat-section{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .stat-section h3{ margin:0 0 12px; font-size:13px; }
  .cleaning-cards-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .cleaning-card h3{ display:flex; align-items:center; gap:8px; }
  .cleaning-card .cnt-badge{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-ink); padding:2px 8px; border-radius:20px; }
  .overdue-stats-card{ border-color:var(--st-hold); }
  .overdue-stats-card h3{ color:var(--st-hold); }
  .overdue-cnt-badge{ background:var(--st-hold-bg) !important; color:var(--st-hold) !important; }
  .cleaning-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .cleaning-row:last-child{ border-bottom:none; }
  .cleaning-row:hover{ background:#FAF8F2; }
  .overdue-branch-group{ padding:8px 0; border-bottom:1px dashed var(--line); }
  .overdue-branch-group:last-child{ border-bottom:none; }
  .overdue-branch-name{ font-weight:700; font-size:13px; margin-bottom:6px; }
  .overdue-branch-name:hover{ text-decoration:underline; }
  .overdue-room-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .overdue-room-chip{ cursor:pointer; }
  .overdue-room-chip:hover{ opacity:.85; }

function nextMonWedFri(fromDateStr){

function normalizeEmailKey(email){ return String(email||'').trim().toLowerCase(); }
function indexEmail(email){
  const key = normalizeEmailKey(email);
  if(!key) return Promise.resolve();
  return EMAIL_INDEX_COL.doc(key).set({ indexedAt: new Date().toISOString() }, { merge:true }).catch(e=> console.error('이메일 색인 실패:', e));
}

let CURRENT_USER = null;   // { uid, email }
let USER_ROLE = null;      // 'pending' | 'viewer' | 'editor' | 'superadmin'
function canEdit(){ return USER_ROLE === 'editor' || USER_ROLE === 'superadmin'; }
function isSuperAdmin(){ return USER_ROLE === 'superadmin'; }

let pendingChangeSummary = '';
function logChange(summary){ pendingChangeSummary = summary; }
async function writeChangeLog(summary){
  try{
    await CHANGELOG_COL.add({
      uid: CURRENT_USER ? CURRENT_USER.uid : '',
      email: CURRENT_USER ? CURRENT_USER.email : '',
      summary: summary || '정보 수정',
      timestamp: new Date().toISOString()
    });
  }catch(e){ console.error('변경 로그 기록 실패:', e); }
}

async function loadState(){
  try{
    const snap = await FIRESTORE_DOC.get();
    if(snap.exists && snap.data() && snap.data().json){
      return JSON.parse(snap.data().json);
    }
  }catch(e){ console.error('불러오기 실패:', e); }
  return seedState();
}
let saveTimer = null;
async function saveState(){
  const note = document.getElementById('savedNote');
  if(note) note.textContent = '저장 중…';

    await FIRESTORE_DOC.set({ json: JSON.stringify(DB), updatedAt: new Date().toISOString() });

    pendingChangeSummary = '';
    writeChangeLog(summary);
  }catch(e){
    if(note) note.textContent = '저장 실패 — 네트워크 또는 Firebase 설정을 확인해주세요';
    console.error(e);
  }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 250); }

    '판매보류':    { fg:'var(--st-hold)',     bg:'var(--st-hold-bg)' },
  };
  return m[s] || m['공실'];
}
const CHANNEL_PALETTE = ['#D6673E','#B5459A','#5B4FCF','#2F8F5B','#C98A2C','#2F6FED','#B5335C','#5C8A3A','#0F7173','#A8481E'];
function channelColor(c){
  const fixed = { '독립생활':'var(--ch-indep)', '삼삼엠투':'var(--ch-33m2)', '리브애니':'var(--ch-liveany)' };
  if(fixed[c]) return fixed[c];
  // "기타"나 새로 추가한 채널(엔코스테이 등)도 흐릿한 회색 대신 눈에 띄는 고유 색을 자동으로 배정합니다.
  let hash = 0;
  const s = String(c||'');
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
  return CHANNEL_PALETTE[hash % CHANNEL_PALETTE.length];
}

/* ---------------- root render ---------------- */
function render(){
  renderTopNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(UI.view === 'stats'){ main.appendChild(renderStatsView()); return; }
  if(UI.view === 'admin'){ main.appendChild(renderAdminView()); return; }
  main.appendChild(renderBranchView());
}

function renderTopNav(){
  const sel = document.getElementById('branchSelect');
  sel.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = ''; placeholder.textContent = '지점 선택';
  placeholder.selected = UI.view !== 'branch';
  sel.appendChild(placeholder);
  DB.branches.forEach(br=>{
    const o = document.createElement('option');
    o.value = br.id; o.textContent = br.name;
    o.selected = UI.view === 'branch' && UI.branchId===br.id;
    sel.appendChild(o);
  });
  sel.onchange = ()=>{
    if(!sel.value) return;
    UI.view='branch'; UI.branchId = sel.value; UI.roomStatusFilter='이용중'; render();
  };

  const adminBtn = document.getElementById('adminBtn');
  adminBtn.style.display = isSuperAdmin() ? '' : 'none';
  adminBtn.className = 'btn small' + (UI.view==='admin' ? ' primary' : '');
  adminBtn.onclick = ()=>{ UI.view = 'admin'; render(); };
}

function currentBranch(){
  if(!UI.branchId || !DB.branches.find(b=>b.id===UI.branchId)){
    UI.branchId = DB.branches[0] ? DB.branches[0].id : null;
  }
  return DB.branches.find(b=>b.id===UI.branchId);
}

/* ---------------- branch view ---------------- */
function scrollToRoomCard(room){
  UI.branchTab = 'rooms';

  render();
  setTimeout(()=>{
    const el = document.getElementById('room-card-' + room.id);
    if(!el) return;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.add('flash-highlight');
    setTimeout(()=> el.classList.remove('flash-highlight'), 2200);
  }, 60);
}

function renderOverdueBanner(branch){
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);
  const overdueRooms = rooms.filter(r=>roomHasOverdueResident(r))
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));
  if(overdueRooms.length===0) return null;

  const box = document.createElement('div');
  box.className = 'overdue-banner';

  const icon = document.createElement('span');
  icon.className = 'overdue-banner-icon';
  icon.textContent = '📢';
  box.appendChild(icon);

  const body = document.createElement('div');
  body.className = 'overdue-banner-body';
  const title = document.createElement('div');
  title.className = 'overdue-banner-title';

function roomHasScheduledLeaveResident(room){
  return DB.residents.some(p => p.roomId===room.id && p.scheduledToLeave && isCurrentlyResiding(p));
}

}

function addResidentToRoom(room){
  const cap = occupancyCapacity(room);
  const confirmedCount = DB.residents.filter(p=>p.roomId===room.id).length;
  const hasDraft = !!UI.draftResident[room.id];
  if(confirmedCount + (hasDraft?1:0) >= cap){
    showAlert(`이 호실(${room.occupancy || '2인실'})은 최대 ${cap}인까지만 입실 가능합니다.`);
    return;
  }
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: todayISO(), moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex: confirmedCount };
  p.resStatus = computeResStatus(p);
  // 최초 입력 중에는 DB에 반영하지 않고 화면(초안) 상태로만 유지합니다.
  // "완료"를 눌러야 실제로 저장되고, 취소/새로고침 시 남지 않습니다.
  UI.draftResident[room.id] = p;
  render();
}

/* ---------------- room card: view mode ---------------- */
function computeResStatus(p){
  // 입실 시작일 기준 자동 계산 (화면에는 노출하지 않고 내부 데이터로만 사용)
  if(!p.moveIn) return p.resStatus || '입실중';
  const today = todayISO();
  if(p.moveIn > today) return '입실예정';
  if(p.moveIn === today) return '입실중';
  return '퇴실';
}
function isCurrentlyResiding(p){
  // 입실일이 이미 지났고(오늘 포함) 아직 퇴실 처리가 되지 않았다면 "이용중"으로 간주합니다.
  // 퇴실예정일이 지났더라도 실제 퇴실 처리(히스토리 이동) 전까지는 계속 이용중으로 봅니다.
  if(!p.moveIn) return false;
  return p.moveIn <= todayISO();
}
function isOverdue(p){
  return !!(p.moveOut && p.moveOut < todayISO());
}
function isUpcoming(p){
  return !!(p.moveIn && p.moveIn > todayISO());
}
function occupiesRoom(p){
  return isCurrentlyResiding(p) || isUpcoming(p);
}
function roomHasOverdueResident(room){
  return DB.residents.some(p => p.roomId===room.id && isOverdue(p));
}
function moveResidentToHistory(p, moveOutOverride){
  logChange(`${p.name || '입실자'} 퇴실 처리`);
  DB.residentHistory.push({
    id: uid('h'), roomId: p.roomId,
    name: p.name || '(이름 미입력)', phone: p.phone || '',
    moveIn: p.originalMoveIn || p.moveIn || '', moveOut: moveOutOverride || p.moveOut || todayISO()
  });
  DB.residents = DB.residents.filter(x=>x.id!==p.id);
  delete UI.residentEditMode[p.id];
  delete UI.residentSnapshots[p.id];
  // 마지막 재실 입실자가 퇴실한 뒤에도 저장된 상태값이 "이용중"처럼 더 이상 유효하지 않게
  // 남아있으면(과거 데이터 등) 공실로 정리합니다. 그 외에는 관리자가 이미 설정해둔 판매
  // 상태(예: 판매중)를 그대로 유지하며, 자동으로 바꾸지 않습니다.
  const room = DB.rooms.find(r=>r.id===p.roomId);
  if(room && !roomHasActiveResident(room) && !STATUS_LIST_MANUAL.includes(room.saleStatus)){
    room.saleStatus = '공실';
  }
}
function restoreFromHistory(h){
  const room = DB.rooms.find(r=>r.id===h.roomId);
  if(!room){ showAlert('해당 호실을 찾을 수 없습니다. (삭제된 호실일 수 있어요)'); return; }
  const cap = occupancyCapacity(room);
  const currentCount = DB.residents.filter(p=>p.roomId===room.id).length;
  if(currentCount >= cap){
    showAlert(`이 호실은 이미 정원(${cap}인)이 가득 차 있어 복원할 수 없습니다. 먼저 자리를 비워주세요.`);
    return;
  }
  showConfirm(`"${h.name}" 님의 정보를 이 호실의 입실자로 복원할까요?`, ()=>{
    const usedSlots = new Set(DB.residents.filter(p=>p.roomId===room.id).map(p=>p.slotIndex||0));
    let freeSlot = 0;
    while(usedSlots.has(freeSlot)) freeSlot++;
    const p = {
      id: uid('p'), roomId: room.id, name: h.name, phone: h.phone,
      channel: '독립생활', resStatus:'', contractType:'신규',
      moveIn: h.moveIn, moveOut: h.moveOut, originalMoveIn: h.moveIn, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex: freeSlot
    };
    p.resStatus = computeResStatus(p);
    DB.residents.push(p);
    DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
    UI.historyOpen[room.id] = false;
    logChange(`"${h.name}" 님을 ${room.number}호 입실자로 복원`);
    scheduleSave(); render();
  });
}
function processScheduledLeaves(){
  const today = todayISO();
  const toLeave = DB.residents.filter(p => p.scheduledToLeave && p.moveOut && p.moveOut < today);
  if(toLeave.length===0) return;
  toLeave.forEach(p => moveResidentToHistory(p));
  scheduleSave();
}
function roomHasActiveResident(room){
  return DB.residents.some(p => p.roomId===room.id && occupiesRoom(p));
}
function branchActiveCarResidents(branchId){
  const roomIds = new Set(DB.rooms.filter(r=>r.branchId===branchId).map(r=>r.id));
  return DB.residents
    .filter(p => roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && isCurrentlyResiding(p))
    .map(p => {
      const room = DB.rooms.find(r=>r.id===p.roomId);
      return { roomNumber: room ? room.number : '-', name: p.name || '(이름 미입력)', carNumber: p.carNumber };
    });
}
function branchActiveCarCount(branchId, excludeResidentId){
  const roomIds = new Set(DB.rooms.filter(r=>r.branchId===branchId).map(r=>r.id));
  return DB.residents.filter(p =>
    p.id !== excludeResidentId && roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && isCurrentlyResiding(p)
  ).length;
}
function effectiveRoomStatus(room){
  // "이용중"/"사전판매중"은 오늘 날짜 기준 실제 거주 중인 입실자가 있는지로 자동 판정하며 수동 설정 불가.
  // 재실 중에 관리자가 판매 상태를 "판매중"으로 지정해두면 "사전판매중"으로 표시됩니다.
  if(roomHasActiveResident(room)){
    return room.saleStatus === '판매중' ? '사전판매중' : '이용중';
  }
  return room.saleStatus;
}

        const topRow = document.createElement('div');
        topRow.className = 'history-top';
        topRow.innerHTML = `<span class="nm">${esc(h.name)}</span><span class="ph">${esc(h.phone||'-')}</span>`;
        if(canEdit()){
          const restoreBtn = document.createElement('button');
          restoreBtn.className = 'btn small';
          restoreBtn.textContent = '복원';
          restoreBtn.title = '이 입실자 정보를 다시 입실자로 복원';
          restoreBtn.onclick = ()=> restoreFromHistory(h);
          const delHistBtn = document.createElement('button');
          delHistBtn.className = 'iconbtn del';
          delHistBtn.innerHTML = '&times;';
          delHistBtn.title = '이 히스토리 항목 삭제';
          delHistBtn.onclick = ()=>{
            showConfirm(`"${h.name}" 님의 히스토리 기록을 완전히 삭제할까요? 이 작업은 되돌릴 수 없습니다.`, ()=>{
              DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
              logChange(`"${h.name}" 히스토리 기록 삭제`);
              scheduleSave(); render();
            });
          };
          topRow.appendChild(restoreBtn);
          topRow.appendChild(delHistBtn);
        }
        entry.appendChild(topRow);
        const periodRow = document.createElement('div');
        periodRow.className = 'history-period';
        periodRow.textContent = `${h.moveIn || '-'} ~ ${h.moveOut || '-'}`;
        entry.appendChild(periodRow);
        histBox.appendChild(entry);
      });
    }
    card.appendChild(histBox);
  }

  if(!roomEditOn && room.note){
    const chip = document.createElement('div');
    chip.className = 'rc-note-chip';
    chip.textContent = room.note;
    chip.title = room.note;
    chip.style.color = MEMO_COLORS[room.noteColor] || MEMO_COLORS.black;
    if(room.noteBold) chip.style.fontWeight = '700';
    card.appendChild(chip);
  }

  card.appendChild(document.createElement('hr')).className = 'rc-divider';

  const body = document.createElement('div');
  body.className = 'rc-body';

  if(roomEditOn){
    body.appendChild(renderRoomEditForm(room));
    body.appendChild(document.createElement('hr')).className = 'rc-divider';
    body.lastChild.style.margin = '4px 0 12px';
  }

  if(residents.length===0 && !draft){
    const emptyRow = document.createElement('div');
    emptyRow.className = 'empty-residents';
    emptyRow.innerHTML = `<span class="msg">이용 중인 입실자가 없습니다.</span>`;
    if(canEdit()){
      const addBtn = document.createElement('button');
      addBtn.className = 'btn small primary pill';
      addBtn.textContent = '+ 입실자 추가';
      addBtn.onclick = ()=> addResidentToRoom(room);
      emptyRow.appendChild(addBtn);
    }
    body.appendChild(emptyRow);
  } else {
    [...residents].sort((a,b)=> (a.slotIndex||0) - (b.slotIndex||0)).forEach((p, idx)=>{
      const isSecondary = (p.slotIndex!=null ? p.slotIndex : idx) > 0;
      if(UI.residentEditMode[p.id]) body.appendChild(renderResidentEditCard(p, isSecondary, false, room));
      else body.appendChild(renderResidentView(p, room, isSecondary));
    });
    if(draft){
      const isSecondary = (draft.slotIndex||0) > 0;
      body.appendChild(renderResidentEditCard(draft, isSecondary, true, room));
    }
  }

  card.appendChild(body);
  return card;
}

  const acts = document.createElement('div');

  if(!isSecondary && p.firstSaveDone && canEdit()){
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'btn small danger';
    leaveBtn.textContent = '퇴실';
    leaveBtn.title = '퇴실 유형을 선택해 처리합니다';
    leaveBtn.onclick = ()=> showLeaveChoiceModal(p, room);

    const extendBtn = document.createElement('button');
    extendBtn.className = 'btn small';
    extendBtn.textContent = '연장';
    extendBtn.title = '퇴실예정일 기준 1개월 뒤로 연장';
    extendBtn.onclick = ()=>{
      const newMoveOut = addOneMonth(p.moveOut || p.moveIn || todayISO());
      const violation = wouldExceedParking(p, p.moveIn, newMoveOut);
      if(violation){
        showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
        return;
      }
      showConfirm(`퇴실예정일을 ${newMoveOut}로 연장할까요? (기존 퇴실예정일 기준 1개월 뒤)`, ()=>{
        p.moveOut = newMoveOut;
        p.scheduledToLeave = false;
        p.contractType = '연장';
        logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 퇴실예정일 연장: ${newMoveOut}`);
        scheduleSave(); render();
      });
    };

    const paymentBtn = document.createElement('button');
    paymentBtn.className = 'btn small';
    paymentBtn.textContent = '결제현황';
    paymentBtn.title = '회차별 납부 기록 보기';
    paymentBtn.onclick = ()=> showPaymentModal(p, room);

    acts.appendChild(leaveBtn); acts.appendChild(extendBtn); acts.appendChild(paymentBtn);
  }
  nameLine.appendChild(nameWrap); nameLine.appendChild(acts);
  block.appendChild(nameLine);

  if(!isSecondary){
    const period = document.createElement('div');
    period.className = 'resident-period';
    period.textContent = `${p.moveIn || '-'} ~ ${p.moveOut || '미정'}`;
    block.appendChild(period);

    if(p.carNumber && p.carNumber.trim()){
      const carLine = document.createElement('div');
      carLine.className = 'resident-car';
      carLine.textContent = `차량 ${p.carNumber}`;
      block.appendChild(carLine);
    }

    if(p.memo){
      const memo = document.createElement('div');
      memo.className = 'resident-memo';
      memo.textContent = p.memo;
      memo.title = p.memo;
      memo.style.color = MEMO_COLORS[p.memoColor] || MEMO_COLORS.black;
      if(p.memoBold) memo.style.fontWeight = '700';
      block.appendChild(memo);
    }
  }
  return block;
}

function wouldExceedParking(p, candidateMoveIn, candidateMoveOut){
  if(!p.carNumber || !p.carNumber.trim()) return null;
  const room = DB.rooms.find(r=>r.id===p.roomId);
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  if(!branch) return null;
  if(!isCurrentlyResiding({ moveIn: candidateMoveIn, moveOut: candidateMoveOut })) return null;
  const cap = branch.parkingCapacity || 0;
  const others = branchActiveCarCount(branch.id, p.id);
  const projected = others + 1;
  if(projected > cap) return { branch, cap, others, projected };
  return null;
}

function renderResidentEditCard(p, isSecondary, isDraft, room){
  const card = document.createElement('div');
  card.className = 'resident-edit-card';
  const maybeSave = ()=>{ if(!isDraft) scheduleSave(); };

  const top = document.createElement('div');
  top.className = 'redit-top';
  top.innerHTML = `<span class="redit-title">${isSecondary ? '2번째 입실자' : '입실자 정보'}</span>`;
  const acts = document.createElement('div');
  acts.style.cssText = 'display:flex;gap:5px;';
  const doneBtn = document.createElement('button');
  doneBtn.className = 'iconbtn active'; doneBtn.innerHTML = '&#10003;'; doneBtn.title = '수정 완료';
  doneBtn.onclick = ()=>{
    const missing = residentMissingFields(p, isSecondary);
    if(missing.length){
      showAlert(`필수 항목이 비어 있습니다: ${missing.join(', ')}\n입력을 완료한 뒤 다시 시도해주세요.`);
      return;
    }
    const violation = wouldExceedParking(p, p.moveIn, p.moveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
      return;
    }
    p.firstSaveDone = true;
    if(isDraft){
      p.originalMoveIn = p.moveIn;
      DB.residents.push(p);
      delete UI.draftResident[p.roomId];
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 입실자 신규 등록`);
    } else {
      delete UI.residentSnapshots[p.id];
      UI.residentEditMode[p.id] = false;
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 입실자 정보 수정`);
    }
    scheduleSave(); render();
  };
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'iconbtn'; cancelBtn.innerHTML = '&#8634;'; cancelBtn.title = '취소';
  cancelBtn.onclick = ()=>{
    if(isDraft){
      // 아직 저장된 적 없는 초안이므로 그냥 버립니다 (DB에는 존재하지 않음)
      delete UI.draftResident[p.roomId];
      render();
      return;
    }
    const snap = UI.residentSnapshots[p.id];
    if(snap) Object.assign(p, snap);
    delete UI.residentSnapshots[p.id];
    UI.residentEditMode[p.id] = false;
    scheduleSave(); render();
  };
  const delBtn = document.createElement('button');
  delBtn.className = 'iconbtn del'; delBtn.innerHTML = '&times;'; delBtn.title = '입실자 삭제';
  delBtn.onclick = ()=>{
    if(isDraft){
      delete UI.draftResident[p.roomId];
      render();
      return;
    }
    showConfirm(`${p.name || '이 입실자'} 정보를 삭제할까요?`, ()=>{
      delete UI.residentSnapshots[p.id];
      DB.residents = DB.residents.filter(x=>x.id!==p.id); scheduleSave(); render();
    });
  };
  acts.appendChild(cancelBtn); acts.appendChild(doneBtn); acts.appendChild(delBtn);
  top.appendChild(acts);
  card.appendChild(top);

  const nameInput = document.createElement('input');
  nameInput.type = 'text'; nameInput.placeholder = '홍길동'; nameInput.value = p.name;
  if(!p.name || !p.name.trim()) nameInput.classList.add('invalid');
  nameInput.addEventListener('input', ()=>{ p.name = nameInput.value; maybeSave(); nameInput.classList.toggle('invalid', !nameInput.value.trim()); });
  card.appendChild(fullRow(labeledReq('이름', nameInput)));

  const phoneInput = document.createElement('input');
  phoneInput.type = 'tel'; phoneInput.placeholder = '010-0000-0000'; phoneInput.value = p.phone;
  if(!p.phone || !p.phone.trim()) phoneInput.classList.add('invalid');
  phoneInput.addEventListener('input', ()=>{ p.phone = phoneInput.value; maybeSave(); phoneInput.classList.toggle('invalid', !phoneInput.value.trim()); });
  card.appendChild(fullRow(labeledReq('연락처', phoneInput)));

  if(isSecondary){
    setTimeout(()=>{ if(!p.name) nameInput.focus(); }, 0);
    return card;
  }

  const chSel = document.createElement('select');
  DB.channelList.forEach(c=>{ const o=document.createElement('option'); o.textContent=c; o.selected=c===p.channel; chSel.appendChild(o); });
  chSel.addEventListener('change', ()=>{ p.channel = chSel.value; maybeSave(); render(); });
  card.appendChild(fullRow(labeled('유입채널', chSel)));

  const branchForCar = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  const parkingAvailable = !branchForCar || (branchForCar.parkingCapacity||0) > 0;
  if(parkingAvailable){
    const carInput = document.createElement('input');
    carInput.type = 'text'; carInput.placeholder = '12가3456'; carInput.value = p.carNumber || '';
    carInput.addEventListener('change', ()=>{
      const newVal = carInput.value.trim();
      const branch = branchForCar;
      if(newVal && branch && isCurrentlyResiding(p)){
        const cap = branch.parkingCapacity || 0;
        const others = branchActiveCarCount(branch.id, p.id);
        const projected = others + 1;
        if(projected > cap){
          showAlert(`"${branch.name}" 지점의 주차 가능 대수(${cap}대)를 초과합니다.\n(현재 이용중 ${others}대 + 이 입실자 1대 = ${projected}대)\n\n차량번호를 비우거나, 지점 정보에서 주차 가능 대수를 먼저 늘려주세요.`);
          carInput.value = p.carNumber || '';
          return;
        }
      }
      p.carNumber = carInput.value;
      maybeSave();
    });
    card.appendChild(fullRow(labeled('차량 번호 (선택)', carInput)));
  }

  const inDateRow = document.createElement('div');
  inDateRow.className = 'redit-inline-row';
  const inDate = document.createElement('input'); inDate.type='date'; inDate.value = p.moveIn || '';
  if(!p.moveIn) inDate.classList.add('invalid');
  inDate.addEventListener('change', ()=>{
    const violation = wouldExceedParking(p, inDate.value, p.moveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n입실일을 다시 확인하거나 차량번호를 비운 뒤 저장해주세요.`);
      inDate.value = p.moveIn || '';
      return;
    }
    p.moveIn = inDate.value; p.resStatus = computeResStatus(p); maybeSave(); render();
  });
  inDateRow.appendChild(labeledReq('입실일', inDate));
  if(p.firstSaveDone){
    const extendBtn = document.createElement('button');
    extendBtn.className = 'btn small';
    extendBtn.textContent = '연장';
    extendBtn.title = '퇴실예정일 기준 1개월 연장';
    extendBtn.onclick = ()=>{
      const newMoveOut = addOneMonth(p.moveOut || p.moveIn || todayISO());
      const violation = wouldExceedParking(p, p.moveIn, newMoveOut);
      if(violation){
        showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
        return;
      }
      p.moveOut = newMoveOut;
      p.contractType = '연장';
      maybeSave(); render();
    };
    const extendWrap = document.createElement('div');
    extendWrap.style.cssText = 'display:flex;align-items:flex-end;padding-bottom:1px;';
    extendWrap.appendChild(extendBtn);
    inDateRow.appendChild(extendWrap);
  }
  card.appendChild(inDateRow);

  const outDate = document.createElement('input'); outDate.type='date'; outDate.value = p.moveOut || '';
  if(!p.moveOut) outDate.classList.add('invalid');
  outDate.addEventListener('change', ()=>{
    const violation = wouldExceedParking(p, p.moveIn, outDate.value);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n퇴실예정일을 다시 확인하거나 차량번호를 비운 뒤 저장해주세요.`);
      outDate.value = p.moveOut || '';
      return;
    }
    p.moveOut = outDate.value; maybeSave(); render();
  });

  const outDateRow = document.createElement('div');
  outDateRow.className = 'redit-inline-row';
  outDateRow.appendChild(labeledReq('퇴실(예정)일', outDate));
  if(p.firstSaveDone){
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;gap:6px;align-items:flex-end;padding-bottom:1px;';
    const scheduledBtn = document.createElement('button');
    scheduledBtn.className = 'btn small' + (p.scheduledToLeave ? ' primary' : '');
    scheduledBtn.textContent = '퇴실예정';

    scheduledBtn.onclick = ()=>{ p.scheduledToLeave = !p.scheduledToLeave; maybeSave(); render(); };
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'btn small danger';
    leaveBtn.textContent = '퇴실';
    leaveBtn.title = '지금(오늘 날짜)로 즉시 퇴실 처리 (정보는 히스토리로 이동하고 자리가 비워집니다)';
    leaveBtn.onclick = ()=>{
      const today = todayISO();
      showConfirm(`${p.name || '이 입실자'}를 오늘(${today}) 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
        moveResidentToHistory(p, today);
        scheduleSave(); render();
      });
    };
    btnCol.appendChild(scheduledBtn); btnCol.appendChild(leaveBtn);
    outDateRow.appendChild(btnCol);
  }
  card.appendChild(outDateRow);

  const memo = document.createElement('textarea');
  memo.placeholder = '입실자 메모 (실거주자 정보, 결제방식 등)';
  memo.value = p.memo;
  memo.style.marginTop = '4px';
  memo.addEventListener('input', ()=>{ p.memo = memo.value; maybeSave(); });
  card.appendChild(memo);
  card.appendChild(renderMemoStyleControls(p, 'memoColor', 'memoBold'));

  if(room && !isDraft){
    const cap = occupancyCapacity(room);
    const currentTotal = DB.residents.filter(x=>x.roomId===room.id).length + (UI.draftResident[room.id] ? 1 : 0);
    if(currentTotal < cap){
      const addRow = document.createElement('div');
      addRow.style.cssText = 'margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);';
      const addBtn = document.createElement('button');
      addBtn.className = 'btn small primary';
      addBtn.textContent = '+ 2번째 입실자 추가';
      addBtn.onclick = ()=> addResidentToRoom(room);
      addRow.appendChild(addBtn);
      card.appendChild(addRow);
    }
  }

  setTimeout(()=>{ if(!p.name) nameInput.focus(); }, 0);
  return card;
}

const TIMELINE_BAR_STATUSES = [
  { key:'정상',     fg:'var(--st-occupied)', bg:'var(--st-occupied-bg)' },
  { key:'연체',     fg:'var(--st-hold)',     bg:'var(--st-hold-bg)' },
  { key:'퇴실예정', fg:'var(--st-leaving)',  bg:'var(--st-leaving-bg)' },
  { key:'사전판매중', fg:'var(--st-presell)', bg:'var(--st-presell-bg)' }
];
function residentTimelineMeta(p, room){
  if(isOverdue(p)) return TIMELINE_BAR_STATUSES[1];
  if(p.scheduledToLeave) return TIMELINE_BAR_STATUSES[2];
  if(room && effectiveRoomStatus(room)==='사전판매중') return TIMELINE_BAR_STATUSES[3];
  return TIMELINE_BAR_STATUSES[0];
}
function buildBar(p, room, monthStart, daysInMonth){
  const monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth(), daysInMonth);
  const inD = new Date(p.moveIn);
  const outD = p.moveOut ? new Date(p.moveOut) : new Date(monthStart.getFullYear(), monthStart.getMonth()+2, 0);
  if(outD < monthStart || inD > monthEnd) return null;
  const clampIn = inD < monthStart ? monthStart : inD;
  const clampOut = outD > monthEnd ? monthEnd : outD;
  const startDay = clampIn.getDate();
  const endDay = clampOut.getDate();
  const leftPct = ((startDay-1)/daysInMonth)*100;
  const widthPct = Math.max(((endDay-startDay+1)/daysInMonth)*100, (1/daysInMonth)*100);
  const bar = document.createElement('div');
  bar.className = 'tl-bar';
  bar.style.left = leftPct + '%';
  bar.style.width = widthPct + '%';
  const meta = residentTimelineMeta(p, room);
  bar.style.background = meta.fg;
  const nameText = esc(p.name || p.resStatus);
  const memoText = p.memo ? ` <span class="tl-bar-memo">${esc(p.memo)}</span>` : '';
  bar.innerHTML = `<span class="tl-bar-name">${nameText}</span>${memoText}`;
  bar.title = `${p.name || '이름 미입력'} · ${meta.key} · ${p.channel} · ${p.moveIn} ~ ${p.moveOut || '미정'}${p.memo ? ' · ' + p.memo : ''} (클릭 시 호실로 이동)`;
  bar.style.cursor = 'pointer';
  bar.onclick = ()=> scrollToRoomCard(room);
  return bar;
}

function handleRoomBulkCreateFile(file){
  if(typeof XLSX === 'undefined'){ showAlert('\uC5D1\uC140 \uB77C\uC774\uBE0C\uB7EC\uB9AC\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4. \uB124\uD2B8\uC6CC\uD06C \uC5F0\uACB0\uC744 \uD655\uC778\uD574\uC8FC\uC138\uC694.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

      const result = { created:0, skippedExists:0, unmatchedBranch:[] };
      const newRooms = [];

      rows.forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(row['\uC9C0\uC810\uBA85']);
        const numberRaw = cleanKeyLoose(String(row['\uD638\uC2E4\uBC88\uD638']||'')).replace(/\uD638$/,'');
        if(!branchRaw && !numberRaw) return; // \uBE48 \uC5EC\uBC31 \uD589

        const resolvedBranchName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
        const branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedBranchName.toLowerCase());
        if(!branch){ result.unmatchedBranch.push(`[${idx+2}\uD589] \uC9C0\uC810 "${branchRaw}"\uC744(\uB97C) \uCC3E\uC744 \uC218 \uC5C6\uC74C`); return; }

        const exists = DB.rooms.some(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(numberRaw))
          || newRooms.some(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(numberRaw));
        if(exists){ result.skippedExists++; return; }

        const occRaw = cleanKeyLoose(String(row['\uC778\uC2E4\uAD6C\uBD84']||''));
        const occupancy = (occRaw==='2' || occRaw==='2\uC778\uC2E4') ? '2\uC778\uC2E4' : '1\uC778\uC2E4';
        const type = cleanKeyLoose(row['\uD0C0\uC785']) || '\uAE30\uD0C0';
        const price = Number(row['\uC815\uC0C1\uC785\uC2E4\uB8CC(\uC6D0)']) || 0;

        newRooms.push({
          id: uid('r'), branchId: branch.id, number: numberRaw,
          type, occupancy, saleStatus:'\uACF5\uC2E4',
          needsCleaning:false, needsRetouch:false, maintenanceDate:'', preSelling:false, note:'',
          price
        });
        result.created++;
      });

      const problems = [...result.unmatchedBranch];
      showConfirm(
        `\uC5D1\uC140 \uBD84\uC11D \uACB0\uACFC\n`+
        `- \uC0C8\uB85C \uC0DD\uC131\uB420 \uD638\uC2E4: ${result.created}\uAC1C\n`+
        `- \uC774\uBBF8 \uC874\uC7AC\uD574\uC11C \uAC74\uB108\uB700: ${result.skippedExists}\uAC1C\n`+
        `- \uC9C0\uC810\uBA85 \uBD88\uC77C\uCE58: ${result.unmatchedBranch.length}\uAC74\n\n`+
        `\uACC4\uC18D\uD560\uAE4C\uC694?`,
        ()=>{
          DB.rooms.push(...newRooms);
          logChange(`\uD638\uC2E4 \uC77C\uAD04 \uC0DD\uC131 (${result.created}\uAC1C)`);
          scheduleSave();
          render();
          if(problems.length){
            showAlert(`\uD638\uC2E4 \uC0DD\uC131 \uC644\uB8CC (${result.created}\uAC1C). \uB2E4\uB9CC \uC544\uB798 ${problems.length}\uAC74\uC740 \uBC18\uC601\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4:\n\n` +
              problems.slice(0,30).join('\n') + (problems.length>30 ? `\n...\uC678 ${problems.length-30}\uAC74` : ''));
          } else {
            showAlert(`\uD638\uC2E4 \uC0DD\uC131\uC774 \uC644\uB8CC\uB418\uC5C8\uC2B5\uB2C8\uB2E4. (${result.created}\uAC1C)`);
          }
        }
      );
    }catch(err){
      console.error(err);
      showAlert('\uC5D1\uC140 \uCC98\uB9AC \uC911 \uC624\uB958\uAC00 \uBC1C\uC0DD\uD588\uC2B5\uB2C8\uB2E4: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

      handleResidentResyncFile(fileInput.files[0]);
      fileInput.value = '';
    }
  });
  box.appendChild(uploadBtn);
  box.appendChild(fileInput);
  return box;
}

function handleResidentResyncFile(file){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

      const result = { matched:0, vacant:0, unmatchedBranch:[], unmatchedRoom:[], overCapacity:[] };
      const newResidents = [];
      const slotCounters = {};

      rows.forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(row['지점명']);
        const roomRaw = cleanKeyLoose(String(row['호실번호']||'')).replace(/호$/,'');
        if(!branchRaw && !roomRaw) return; // 빈 여백 행

        const resolvedBranchName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
        const branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedBranchName.toLowerCase());
        if(!branch){ result.unmatchedBranch.push(`[${idx+2}행] 지점 "${branchRaw}"을(를) 찾을 수 없음`); return; }

        const room = DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw));
        if(!room){ result.unmatchedRoom.push(`[${idx+2}행] ${branch.name} "${roomRaw}"호를 찾을 수 없음`); return; }

        const nameRaw = cleanKeyLoose(row['이름']);
        if(!nameRaw || nameRaw==='-' || nameRaw==='*'){ result.vacant++; return; }

        const cap = occupancyCapacity(room);
        const slot = slotCounters[room.id] || 0;
        if(slot >= cap){
          result.overCapacity.push(`[${idx+2}행] ${branch.name} ${room.number}호 "${nameRaw}" (정원 ${cap}명 초과로 제외)`);
          return;
        }
        slotCounters[room.id] = slot + 1;

        let phone = String(row['연락처']||'').trim();
        if(phone.startsWith('=')) phone = phone.slice(1);
        const moveIn = toISODateStr(row['입실일']);
        const moveOut = toISODateStr(row['퇴실예정일']);
        const p = {
          id: uid('p'), roomId: room.id, name: nameRaw,
          channel: '독립생활', resStatus:'', contractType:'신규',
          moveIn, moveOut, originalMoveIn: moveIn, scheduledToLeave:false,
          phone, memo:'', carNumber:'', firstSaveDone:true, slotIndex: slot
        };
        p.resStatus = computeResStatus(p);
        newResidents.push(p);
        result.matched++;
      });

      const problems = [...result.unmatchedBranch, ...result.unmatchedRoom, ...result.overCapacity];
      showConfirm(
        `엑셀 분석 결과\n`+
        `- 등록될 입실자: ${result.matched}명\n`+
        `- 공실 처리(이름 "-"/"*"): ${result.vacant}건\n`+
        `- 지점명 불일치: ${result.unmatchedBranch.length}건\n`+
        `- 호실 불일치: ${result.unmatchedRoom.length}건\n`+
        `- 정원 초과 제외: ${result.overCapacity.length}건\n\n`+
        `현재 등록된 모든 입실자(${DB.residents.length}명)와 퇴실 이력이 삭제되고 위 내용으로 교체됩니다.\n이 작업은 되돌릴 수 없습니다. 계속할까요?`,
        ()=>{
          DB.residents = newResidents;
          DB.residentHistory = [];
          logChange(`계약자 DB 엑셀로 입실자 전체 재등록 (${result.matched}명)`);
          scheduleSave();
          render();
          if(problems.length){
            showAlert(`재등록 완료 (${result.matched}명). 다만 아래 ${problems.length}건은 반영되지 않았습니다:\n\n` +
              problems.slice(0,30).join('\n') + (problems.length>30 ? `\n...외 ${problems.length-30}건` : ''));
          } else {
            showAlert(`입실자 재등록이 완료되었습니다. (${result.matched}명)`);
          }
        }
      );
    }catch(err){
      console.error(err);
      showAlert('엑셀 처리 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function toISODateStr(v){
  if(v == null || v==='') return '';
  if(v instanceof Date){
    // 엑셀/구글시트 날짜 직렬값에 부동소수점 오차가 섞여 있어(예: 자정이 아닌 23:59:xx)
    // 하루 전날로 잘못 계산되는 경우가 있어, 가장 가까운 날짜로 반올림해 보정합니다.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth()+1).padStart(2,'0'), d = String(rounded.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'number'){
    // 엑셀 날짜 직렬번호(문자열이 아닌 순수 숫자로 남은 경우) 보정
    const parsed = XLSX.SSF && XLSX.SSF.parse_date_code ? XLSX.SSF.parse_date_code(Math.round(v)) : null;
    if(parsed){
      const y = parsed.y, m = String(parsed.m).padStart(2,'0'), d = String(parsed.d).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
  }
  return String(v).trim();
}

function sheetRows(wb, name){
  const sheet = wb.Sheets[name];
  if(!sheet) return [];
  return XLSX.utils.sheet_to_json(sheet, { defval:'' });
}

function importFromWorkbook(wb){
  const result = { branchesCreated:0, branchesUpdated:0, roomsCreated:0, roomsUpdated:0, residentsAdded:0, warnings:[] };
  // 눈에 보이지 않는 zero-width space 등의 문자 때문에 이름이 서로 달라 보이는 문제를 막기 위해 정리합니다.
  const cleanKey = (s)=> String(s||'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim();
  const findBranch = (name)=> DB.branches.find(b=> cleanKey(b.name).toLowerCase() === cleanKey(name).toLowerCase());

  sheetRows(wb, '지점').forEach(row=>{
    const name = cleanKey(row['지점명']);
    if(!name) return;
    const cap = Math.max(0, Math.min(10, parseInt(row['주차가능대수'],10) || 0));
    let branch = findBranch(name);
    if(branch){
      branch.parkingCapacity = cap;
      if(String(row['주차메모']||'').trim()) branch.parkingNote = String(row['주차메모']);
      if(String(row['특이사항메모']||'').trim()) branch.memo = String(row['특이사항메모']);
      result.branchesUpdated++;
    } else {
      DB.branches.push({ id: uid('b'), name, parkingNote: String(row['주차메모']||''), parkingCapacity: cap, memo: String(row['특이사항메모']||'') });
      result.branchesCreated++;
    }
  });

  sheetRows(wb, '호실').forEach((row, idx)=>{
    const branchName = cleanKey(row['지점명']);
    const number = cleanKey(row['호실번호']);
    if(!branchName || !number){ result.warnings.push(`[호실 ${idx+2}행] 지점명 또는 호실번호 누락 - 건너뜀`); return; }
    const branch = findBranch(branchName);
    if(!branch){ result.warnings.push(`[호실 ${idx+2}행] "${branchName}" 지점을 찾을 수 없어 건너뜀`); return; }
    const type = ROOM_TYPE_LIST.includes(row['타입']) ? row['타입'] : '기타';
    const occupancy = OCCUPANCY_LIST.includes(row['인실구분']) ? row['인실구분'] : '2인실';
    const rawStatus = String(row['판매상태']||'').trim();
    const saleStatus = STATUS_LIST_MANUAL.includes(rawStatus) ? rawStatus : '공실';
    const price = Number(row['정상입실료']) || 0;
    const needsCleaning = String(row['청소필요']||'').trim().toUpperCase()==='O';
    const needsRetouch = needsCleaning ? false : String(row['리터치필요']||'').trim().toUpperCase()==='O';
    const note = String(row['호실특이사항']||'');
    let room = DB.rooms.find(r=> r.branchId===branch.id && cleanKey(r.number).toLowerCase()===number.toLowerCase());
    if(room){
      Object.assign(room, { type, occupancy, saleStatus, price, needsCleaning, needsRetouch, note });
      result.roomsUpdated++;
    } else {
      DB.rooms.push({ id: uid('r'), branchId: branch.id, number, type, occupancy, saleStatus, needsCleaning, needsRetouch, note, price });
      result.roomsCreated++;
    }
  });

  sheetRows(wb, '입실자').forEach((row, idx)=>{
    const branchName = cleanKey(row['지점명']);
    const number = cleanKey(row['호실번호']);
    const name = cleanKey(row['이름']);
    const phone = cleanKey(row['연락처']);
    if(!branchName || !number || !name || !phone){ result.warnings.push(`[입실자 ${idx+2}행] 지점명/호실번호/이름/연락처 중 누락 - 건너뜀`); return; }
    const branch = findBranch(branchName);
    if(!branch){ result.warnings.push(`[입실자 ${idx+2}행] "${branchName}" 지점을 찾을 수 없어 건너뜀`); return; }
    const room = DB.rooms.find(r=> r.branchId===branch.id && cleanKey(r.number).toLowerCase()===number.toLowerCase());
    if(!room){ result.warnings.push(`[입실자 ${idx+2}행] "${branchName} ${number}호"를 찾을 수 없어 건너뜀`); return; }
    const cap = occupancyCapacity(room);
    const slotIndex = String(row['순번']).trim()==='2' ? 1 : 0;
    if(slotIndex >= cap){ result.warnings.push(`[입실자 ${idx+2}행] ${branchName} ${number}호는 ${cap}인실이라 순번 ${slotIndex+1}을 추가할 수 없어 건너뜀`); return; }
    if(DB.residents.some(p=>p.roomId===room.id && (p.slotIndex||0)===slotIndex)){
      result.warnings.push(`[입실자 ${idx+2}행] ${branchName} ${number}호 순번 ${slotIndex+1}은 이미 등록되어 있어 건너뜀`); return;
    }
    const moveIn = toISODateStr(row['입실일']);
    const moveOut = toISODateStr(row['퇴실예정일']);
    if(slotIndex===0 && (!moveIn || !moveOut)){ result.warnings.push(`[입실자 ${idx+2}행] 주 입실자는 입실일/퇴실예정일이 필수입니다 - 건너뜀`); return; }
    const channel = DB.channelList.includes(row['유입채널']) ? row['유입채널'] : '독립생활';
    let carNumber = slotIndex===0 ? String(row['차량번호']||'').trim() : '';
    if(carNumber && isCurrentlyResiding({ moveIn, moveOut })){
      const cap = branch.parkingCapacity || 0;
      const others = branchActiveCarCount(branch.id, null);
      if(others + 1 > cap){
        result.warnings.push(`[입실자 ${idx+2}행] ${branchName} 지점 주차 가능 대수(${cap}대) 초과로 차량번호는 비워두고 등록했습니다.`);
        carNumber = '';
      }
    }
    const p = {
      id: uid('p'), roomId: room.id, name, phone,
      channel: slotIndex===0 ? channel : '독립생활',
      contractType: '신규',
      moveIn: slotIndex===0 ? moveIn : '',
      moveOut: slotIndex===0 ? moveOut : '',
      originalMoveIn: slotIndex===0 ? moveIn : '',
      scheduledToLeave: false,
      carNumber,
      memo: slotIndex===0 ? String(row['메모']||'') : '',
      firstSaveDone: true, slotIndex
    };
    p.resStatus = computeResStatus(p);
    DB.residents.push(p);
    result.residentsAdded++;
  });

  return result;
}

function buildImportSummary(r){
  let msg = `업로드 완료\n\n지점: 신규 ${r.branchesCreated}건 · 갱신 ${r.branchesUpdated}건\n호실: 신규 ${r.roomsCreated}건 · 갱신 ${r.roomsUpdated}건\n입실자: 신규 ${r.residentsAdded}건`;
  if(r.warnings.length){
    msg += `\n\n건너뛴 항목 (${r.warnings.length}건):\n` + r.warnings.slice(0,15).join('\n');
    if(r.warnings.length>15) msg += `\n...외 ${r.warnings.length-15}건`;
  }
  return msg;
}

      };

      const delBtn = document.createElement('button');

      delBtn.title = isPending ? '요청 거절' : '계정 접근 차단 (대기 상태로 전환)';

            .then(()=>{ writeChangeLog(`${u.email} 계정 접근 차단/거절`); render(); });

      };
      row.appendChild(delBtn);

      body.appendChild(row);
    });
  }).catch(e=>{ body.textContent = '사용자 목록을 불러오지 못했습니다: ' + e.message; });

  return box;
}

const CHANGELOG_PAGE_SIZE = 10;
function renderChangeLogPanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>변경 로그</h3>`;

  const toolbar = document.createElement('div');
  toolbar.className = 'log-toolbar';
  const dateWrap = document.createElement('div');
  const dateLabel = document.createElement('label');
  dateLabel.className = 'field-label'; dateLabel.textContent = '날짜 조회 (하루 단위)';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateWrap.appendChild(dateLabel); dateWrap.appendChild(dateInput);
  const searchBtn = document.createElement('button');
  searchBtn.className = 'btn small primary'; searchBtn.textContent = '조회';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn small'; resetBtn.textContent = '최근 50건 보기';
  toolbar.appendChild(dateWrap); toolbar.appendChild(searchBtn); toolbar.appendChild(resetBtn);
  box.appendChild(toolbar);

  const body = document.createElement('div');
  body.style.cssText = 'font-size:12px;color:var(--ink-soft);';
  box.appendChild(body);
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  box.appendChild(pager);

  let currentLogs = [];
  let currentPage = 1;

  function renderPage(){
    body.innerHTML = '';
    pager.innerHTML = '';
    if(currentLogs.length === 0){ body.textContent = '기록된 변경 로그가 없습니다.'; return; }
    const totalPages = Math.ceil(currentLogs.length / CHANGELOG_PAGE_SIZE);
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * CHANGELOG_PAGE_SIZE;
    currentLogs.slice(start, start + CHANGELOG_PAGE_SIZE).forEach(d=>{
      const time = (d.timestamp || '').replace('T',' ').slice(0,16);
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <span class="log-time">${esc(time)}</span>
        <span class="log-email">${esc(d.email || '-')}</span>
        <span class="log-summary">${esc(d.summary || '')}</span>
      `;
      body.appendChild(row);
    });
    if(currentLogs.length > CHANGELOG_PAGE_SIZE){
      for(let p=1; p<=totalPages; p++){
        const pBtn = document.createElement('button');
        pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
        pBtn.textContent = String(p);
        pBtn.onclick = ()=>{ currentPage = p; renderPage(); };
        pager.appendChild(pBtn);
      }
    }
  }

  function loadDefault(){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    CHANGELOG_COL.orderBy('timestamp','desc').limit(50).get().then(snap=>{
      currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
      currentPage = 1;
      renderPage();
    }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  function loadByDate(dateStr){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    const dayStart = dateStr + 'T00:00:00.000Z';
    const dayEnd = dateStr + 'T23:59:59.999Z';
    CHANGELOG_COL.where('timestamp','>=',dayStart).where('timestamp','<=',dayEnd)
      .orderBy('timestamp','desc').limit(500).get().then(snap=>{
        currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
        currentPage = 1;
        renderPage();
      }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  searchBtn.onclick = ()=>{
    if(!dateInput.value){ showAlert('조회할 날짜를 선택해주세요.'); return; }
    loadByDate(dateInput.value);
  };
  resetBtn.onclick = ()=>{ dateInput.value = ''; loadDefault(); };

  loadDefault();
  return box;
}

function renderStatsView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';

  wrap.appendChild(renderOverdueStatsCard());
  wrap.appendChild(renderCleaningCards());

  const branchSection = document.createElement('div');
  branchSection.className = 'stat-section';
  branchSection.innerHTML = `<h3>지점별 현황</h3>`;
  const table = document.createElement('table');
  table.className = 'branch-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>호실수</th><th>이용중</th><th>판매중</th><th>입실율</th><th>판매보류</th><th>예약</th></tr></thead>`;
  const today = todayISO();
  const tbody = document.createElement('tbody');
  const totals = { total:0, occupied:0, forSale:0, hold:0, reserved:0, activeCount:0 };
  DB.branches.forEach(b=>{
    const rms = DB.rooms.filter(r=>r.branchId===b.id);
    const roomIds = new Set(rms.map(r=>r.id));
    const total = rms.length;
    let occupied=0, forSale=0, hold=0, activeCount=0;
    rms.forEach(r=>{
      const s = effectiveRoomStatus(r);
      if(s==='이용중' || s==='사전판매중') occupied++;
      else if(s==='판매중') forSale++;
      else if(s==='판매보류') hold++;
      if(roomHasActiveResident(r)) activeCount++;
    });
    const reserved = DB.residents.filter(p => roomIds.has(p.roomId) && p.moveIn && p.moveIn > today).length;
    const occRate = total ? Math.round((activeCount/total)*100) : 0;
    totals.total += total; totals.occupied += occupied; totals.forSale += forSale;
    totals.hold += hold; totals.reserved += reserved; totals.activeCount += activeCount;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="#" data-goto="${b.id}" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(b.name)}</a></td>
      <td>${total}</td><td>${occupied}</td><td>${forSale}</td><td>${occRate}%</td><td>${hold}</td><td>${reserved}</td>`;
    tbody.appendChild(tr);
  });
  const totalOccRate = totals.total ? Math.round((totals.activeCount/totals.total)*100) : 0;
  const totalTr = document.createElement('tr');
  totalTr.className = 'branch-table-total';
  totalTr.innerHTML = `<td>전체</td>
    <td>${totals.total}</td><td>${totals.occupied}</td><td>${totals.forSale}</td><td>${totalOccRate}%</td><td>${totals.hold}</td><td>${totals.reserved}</td>`;
  tbody.insertBefore(totalTr, tbody.firstChild);
  table.appendChild(tbody);
  branchSection.appendChild(table);
  wrap.appendChild(branchSection);

  wrap.querySelectorAll('[data-goto]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); UI.view='branch'; UI.branchId = a.dataset.goto; UI.branchTab='rooms'; UI.roomStatusFilter='이용중'; render(); });
  });

  return wrap;
}
