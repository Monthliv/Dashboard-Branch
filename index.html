// 지점 구분: 소속명(affiliation)에 "먼슬리브"가 들어있으면 먼슬리브 직영 지점, 그렇지 않고
// 다른 회사 브랜드로 표기돼 있으면(예: 달해스테이·더쉼·블루스테이 등) 입점고시원으로 분류한다.
// 먼슬리브 직영 중에서도 기기명에 "호텔스테이"가 들어있으면(예: "먼슬리브 청량리 호텔스테이_...")
// 별도로 호텔스테이로 더 세분화한다 — 소속명은 지점마다 "호텔 스테이"/"호스텔" 등으로 표기가
// 갈려 신뢰할 수 없어서, 기기명 원문 쪽을 기준으로 판단한다.
const DOORLOCK_CATEGORY_ORDER = ['입점고시원', '먼슬리브', '호텔스테이'];
function doorlockCategoryForGroup(group){
  const rec = group.records.find(r=> r.affiliation);
  if(!rec || !rec.affiliation.includes('먼슬리브')) return '입점고시원';
  const isHotelStay = group.records.some(r=> (r.deviceName||'').includes('호텔스테이'));
  return isHotelStay ? '호텔스테이' : '먼슬리브';
}
// 도어락 지점명(기기명에서 뽑아낸 것)을 실제 대시보드에 등록된 지점과 이름 기준으로 자동
// 매칭한다 — 회사 공통 단어(먼슬리브 등, doorlockStripGenericWords 재사용)와 끝의 "점"을 지운
// 뒤 서로 포함 관계면 같은 지점으로 본다. 완벽하지 않을 수 있어 doorlockBranchLinks로 직접
// 연결을 지정해 덮어쓸 수 있게 해둔다(그쪽이 항상 우선). DB.branches가 없는 화면(공유 링크 등
// 도어락 데이터만 불러온 상태)에서는 조용히 null을 반환한다.
function normalizeForDoorlockBranchMatch(s){
  let cleaned = String(s||'').replace(/[\s_]+/g,'');
  cleaned = doorlockStripGenericWords(cleaned);
  return cleaned.replace(/점$/, '');
}
function autoMatchDoorlockBranch(doorlockLabel){
  if(!DB.branches) return null;
  const norm = normalizeForDoorlockBranchMatch(doorlockLabel);
  if(!norm) return null;
  return DB.branches.find(b=>{
    const bn = normalizeForDoorlockBranchMatch(b.name);
    return bn && (bn.includes(norm) || norm.includes(bn));
  }) || null;
}
// 화면에 보여줄 지점 라벨(병합된 행)에 대해, 수동으로 연결해둔 실제 지점(doorlockBranchLinks)이
// 있으면 그걸 우선 쓰고, 없으면 이름 기준 자동 매칭 결과를 쓴다.
function doorlockResolveBranchLink(group, label){
  const linkedId = group.keys.map(k=> DB.doorlockBranchLinks && DB.doorlockBranchLinks[k]).find(Boolean);
  if(linkedId && DB.branches){
    const linked = DB.branches.find(b=> b.id === linkedId);
    if(linked) return linked;
  }
  return autoMatchDoorlockBranch(label);
}
function renderDoorlockDisconnectedSection(records, prevRecords, dateForTitle, editable, branchNotes){
  branchNotes = branchNotes || {};
  const box = document.createElement('div');
  box.className = 'stat-section';
  const dateSlash = (dateForTitle || localDateKey()).replace(/-/g,'/');
  const legendDot = (color)=> `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:4px;"></span>`;
  box.innerHTML = `
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
      <h3 style="margin:0;font-size:16px;">지점별 도어락 미연결 정보 (${esc(dateSlash)})</h3>
      <div style="display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft);">
        <span>${legendDot('var(--st-imported)')}기존 미연결</span>
        <span>${legendDot('var(--st-hold)')}신규 미연결</span>
        <span>${legendDot('var(--st-vacant)')}${DOORLOCK_LONG_OVERDUE_DAYS}일 이상 미연결</span>
      </div>
    </div>`;

  const chipBySerial = new Map(computeDoorlockChipList(records, prevRecords).map(c=> [c.record.serial, c]));

  // 1차: 기기명 기준 그룹핑 키(branchGroup)별로 묶는다(연결에 문제 없는 지점도 "전체
  // 연결됨"으로 보여주기 위해 전체 레코드를 기준으로 묶는다).
  const rawGroups = {};
  records.forEach(r=>{
    const key = r.branchGroup || '기타';
    (rawGroups[key] = rawGroups[key] || []).push(r);
  });
  // 2차: 화면에 보여줄 지점명이 같으면 한 행으로 합친다 — 기기명 패턴이 같은 지점 안에서도
  // 완전히 통일돼있지 않으면 같은 지점이 서로 다른 branchGroup으로 쪼개질 수 있는데, 지점명이
  // 같다면 화면에는 하나로 보여줘야 한다.
  const displayGroups = {};
  Object.keys(rawGroups).forEach(key=>{
    const groupRecords = rawGroups[key];
    const label = doorlockBranchLabel(key);
    if(!displayGroups[label]) displayGroups[label] = { keys: [], records: [] };
    displayGroups[label].keys.push(key);
    displayGroups[label].records.push(...groupRecords);
  });

  const table = document.createElement('table');
  table.className = 'doorlock-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>미연결 방</th><th>특이사항</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  function buildBranchRow(label, group){
    // 도어락 기기가 같은 방에 여러 대(재스캔 등)라 라벨이 같은 값으로 겹칠 수 있어 라벨
    // 기준으로 중복 제거한다.
    const byRoomLabel = new Map();
    group.records.forEach(r=>{
      const chip = chipBySerial.get(r.serial);
      if(!chip) return; // 연결됨(문제 없음)이면 표시하지 않는다
      const rl = doorlockRoomLabel(r);
      if(!byRoomLabel.has(rl)) byRoomLabel.set(rl, chip);
    });
    const chipsSorted = Array.from(byRoomLabel.values())
      .sort((a,b)=> doorlockRoomLabel(a.record).localeCompare(doorlockRoomLabel(b.record), 'ko', {numeric:true}));
    // 방에 입실자가 있는지 확인하려면, 이 도어락 지점을 실제 대시보드에 등록된 지점과 먼저
    // 연결해야 한다(이름 자동 매칭, 안 맞으면 아래 select로 직접 지정). DB.branches가 없는
    // 화면(공유 링크)에서는 doorlockResolveBranchLink가 그냥 null을 반환해 이 기능 전체가
    // 조용히 꺼진다.
    const linkedBranch = doorlockResolveBranchLink(group, label);
    const tr = document.createElement('tr');
    const branchTd = document.createElement('td');
    branchTd.style.cssText = 'font-weight:700;white-space:nowrap;';
    if(canEdit() && editable){
      const nameSpan = document.createElement('span');
      nameSpan.textContent = label;
      nameSpan.style.cursor = 'pointer';
      nameSpan.title = '클릭하여 지점명 수정';
      nameSpan.onclick = ()=>{
        const input = document.createElement('input');
        input.type = 'text';
        input.value = label;
        input.style.cssText = 'width:130px;font-weight:700;';
        const commit = ()=>{
          const val = input.value.trim();
          if(!DB.doorlockBranchNameOverrides) DB.doorlockBranchNameOverrides = {};
          // 합쳐진 행일 수 있으므로, 이 행을 구성하는 모든 branchGroup 키에 같은 수정값을
          // 적용해야 다음 렌더에서도 계속 하나로 합쳐진 채 유지된다.
          let changed = false;
          group.keys.forEach(key=>{
            const before = DB.doorlockBranchNameOverrides[key];
            if(val) DB.doorlockBranchNameOverrides[key] = val;
            else delete DB.doorlockBranchNameOverrides[key];
            if(before !== DB.doorlockBranchNameOverrides[key]) changed = true;
          });
          if(changed){
            logChange(`도어락 지점명 수정: "${label}" → "${val || label}"`);
            saveDoorlockState();
            syncDoorlockPublicMirror();
          }
          render();
        };
        input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') input.blur(); });
        input.addEventListener('blur', commit);
        branchTd.innerHTML = '';
        branchTd.appendChild(input);
        input.focus(); input.select();
      };
      branchTd.appendChild(nameSpan);
    } else {
      branchTd.textContent = label;
    }
    // 실제 지점 연결 표시 — 입실자 유무를 확인하려면 이 지점이 실제 등록된 지점 중 어디인지
    // 알아야 한다. 이름으로 자동 매칭되지만 틀릴 수 있어 직접 고를 수 있게 한다.
    if(DB.branches){
      const linkRow = document.createElement('div');
      linkRow.style.cssText = 'font-size:10.5px; color:var(--ink-soft); font-weight:400; margin-top:2px;';
      if(canEdit() && editable){
        const linkSelect = document.createElement('select');
        linkSelect.style.cssText = 'font-size:10.5px; max-width:130px;';
        linkSelect.title = '입실자 유무 확인을 위해 실제 지점과 연결합니다(이름으로 자동 매칭됨, 다르면 직접 선택)';
        const noneOpt = document.createElement('option');
        noneOpt.value = ''; noneOpt.textContent = '지점 연결 안 함';
        linkSelect.appendChild(noneOpt);
        DB.branches.slice().sort((a,b)=> branchLabel(a).localeCompare(branchLabel(b),'ko')).forEach(b=>{
          const opt = document.createElement('option');
          opt.value = b.id; opt.textContent = branchLabel(b);
          if(linkedBranch && linkedBranch.id===b.id) opt.selected = true;
          linkSelect.appendChild(opt);
        });
        linkSelect.addEventListener('change', ()=>{
          const val = linkSelect.value;
          if(!DB.doorlockBranchLinks) DB.doorlockBranchLinks = {};
          let changed = false;
          group.keys.forEach(key=>{
            const before = DB.doorlockBranchLinks[key];
            if(val) DB.doorlockBranchLinks[key] = val;
            else delete DB.doorlockBranchLinks[key];
            if(before !== DB.doorlockBranchLinks[key]) changed = true;
          });
          if(changed){
            logChange(`도어락 "${label}" 실제 지점 연결 변경`);
            saveDoorlockState();
          }
          render();
        });
        linkRow.appendChild(linkSelect);
      } else if(linkedBranch){
        linkRow.textContent = `→ ${branchLabel(linkedBranch)}`;
      }
      branchTd.appendChild(linkRow);
    }
    const roomTd = document.createElement('td');
    if(chipsSorted.length===0){
      roomTd.innerHTML = '<span style="color:var(--ink-soft);">전체 연결됨</span>';
    } else {
      // td 자체에 display:flex를 주면 table-cell 레이아웃을 벗어나 border-collapse 시
      // 옆 칸(특이사항)이 줄바꿈으로 길어질 때 테두리 줄이 어긋나 보이는 문제가 있어,
      // td는 그대로 두고 안에 래퍼 div로만 flex를 적용한다.
      const chipsWrap = document.createElement('div');
      chipsWrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px;';
      chipsSorted.forEach(c=>{
        const r = c.record;
        const colors = DOORLOCK_STATUS_COLORS[c.status];
        const chip = document.createElement('span');
        chip.className = 'badge';
        chip.style.cssText = `background:${colors.bg}; color:${colors.fg};`;
        chip.textContent = doorlockRoomLabel(r);
        const titleParts = [r.lastConnected ? `마지막 연결: ${r.lastConnected}` : '연결 기록 없음'];
        // 방 번호가 있고(공용구역 등 번호 없는 항목은 애초에 입실자 개념이 없어 건너뜀) 실제
        // 지점과 연결돼 있으면, 그 지점의 같은 호실번호 방에 재실 입실자가 있는지 확인해서
        // 있는 방만 테두리로 표시한다(입실자가 없는 방은 급하지 않으므로 굳이 표시하지 않음).
        if(linkedBranch && r.roomNumber){
          const realRoom = DB.rooms.find(rm=> rm.branchId===linkedBranch.id && rm.number===r.roomNumber);
          if(realRoom){
            if(roomHasActiveResident(realRoom)){
              chip.style.border = '2px solid var(--accent)';
              titleParts.push('입실자 있음');
            } else {
              titleParts.push('공실');
            }
          }
        }
        chip.title = titleParts.join(' · ');
        if(canEdit() && editable){
          chip.style.cursor = 'pointer';
          chip.onclick = ()=> showDoorlockActionModal(r.serial, `${label} ${doorlockRoomLabel(r)}`);
        }
        chipsWrap.appendChild(chip);
      });
      roomTd.appendChild(chipsWrap);
    }
    const noteTd = document.createElement('td');
    const note = group.keys.map(k=> branchNotes[k]).find(Boolean) || '';
    if(canEdit() && editable){
      const noteSpan = document.createElement('span');
      noteSpan.textContent = note || '메모 추가';
      noteSpan.style.cssText = 'cursor:pointer; white-space:pre-line;' + (note ? '' : 'color:var(--ink-soft);font-style:italic;');
      noteSpan.title = '클릭하여 특이사항 수정';
      noteSpan.onclick = ()=>{
        const textarea = document.createElement('textarea');
        textarea.value = note;
        textarea.placeholder = '특이사항 입력';
        textarea.rows = 2;
        textarea.style.cssText = 'width:200px; resize:vertical;';
        const commit = ()=>{
          const val = textarea.value.trim();
          if(!DB.doorlockBranchNotes) DB.doorlockBranchNotes = {};
          // 합쳐진 행일 수 있으므로, 이 행을 구성하는 모든 branchGroup 키에 같은 메모를
          // 적용해야 다음 렌더에서도 일관되게 보인다.
          let changed = false;
          group.keys.forEach(key=>{
            const before = DB.doorlockBranchNotes[key];
            if(val) DB.doorlockBranchNotes[key] = val;
            else delete DB.doorlockBranchNotes[key];
            if(before !== DB.doorlockBranchNotes[key]) changed = true;
          });
          if(changed){
            syncDoorlockBranchNotesToTodayHistory();
            logChange(`도어락 "${label}" 특이사항 수정`);
            saveDoorlockState();
            syncDoorlockPublicMirror();
          }
          render();
        };
        // 줄바꿈이 가능한 메모라 Enter는 그대로 줄바꿈으로 두고, blur(다른 곳 클릭)로만 저장한다.
        textarea.addEventListener('blur', commit);
        noteTd.innerHTML = '';
        noteTd.appendChild(textarea);
        textarea.focus(); textarea.select();
      };
      noteTd.appendChild(noteSpan);
    } else {
      noteTd.style.whiteSpace = 'pre-line';
      noteTd.textContent = note || '-';
    }
    tr.appendChild(branchTd); tr.appendChild(roomTd); tr.appendChild(noteTd);
    return tr;
  }
  // 지점 구분(입점고시원/먼슬리브)별로 묶어서, 구분 헤더 행 → 그 구분에 속한 지점들(가나다순)
  // 순서로 렌더링한다. 상단에 입점고시원, 그 아래 먼슬리브 순서로 고정 노출한다.
  const labelsByCategory = {};
  Object.keys(displayGroups).forEach(label=>{
    const cat = doorlockCategoryForGroup(displayGroups[label]);
    (labelsByCategory[cat] = labelsByCategory[cat] || []).push(label);
  });
  DOORLOCK_CATEGORY_ORDER.forEach(cat=>{
    const labels = labelsByCategory[cat];
    if(!labels || labels.length===0) return;
    const headerTr = document.createElement('tr');
    const headerTd = document.createElement('td');
    headerTd.colSpan = 3;
    headerTd.textContent = cat;
    headerTd.style.cssText = 'font-weight:800; color:var(--accent-ink); background:var(--accent-soft); padding:8px 12px;';
    headerTr.appendChild(headerTd);
    tbody.appendChild(headerTr);
    labels.sort((a,b)=> a.localeCompare(b,'ko')).forEach(label=>{
      tbody.appendChild(buildBranchRow(label, displayGroups[label]));
    });
  });
  table.appendChild(tbody);
  box.appendChild(table);

  return box;
}
// 같은 방을 가리키는 기기가 여러 개(재스캔 등으로 일련번호만 다르게 중복 등록)일 때, 화면에
// 보여줄 지점+방 라벨이 같으면 하나만 남긴다(먼저 나온 것을 유지) — 지점별 미연결 표
// (renderDoorlockDisconnectedSection)의 방 칩 중복 제거와 같은 기준을 이 두 상단 카드
// (신규 추가된 미연결 방·정상 연결됨)에도 동일하게 적용한다.
function dedupeDoorlockRecordsByLabel(records){
  const seen = new Set();
  const out = [];
  records.forEach(r=>{
    const key = doorlockBranchLabel(r.branchGroup) + '__' + doorlockRoomLabel(r);
    if(seen.has(key)) return;
    seen.add(key);
    out.push(r);
  });
  return out;
}
function renderDoorlockNewIssuesSection(prevRecords, currRecords){
  const prevBySerial = new Map((prevRecords||[]).map(r=>[r.serial, r]));
  const added = dedupeDoorlockRecordsByLabel(currRecords.filter(r=> !prevBySerial.has(r.serial) && !r.connected))
    .sort((a,b)=> doorlockBranchLabel(a.branchGroup).localeCompare(doorlockBranchLabel(b.branchGroup),'ko'));
  const box = document.createElement('div');
  box.className = 'stat-section cleaning-card';
  box.innerHTML = `<h3 style="margin:0;">신규 추가된 미연결 방 <span class="cnt-badge">${added.length}</span></h3>`;
  if(added.length===0){
    box.appendChild(el('div','cleaning-empty','해당 항목이 없습니다.'));
    return box;
  }
  const table = document.createElement('table');
  table.className = 'doorlock-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>방</th><th>배터리</th><th>마지막 연결</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  added.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="white-space:nowrap;">${esc(doorlockBranchLabel(r.branchGroup))}</td><td>${esc(doorlockRoomLabel(r))}</td><td>${esc(r.battery||'-')}</td><td>${esc(r.lastConnected||'-')}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
  return box;
}
// 전날(직전 붙여넣기)에는 미연결이었는데 오늘은 연결된 방을 상단에 별도로 모아 보여준다.
// 하루만 보여주고 자연히 빠진다 — doorlockPrevSnapshot이 매번 한 칸씩 앞으로 이동하므로,
// 다음 붙여넣기 때는 "그 전날"이 이미 연결 상태였던 것으로 비교되어 더 이상 여기 나오지 않는다.
function renderDoorlockResolvedSection(prevRecords, currRecords){
  const prevBySerial = new Map((prevRecords||[]).map(r=>[r.serial, r]));
  const resolved = dedupeDoorlockRecordsByLabel(currRecords.filter(r=>{
    const prev = prevBySerial.get(r.serial);
    return prev && prev.connected===false && r.connected===true;
  })).sort((a,b)=> doorlockBranchLabel(a.branchGroup).localeCompare(doorlockBranchLabel(b.branchGroup),'ko'));
  const box = document.createElement('div');
  box.className = 'stat-section cleaning-card';
  box.innerHTML = `<h3 style="margin:0;">정상 연결됨 <span class="cnt-badge">${resolved.length}</span></h3>`;
  if(resolved.length===0){
    box.appendChild(el('div','cleaning-empty','해당 항목이 없습니다.'));
    return box;
  }
  const table = document.createElement('table');
  table.className = 'doorlock-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>방</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  resolved.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="white-space:nowrap;">${esc(doorlockBranchLabel(r.branchGroup))}</td><td>${esc(doorlockRoomLabel(r))}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
  return box;
}
// 도어락 화면(과거 날짜 이동 등)만 다시 그린다. 로그인 없는 공유 화면(?public=doorlock)에는
// 지점 목록·상단 메뉴 등 나머지 앱 상태가 없으므로, 전체 render()를 부르면 그 상태를 읽으려다
// 오류가 난다 — 공유 화면일 때는 도어락 섹션만 직접 다시 그린다.
function refreshDoorlockDisplay(){
  if(DOORLOCK_PUBLIC_VIEW){
    const main = document.getElementById('main');
    main.innerHTML = '';
    main.appendChild(renderDoorlockView());
  } else {
    render();
  }
}
function renderDoorlockView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';

  const headerBox = document.createElement('div');
  headerBox.className = 'stat-section';
  headerBox.innerHTML = DOORLOCK_PUBLIC_VIEW
    ? `<h3>도어락 연결 현황 (공유 링크)</h3>
       <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
         조회 전용 공유 화면입니다. ${DB.doorlockImportDate ? `마지막으로 갱신된 날짜: ${esc(DB.doorlockImportDate)}` : '아직 데이터가 없습니다.'}
       </div>`
    : `<h3>도어락 연결 관리</h3>
       <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
         도어락 관리 업체 표(기기명·일련번호·소속명·공간명·SSID·배터리·마지막 연결·소유자, 헤더 포함)를 통째로 붙여넣으면 지점별 미연결 방 현황으로 정리됩니다.
         ${DB.doorlockImportDate ? `마지막으로 붙여넣은 날짜: ${esc(DB.doorlockImportDate)}` : '아직 붙여넣은 데이터가 없습니다.'}
       </div>`;
  if(canEdit()){
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex; gap:8px; flex-wrap:wrap;';
    const pasteBtn = document.createElement('button');
    pasteBtn.className = 'btn primary';
    pasteBtn.textContent = '도어락 데이터 붙여넣기';
    pasteBtn.onclick = showDoorlockPasteModal;
    btnRow.appendChild(pasteBtn);
    if((DB.doorlocks||[]).length > 0){
      const resetBtn = document.createElement('button');
      resetBtn.className = 'btn danger';
      resetBtn.textContent = '데이터 초기화';
      resetBtn.onclick = ()=>{
        showConfirm('도어락 데이터를 모두 초기화할까요?\n지금까지 붙여넣은 데이터, 이전 비교 기록, 지점명 수정 내역, 처리 방법 태그, 특이사항 메모, 실제 지점 연결, 히스토리가 모두 삭제됩니다.', ()=>{
          DB.doorlocks = [];
          DB.doorlockPrevSnapshot = null;
          DB.doorlockImportDate = '';
          DB.doorlockBranchNameOverrides = {};
          DB.doorlockActionTags = {};
          DB.doorlockBranchNotes = {};
          DB.doorlockBranchLinks = {};
          DB.doorlockHistory = [];
          UI.doorlockHistoryOffset = 0;
          logChange('도어락 데이터 초기화');
          saveDoorlockState(); syncDoorlockPublicMirror(); render();
        });
      };
      btnRow.appendChild(resetBtn);
    }
    headerBox.appendChild(btnRow);
  }
  wrap.appendChild(headerBox);

  const records = DB.doorlocks || [];
  if(records.length===0){
    wrap.appendChild(el('div','empty-hint','아직 붙여넣은 도어락 데이터가 없습니다.'));
    return wrap;
  }

  // 히스토리 탐색: offset 0 = 오늘(최신), 값이 클수록 과거(최대 4 = 최근 5일 중 가장 오래된 날).
  const history = DB.doorlockHistory || [];
  const maxOffset = Math.max(0, history.length - 1);
  if(UI.doorlockHistoryOffset == null || UI.doorlockHistoryOffset > maxOffset) UI.doorlockHistoryOffset = Math.min(UI.doorlockHistoryOffset || 0, maxOffset);
  const offset = UI.doorlockHistoryOffset;
  const snap = getDoorlockSnapshotAt(offset) ||
    { date: DB.doorlockImportDate, records, prevRecords: (DB.doorlockPrevSnapshot && DB.doorlockPrevSnapshot.records) || null, actionTags: DB.doorlockActionTags || {}, branchNotes: DB.doorlockBranchNotes || {} };
  const viewRecords = snap.records;
  const viewPrevRecords = snap.prevRecords;
  const isLatest = offset === 0;

  {
    const navBar = document.createElement('div');
    navBar.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:14px;';
    if(maxOffset > 0){
      const prevBtn = document.createElement('button');
      prevBtn.className = 'btn small';
      prevBtn.textContent = '◀ 이전';
      prevBtn.disabled = offset >= maxOffset;
      prevBtn.onclick = ()=>{ UI.doorlockHistoryOffset = Math.min(maxOffset, offset+1); refreshDoorlockDisplay(); };
      navBar.appendChild(prevBtn);
    }
    const dateLabel = document.createElement('span');
    dateLabel.style.cssText = 'font-weight:700; font-size:13px; min-width:120px; text-align:center;';
    dateLabel.textContent = `${(snap.date||'').replace(/-/g,'/')}${isLatest ? ' (최신)' : ''}`;
    navBar.appendChild(dateLabel);
    if(maxOffset > 0){
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn small';
      nextBtn.textContent = '다음 ▶';
      nextBtn.disabled = isLatest;
      nextBtn.onclick = ()=>{ UI.doorlockHistoryOffset = Math.max(0, offset-1); refreshDoorlockDisplay(); };
      navBar.appendChild(nextBtn);
    }
    if(!DOORLOCK_PUBLIC_VIEW){
      const shareBtn = document.createElement('button');
      shareBtn.className = 'btn small';
      shareBtn.textContent = '공유하기';
      shareBtn.title = '로그인 없이 이 날짜의 도어락 현황을 볼 수 있는 링크를 복사합니다';
      shareBtn.onclick = ()=>{
        const url = `${location.origin}${location.pathname}?public=doorlock&date=${encodeURIComponent(snap.date || '')}`;
        navigator.clipboard.writeText(url).then(()=>{
          const orig = shareBtn.textContent;
          shareBtn.textContent = '복사됨';
          setTimeout(()=>{ shareBtn.textContent = orig; }, 1500);
        }).catch(()=> showAlert(`링크 복사에 실패했습니다. 직접 복사해주세요:\n${url}`));
      };
      navBar.appendChild(shareBtn);
    }
    wrap.appendChild(navBar);
    if(maxOffset > 0 && !isLatest){
      wrap.appendChild(el('div', null, '지난 기록을 보고 있습니다(수정 불가) · "다음 ▶"을 눌러 최신으로 돌아갈 수 있습니다.', 'font-size:11.5px;color:var(--ink-soft);text-align:center;margin-bottom:14px;'));
    }
  }

  // 처리 방법 요약도 이제 날짜별로 얼려서 보관되므로(doorlockHistory의 actionTags), 과거
  // 날짜를 보고 있어도 그 날짜의 기록을 보여준다 — 다만 수정은 최신일 때만 가능하다.
  {
    const actionSummary = renderDoorlockActionSummary(snap.actionTags, isLatest);
    if(actionSummary) wrap.appendChild(actionSummary);
  }

  if(viewPrevRecords && viewPrevRecords.length){
    const diffGrid = document.createElement('div');
    diffGrid.className = 'cleaning-cards-grid';
    diffGrid.appendChild(renderDoorlockNewIssuesSection(viewPrevRecords, viewRecords));
    diffGrid.appendChild(renderDoorlockResolvedSection(viewPrevRecords, viewRecords));
    wrap.appendChild(diffGrid);
  }
  wrap.appendChild(renderDoorlockDisconnectedSection(viewRecords, viewPrevRecords, snap.date, isLatest, snap.branchNotes));

  return wrap;
}

/* ---------------- custom alert/confirm (샌드박스 iframe에서 window.alert/confirm이
   막히는 경우를 대비해 네이티브 다이얼로그 대신 사용) ---------------- */
function showAlert(message){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.style.color = 'var(--st-hold)';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  okBtn.onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}
function showConfirm(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn';
  cancelBtn.textContent = '취소';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn danger';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  cancelBtn.onclick = close;
  okBtn.onclick = ()=>{ close(); onConfirm(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}

function showExtendChoiceModal(p, room, onApply){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  function tryApply(newMoveOut, confirmMsg){
    const violation = wouldExceedParking(p, p.moveIn, newMoveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)${branchParkingGroupSuffix(violation.branch)}를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
      return;
    }
    const apply = ()=>{ close(); onApply(newMoveOut); };
    if(confirmMsg) showConfirm(confirmMsg, apply);
    else apply();
  }

  function renderChoices(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 연장</div>`;
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    const oneMonthBtn = document.createElement('button');
    oneMonthBtn.className = 'btn';
    oneMonthBtn.textContent = '한달연장 (퇴실예정일 기준 1개월 뒤)';
    oneMonthBtn.onclick = ()=>{
      const newMoveOut = addOneMonth(p.moveOut || p.moveIn || todayISO());
      tryApply(newMoveOut, `퇴실예정일을 ${newMoveOut}로 연장할까요? (기존 퇴실예정일 기준 1개월 뒤)`);
    };

    const shortBtn = document.createElement('button');
    shortBtn.className = 'btn';
    shortBtn.textContent = '단기연장 (날짜 지정)';
    shortBtn.onclick = renderShortStep;

    btnCol.appendChild(oneMonthBtn); btnCol.appendChild(shortBtn);
    box.appendChild(btnCol);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }

  function renderShortStep(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 단기연장 - 날짜 지정</div>`;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = p.moveOut || todayISO();
    dateInput.style.width = '100%';
    const dateRow = labeledReq('연장할 퇴실예정일', dateInput);
    dateRow.style.marginBottom = '14px';
    box.appendChild(dateRow);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn'; backBtn.textContent = '뒤로';
    backBtn.onclick = renderChoices;
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '확인';
    okBtn.onclick = ()=>{
      const chosen = dateInput.value;
      if(!chosen){ showAlert('연장할 날짜를 선택해주세요.'); return; }
      tryApply(chosen, null);
    };
    btnRow.appendChild(backBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
  }

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  renderChoices();
}

function showLeaveChoiceModal(p, room){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  function renderChoices(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 퇴실 처리</div>`;
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    const expireBtn = document.createElement('button');
    expireBtn.className = 'btn';
    expireBtn.textContent = `만기퇴실 (계약 종료일: ${p.moveOut || '미정'})`;
    expireBtn.title = '계약 종료일 기준으로 퇴실 처리합니다';
    expireBtn.onclick = ()=>{
      if(!p.moveOut){ showAlert('퇴실예정일이 설정되어 있지 않습니다. 먼저 입실자 정보 수정에서 퇴실예정일을 입력해주세요.'); return; }
      showConfirm(`계약기간 종료일(${p.moveOut})로 퇴실 처리할까요?`, ()=>{
        const today = todayISO();
        if(p.moveOut <= today){
          moveResidentToHistory(p, p.moveOut);
        } else {
          p.scheduledToLeave = true;
          if(room && roomWouldBeVacantExcept(room, p.id)) flagUpcomingCleaning(room, p.moveOut, p.id);
          logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 만기퇴실 예약 (${p.moveOut})`);
        }
        scheduleSave();
        close(); render();
      });
    };

    const midBtn = document.createElement('button');
    midBtn.className = 'btn';
    midBtn.textContent = '중도퇴실 (날짜 지정)';
    midBtn.onclick = renderMidTermStep;

    const sameDayBtn = document.createElement('button');
    sameDayBtn.className = 'btn danger';
    sameDayBtn.textContent = '당일퇴실 (오늘 날짜로 즉시 처리)';
    sameDayBtn.onclick = ()=>{
      const today = todayISO();
      showConfirm(`${p.name || '이 입실자'}를 오늘(${today}) 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
        moveResidentToHistory(p, today);
        scheduleSave();
        close(); render();
      });
    };

    btnCol.appendChild(expireBtn); btnCol.appendChild(midBtn); btnCol.appendChild(sameDayBtn);
    box.appendChild(btnCol);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }

  function renderMidTermStep(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 중도퇴실 - 날짜 지정</div>`;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = p.moveOut || todayISO();
    dateInput.style.width = '100%';
    const dateRow = labeledReq('퇴실 날짜', dateInput);
    dateRow.style.marginBottom = '14px';
    box.appendChild(dateRow);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn'; backBtn.textContent = '뒤로';
    backBtn.onclick = renderChoices;
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '확인';
    okBtn.onclick = ()=>{
      const chosen = dateInput.value;
      if(!chosen){ showAlert('퇴실 날짜를 선택해주세요.'); return; }
      const today = todayISO();
      if(chosen > today){
        p.moveOut = chosen;
        p.scheduledToLeave = true;
        if(room && roomWouldBeVacantExcept(room, p.id)) flagUpcomingCleaning(room, chosen, p.id);
        logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 중도퇴실 예약 (${chosen})`);
        scheduleSave();
        close(); render();
      } else {
        showConfirm(`${p.name || '이 입실자'}를 ${chosen} 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
          moveResidentToHistory(p, chosen);
          scheduleSave();
          close(); render();
        });
      }
    };
    btnRow.appendChild(backBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
  }

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  renderChoices();
}

function showRoomMoveModal(p, room){
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  const candidates = (branch ? DB.rooms.filter(r=> r.branchId===branch.id && r.id!==room.id && !roomHasActiveResident(r)) : [])
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 방이동</div>`;

  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';

  if(candidates.length===0){
    box.appendChild(el('div','cleaning-empty','같은 지점에 이동 가능한(입실자가 없는) 방이 없습니다.'));
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    return;
  }

  const roomSel = document.createElement('select');
  roomSel.style.width = '100%';
  candidates.forEach(r=>{
    const o = document.createElement('option');
    o.value = r.id;
    o.textContent = `${r.number}호 (${r.type})`;
    roomSel.appendChild(o);
  });
  const roomRow = labeledReq('이동할 방', roomSel);
  roomRow.style.marginBottom = '12px';
  box.appendChild(roomRow);

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = todayISO();
  dateInput.style.width = '100%';
  const dateRow = labeledReq('이동 날짜', dateInput);
  dateRow.style.marginBottom = '14px';
  box.appendChild(dateRow);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = close;
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '확인';
  okBtn.onclick = ()=>{
    const toRoom = DB.rooms.find(r=>r.id===roomSel.value);
    const moveDate = dateInput.value;
    if(!toRoom || !moveDate){ showAlert('이동할 방과 날짜를 선택해주세요.'); return; }
    const today = todayISO();
    if(moveDate > today){
      showConfirm(`${moveDate}에 ${room.number}호 → ${toRoom.number}호로 방이동 예정 등록할까요?`, ()=>{
        p.pendingRoomMove = { toRoomId: toRoom.id, date: moveDate };
        logChange(`${room.number}호 → ${toRoom.number}호 방이동 예약 (${moveDate}) - "${p.name}"`);
        scheduleSave();
        close(); render();
      });
    } else {
      showConfirm(`${room.number}호 → ${toRoom.number}호로 지금 방이동 처리할까요?`, ()=>{
        executeRoomMove(p, room, toRoom, moveDate);
        scheduleSave();
        close(); render();
      });
    }
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function executeRoomMove(p, fromRoom, toRoom, moveDate){
  moveResidentToHistory(p, moveDate);
  const carriedMoveOut = (p.moveOut && p.moveOut > moveDate) ? p.moveOut : '';
  // 방이동은 새 방으로 자리만 옮기는 것일 뿐 다른 사람이 되는 게 아니므로, 대리결제·메모(색상/굵기
  // 포함)·2인 거주 등 기존 입실자의 모든 정보를 그대로 들고 가야 한다. 예전에는 옮길 필드를
  // 하나씩 나열해서 복사했는데, 그 목록에 없는 필드(대리결제 관련 정보 등)는 이동할 때마다
  // 누락되어 사라지는 문제가 있었다. 기존 객체를 통째로 복사한 뒤, 새 방/기간에 맞춰 바뀌어야
  // 하는 필드만 덮어쓴다.
  const newP = Object.assign({}, p, {
    id: uid('p'), roomId: toRoom.id, resStatus:'', contractType:'이동',
    moveIn: moveDate, moveOut: carriedMoveOut, originalMoveIn: moveDate, scheduledToLeave:false,
    firstSaveDone:true, slotIndex:0
  });
  newP.resStatus = computeResStatus(newP);
  DB.residents.push(newP);
  logChange(`${fromRoom.number}호 → ${toRoom.number}호 방이동 처리 ("${p.name}")`);
}

function processPendingRoomMoves(){
  const today = todayISO();
  const due = DB.residents.filter(p => p.pendingRoomMove && p.pendingRoomMove.date <= today);
  if(due.length===0) return;
  due.forEach(p=>{
    const fromRoom = DB.rooms.find(r=>r.id===p.roomId);
    const toRoom = DB.rooms.find(r=>r.id===p.pendingRoomMove.toRoomId);
    if(!fromRoom || !toRoom){ delete p.pendingRoomMove; return; }
    if(roomHasActiveResident(toRoom)) return; // 대상 방이 그 사이 다시 채워졌으면 보류
    const moveDate = p.pendingRoomMove.date;
    delete p.pendingRoomMove;
    executeRoomMove(p, fromRoom, toRoom, moveDate);
  });
  scheduleSave();
}

function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function initApp(user){
  CURRENT_USER = { uid: user.uid, email: user.email };
  lastSeenLocalDate = localDateKey();
  idleLoggedOut = false;
  indexEmail(user.email); // 기존 계정(이 색인 기능 도입 이전 가입)도 로그인 시 자동으로 채워 넣습니다.

  let roleDoc;
  try{
    roleDoc = await USERS_COL.doc(user.uid).get();
  }catch(e){
    console.error('사용자 권한 조회 실패:', e);
    showAlert('사용자 정보를 불러오지 못했습니다. 네트워크를 확인하거나 관리자에게 문의해주세요.');
    firebase.auth().signOut();
    return;
  }

  if(!roleDoc.exists){
    // 이전 방식으로 만든 계정 등, users 문서가 없는 경우 안전하게 대기 상태로 생성
    await USERS_COL.doc(user.uid).set({ email: user.email, role:'pending', createdAt: new Date().toISOString() });
    USER_ROLE = 'pending';
  } else {
    const roleData = roleDoc.data();
    USER_ROLE = roleData.role || 'pending';
    USER_BRANCH_SCOPE = roleData.branchScope || 'all';
    USER_BRANCH_IDS = Array.isArray(roleData.branchIds) ? roleData.branchIds : null;
  }

  if(USER_ROLE === 'pending'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'flex';
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[USER_ROLE] || USER_ROLE;
  const loggedInAs = document.getElementById('loggedInAs');
  if(loggedInAs) loggedInAs.textContent = `${user.email} (${roleLabel})`;

  DB = await loadState();
  // 과거 버전에서 "완료" 없이 새로고침 등으로 남겨졌을 수 있는 미확정 입실자(이름 미입력 등) 정리
  const beforeCount = DB.residents.length;
  DB.residents = DB.residents.filter(p => p.firstSaveDone !== false);
  if(canEdit() && DB.residents.length !== beforeCount) scheduleSave();
  applyLoadedCore(DB);
  // 도어락 데이터는 별도 문서(DOORLOCK_DOC)에서 불러온다 — 이 부분만 실패해도 이미 불러온
  // 지점/호실/입실자 같은 핵심 데이터는 그대로 유지되도록 별도 try/catch로 분리한다.
  try{
    const doorlockSnap = await DOORLOCK_DOC.get();
    applyDoorlockCore(doorlockSnap.exists ? doorlockSnap.data() : {});
  }catch(e){
    // 이 실패는 예전에 콘솔에만 남기고 조용히 넘어갔는데, 그러면 "붙여넣은 데이터가 사라졌다"는
    // 신고를 받아도 새로고침 캐시 문제인지 권한 문제인지 알 방법이 없었다. 반드시 화면에 실제
    // 오류를 보여준다 — 이 경고가 뜨면 권한(규칙) 문제, 안 뜨는데도 비어있으면 오래된 캐시로
    // 실행 중이라는 뜻이다.
    console.error('도어락 데이터 불러오기 실패:', e);
    const detail = (e && e.message) ? e.message : String(e);
    showAlert(`도어락 데이터를 불러오지 못했습니다. 도어락 관리 화면이 비어있거나 초기화된 것처럼 보일 수 있습니다.\n\n오류 내용: ${detail}\n\n이 창을 스크린샷으로 남겨주시면 원인을 바로 확인할 수 있습니다.`);
    applyDoorlockCore({});
  }
  if(canEdit()) processScheduledLeaves();
  if(canEdit()) processPendingRoomMoves();
  if(canEdit()) autoFlagDueRetouch();
  if(canEdit()) clearCleaningFlagsOnMoveIn();
  if(canEdit()) clearCleaningFlagsForExcludedBranches();
  let statusFixed = false;
  DB.rooms.forEach(room=>{
    if(!roomHasActiveResident(room) && !STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
      statusFixed = true;
    }
  });
  if(canEdit() && statusFixed) scheduleSave();
  let roomTypesFilled = false;
  DB.branches.forEach(branch=>{
    if(!branch.roomTypes || !branch.roomTypes.length){
      // 기존 타입별가격에 저장된 타입과, 엑셀 일괄업로드 등으로 이미 호실에 쓰이고 있는
      // 타입 값을 모두 합쳐서 초기 목록으로 삼는다. (호실 타입은 고정 목록이 아니라
      // 지점마다 자유롭게 추가/삭제 가능 — 여기서 없던 타입이 나중에 발견되면 그냥 놓치고
      // 있었던 것이므로, 최초 1회에 한해 실제 사용 이력에서 복구한다)
      const fromPrices = branch.typePrices ? Object.keys(branch.typePrices) : [];
      const fromRooms = DB.rooms.filter(r=>r.branchId===branch.id).map(r=>r.type).filter(Boolean);
      branch.roomTypes = Array.from(new Set([...ROOM_TYPE_LIST, ...fromPrices, ...fromRooms]));
      roomTypesFilled = true;
    }
  });
  if(canEdit() && roomTypesFilled) scheduleSave();
  let typePricesFilled = false;
  DB.branches.forEach(branch=>{
    if(!branch.typePrices) branch.typePrices = {};
    branchRoomTypes(branch).forEach(t=>{
      if(!(t in branch.typePrices)){
        branch.typePrices[t] = computeTypeDefaultPrice(branch, t);
        typePricesFilled = true;
      }
    });
  });
  if(canEdit() && typePricesFilled) scheduleSave();
  if(canEdit()) maybeCreateDailyBackup();
  UI.branchId = allowedBranches()[0] ? allowedBranches()[0].id : null;
  if(USER_ROLE === 'editor') UI.view = 'branch'; // 수정 권한 계정은 전체 통계 대신 지점 대시보드로 바로 진입
  // 조회 전용(viewer) 계정과 슈퍼어드민은 기본값인 전체 통계 대시보드로 진입
  render();
  document.getElementById('savedNote').textContent = '자동 저장됨 · 이 대시보드를 사용하는 모든 사람에게 공유됩니다';

  if(isSuperAdmin()) checkPendingRequests();

  // 관제센터 특성상 여러 명이 각자 다른 탭/PC에서 동시에 이 대시보드를 켜두고 편집하는 일이
  // 잦다. 로그인 시 한 번만 불러오고 저장 시에만 충돌을 감지하던 기존 방식으로는, 누군가
  // 저장한 뒤 새로고침하기 전까지는 여전히 화면에 오래된 데이터가 보이고 있었다(그 상태에서
  // 다시 저장하면 최신 데이터가 사라질 위험도 있었음). 그래서 이 상태 문서를 실시간으로
  // 구독해서, 다른 곳에서 저장이 일어나는 즉시 이 탭의 화면에도 반영한다.
  if(firestoreUnsubscribe) firestoreUnsubscribe();
  firestoreUnsubscribe = FIRESTORE_DOC.onSnapshot(snap=>{
    if(!CURRENT_USER) return;
    if(snap.metadata.hasPendingWrites) return; // 이 탭 자신이 방금 쓴 낙관적 반영이면 무시
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.json || data.updatedAt === lastKnownUpdatedAt) return; // 이미 반영된 내용
    let parsed;
    try{ parsed = JSON.parse(data.json); }catch(e){ console.error('실시간 동기화 데이터 파싱 실패:', e); return; }
    if(anyEditInProgress()){
      // 지금 뭔가 편집 중이면 화면을 다시 그리지 않고 대기시킨다 — 다음 render()에서 반영됨
      pendingRemoteApply = { parsed, updatedAt: data.updatedAt };
      return;
    }
    applyLoadedCore(parsed);
    lastKnownUpdatedAt = data.updatedAt;
    render();
  }, err=> console.error('실시간 동기화 구독 실패:', err));
}

  errBox.style.color = 'var(--ink-soft)';

  // Firebase의 "이메일 열거 보호"가 켜져 있으면 sendPasswordResetEmail이 존재하지 않는
  // 이메일에도 에러 없이 성공 처리되어(메일은 실제로 발송되지 않음) 혼란을 줍니다.

}

// 도어락 현황 공유 링크(?public=doorlock)는 로그인 절차를 아예 건너뛴다 — Firebase 인증 상태
// 구독 자체를 등록하지 않아, 링크를 연 사람의 기기에 로그인 세션이 없어도 로그인 화면이
// 뜨지 않는다.
function isPublicDoorlockShareUrl(){
  return new URLSearchParams(location.search).get('public') === 'doorlock';
}
async function initPublicDoorlockView(){
  DOORLOCK_PUBLIC_VIEW = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.querySelector('#app > header.top').style.display = 'none';
  DB = { doorlocks: [], doorlockPrevSnapshot: null, doorlockImportDate: '', doorlockHistory: [],
    doorlockBranchNameOverrides: {}, doorlockBranchNotes: {}, doorlockActionTags: {} };
  try{
    const snap = await DOORLOCK_PUBLIC_DOC.get();
    if(snap.exists){
      const d = snap.data() || {};
      DB.doorlocks = d.doorlocks || [];
      DB.doorlockPrevSnapshot = d.doorlockPrevSnapshot || null;
      DB.doorlockImportDate = d.doorlockImportDate || '';
      DB.doorlockHistory = d.doorlockHistory || [];
      DB.doorlockBranchNameOverrides = d.doorlockBranchNameOverrides || {};
      DB.doorlockBranchNotes = d.doorlockBranchNotes || {};
      DB.doorlockActionTags = d.doorlockActionTags || {};
    }
  }catch(e){
    console.error('공유용 도어락 데이터 조회 실패:', e);
  }
  UI.doorlockHistoryOffset = 0;
  const requestedDate = new URLSearchParams(location.search).get('date');
  if(requestedDate){
    const idx = DB.doorlockHistory.findIndex(h=> h.date === requestedDate);
    if(idx >= 0) UI.doorlockHistoryOffset = DB.doorlockHistory.length - 1 - idx;
  }
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(renderDoorlockView());
}

let suppressAuthHandling = false;
if(isPublicDoorlockShareUrl()){
  initPublicDoorlockView();
} else {
  firebase.auth().onAuthStateChanged(user=>{
    if(suppressAuthHandling) return;
    if(user){ initApp(user); }
    else {
      CURRENT_USER = null; USER_ROLE = null;
      if(firestoreUnsubscribe){ firestoreUnsubscribe(); firestoreUnsubscribe = null; }
      showLoginScreen();
    }
  });
}
// PC를 계속 켜둔 채 로그인 화면을 새로고침 없이 며칠씩 열어두면 initApp()이 다시 실행되지
// 않아 날짜가 바뀌어도 자동 백업/리터치 자동 예약이 안 갱신된다. 그래서 별도로 주기적으로
// (1시간마다) 오늘 백업이 있는지, 새로 리터치 예약 대상이 된 방이 있는지 확인한다.
setInterval(()=>{ if(canEdit()){ maybeCreateDailyBackup(); autoFlagDueRetouch(); clearCleaningFlagsOnMoveIn(); clearCleaningFlagsForExcludedBranches(); } }, 60*60*1000);

// 관제센터 특성상 PC를 끄지 않고 탭을 며칠씩 열어두는 경우가 많다. 예전에는 그렇게 오래 열린
// 세션이 로그인 시점의(=시간이 지날수록 오래된) 데이터를 계속 들고 있다가 저장 시 다른 곳의
// 변경사항을 되돌릴 위험이 있어 유휴 시간 기준으로 주기적으로 로그아웃시켰는데, 지금은 실시간
// 동기화(onSnapshot)가 열려 있는 모든 탭의 데이터를 계속 최신으로 유지해주므로 그 목적은 이미
// 해결되었다. 그런데 재로그인마다 계약/이력 등을 다시 불러오는 비용도 있어(Firestore 무료
// 요금제 일일 읽기 한도 문제, 관련 캐시 도입 참고) 너무 자주 재로그인시키는 건 오히려 손해다.
// 그래서 유휴 시간이 아니라 "날짜가 바뀌는 시점(자정)"에만 하루 한 번 세션을 초기화한다.
// todayISO()는 UTC 기준이라 그대로 쓰면 한국 시간 자정이 아니라 오전 9시에 바뀌어버리므로,
// 반드시 이 브라우저의 로컬 시간 기준 날짜로 비교해야 한다.
function localDateKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
let lastSeenLocalDate = localDateKey();
let idleLoggedOut = false;
function checkDailySessionReset(){
  if(!CURRENT_USER || idleLoggedOut) return;
  const today = localDateKey();
  if(today === lastSeenLocalDate) return;
  lastSeenLocalDate = today;
  idleLoggedOut = true;
  firebase.auth().signOut().then(()=>{
    showAlert('날짜가 바뀌어 세션이 초기화되었습니다. 다시 로그인해주세요.');
  });
}
setInterval(checkDailySessionReset, 60*1000);
// 백그라운드 탭에는 타이머 정확도가 떨어질 수 있으므로, 다시 화면을 보는 순간(visible로 전환)
// 바로 한 번 더 확인한다.
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkDailySessionReset(); });
</script>
</body>
