<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONTHLIV 운영 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --panel:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5B6B72;
    --line:#E1DCCF;
    --accent:#10767A;
    --accent-ink:#0B5457;
    --accent-soft:#E1F1F1;

    --st-all:#4B5563;      --st-all-bg:#E9EAEC;
    --st-vacant:#8B96A0;   --st-vacant-bg:#EEF0F2;
    --st-forsale:#2F6FED;  --st-forsale-bg:#E8EFFD;
    --st-occupied:#10767A; --st-occupied-bg:#E1F1F1;
    --st-confirmed:#3B7A9E; --st-confirmed-bg:#E5F1F7;
    --st-leaving:#C98A2C;  --st-leaving-bg:#FBF0DD;
    --st-hold:#C0473F;     --st-hold-bg:#FBE7E5;
    --st-presell:#6C5FC7;  --st-presell-bg:#EDEBFA;
    --st-shortsale:#C2478B; --st-shortsale-bg:#FBE7F1;
    --st-proxy:#2E8B57;    --st-proxy-bg:#E4F3EA;
    --st-reserved:#A67C00; --st-reserved-bg:#FBF0D6;
    --st-imported:#1789A6; --st-imported-bg:#E1F4F8;
    --st-double:#8A56C7;   --st-double-bg:#F0E9FA;

    --ch-indep:#5B4FCF; --ch-33m2:#B5459A; --ch-liveany:#D6673E; --ch-etc:#7A8790;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  #app{ max-width:1320px; margin:0 auto; padding:0 20px 60px; }
  header.top{ position:sticky; top:0; z-index:20; background:var(--paper); padding:20px 0 16px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; }
  .brand h1{ font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .brand h1 .tag{
    display:inline-block; margin-left:10px; font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:600; color:var(--accent-ink);
    background:var(--accent-soft); padding:2px 8px; border-radius:20px; vertical-align:middle;
  }
  .brand .sub{ font-size:12px; color:var(--ink-soft); }
  .home-link{ cursor:pointer; display:flex; align-items:center; }
  .home-link:hover{ color:var(--accent-ink); }
  .home-icon{ font-size:20px; margin-right:8px; line-height:1; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .branch-picker{ display:flex; align-items:center; gap:8px; }
  .branch-picker select{
    font-family:inherit; font-weight:700; font-size:14px; padding:9px 34px 9px 12px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235B6B72'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .header-search{ position:relative; flex:1 1 260px; max-width:360px; }
  .header-search input{
    width:100%; padding:9px 12px; font-family:inherit; font-size:13px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
  }
  .header-search input:focus{ outline:none; border-color:var(--accent); }
  .header-search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:360px; overflow-y:auto; z-index:30;
  }
  .header-search-item{ display:flex; flex-direction:column; gap:2px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .header-search-item:last-child{ border-bottom:none; }
  .header-search-item:hover{ background:var(--paper); }
  .header-search-item .hs-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .header-search-item .hs-sub{ font-size:11.5px; color:var(--ink-soft); }
  .header-search-empty{ padding:12px; font-size:12.5px; color:var(--ink-soft); text-align:center; }
  .btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:8px; padding:7px 12px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); color:#fff; }
  .btn.pill{ border-radius:999px; }
  .btn.danger{ color:var(--st-hold); }
  .btn.danger:hover{ border-color:var(--st-hold); color:var(--st-hold); }
  .btn.small{ padding:4px 9px; font-size:11.5px; border-radius:6px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .iconbtn{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1; padding:0; flex:none;
  }
  .iconbtn:hover{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .iconbtn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .iconbtn.del:hover{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); }

  .subnav{ display:inline-flex; gap:3px; background:#EFEAE0; padding:3px; border-radius:10px; margin:16px 0 16px; }
  .subnav button{
    border:none; background:none; cursor:pointer; font-family:inherit; font-weight:700;
    font-size:12.5px; padding:7px 14px; border-radius:8px; color:var(--ink-soft);
  }
  .subnav button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  main{ padding-top:6px; }

  select, input[type=text], input[type=date], input[type=tel], input[type=number], textarea{
    font-family:inherit; font-size:12.5px; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff;
  }
  textarea{ width:100%; resize:vertical; min-height:38px; }
  label.field-label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:3px; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.overdue-badge{ background:#C0473F; color:#fff; font-weight:800; animation:overduePulse 1.8s ease-in-out infinite; }
  @keyframes overduePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.65; } }
  .badge.muted{ background:#F1EFE8; color:var(--ink-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .empty-hint{ padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px; border:1px dashed var(--line); border-radius:12px; background:var(--panel); }

  .branch-bar{
    position:relative;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:18px; display:flex; flex-direction:column; gap:14px;
  }
  .branch-bar .branch-edit-pencil{ position:absolute; top:14px; right:14px; }
  .branch-bar .col h3{ margin:0 0 6px; font-size:11px; color:var(--ink-soft); font-weight:700; letter-spacing:.02em; }
  .branch-bar input, .branch-bar textarea{ width:100%; }
  .branch-bar .namewrap{ display:flex; gap:8px; align-items:center; }
  .branch-bar .namewrap input{ font-size:19px; font-weight:800; border:none; background:transparent; padding:2px 0; }
  .branch-bar .namewrap input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .parking-cap-row select{ width:100px; }
  .parking-cap-row{ margin-bottom:8px; }
  .branch-info-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .branch-info-table td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  .branch-info-table td.bi-label{ width:108px; color:var(--ink-soft); font-weight:700; font-size:11.5px; white-space:nowrap; }
  .branch-info-table tr:last-child td{ border-bottom:none; }
  .branch-info-table input, .branch-info-table select, .branch-info-table textarea{ width:100%; font-size:13px; }
  .parking-summary{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .parking-summary.parking-unavailable{ font-size:14px; font-weight:800; color:var(--st-hold); margin-bottom:0; }
  .parking-active-toggle{ color:var(--accent-ink); font-weight:700; text-decoration:underline; cursor:pointer; }
  .parking-active-toggle:hover{ color:var(--accent); }
  .parking-list{ background:#F4F1E9; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .parking-list-row{ display:flex; gap:8px; font-size:12px; padding:3px 0; }
  .parking-list-row .rm{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .parking-list-row .nm{ font-weight:600; }
  .parking-list-row .car{ color:var(--ink-soft); margin-left:auto; font-family:'JetBrains Mono',monospace; }
  .parking-list-empty{ font-size:12px; color:var(--ink-soft); }

  .room-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .room-toolbar .legend{ display:flex; gap:10px; flex-wrap:wrap; }
  .legend-btn{ border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .legend-btn:hover{ border-color:currentColor; }
  .legend-btn.active{ border-color:currentColor; box-shadow:0 0 0 1px currentColor inset; }

  .add-room-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-room-form .fld{ display:flex; flex-direction:column; }
  .add-room-form input, .add-room-form select{ width:100%; }

  .add-branch-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:2fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-branch-form .fld{ display:flex; flex-direction:column; }
  .add-branch-form input, .add-branch-form select{ width:100%; }

  .admin-add-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; align-items:end;
  }
  .branch-order-list{ display:flex; flex-direction:column; gap:6px; }
  .branch-order-row{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:9px 12px; cursor:grab; user-select:none;
  }
  .branch-order-row.dragging{ opacity:.4; }
  .branch-order-handle{ color:var(--ink-soft); font-size:14px; }
  .branch-order-name{ font-weight:700; font-size:13.5px; flex:1; cursor:pointer; }
  .branch-order-name:hover{ color:var(--accent-ink); text-decoration:underline; }
  .admin-add-form .fld{ display:flex; flex-direction:column; }
  .admin-add-form input, .admin-add-form select, .admin-add-form textarea{ width:100%; }
  .admin-add-form .btn-row{ display:flex; gap:8px; }
  .branch-address{ font-size:13px; font-weight:400; color:var(--ink-soft); margin-left:10px; }

  .branch-view-text{ font-size:14px; font-weight:600; padding:2px 0; }
  .branch-view-text.title{ font-size:19px; font-weight:800; }
  .branch-title-toggle{ cursor:pointer; display:inline-flex; align-items:center; }
  .branch-title-toggle:hover{ color:var(--accent-ink); }
  .branch-title-chevron{ font-size:13px; margin-left:8px; color:var(--ink-soft); }
  .branch-view-text.small{ font-size:12.5px; font-weight:400; color:var(--ink-soft); white-space:pre-wrap; }

  .overdue-banner{
    display:flex; align-items:flex-start; gap:12px; background:var(--st-hold-bg);
    border:1.5px solid var(--st-hold); border-radius:12px; padding:14px 16px; margin-bottom:18px;
  }
  .overdue-banner-icon{ font-size:20px; line-height:1; flex:none; }
  .overdue-banner-title{ font-weight:800; font-size:13.5px; color:var(--st-hold); margin-bottom:8px; }
  .overdue-banner-rooms{ display:flex; flex-wrap:wrap; gap:6px; }
  .overdue-room-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    background:#fff; color:var(--st-hold); border:1px solid var(--st-hold); border-radius:6px; padding:3px 9px;
    cursor:pointer;
  }
  .overdue-room-chip:hover{ background:var(--st-hold); color:#fff; }
  .room-card.flash-highlight{
    animation:cardFlash 2.2s ease-out;
  }
  @keyframes cardFlash{
    0%{ box-shadow:0 0 0 4px var(--st-hold); }
    70%{ box-shadow:0 0 0 4px var(--st-hold); }
    100%{ box-shadow:0 0 0 0 transparent; }
  }

  .status-section{ margin-bottom:22px; }
  .status-section .sec-head{
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:6px;
    border-bottom:2px solid; cursor:pointer; user-select:none;
  }
  .status-section .sec-head:hover .name{ text-decoration:underline; }
  .status-section .sec-head .name{ font-weight:800; font-size:14px; }
  .status-section .sec-head .count-badge{
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:800;
    padding:3px 11px; border-radius:20px;
  }
  .status-section .sec-head .sec-toggle-caret{ margin-left:auto; color:var(--ink-soft); font-size:13px; }
  .status-section .sec-head.collapsed{ margin-bottom:0; border-bottom-style:dashed; opacity:.85; }
  .status-section .sec-empty{ font-size:12px; color:var(--ink-soft); padding:8px 2px; }

  .grid-rooms{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; align-items:start; }

  /* ---- room card (view layout, matches reference mockup) ---- */
  .room-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; border-left:5px solid var(--st-vacant); }
  .rc-header{ display:flex; flex-direction:column; gap:6px; padding:12px 14px 8px; }
  .rc-header-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rc-title{ display:flex; align-items:baseline; gap:6px; min-width:0; flex:1; }
  .rc-title .roomno{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap; }
  .rc-title .roomtype{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rc-title .room-price{ font-size:11.5px; color:var(--accent-ink); font-weight:700; white-space:nowrap; }
  .rc-door-lock{
    border:none; background:none; padding:2px; margin:0; flex:none; align-self:center;
    display:inline-flex; color:var(--ink-soft); border-radius:5px; cursor:default;
  }
  .rc-door-lock.editable{ cursor:pointer; }
  .rc-door-lock.editable:hover{ background:var(--st-vacant-bg); }
  .rc-door-lock.unlocked{
    color:#fff; background:var(--st-hold); padding:2px 4px;
    animation:overduePulse 1.8s ease-in-out infinite;
  }
  .rc-door-lock.unlocked.editable:hover{ background:var(--st-hold); opacity:.85; }
  .rc-header-badges{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .history-btn{
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex:none;
  }
  .history-btn:hover, .history-btn.active{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .history-btn.contract-mismatch{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); animation:overduePulse 1.8s ease-in-out infinite; }
  .history-panel{ margin:0 14px 10px; background:#F4F1E9; border-radius:8px; padding:8px 10px; }
  .history-entry{ padding:6px 0; border-bottom:1px dashed #E1DCCF; }
  .history-entry:last-child{ border-bottom:none; }
  .history-top{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .history-top .nm{ font-weight:700; }
  .history-top .ph{ color:var(--ink-soft); }
  .history-top .btn{ margin-left:auto; }
  .history-sub{ font-size:11.5px; color:var(--ink); margin-top:3px; }
  .history-period{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .history-empty{ font-size:12px; color:var(--ink-soft); }
  .rc-header-right{ display:flex; align-items:center; gap:6px; flex:none; }

  .rc-note-chip{
    margin:0 14px 8px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:8px;
    padding:6px 10px; white-space:pre-wrap; word-break:break-word;
  }
  .rc-divider{ border:none; border-top:1px solid var(--line); margin:0; }

  .rc-body{ padding:12px 14px 14px; }

  .resident-block{ padding:9px 0; border-bottom:1px dashed #EAE5D8; }
  .resident-block:last-child{ border-bottom:none; }
  .resident-flags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .resident-name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; }
  .resident-name-row .nm{ font-weight:700; font-size:13.5px; }
  .resident-name-row .nm.nm-clickable{ cursor:pointer; }
  .resident-name-row .nm.nm-clickable:hover{ color:var(--accent-ink); text-decoration:underline; }
  .resident-name-row .acts{ display:flex; gap:5px; flex:none; }
  .badge.tag-new{ background:#F1EFE8; color:var(--ink-soft); border:1px solid var(--line); }
  .badge.tag-ext{ background:#FBF0DD; color:#8A5F14; border:1px solid #E3B25C; }
  .badge.res-status{ background:#EEF0F2; color:var(--ink-soft); }
  .badge.res-status.leaving{ background:var(--st-leaving-bg); color:var(--st-leaving); }
  .badge.res-status.moving{ background:var(--st-presell-bg); color:var(--st-presell); }
  .badge.res-status.upcoming{ background:var(--st-forsale-bg); color:var(--st-forsale); }
  .resident-period{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .resident-phone{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-family:'JetBrains Mono',monospace; }
  .resident-car{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .resident-memo{
    margin-top:5px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:6px;
    padding:5px 9px; white-space:pre-wrap; word-break:break-word;
  }

  .empty-residents{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 4px; }
  .empty-residents .msg{ font-size:12.5px; color:var(--ink-soft); }

  /* ---- edit mode ---- */
  .edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .edit-grid input, .edit-grid select{ width:100%; }
  .maint-chips{ display:flex; gap:6px; }
  .flagchip{
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px;
    border:1px solid var(--line); background:#fbfaf7; color:var(--ink-soft); cursor:pointer;
  }
  .flagchip.on.moveout{ background:#FBEFD8; border-color:#E3B25C; color:#8A5F14; }
  .flagchip.on.retouch{ background:#E3E8FD; border-color:#8B9FEE; color:#2E3F9E; }
  .flagchip.on.extra{ background:#E1F5E9; border-color:#6FBF8B; color:#1F7A45; }
  .flagchip.on.presell{ background:var(--st-forsale-bg); border-color:var(--st-forsale); color:var(--st-forsale); }
  .flagchip.on.reserved{ background:var(--st-reserved-bg); border-color:var(--st-reserved); color:var(--st-reserved); }
  .edit-section-label{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; margin:14px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .edit-section-label:first-child{ margin-top:0; }

  .resident-edit-card{ border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:#FCFBF8; }
  .resident-edit-card .redit-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .resident-edit-card .redit-title{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; }
  .resident-edit-card input[type=text], .resident-edit-card input[type=tel]{ width:100%; }
  .resident-edit-card .redit-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }

let DB = null;

  view:'stats', branchId:null, branchTab:'rooms',
  roomEditMode:{}, residentEditMode:{}, roomSnapshots:{}, residentSnapshots:{}, draftResident:{}, parkingListOpen:{}, residentFieldEdit:{},
  branchEditMode:{}, branchSnapshots:{}, branchInfoOpen:{}, historyOpen:{}, addingBranch:false, addingRoom:false, managingRoom:false, managingTypePrice:false, editingBranchId:null, branchOrderOpen:false,
  tlYear:null, tlMonth:null, roomStatusFilter:'전체', cleanWeekStart:null, overdueTabKey:null,
  cleanTodayPage:1, cleanFuturePage:1, shortcutSelectedId:null, upcomingSoonDays:7, doorlockHistoryOffset:0

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addOneMonth(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function nextMonWedFri(fromDateStr){
  const d = fromDateStr ? new Date(fromDateStr) : new Date();
  while(![1,3,5].includes(d.getDay())) d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function prevMonWedFri(fromDateStr){
  const d = fromDateStr ? new Date(fromDateStr) : new Date();
  while(![1,3,5].includes(d.getDay())) d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function formatWon(n){ n = Number(n)||0; return n.toLocaleString('ko-KR') + '원'; }
function branchLabel(branch){ return (branch && branch.shortName && branch.shortName.trim()) ? branch.shortName : (branch ? branch.name : ''); }
function syncBranchSelectOption(branch){
  const opt = document.querySelector(`#branchSelect option[value="${branch.id}"]`);

function branchDoubleOccupancyFee(branch){
  if(!branch) return 0;

  return digits ? Number(digits) : 0;

// 정산 수수료율(%). 지점별로 다르게 설정할 수 있고, 설정 전에는 표준 7%를 쓴다.
const SETTLEMENT_DEFAULT_COMMISSION_RATE = 7;
function branchCommissionRate(branch){
  if(!branch) return SETTLEMENT_DEFAULT_COMMISSION_RATE;
  const v = Number(branch.commissionRate);
  return (isFinite(v) && v >= 0) ? v : SETTLEMENT_DEFAULT_COMMISSION_RATE;
}
// 이미 정산이 끝난 뒤 환불이 발생하면, 회사는 원장에게 정산해준 금액을 되돌려받아야 한다.
// 운영팀 정산 로직 기준:
//   정산 기준 금액 = 총 판매가 − 원장님 쿠폰   (플랫폼 쿠폰/포인트는 정산 기준에서 빠지지 않음)
//   실결제금       = 총 판매가 − 쿠폰/포인트
//   고객 환불액    = 실결제금 − 차감액
//   원장 반환액    = (총 판매가 − 차감액) × (1 − 수수료율)
// 원장 반환액에 (1 − 수수료율)을 곱하는 이유는, 선차감했던 수수료 중 환불분에 해당하는 몫은
// 회사가 부담하고 나머지만 회수하기 때문이다(정산표의 "환불" 행과 같은 계산).
// 보증금은 원장에게 청구하는 항목이 아니라서 이 계산에서 완전히 제외한다.
function calcSettlementReturn(input){
  const num = (v)=> Math.max(0, Math.round(Number(String(v==null?'':v).replace(/[^0-9]/g,'')) || 0));
  const gross = num(input.gross);
  const ownerCoupon = num(input.ownerCoupon);
  const platformCoupon = num(input.platformCoupon);
  const deduction = num(input.deduction);
  const rate = Math.max(0, Number(input.rate) || 0);
  const settlementBase = gross - ownerCoupon;
  const actualPaid = settlementBase - platformCoupon;
  const customerRefund = actualPaid - deduction;
  const ownerReturnBase = gross - deduction;
  // 정산표와 동일하게 원 단위에서 반올림한다.
  const commissionBack = Math.round(ownerReturnBase * rate / 100);
  const ownerReturn = ownerReturnBase - commissionBack;
  return { gross, ownerCoupon, platformCoupon, deduction, rate,
           settlementBase, actualPaid, customerRefund, ownerReturnBase, commissionBack, ownerReturn };
}
/* 방 가격은 호실별이 아니라 지점+타입별로 관리한다. 같은 지점의 같은 타입 호실은 항상 같은 가격을 쓴다.
   입실자가 "2인 거주"로 체크되어 있으면 지점에 설정된 1인 추가금을 더해서 보여준다. */
function roomPrice(room){
  const branch = DB.branches.find(b=>b.id===room.branchId);
  const base = (branch && branch.typePrices && branch.typePrices[room.type]) || 0;
  if(roomHasDoubleOccupancy(room)) return base + branchDoubleOccupancyFee(branch);
  return base;
}
// 타입은 지점마다 고정된 목록이 아니라 자유롭게 추가/삭제할 수 있다(관리자 설정 > 타입별 가격 관리).
// ROOM_TYPE_LIST는 새 지점이 생겼을 때 쓰는 초기값일 뿐이다.
function branchRoomTypes(branch){
  return (branch.roomTypes && branch.roomTypes.length) ? branch.roomTypes : ROOM_TYPE_LIST;
}
function registerRoomType(branch, type){
  if(!type) return;
  if(!branch.roomTypes || !branch.roomTypes.length) branch.roomTypes = [...ROOM_TYPE_LIST];
  if(!branch.roomTypes.includes(type)) branch.roomTypes.push(type);
  if(!branch.typePrices) branch.typePrices = {};
  if(!(type in branch.typePrices)) branch.typePrices[type] = 0;
}
function computeTypeDefaultPrice(branch, t){
  // 타입별 가격 관리를 처음 도입할 때, 기존에 호실마다 따로 등록돼 있던 가격 중
  // 지점·타입별로 가장 많이 쓰인(최빈값) 가격을 그 타입의 기준가로 채워준다.
  const prices = DB.rooms.filter(r=>r.branchId===branch.id && r.type===t && r.price).map(r=>r.price);
  if(prices.length===0) return 0;
  const freq = new Map();
  prices.forEach(p=> freq.set(p, (freq.get(p)||0)+1));
  let best = prices[0], bestCount = 0;
  freq.forEach((count, price)=>{ if(count>bestCount || (count===bestCount && price>best)){ best=price; bestCount=count; } });
  return best;
}

function roomCardMaintKind(room){
  // 청소/리터치 예정일이 지나면 방 카드(입실자 카드)에서는 배지를 더 이상 노출하지 않는다.
  // 단, 원본 데이터(needsCleaning 등)는 그대로 두어 청소 관리 화면에는 계속 기록이 남는다.
  const kind = roomMaintKind(room);
  if(kind){
    if(room.maintenanceDate && room.maintenanceDate < todayISO()) return null;
    return kind;
  }
  // needsCleaning 플래그가 아직 안 걸려 있어도(예: 새 계약자를 미리 등록하며 기존 입실자만
  // 퇴실확정으로 표시해 둔 경우처럼 flagUpcomingCleaning이 호출되지 않는 경로), 청소관리
  // 화면(collectCleaningEntries)과 같은 기준으로 방 카드에도 청소예정일 배지를 미리 보여준다.
  if(roomUpcomingLeaveDate(room)) return 'moveout';
  return null;
}
function roomEarliestLeaverMoveOut(room){
  const leavers = DB.residents.filter(p=> p.roomId===room.id && p.scheduledToLeave && p.moveOut);
  if(leavers.length===0) return null;
  return leavers.reduce((a,b)=> a.moveOut < b.moveOut ? a : b).moveOut;
}
function roomUpcomingLeaveDate(room){
  // 청소관리 화면(collectCleaningEntries)의 예비 판정과 동일한 기준: room.needsCleaning이
  // 아직 안 걸려 있어도, 퇴실확정(scheduledToLeave)된 입실자가 있으면 그 퇴실일 기준으로
  // 청소예정일을 미리 계산해 보여준다(방이 곧 완전히 빌지 여부와 무관하게 동일하게 취급).
  const raw = roomEarliestLeaverMoveOut(room);
  if(!raw) return null;
  // 방 카드에서 "퇴실청소" 칩을 눌러 이 제안을 취소한 적이 있다면, 같은 퇴실일 기준으로는
  // 다시 자동으로 켜지 않는다(퇴실일이 바뀌면 새 정보이므로 다시 제안한다).
  if(room.cleaningDismissedMoveOut && room.cleaningDismissedMoveOut === raw) return null;
  return nextMonWedFri(raw);
}

   우선 표시한다. 입실자 카드(renderResidentView)와 타임라인이 이 기준을 공유한다. */
function residentDisplayName(p){
  return (p.paymentProxy && p.actualResidentName) ? p.actualResidentName : p.name;
}
/* 연락처도 이름과 같은 기준: 대리결제면 계약자 연락처(phone) 대신 실입실자 연락처를 보여준다. */
function residentDisplayPhone(p){
  return (p.paymentProxy && p.actualResidentPhone) ? p.actualResidentPhone : p.phone;
}
/* 보기 권한(viewer) 계정에는 입실자 이름 앞 두 글자만 보여주고 나머지는 마스킹한다. */
function maskViewerName(name){
  if(!name || USER_ROLE !== 'viewer') return name;
  const s = String(name);
  return s.length <= 2 ? s : s.slice(0,2) + '*'.repeat(s.length-2);
}
/* 슈퍼어드민은 항상 전체 지점에 접근 가능. 그 외 계정은 관리자가 지정한 범위(전체 또는 선택한 지점)로 제한된다. */
function hasBranchAccess(branchId){
  if(isSuperAdmin() || USER_BRANCH_SCOPE !== 'selected') return true;
  return Array.isArray(USER_BRANCH_IDS) && USER_BRANCH_IDS.includes(branchId);
}
function allowedBranches(){
  if(isSuperAdmin() || USER_BRANCH_SCOPE !== 'selected') return DB.branches;
  return DB.branches.filter(b=> Array.isArray(USER_BRANCH_IDS) && USER_BRANCH_IDS.includes(b.id));
}

let pendingChangeSummary = '';
function logChange(summary){ pendingChangeSummary = summary; }

// 이 탭이 마지막으로 불러오거나 저장했을 때의 서버 updatedAt. saveState()가 저장 직전에
// 서버의 현재 updatedAt과 이 값을 비교해서, 이 탭을 열어둔 사이 다른 곳(다른 담당자/다른 탭)이
// 먼저 저장한 게 있는지 감지하는 데 쓴다.
let lastKnownUpdatedAt = null;

// Firestore 무료 요금제 일일 읽기 한도(Quota exceeded)에 걸리는 걸 막기 위한 로컬 캐시.
// 계약 이력·퇴실 이력 컬렉션은 로그인할 때마다 컬렉션 전체를 통째로 읽어오는데, 문서 수가
// 쌓일수록 이 비용이 커지고, 관제센터 특성상 유휴 타임아웃(3시간)마다 재로그인이 일어나
// 하루에도 여러 번 반복된다. 이 두 컬렉션은 실시간으로 자주 바뀌는 데이터가 아니므로,
// 브라우저 localStorage에 최근 읽은 내용을 캐시해두고 일정 시간 안에는 재로그인해도 다시
// 읽지 않는다. 이 탭에서 직접 계약/이력을 추가·삭제할 때는 caches를 즉시 갱신해 최신 상태를
// 유지한다(아래 각 변경 지점의 refreshContractsCache/refreshHistoryCache 호출 참고).
const COLLECTION_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6시간
function readCachedCollection(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.data) || typeof parsed.cachedAt !== 'number') return null;
    if(Date.now() - parsed.cachedAt > COLLECTION_CACHE_TTL_MS) return null;
    return parsed.data;
  }catch(e){ return null; }
}
function writeCachedCollection(key, data){
  try{ localStorage.setItem(key, JSON.stringify({ data, cachedAt: Date.now() })); }catch(e){ /* localStorage 사용 불가 시 캐시 없이 매번 새로 읽음 */ }
}
const CONTRACTS_CACHE_KEY = 'monthliv_contracts_cache_v1';
const HISTORY_CACHE_KEY = 'monthliv_residentHistory_cache_v1';
function refreshContractsCache(){ writeCachedCollection(CONTRACTS_CACHE_KEY, DB.contracts); }
function refreshHistoryCache(){ writeCachedCollection(HISTORY_CACHE_KEY, DB.residentHistory); }

async function loadState(){
  let base;
  try{
    const snap = await FIRESTORE_DOC.get();
    const data = snap.exists ? snap.data() : null;
    lastKnownUpdatedAt = (data && data.updatedAt) || null;
    base = (data && data.json) ? JSON.parse(data.json) : seedState();
  }catch(e){
    console.error('불러오기 실패:', e);
    return seedState();
  }
  // 계약 이력·퇴실 이력은 별도 컬렉션에서 따로 불러온다. 이 부분만 실패하더라도(예: 새 컬렉션에
  // 대한 Firestore 권한 설정 누락 등) 이미 정상적으로 불러온 지점/호실/입실자 같은 핵심 데이터를
  // 절대 통째로 버리면 안 되므로, 메인 문서 로딩과는 별도의 try/catch로 완전히 분리한다.
  try{
    const cachedContracts = readCachedCollection(CONTRACTS_CACHE_KEY);
    let contractsFromCol;
    if(cachedContracts){
      contractsFromCol = cachedContracts;
    } else {
      const contractsSnap = await CONTRACTS_COL.get();
      contractsFromCol = contractsSnap.docs.map(d=>d.data());
      writeCachedCollection(CONTRACTS_CACHE_KEY, contractsFromCol);
    }
    // 예전 버전은 계약 이력을 메인 문서 안에 배열로 통째로 저장했다(문서 용량 제한 초과의 원인).
    // 새 컬렉션이 아직 비어있고 메인 문서에 예전 데이터가 남아있으면, 딱 한 번 그 데이터를 새
    // 컬렉션 구조로 옮겨 쓴다. 그 뒤로는 컬렉션 쪽 데이터가 항상 기준이 된다.
    if(contractsFromCol.length===0 && Array.isArray(base.contracts) && base.contracts.length>0){
      await batchWriteDocs(CONTRACTS_COL, base.contracts);
      writeCachedCollection(CONTRACTS_CACHE_KEY, base.contracts);
    } else {
      base.contracts = contractsFromCol;
    }
  }catch(e){
    console.error('계약 이력 불러오기 실패:', e);
    base.contracts = Array.isArray(base.contracts) ? base.contracts : [];
  }
  try{
    const cachedHistory = readCachedCollection(HISTORY_CACHE_KEY);
    let historyFromCol;
    if(cachedHistory){
      historyFromCol = cachedHistory;
    } else {
      const historySnap = await RESIDENT_HISTORY_COL.get();
      historyFromCol = historySnap.docs.map(d=>d.data());
      writeCachedCollection(HISTORY_CACHE_KEY, historyFromCol);
    }
    if(historyFromCol.length===0 && Array.isArray(base.residentHistory) && base.residentHistory.length>0){
      await batchWriteDocs(RESIDENT_HISTORY_COL, base.residentHistory);
      writeCachedCollection(HISTORY_CACHE_KEY, base.residentHistory);
    } else {
      base.residentHistory = historyFromCol;
    }
  }catch(e){
    console.error('퇴실 이력 불러오기 실패:', e);
    base.residentHistory = Array.isArray(base.residentHistory) ? base.residentHistory : [];
  }
  return base;
}
let saveTimer = null;
let saveInFlight = false;
async function saveState(){
  const note = document.getElementById('savedNote');
  if(note) note.textContent = '저장 중…';
  saveInFlight = true;
  try{
    const core = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
    const nowIso = new Date().toISOString();
    // 이 상태 문서는 통째로 덮어써서 저장하는 구조라, 이 탭이 불러온 뒤로 다른 곳에서 이미 저장이
    // 일어났는데도 그냥 저장하면 이 탭이 들고 있는(=오래된) 데이터로 그 변경사항을 통째로 지워버리게
    // 된다. 그래서 트랜잭션 안에서 저장 직전 서버의 updatedAt을 다시 확인해, 우리가 불러온/마지막으로
    // 저장한 시점 이후로 바뀌었으면(=다른 곳이 먼저 저장함) 이 탭의 오래된 데이터를 쓰지 않고
    // 저장을 건너뛴다. 사용자는 새로고침 후 방금 한 수정을 다시 적용해야 한다.
    let conflict = false;
    await firestoreDB.runTransaction(async (tx)=>{
      const snap = await tx.get(FIRESTORE_DOC);
      const serverUpdatedAt = snap.exists ? snap.data().updatedAt : null;
      if(lastKnownUpdatedAt && serverUpdatedAt && serverUpdatedAt !== lastKnownUpdatedAt){
        conflict = true;
        return;
      }
      tx.set(FIRESTORE_DOC, { json: JSON.stringify(core), updatedAt: nowIso });
    });
    if(conflict){
      if(note) note.textContent = '⚠ 저장 건너뜀 · 다른 곳에서 방금 저장된 내용이 있어요 · 새로고침 필요';
      showAlert('다른 담당자(또는 다른 탭/기기)가 방금 이 대시보드를 먼저 저장했습니다.\n이 상태로 저장하면 그 변경사항이 사라질 수 있어 이번 저장은 건너뛰었습니다.\n\n페이지를 새로고침한 뒤, 방금 하신 수정을 다시 적용해주세요.');
      return;
    }
    lastKnownUpdatedAt = nowIso;
    if(note) note.textContent = '자동 저장됨 · 이 대시보드를 사용하는 모든 사람에게 공유됩니다';
    const summary = pendingChangeSummary || '정보 수정';
    pendingChangeSummary = '';
    writeChangeLog(summary);
  }catch(e){
    // 예전에는 오류를 콘솔에만 남기고 화면엔 뭉뚱그린 문구만 보여줬는데, 그러면 실제로 저장이
    // 실패해도 담당자가 알아채기 어렵고(방금 한 수정이 조용히 사라진 것처럼 보임), 진짜 원인(용량
    // 초과인지 네트워크 문제인지 등)도 알 수 없었다. 그래서 실제 오류 메시지를 그대로 화면에 노출한다.
    console.error(e);
    const detail = (e && e.message) ? e.message : String(e);
    const looksLikeSizeLimit = /longer than|exceeds|too large|maximum size/i.test(detail);
    if(note) note.textContent = '⚠ 저장 실패 — ' + detail;
    showAlert(
      `저장에 실패했습니다. 방금 하신 수정이 저장되지 않았을 수 있습니다.\n\n오류 내용: ${detail}` +
      (looksLikeSizeLimit
        ? '\n\n저장하려는 데이터가 문서 용량 제한을 넘은 것으로 보입니다. 개발팀에 문의해주세요.'
        : '\n\n네트워크를 확인한 뒤 다시 시도하거나, 계속되면 개발팀에 이 오류 메시지를 전달해주세요.')
    );
  } finally {
    saveInFlight = false;
    // 저장이 진행되는 동안 반영을 미뤄뒀던 실시간 동기화 데이터가 있으면, 다음 사용자 조작을
    // 기다리지 않고 저장이 끝나는 즉시 반영한다(방금 우리가 저장한 것보다 더 오래된 데이터면
    // tryApplyPendingRemoteUpdate가 알아서 무시함).
    if(tryApplyPendingRemoteUpdate()) render();
  }
}

// 실시간 동기화(onSnapshot)로 받아온 최신 데이터를, 저장할 때 쓰는 core와 같은 모양으로
// DB에 반영한다. 로그인 시 최초 로딩에도 같은 정규화(누락 필드 채우기·상태 재계산)를
// 그대로 쓰기 위해 공용 함수로 뺐다.
function applyLoadedCore(parsed){
  DB.branches = parsed.branches;
  DB.rooms = parsed.rooms;
  DB.residents = parsed.residents;
  DB.channelList = (parsed.channelList && parsed.channelList.length) ? parsed.channelList : [...DEFAULT_CHANNEL_LIST];
  DB.shortcuts = parsed.shortcuts || [];
  // 마이그레이션: 지점 화면에서 직접 켜고 끄는 "청소/리터치 자동 지정 제외" 설정을 도입하기 전에도
  // 이미 있던 지점은, 예전에 코드에 하드코딩돼 있던 기본값(제주·오산)으로 딱 한 번만 채워준다.
  // 값이 이미 있으면(담당자가 이미 화면에서 설정했으면) 절대 덮어쓰지 않는다.
  const LEGACY_AUTO_CLEANING_EXCLUDED_NAMES = ['제주', '오산'];
  DB.branches.forEach(b=>{
    if(b.autoCleaningExcluded == null){
      b.autoCleaningExcluded = LEGACY_AUTO_CLEANING_EXCLUDED_NAMES.some(name => cleanKeyLoose(b.name).includes(name));
    }
    // 정산 관련 지점 설정. 값이 없던 기존 지점은 표준 수수료율(7%)/보증금 미관리로 시작하고,
    // 담당자가 지점 정보에서 바꾸거나 엑셀 일괄 등록으로 채워넣는다.
    if(b.commissionRate == null) b.commissionRate = SETTLEMENT_DEFAULT_COMMISSION_RATE;
    if(b.managesDeposit == null) b.managesDeposit = false;
    if(b.depositAmount == null) b.depositAmount = 0;
    if(b.refundAccount == null) b.refundAccount = '';
  });
  DB.residents.forEach(p => {
    if(p.originalMoveIn == null) p.originalMoveIn = p.moveIn || '';
    if(p.scheduledToLeave == null) p.scheduledToLeave = false;
    p.resStatus = computeResStatus(p);
  });
}
// 도어락 데이터는 DOORLOCK_DOC(별도 문서)에서 따로 불러와 적용한다 — applyLoadedCore와 분리해둔
// 이유는, 지점/호실/입실자 실시간 동기화(onSnapshot on FIRESTORE_DOC)가 갱신될 때마다
// applyLoadedCore가 다시 호출되는데, 그 스냅샷 JSON에는 더 이상 도어락 필드가 들어있지 않으므로
// 여기서 함께 처리하면 다른 사람이 방/입실자만 수정해도 화면의 도어락 데이터가 매번 빈 값으로
// 지워져버린다.
function applyDoorlockCore(parsed){
  DB.doorlocks = parsed.doorlocks || [];
  DB.doorlockPrevSnapshot = parsed.doorlockPrevSnapshot || null;
  DB.doorlockImportDate = parsed.doorlockImportDate || '';
  DB.doorlockBranchNameOverrides = parsed.doorlockBranchNameOverrides || {};
  DB.doorlockActionTags = parsed.doorlockActionTags || {};
  DB.doorlockBranchNotes = parsed.doorlockBranchNotes || {};
  DB.doorlockBranchLinks = parsed.doorlockBranchLinks || {};
  DB.doorlockHistory = parsed.doorlockHistory || [];
  // 마이그레이션: 이 기능 추가 전에 이미 doorlocks/doorlockPrevSnapshot가 쌓여있던 경우,
  // 히스토리가 비어있으면 최소한 그 두 스냅샷으로 채워 넣어 화살표 이동이 바로 동작하게 한다.
  if(DB.doorlockHistory.length === 0 && DB.doorlocks.length){
    if(DB.doorlockPrevSnapshot && DB.doorlockPrevSnapshot.records && DB.doorlockPrevSnapshot.records.length){
      DB.doorlockHistory.push({ date: DB.doorlockPrevSnapshot.date, records: DB.doorlockPrevSnapshot.records });
    }
    DB.doorlockHistory.push({ date: DB.doorlockImportDate, records: DB.doorlocks });
  }
}
// 실시간 동기화로 받은 데이터가 있어도, 지금 화면 어딘가에서 아직 저장 안 된 입력(방/입실자
// 수정 패널, 신규 입실자 작성 중, 관리자 화면의 지점/호실 추가·관리 폼 등)이 진행 중이면 바로
// 반영하지 않는다. 그 상태에서 DB를 통째로 바꾸면 화면이 다시 그려지면서 방금 입력하던 내용이
// 그대로 사라져버리기 때문이다. 대신 pendingRemoteApply에 담아두고, 그 편집이 끝나 다음 render()가
// 호출되는 시점에 안전하게 반영한다.
//
// 편집 패널이 열려 있는지만 확인하면 안 된다 — 잇소키 자물쇠 토글처럼 편집 모드 없이 바로
// 클릭 한 번으로 DB를 바꾸고 scheduleSave()만 거는 동작들도 있고, 그런 경우 클릭 직후부터
// 실제 저장이 끝나기까지(디바운스 250ms + 네트워크 왕복) 사이에 원격 갱신이 끼어들면 DB.rooms/
// residents 등이 통째로 "저장되기 전" 서버 데이터로 교체되면서 방금 한 수정이 통째로 사라지고,
// 그 상태 그대로 다음 저장이 실행돼 없어진 수정 내용이 그대로 서버에 다시 저장돼버린다("저장은
// 됐는데 새로고침하면 예전 데이터로 돌아가 있다"는 증상의 원인). 그래서 저장 타이머가 걸려있거나
// 저장이 진행 중인 동안(saveTimer/saveInFlight)도 반드시 편집 중으로 간주해야 한다.
function anyEditInProgress(){
  return saveTimer !== null || saveInFlight
    || Object.values(UI.roomEditMode).some(Boolean)
    || Object.values(UI.residentEditMode).some(Boolean)
    || Object.values(UI.residentFieldEdit).some(Boolean)
    || Object.values(UI.branchEditMode).some(Boolean)
    || Object.keys(UI.draftResident).length > 0
    || ADMIN_PANEL_TOGGLE_FLAGS.some(f=> UI[f])
    || !!UI.editingBranchId;
}
let pendingRemoteApply = null;
let firestoreUnsubscribe = null;
// pendingRemoteApply를 안전할 때(편집 중이 아닐 때) 반영한다. 큐에 담긴 뒤로 우리 자신이 먼저
// 저장을 끝냈을 수 있으므로(예: 방 카드를 편집하는 동안 받은 원격 갱신을, 편집을 마치고 저장까지
// 끝낸 뒤에야 이 함수로 반영하려는 경우) updatedAt이 지금 알고 있는 값보다 실제로 더 최신일 때만
// 적용한다 — 그렇지 않으면 방금 우리가 저장한 최신 데이터를 큐에 있던 오래된 데이터로 덮어써서
// "저장했는데 잠시 후 사라진다"는 문제가 생긴다. 반영했으면 true를 반환한다.
function tryApplyPendingRemoteUpdate(){
  if(!pendingRemoteApply || anyEditInProgress()) return false;
  const { parsed, updatedAt } = pendingRemoteApply;
  pendingRemoteApply = null;
  if(lastKnownUpdatedAt && updatedAt <= lastKnownUpdatedAt) return false;
  applyLoadedCore(parsed);
  lastKnownUpdatedAt = updatedAt;
  return true;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; saveState(); }, 250);
}

const CHANNEL_PALETTE = ['#D6673E','#B5459A','#5B4FCF','#2F8F5B','#C98A2C','#2F6FED','#B5335C','#5C8A3A','#0F7173','#A8481E'];
function channelColor(c){
  const fixed = { '독립생활':'var(--ch-indep)', '삼삼엠투':'var(--ch-33m2)', '리브애니':'var(--ch-liveany)' };
  if(fixed[c]) return fixed[c];
  // "기타"나 새로 추가한 채널(엔코스테이 등)도 흐릿한 회색 대신 눈에 띄는 고유 색을 자동으로 배정합니다.
  let hash = 0;
  const s = String(c||'');
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
  return CHANNEL_PALETTE[hash % CHANNEL_PALETTE.length];
}

  // 편집 중이라 미뤄뒀던 실시간 동기화 데이터가 있고, 이제는 편집이 끝나 안전하게 반영할 수

  if(UI.view === 'admin'){ main.appendChild(renderAdminView()); return; }

}

    // 수정 직후 몇 초 안에 새로고침하면 그 사이 저장이 아직 안 끝나 예전 데이터로

/* ---------------- 상단 통합 검색 ---------------- */
function buildGlobalSearchIndex(){
  // 현재 입실중/입실예정 입실자는 DB.residents에 그대로 있고(퇴실일이 미래인 경우도 포함),
  // 이미 퇴실 처리된 입실자는 DB.residentHistory로 옮겨져 있으므로 둘 다 합쳐서 검색 대상으로 삼는다.
  const current = DB.residents.map(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room) return null;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { kind:'resident', p, room, branch, isHistory:false };
  }).filter(Boolean);
  const past = DB.residentHistory.map(h=>{
    const room = DB.rooms.find(r=>r.id===h.roomId);
    if(!room) return null;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { kind:'resident', p:h, room, branch, isHistory:true };
  }).filter(Boolean);
  // 예약 중인 호실(방 카드의 "예약" 정보)도 검색 대상에 포함한다 — 입실자가 아니라 방 자체에
  // 붙어있는 정보라 별도 종류(kind:'reservation')로 다룬다.
  const reservations = DB.rooms.filter(r=>r.reserved).map(room=>{
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { kind:'reservation', room, branch };
  }).filter(Boolean);
  return [...current, ...past, ...reservations];
}
function globalSearchHaystack(item){
  if(item.kind === 'reservation'){
    const { room, branch } = item;
    const phoneDigits = (room.reservationPhone||'').replace(/\D/g,'');
    return [room.reservationName, room.reservationPhone, phoneDigits, room.number, branch.name, branch.shortName]
      .filter(Boolean).join(' ').toLowerCase();
  }
  const { p, room, branch } = item;
  const phoneDigits = (p.phone||'').replace(/\D/g,'');
  // 대리결제인 경우 계약자 정보뿐 아니라 실입실자 이름/연락처로도 찾을 수 있어야 한다.
  const actualPhoneDigits = (p.actualResidentPhone||'').replace(/\D/g,'');
  return [p.name, p.phone, phoneDigits, p.actualResidentName, p.actualResidentPhone, actualPhoneDigits, p.carNumber, room.number, branch.name, branch.shortName]
    .filter(Boolean).join(' ').toLowerCase();
}
function runGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return buildGlobalSearchIndex().filter(item=> globalSearchHaystack(item).includes(q)).slice(0, 20);
}
function renderGlobalSearchResults(query){
  const box = document.getElementById('globalSearchResults');
  if(!box) return;
  const q = query.trim();
  if(!q){ box.style.display = 'none'; box.innerHTML = ''; return; }

  const results = runGlobalSearch(q);
  box.innerHTML = '';
  if(results.length===0){
    box.appendChild(el('div', 'header-search-empty', '검색 결과가 없습니다.'));
  } else {
    results.forEach((item)=>{
      const { room, branch } = item;
      const row = document.createElement('div');
      row.className = 'header-search-item';

      if(item.kind === 'reservation'){
        const top = document.createElement('div'); top.className = 'hs-top';
        top.appendChild(el('span', null, maskViewerName(room.reservationName) || '예약자명 미입력'));
        top.appendChild(el('span', 'badge muted', '예약'));
        row.appendChild(top);
        const periodText = room.reservationMoveIn ? ` (입실예정 ${room.reservationMoveIn}${room.reservationMoveOut ? '~'+room.reservationMoveOut : ''})` : '';
        row.appendChild(el('div', 'hs-sub', `${room.reservationPhone || '연락처 미입력'} · ${branchLabel(branch)} ${room.number}호${periodText}`));
        row.addEventListener('click', ()=>{
          UI.view = 'branch';
          UI.branchId = branch.id;
          scrollToRoomCard(room);
          const input = document.getElementById('globalSearchInput');
          if(input) input.value = '';
          box.style.display = 'none'; box.innerHTML = '';
        });
        box.appendChild(row);
        return;
      }

      const { p, isHistory } = item;
      const top = document.createElement('div'); top.className = 'hs-top';
      top.appendChild(el('span', null, maskViewerName(p.name) || '이름 미입력'));
      const isUpcoming = !isHistory && computeResStatus(p) === '입실예정';
      const statusLabel = isHistory ? '퇴실' : (isUpcoming ? '입실예정' : '입실중');
      top.appendChild(el('span', 'badge' + (isHistory || isUpcoming ? ' muted' : ''), statusLabel));
      row.appendChild(top);

      const periodText = isHistory ? ` (${p.moveIn || '?'} ~ ${p.moveOut || '?'})` : '';
      row.appendChild(el('div', 'hs-sub', `${p.phone || '연락처 미입력'} · ${branchLabel(branch)} ${room.number}호${periodText}`));
      if(p.paymentProxy && (p.actualResidentName || p.actualResidentPhone)){
        row.appendChild(el('div', 'hs-sub', `실입실자 ${maskViewerName(p.actualResidentName) || '-'} ${p.actualResidentPhone || '-'}`));
      }

      row.addEventListener('click', ()=>{
        UI.view = 'branch';
        UI.branchId = branch.id;
        if(isHistory) UI.historyOpen[room.id] = true;
        scrollToRoomCard(room);
        const input = document.getElementById('globalSearchInput');
        if(input) input.value = '';
        box.style.display = 'none'; box.innerHTML = '';
      });
      box.appendChild(row);
    });
  }
  box.style.display = '';
}

const UPCOMING_SOON_DAYS_OPTIONS = [1,3,5,7];
const UPCOMING_SOON_DAYS_DEFAULT = 7;
function renderBranchUpcomingCards(branch){
  const soonDays = UPCOMING_SOON_DAYS_OPTIONS.includes(UI.upcomingSoonDays) ? UI.upcomingSoonDays : UPCOMING_SOON_DAYS_DEFAULT;
  const today = todayISO();
  const soonEnd = addDaysISO(today, soonDays);
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);
  const roomIds = new Set(rooms.map(r=>r.id));

  const moveInItems = DB.residents
    .filter(p=> roomIds.has(p.roomId) && computeResStatus(p)==='입실예정' && p.moveIn && p.moveIn<=soonEnd)
    .map(p=> ({ room: rooms.find(r=>r.id===p.roomId), date: p.moveIn, name: maskViewerName(p.name) || '이름 미입력' }))
    .sort((a,b)=> a.date.localeCompare(b.date));

  const moveOutItems = DB.residents
    .filter(p=> roomIds.has(p.roomId) && p.scheduledToLeave && p.moveOut && p.moveOut>=today && p.moveOut<=soonEnd)
    .map(p=> ({ room: rooms.find(r=>r.id===p.roomId), date: p.moveOut, name: maskViewerName(p.name) || '이름 미입력' }))
    .sort((a,b)=> a.date.localeCompare(b.date));

  const contractEndItems = [];
  rooms.forEach(room=>{
    const segments = roomContractSegments(room);
    if(segments.length===0) return;
    const latest = segments[segments.length-1];
    if(latest.end>=today && latest.end<=soonEnd){
      const alreadyScheduled = DB.residents.some(p=> p.roomId===room.id && p.scheduledToLeave);
      if(alreadyScheduled) return; // 이미 퇴실예정으로 확정된 사람은 계약만료 카드에서 제외
      contractEndItems.push({ room, date: latest.end, name: maskViewerName(latest.contract.contractor || latest.contract.resident) || '계약자 미입력' });
    }
  });
  contractEndItems.sort((a,b)=> a.date.localeCompare(b.date));

  function card(title, items){
    const box = document.createElement('div');
    box.className = 'stat-section cleaning-card';
    box.innerHTML = `<h3>${title} <span class="cnt-badge">${items.length}</span></h3>`;
    if(items.length===0){
      box.appendChild(el('div','cleaning-empty','해당하는 호실이 없습니다.'));
      return box;
    }
    items.forEach(item=>{
      const entry = document.createElement('div');
      entry.className = 'cleaning-entry';
      const row = document.createElement('div');
      row.className = 'cleaning-row';
      row.innerHTML = `<span class="rm">${esc(item.room.number)}호</span><span class="kind"><span class="upcoming-name">${esc(item.name)}</span><span class="mdate">${esc(item.date.slice(5))}</span></span>`;
      row.style.cursor = 'pointer';
      row.title = '클릭 시 호실로 이동';
      row.onclick = ()=> scrollToRoomCard(item.room);
      entry.appendChild(row);
      box.appendChild(entry);
    });
    return box;
  }

  const outer = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'upcoming-days-toolbar';
  const label = document.createElement('span');
  label.className = 'upcoming-days-label';
  label.textContent = '노출 기준';
  toolbar.appendChild(label);
  UPCOMING_SOON_DAYS_OPTIONS.forEach(d=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn small' + (soonDays === d ? ' primary' : '');
    btn.textContent = `${d}일`;
    btn.onclick = ()=>{ UI.upcomingSoonDays = d; render(); };
    toolbar.appendChild(btn);
  });
  outer.appendChild(toolbar);

  const wrap = document.createElement('div');
  wrap.className = 'upcoming-cards-grid';
  wrap.appendChild(card(`입실예정 (${soonDays}일 이내)`, moveInItems));
  wrap.appendChild(card(`계약만료 (${soonDays}일 이내)`, contractEndItems));
  wrap.appendChild(card(`퇴실확정 (${soonDays}일 이내)`, moveOutItems));
  outer.appendChild(wrap);
  return outer;
}

  function combinedParkingItems(){
    const residentItems = branchActiveCarResidents(branch).map(item=>({
      roomText: `${item.roomNumber}호`, name: item.name, carNumber: item.carNumber, branchLabel: item.branchLabel, external:false
    }));
    const externalItems = branchExternalParkingList(branch).map(item=>({
      roomText: '외부', name: item.label, carNumber: item.carNumber, branchLabel: item.branchLabel, external:true, id: item.id, branchId: item.branchId
    }));
    return [...residentItems, ...externalItems];

  function renderParkingListRow(item, editable){
    const row = document.createElement('div');
    row.className = 'parking-list-row';
    const prefix = item.branchLabel ? `[${esc(item.branchLabel)}] ` : '';
    row.innerHTML = `<span class="rm">${prefix}${esc(item.roomText)}</span><span class="nm">${esc(item.name)}</span><span class="car">${esc(item.carNumber)}</span>`;
    if(item.external && editable){
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'iconbtn';
      delBtn.innerHTML = '&times;';
      delBtn.title = '외부 주차 삭제';
      delBtn.style.cssText = 'margin-left:6px;flex-shrink:0;';
      delBtn.onclick = ()=>{
        showConfirm(`"${item.name}" (${item.carNumber}) 외부 주차 등록을 삭제할까요?`, ()=>{
          const targetBranch = DB.branches.find(b=>b.id===item.branchId) || branch;
          const list = targetBranch.externalParking || [];
          const idx = list.findIndex(x=>x.id===item.id);
          if(idx>=0) list.splice(idx,1);
          logChange(`"${targetBranch.name}" 외부 주차 삭제: ${item.name} ${item.carNumber}`);

      if(others + 1 > cap){
        showAlert(`"${branch.name}" 지점의 주차 가능 대수(${cap}대)${parkingGroupNote()}를 초과합니다.\n(현재 이용중 ${others}대 + 외부 주차 1대 = ${others+1}대)\n\n먼저 주차 가능 대수를 늘려주세요.`);

      }

      branch.externalParking.push({ id: uid('ep'), label: label || '외부', carNumber });
