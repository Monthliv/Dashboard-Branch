<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONTHLIV 운영 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --panel:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5B6B72;
    --line:#E1DCCF;
    --accent:#10767A;
    --accent-ink:#0B5457;
    --accent-soft:#E1F1F1;

    --st-vacant:#8B96A0;   --st-vacant-bg:#EEF0F2;
    --st-forsale:#2F6FED;  --st-forsale-bg:#E8EFFD;
    --st-occupied:#10767A; --st-occupied-bg:#E1F1F1;
    --st-leaving:#C98A2C;  --st-leaving-bg:#FBF0DD;
    --st-hold:#C0473F;     --st-hold-bg:#FBE7E5;
    --st-presell:#6C5FC7;  --st-presell-bg:#EDEBFA;
    --st-shortsale:#C2478B; --st-shortsale-bg:#FBE7F1;
    --st-proxy:#2E8B57;    --st-proxy-bg:#E4F3EA;

    --ch-indep:#5B4FCF; --ch-33m2:#B5459A; --ch-liveany:#D6673E; --ch-etc:#7A8790;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  #app{ max-width:1320px; margin:0 auto; padding:0 20px 60px; }
  header.top{ position:sticky; top:0; z-index:20; background:var(--paper); padding:20px 0 16px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; }
  .brand h1{ font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .brand h1 .tag{
    display:inline-block; margin-left:10px; font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:600; color:var(--accent-ink);
    background:var(--accent-soft); padding:2px 8px; border-radius:20px; vertical-align:middle;
  }
  .brand .sub{ font-size:12px; color:var(--ink-soft); }
  .home-link{ cursor:pointer; display:flex; align-items:center; }
  .home-link:hover{ color:var(--accent-ink); }
  .home-icon{ font-size:20px; margin-right:8px; line-height:1; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .branch-picker{ display:flex; align-items:center; gap:8px; }
  .branch-picker select{
    font-family:inherit; font-weight:700; font-size:14px; padding:9px 34px 9px 12px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235B6B72'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .header-search{ position:relative; flex:1 1 260px; max-width:360px; }
  .header-search input{
    width:100%; padding:9px 12px; font-family:inherit; font-size:13px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
  }
  .header-search input:focus{ outline:none; border-color:var(--accent); }
  .header-search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:360px; overflow-y:auto; z-index:30;
  }
  .header-search-item{ display:flex; flex-direction:column; gap:2px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .header-search-item:last-child{ border-bottom:none; }
  .header-search-item:hover{ background:var(--paper); }
  .header-search-item .hs-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .header-search-item .hs-sub{ font-size:11.5px; color:var(--ink-soft); }
  .header-search-empty{ padding:12px; font-size:12.5px; color:var(--ink-soft); text-align:center; }
  .btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:8px; padding:7px 12px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); color:#fff; }
  .btn.pill{ border-radius:999px; }
  .btn.danger{ color:var(--st-hold); }
  .btn.danger:hover{ border-color:var(--st-hold); color:var(--st-hold); }
  .btn.small{ padding:4px 9px; font-size:11.5px; border-radius:6px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .iconbtn{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1; padding:0; flex:none;
  }
  .iconbtn:hover{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .iconbtn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .iconbtn.del:hover{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); }

  .subnav{ display:inline-flex; gap:3px; background:#EFEAE0; padding:3px; border-radius:10px; margin:16px 0 16px; }
  .subnav button{
    border:none; background:none; cursor:pointer; font-family:inherit; font-weight:700;
    font-size:12.5px; padding:7px 14px; border-radius:8px; color:var(--ink-soft);
  }
  .subnav button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  main{ padding-top:6px; }

  select, input[type=text], input[type=date], input[type=tel], input[type=number], textarea{
    font-family:inherit; font-size:12.5px; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff;
  }
  textarea{ width:100%; resize:vertical; min-height:38px; }
  label.field-label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:3px; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.overdue-badge{ background:#C0473F; color:#fff; font-weight:800; animation:overduePulse 1.8s ease-in-out infinite; }
  @keyframes overduePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.65; } }
  .badge.muted{ background:#F1EFE8; color:var(--ink-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .empty-hint{ padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px; border:1px dashed var(--line); border-radius:12px; background:var(--panel); }

  .branch-bar{
    position:relative;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:18px; display:flex; flex-direction:column; gap:14px;
  }
  .branch-bar .branch-edit-pencil{ position:absolute; top:14px; right:14px; }
  .branch-bar .col h3{ margin:0 0 6px; font-size:11px; color:var(--ink-soft); font-weight:700; letter-spacing:.02em; }
  .branch-bar input, .branch-bar textarea{ width:100%; }
  .branch-bar .namewrap{ display:flex; gap:8px; align-items:center; }
  .branch-bar .namewrap input{ font-size:19px; font-weight:800; border:none; background:transparent; padding:2px 0; }
  .branch-bar .namewrap input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .parking-cap-row select{ width:100px; }
  .parking-cap-row{ margin-bottom:8px; }
  .branch-info-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .branch-info-table td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  .branch-info-table td.bi-label{ width:88px; color:var(--ink-soft); font-weight:700; font-size:11.5px; white-space:nowrap; }
  .branch-info-table tr:last-child td{ border-bottom:none; }
  .branch-info-table input, .branch-info-table select, .branch-info-table textarea{ width:100%; font-size:13px; }
  .parking-summary{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .parking-summary.parking-unavailable{ font-size:14px; font-weight:800; color:var(--st-hold); margin-bottom:0; }
  .parking-active-toggle{ color:var(--accent-ink); font-weight:700; text-decoration:underline; cursor:pointer; }
  .parking-active-toggle:hover{ color:var(--accent); }
  .parking-list{ background:#F4F1E9; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .parking-list-row{ display:flex; gap:8px; font-size:12px; padding:3px 0; }
  .parking-list-row .rm{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .parking-list-row .nm{ font-weight:600; }
  .parking-list-row .car{ color:var(--ink-soft); margin-left:auto; font-family:'JetBrains Mono',monospace; }
  .parking-list-empty{ font-size:12px; color:var(--ink-soft); }

  .room-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .room-toolbar .legend{ display:flex; gap:10px; flex-wrap:wrap; }
  .legend-btn{ border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .legend-btn:hover{ border-color:currentColor; }
  .legend-btn.active{ border-color:currentColor; box-shadow:0 0 0 1px currentColor inset; }

  .add-room-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-room-form .fld{ display:flex; flex-direction:column; }
  .add-room-form input, .add-room-form select{ width:100%; }

  .add-branch-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:2fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-branch-form .fld{ display:flex; flex-direction:column; }
  .add-branch-form input, .add-branch-form select{ width:100%; }

  .admin-add-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; align-items:end;
  }
  .branch-order-list{ display:flex; flex-direction:column; gap:6px; }
  .branch-order-row{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:9px 12px; cursor:grab; user-select:none;
  }
  .branch-order-row.dragging{ opacity:.4; }
  .branch-order-handle{ color:var(--ink-soft); font-size:14px; }
  .branch-order-name{ font-weight:700; font-size:13.5px; flex:1; cursor:pointer; }
  .branch-order-name:hover{ color:var(--accent-ink); text-decoration:underline; }
  .admin-add-form .fld{ display:flex; flex-direction:column; }
  .admin-add-form input, .admin-add-form select, .admin-add-form textarea{ width:100%; }
  .admin-add-form .btn-row{ display:flex; gap:8px; }
  .branch-address{ font-size:13px; font-weight:400; color:var(--ink-soft); margin-left:10px; }

  .branch-view-text{ font-size:14px; font-weight:600; padding:2px 0; }
  .branch-view-text.title{ font-size:19px; font-weight:800; }
  .branch-view-text.small{ font-size:12.5px; font-weight:400; color:var(--ink-soft); white-space:pre-wrap; }

  .overdue-banner{
    display:flex; align-items:flex-start; gap:12px; background:var(--st-hold-bg);
    border:1.5px solid var(--st-hold); border-radius:12px; padding:14px 16px; margin-bottom:18px;
  }
  .overdue-banner-icon{ font-size:20px; line-height:1; flex:none; }
  .overdue-banner-title{ font-weight:800; font-size:13.5px; color:var(--st-hold); margin-bottom:8px; }
  .overdue-banner-rooms{ display:flex; flex-wrap:wrap; gap:6px; }
  .overdue-room-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    background:#fff; color:var(--st-hold); border:1px solid var(--st-hold); border-radius:6px; padding:3px 9px;
    cursor:pointer;
  }
  .overdue-room-chip:hover{ background:var(--st-hold); color:#fff; }
  .room-card.flash-highlight{
    animation:cardFlash 2.2s ease-out;
  }
  @keyframes cardFlash{
    0%{ box-shadow:0 0 0 4px var(--st-hold); }
    70%{ box-shadow:0 0 0 4px var(--st-hold); }
    100%{ box-shadow:0 0 0 0 transparent; }
  }

  .status-section{ margin-bottom:22px; }
  .status-section .sec-head{
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:6px;
    border-bottom:2px solid; cursor:pointer; user-select:none;
  }
  .status-section .sec-head:hover .name{ text-decoration:underline; }
  .status-section .sec-head .name{ font-weight:800; font-size:14px; }
  .status-section .sec-head .count-badge{
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:800;
    padding:3px 11px; border-radius:20px;
  }
  .status-section .sec-head .sec-toggle-caret{ margin-left:auto; color:var(--ink-soft); font-size:13px; }
  .status-section .sec-head.collapsed{ margin-bottom:0; border-bottom-style:dashed; opacity:.85; }
  .status-section .sec-empty{ font-size:12px; color:var(--ink-soft); padding:8px 2px; }

  .grid-rooms{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; align-items:start; }

  /* ---- room card (view layout, matches reference mockup) ---- */
  .room-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; border-left:5px solid var(--st-vacant); }
  .rc-header{ display:flex; flex-direction:column; gap:6px; padding:12px 14px 8px; }
  .rc-header-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rc-title{ display:flex; align-items:baseline; gap:6px; min-width:0; flex:1; }
  .rc-title .roomno{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap; }
  .rc-title .roomtype{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rc-title .room-price{ font-size:11.5px; color:var(--accent-ink); font-weight:700; white-space:nowrap; }
  .rc-header-badges{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .history-btn{
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex:none;
  }
  .history-btn:hover, .history-btn.active{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .history-btn.contract-mismatch{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); animation:overduePulse 1.8s ease-in-out infinite; }
  .history-panel{ margin:0 14px 10px; background:#F4F1E9; border-radius:8px; padding:8px 10px; }
  .history-entry{ padding:6px 0; border-bottom:1px dashed #E1DCCF; }
  .history-entry:last-child{ border-bottom:none; }
  .history-top{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .history-top .nm{ font-weight:700; }
  .history-top .ph{ color:var(--ink-soft); }
  .history-top .btn{ margin-left:auto; }
  .history-period{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .history-empty{ font-size:12px; color:var(--ink-soft); }
  .rc-header-right{ display:flex; align-items:center; gap:6px; flex:none; }

  .rc-note-chip{
    margin:0 14px 8px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:8px;
    padding:6px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rc-divider{ border:none; border-top:1px solid var(--line); margin:0; }

  .rc-body{ padding:12px 14px 14px; }

  .resident-block{ padding:9px 0; border-bottom:1px dashed #EAE5D8; }
  .resident-block:last-child{ border-bottom:none; }
  .resident-flags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .resident-name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; }
  .resident-name-row .nm{ font-weight:700; font-size:13.5px; }
  .resident-name-row .nm.nm-clickable{ cursor:pointer; }
  .resident-name-row .nm.nm-clickable:hover{ color:var(--accent-ink); text-decoration:underline; }
  .resident-name-row .acts{ display:flex; gap:5px; flex:none; }
  .badge.tag-new{ background:#F1EFE8; color:var(--ink-soft); border:1px solid var(--line); }
  .badge.tag-ext{ background:#FBF0DD; color:#8A5F14; border:1px solid #E3B25C; }
  .badge.res-status{ background:#EEF0F2; color:var(--ink-soft); }
  .badge.res-status.leaving{ background:var(--st-leaving-bg); color:var(--st-leaving); }
  .badge.res-status.moving{ background:var(--st-presell-bg); color:var(--st-presell); }
  .badge.res-status.upcoming{ background:var(--st-forsale-bg); color:var(--st-forsale); }
  .resident-period{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .resident-car{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .resident-memo{
    margin-top:5px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:6px;
    padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .empty-residents{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 4px; }
  .empty-residents .msg{ font-size:12.5px; color:var(--ink-soft); }

  /* ---- edit mode ---- */
  .edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .edit-grid input, .edit-grid select{ width:100%; }
  .maint-chips{ display:flex; gap:6px; }
  .flagchip{
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px;
    border:1px solid var(--line); background:#fbfaf7; color:var(--ink-soft); cursor:pointer;
  }
  .flagchip.on.moveout{ background:#FBEFD8; border-color:#E3B25C; color:#8A5F14; }
  .flagchip.on.retouch{ background:#E3E8FD; border-color:#8B9FEE; color:#2E3F9E; }
  .flagchip.on.extra{ background:#E1F5E9; border-color:#6FBF8B; color:#1F7A45; }
  .flagchip.on.presell{ background:var(--st-forsale-bg); border-color:var(--st-forsale); color:var(--st-forsale); }
  .edit-section-label{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; margin:14px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .edit-section-label:first-child{ margin-top:0; }

  .resident-edit-card{ border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:#FCFBF8; }
  .resident-edit-card .redit-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .resident-edit-card .redit-title{ font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.02em; }
  .resident-edit-card input[type=text], .resident-edit-card input[type=tel]{ width:100%; }
  .resident-edit-card .redit-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .resident-edit-card .redit-grid2 select, .resident-edit-card .redit-grid2 input{ width:100%; }
  .resident-edit-card .redit-proxy-row{ grid-column:1 / -1; display:flex; align-items:center; gap:6px; }
  .resident-edit-card .redit-proxy-row input[type=checkbox]{ width:auto; flex:none; }
  .resident-edit-card .redit-proxy-row label{ font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; }
  .resident-edit-card .redit-readonly-text{ font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:6px 0; }
  .resident-edit-card .redit-readonly-text.empty{ color:var(--st-hold); font-weight:400; }
  .resident-edit-card .redit-inline-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .resident-edit-card .redit-inline-row > div:first-child{ flex:1; min-width:0; }
  .resident-edit-card .redit-inline-row input{ width:100%; }
  .resident-edit-card input.invalid, .resident-edit-card input.invalid:focus{ border-color:var(--st-hold); background:#FFF6F5; }
  .field-label .req{ color:var(--st-hold); }

  .tl-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .tl-month-nav{ display:flex; align-items:center; gap:10px; }
  .tl-month-nav .m-label{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; min-width:110px; text-align:center; }
  .tl-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto; }

<script>
const STORE_KEY = 'monthliv-state';
let DB = null;
let UI = {
  view:'stats', branchId:null, branchTab:'rooms',
  roomEditMode:{}, residentEditMode:{}, roomSnapshots:{}, residentSnapshots:{}, draftResident:{}, parkingListOpen:{}, residentFieldEdit:{},
  branchEditMode:{}, branchSnapshots:{}, historyOpen:{}, addingBranch:false, addingRoom:false, managingRoom:false, editingBranchId:null,
  tlYear:null, tlMonth:null, roomStatusFilter:'이용중', cleanWeekStart:null, overdueTabKey:null,
  cleanTodayPage:1, cleanFuturePage:1
};

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addOneMonth(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function nextMonWedFri(fromDateStr){
  const d = fromDateStr ? new Date(fromDateStr) : new Date();
  while(![1,3,5].includes(d.getDay())) d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function formatWon(n){ n = Number(n)||0; return n.toLocaleString('ko-KR') + '원'; }
function branchLabel(branch){ return (branch && branch.shortName && branch.shortName.trim()) ? branch.shortName : (branch ? branch.name : ''); }
function syncBranchSelectOption(branch){
  const opt = document.querySelector(`#branchSelect option[value="${branch.id}"]`);
  if(opt) opt.textContent = branchLabel(branch);
}

const STATUS_LIST = ['이용중','이용중판매','단기판매','판매중','퇴실예정','공실','판매보류'];
const STATUS_LIST_MANUAL = STATUS_LIST.filter(s => !['이용중','이용중판매','단기판매','퇴실예정'].includes(s));
const STATUS_LIST_STATS = STATUS_LIST.filter(s => !['이용중판매','단기판매'].includes(s));
const SHORT_SALE_SOON_DAYS = 9;
function shortSaleMoveInSoon(room){
  return DB.residents.some(p=> p.roomId===room.id && isUpcoming(p)
    && Math.round((new Date(p.moveIn) - new Date(todayISO())) / 86400000) <= SHORT_SALE_SOON_DAYS);
}
/* 탭 노출 규칙: 이용중=입실자가 있으면 무조건, 판매중=판매중 상태면 무조건이라 이용중판매/단기판매는
   두 탭 모두에 걸친다. 호실 카드 배지에는 이용중판매/단기판매를 그대로 보여주고(플래그는 유지),
   탭 목록에는 별도 탭을 만들지 않는다. */
function roomTabs(room){
  const s = effectiveRoomStatus(room);
  if(s === '이용중판매' || s === '단기판매') return ['이용중','판매중'];
  return [s];
}
const RESIDENT_STATUS_LIST = ['입실중','입실예정','퇴실예정'];
const CONTRACT_TYPE_LIST = ['신규','연장'];
const DEFAULT_CHANNEL_LIST = ['독립생활','삼삼엠투','리브애니','기타'];
const ROOM_TYPE_LIST = ['블레스','그레이스','트리니티','기타'];
const OCCUPANCY_LIST = ['1인실','2인실'];
function occupancyCapacity(room){ return (room.occupancy === '1인실') ? 1 : 2; }

/* 호실 청소 상태: 퇴실청소(자동+수동)/리터치(수동)/추가청소(수동) 중 하나만 켤 수 있다 */
const MAINT_KIND_META = {
  moveout: { label:'퇴실청소', bg:'#FBEFD8', fg:'#8A5F14' },
  retouch: { label:'리터치',   bg:'#E3E8FD', fg:'#2E3F9E' },
  extra:   { label:'추가청소', bg:'#E1F5E9', fg:'#1F7A45' },
};
const MAINT_KIND_FIELD = { moveout:'needsCleaning', retouch:'needsRetouch', extra:'needsExtraCleaning' };
function roomMaintKind(room){
  if(room.needsRetouch) return 'retouch';
  if(room.needsExtraCleaning) return 'extra';
  if(room.needsCleaning) return 'moveout';
  return null;
}
function maintBadgeHtml(kind, suffix){
  const m = MAINT_KIND_META[kind];
  if(!m) return '';
  return `<span class="badge" style="background:${m.bg};color:${m.fg};">${m.label}${suffix||''}</span>`;
}

function seedState(){
  const branchSeongsu = uid('b'), branchJamsil = uid('b'), branchDoksan = uid('b');
  const rooms = []; const residents = [];
  function addRoom(branchId, number, type, occupancy, status, cleaning, retouch, note, price){
    const r = { id: uid('r'), branchId, number, type, occupancy, saleStatus: status,
      needsCleaning: cleaning, needsRetouch: retouch, needsExtraCleaning:false, maintenanceDate:'', preSelling:false, note: note || '', price: price||0 };
    rooms.push(r); return r;
  }
  function addResident(roomId, name, channel, resStatus, contractType, moveIn, moveOut, phone, memo, carNumber){
    residents.push({ id: uid('p'), roomId, name, channel, resStatus, contractType, moveIn, moveOut, originalMoveIn: moveIn, scheduledToLeave:false, phone: phone||'', memo: memo||'', carNumber: carNumber||'', firstSaveDone:true, slotIndex:0 });
  }

  const r1 = addRoom(branchSeongsu, '304', '그레이스', '2인실', '공실', false, false, '204호 정독립 이동 예정', 450000);
  addResident(r1.id, '천수진', '삼삼엠투', '퇴실예정', '연장', '2026-08-01', '2026-08-31', '010-6884-8880', '실거주자 박영민(010-1234-5678)');
  const r2 = addRoom(branchSeongsu, '305', '블레스', '1인실', '공실', false, false, '', 480000);

let CURRENT_USER = null;   // { uid, email }
let USER_ROLE = null;      // 'pending' | 'viewer' | 'editor' | 'superadmin'
let USER_BRANCH_SCOPE = 'all'; // 'all' | 'selected' — superadmin is always effectively 'all'
let USER_BRANCH_IDS = null;    // array of branch ids, only meaningful when scope === 'selected'
function canEdit(){ return USER_ROLE === 'editor' || USER_ROLE === 'superadmin'; }
function isSuperAdmin(){ return USER_ROLE === 'superadmin'; }
/* 보기 권한(viewer) 계정에는 입실자 이름 앞 두 글자만 보여주고 나머지는 마스킹한다. */
function maskViewerName(name){
  if(!name || USER_ROLE !== 'viewer') return name;
  const s = String(name);
  return s.length <= 2 ? s : s.slice(0,2) + '*'.repeat(s.length-2);
}
/* 슈퍼어드민은 항상 전체 지점에 접근 가능. 그 외 계정은 관리자가 지정한 범위(전체 또는 선택한 지점)로 제한된다. */
function hasBranchAccess(branchId){
  if(isSuperAdmin() || USER_BRANCH_SCOPE !== 'selected') return true;
  return Array.isArray(USER_BRANCH_IDS) && USER_BRANCH_IDS.includes(branchId);
}
function allowedBranches(){
  if(isSuperAdmin() || USER_BRANCH_SCOPE !== 'selected') return DB.branches;
  return DB.branches.filter(b=> Array.isArray(USER_BRANCH_IDS) && USER_BRANCH_IDS.includes(b.id));
}

const CHANNEL_PALETTE = ['#D6673E','#B5459A','#5B4FCF','#2F8F5B','#C98A2C','#2F6FED','#B5335C','#5C8A3A','#0F7173','#A8481E'];
function channelColor(c){
  const fixed = { '독립생활':'var(--ch-indep)', '삼삼엠투':'var(--ch-33m2)', '리브애니':'var(--ch-liveany)' };
  if(fixed[c]) return fixed[c];
  // "기타"나 새로 추가한 채널(엔코스테이 등)도 흐릿한 회색 대신 눈에 띄는 고유 색을 자동으로 배정합니다.
  let hash = 0;
  const s = String(c||'');
  for(let i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
  return CHANNEL_PALETTE[hash % CHANNEL_PALETTE.length];
}

function buildGlobalSearchIndex(){
  return DB.residents.map(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room) return null;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { p, room, branch };
  }).filter(Boolean);
}
function globalSearchHaystack(item){
  const { p, room, branch } = item;
  const phoneDigits = (p.phone||'').replace(/\D/g,'');
  return [p.name, p.phone, phoneDigits, p.carNumber, room.number, branch.name, branch.shortName]
    .filter(Boolean).join(' ').toLowerCase();
}
function runGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return buildGlobalSearchIndex().filter(item=> globalSearchHaystack(item).includes(q)).slice(0, 20);
}
function renderGlobalSearchResults(query){
  const box = document.getElementById('globalSearchResults');
  if(!box) return;
  const q = query.trim();
  if(!q){ box.style.display = 'none'; box.innerHTML = ''; return; }

  const results = runGlobalSearch(q);
  box.innerHTML = '';
  if(results.length===0){
    box.appendChild(el('div', 'header-search-empty', '검색 결과가 없습니다.'));
  } else {
    results.forEach(({ p, room, branch })=>{
      const row = document.createElement('div');
      row.className = 'header-search-item';

      const top = document.createElement('div'); top.className = 'hs-top';
      top.appendChild(el('span', null, maskViewerName(p.name) || '이름 미입력'));

      row.appendChild(el('div', 'hs-sub', `${p.phone || '연락처 미입력'} · ${branchLabel(branch)} ${room.number}호`));

        if(input) input.value = '';

      });
      box.appendChild(row);
    });
  }
  box.style.display = '';
}

const UPCOMING_SOON_DAYS = 5;
function renderBranchUpcomingCards(branch){
  const today = todayISO();
  const soonEnd = addDaysISO(today, UPCOMING_SOON_DAYS);
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);
  const roomIds = new Set(rooms.map(r=>r.id));

  const moveInItems = DB.residents
    .filter(p=> roomIds.has(p.roomId) && computeResStatus(p)==='입실예정' && p.moveIn && p.moveIn<=soonEnd)
    .map(p=> ({ room: rooms.find(r=>r.id===p.roomId), date: p.moveIn, name: maskViewerName(p.name) || '이름 미입력' }))
    .sort((a,b)=> a.date.localeCompare(b.date));

  const moveOutItems = DB.residents
    .filter(p=> roomIds.has(p.roomId) && p.scheduledToLeave && p.moveOut && p.moveOut>=today && p.moveOut<=soonEnd)
    .map(p=> ({ room: rooms.find(r=>r.id===p.roomId), date: p.moveOut, name: maskViewerName(p.name) || '이름 미입력' }))
    .sort((a,b)=> a.date.localeCompare(b.date));

  const contractEndItems = [];
  rooms.forEach(room=>{
    const segments = roomContractSegments(room);
    if(segments.length===0) return;
    const latest = segments[segments.length-1];
    if(latest.end>=today && latest.end<=soonEnd){
      const alreadyScheduled = DB.residents.some(p=> p.roomId===room.id && p.scheduledToLeave);
      if(alreadyScheduled) return; // 이미 퇴실예정으로 확정된 사람은 계약만료 카드에서 제외
      contractEndItems.push({ room, date: latest.end, name: maskViewerName(latest.contract.contractor || latest.contract.resident) || '계약자 미입력' });
    }
  });
  contractEndItems.sort((a,b)=> a.date.localeCompare(b.date));

  function card(title, items){
    const box = document.createElement('div');
    box.className = 'stat-section cleaning-card';
    box.innerHTML = `<h3>${title} <span class="cnt-badge">${items.length}</span></h3>`;
    if(items.length===0){
      box.appendChild(el('div','cleaning-empty','해당하는 호실이 없습니다.'));
      return box;
    }
    items.forEach(item=>{
      const entry = document.createElement('div');
      entry.className = 'cleaning-entry';
      const row = document.createElement('div');
      row.className = 'cleaning-row';
      row.innerHTML = `<span class="rm">${esc(item.room.number)}호</span><span class="kind"><span class="upcoming-name">${esc(item.name)}</span><span class="mdate">${esc(item.date.slice(5))}</span></span>`;
      row.style.cursor = 'pointer';
      row.title = '클릭 시 호실로 이동';
      row.onclick = ()=> scrollToRoomCard(item.room);
      entry.appendChild(row);
      box.appendChild(entry);
    });
    return box;
  }

  const wrap = document.createElement('div');
  wrap.className = 'upcoming-cards-grid';
  wrap.appendChild(card(`입실예정 (${UPCOMING_SOON_DAYS}일 이내)`, moveInItems));
  wrap.appendChild(card(`계약만료 (${UPCOMING_SOON_DAYS}일 이내)`, contractEndItems));
  wrap.appendChild(card(`퇴실예정 (${UPCOMING_SOON_DAYS}일 이내)`, moveOutItems));
  return wrap;
}

  } else {

/* ---------------- rooms section ---------------- */
function roomNumberTaken(branchId, number, excludeRoomId){
  const norm = String(number).replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();
  return DB.rooms.some(r => r.branchId===branchId && r.id!==excludeRoomId && String(r.number).replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase()===norm);
}

function roomHasScheduledLeaveResident(room){
  return DB.residents.some(p => p.roomId===room.id && p.scheduledToLeave && isCurrentlyResiding(p));
}
function roomIsLeavingSoon(room){
  return roomHasScheduledLeaveResident(room) || effectiveRoomStatus(room)==='퇴실예정';
}
function roomHasPaymentProxy(room){
  return DB.residents.some(p=> p.roomId===room.id && p.paymentProxy);
}
const ROOM_TAB_LIST = [...STATUS_LIST_STATS, '대리결제'];
function roomsInFilterTab(rooms, s){
  if(s === '퇴실예정') return rooms.filter(roomIsLeavingSoon);
  if(s === '대리결제') return rooms.filter(roomHasPaymentProxy);
  return rooms.filter(r=> roomTabs(r).includes(s));
}
function renderRoomsSection(branch){
  const wrap = document.createElement('div');
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);

  const status = UI.roomStatusFilter || '이용중';

  const toolbar = document.createElement('div');
  toolbar.className = 'room-toolbar';
  const legend = document.createElement('div');
  legend.className = 'legend';

    const m = statusMeta(s);

    btn.type = 'button';
    btn.className = 'badge legend-btn' + (status === s ? ' active' : '');
    btn.style.background = m.bg; btn.style.color = m.fg;
    btn.innerHTML = `<span class="dot" style="background:${m.fg}"></span>${s}(${cnt})`;
    btn.title = `${s} 호실만 모아보기`;

  });
  toolbar.appendChild(legend);

  if(rooms.length===0){

    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  const section = document.createElement('div');

  head.className = 'sec-head';

    <span class="dot" style="background:${meta.fg}"></span>
    <span class="name" style="color:${meta.fg}">${status}</span>

function addResidentToRoom(room){
  const cap = occupancyCapacity(room);
  const confirmedCount = DB.residents.filter(p=>p.roomId===room.id).length;
  const hasDraft = !!UI.draftResident[room.id];
  if(confirmedCount + (hasDraft?1:0) >= cap){
    showAlert(`이 호실(${room.occupancy || '2인실'})은 최대 ${cap}인까지만 입실 가능합니다.`);
    return;
  }
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: todayISO(), moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex: confirmedCount,
    paymentProxy:false, actualResidentName:'', actualResidentPhone:'' };
  p.resStatus = computeResStatus(p);
  // 최초 입력 중에는 DB에 반영하지 않고 화면(초안) 상태로만 유지합니다.
  // "완료"를 눌러야 실제로 저장되고, 취소/새로고침 시 남지 않습니다.
  UI.draftResident[room.id] = p;
  render();
}
function roomAnyResidentScheduledToLeave(room){
  return DB.residents.some(p=>p.roomId===room.id && p.scheduledToLeave);
}
function addUpcomingResidentToRoom(room){
  if(UI.draftResident[room.id]){
    showAlert('이미 등록 중인 입실자가 있습니다. 먼저 완료하거나 취소해주세요.');
    return;
  }
  const leaving = DB.residents.filter(p=>p.roomId===room.id && p.scheduledToLeave);
  const defaultMoveIn = leaving.length===1 ? (leaving[0].moveOut || '') : '';
  // 정원이 이미 찬 방이지만, 현재 입실자가 모두 퇴실예정으로 확정된 경우에 한해
  // 다음 입실자를 미리 등록할 수 있도록 slotIndex 0(주 입실자 자리)을 그대로 사용합니다.
  // 실제 퇴실 처리(moveResidentToHistory)가 되면 기존 입실자만 제거되어 자연스럽게 정리됩니다.
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: defaultMoveIn, moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex:0,
    paymentProxy:false, actualResidentName:'', actualResidentPhone:'' };
  p.resStatus = computeResStatus(p);
  UI.draftResident[room.id] = p;
  render();
}

/* ---------------- room card: view mode ---------------- */
function computeResStatus(p){
  // 입실 시작일 기준 자동 계산 (화면에는 노출하지 않고 내부 데이터로만 사용)
  if(!p.moveIn) return p.resStatus || '입실중';
  const today = todayISO();
  if(p.moveIn > today) return '입실예정';
  if(p.moveIn === today) return '입실중';
  return '퇴실';
}
function isCurrentlyResiding(p){
  // 입실일이 이미 지났고(오늘 포함) 아직 퇴실 처리가 되지 않았다면 "이용중"으로 간주합니다.
  // 퇴실예정일이 지났더라도 실제 퇴실 처리(히스토리 이동) 전까지는 계속 이용중으로 봅니다.
  if(!p.moveIn) return false;
  return p.moveIn <= todayISO();
}
function isOverdue(p){
  return !!(p.moveOut && p.moveOut < todayISO());
}
function isUpcoming(p){
  return !!(p.moveIn && p.moveIn > todayISO());
}
function occupiesRoom(p){
  return isCurrentlyResiding(p) || isUpcoming(p);
}
function roomHasOverdueResident(room){
  return DB.residents.some(p => p.roomId===room.id && isOverdue(p));
}
function moveResidentToHistory(p, moveOutOverride){
  logChange(`${p.name || '입실자'} 퇴실 처리`);
  DB.residentHistory.push({
    id: uid('h'), roomId: p.roomId,
    name: p.name || '(이름 미입력)', phone: p.phone || '',
    moveIn: p.originalMoveIn || p.moveIn || '', moveOut: moveOutOverride || p.moveOut || todayISO()
  });
  DB.residents = DB.residents.filter(x=>x.id!==p.id);
  delete UI.residentEditMode[p.id];
  delete UI.residentSnapshots[p.id];
  // 마지막 재실 입실자가 퇴실한 뒤에도 저장된 상태값이 "이용중"처럼 더 이상 유효하지 않게
  // 남아있으면(과거 데이터 등) 공실로 정리합니다. 그 외에는 관리자가 이미 설정해둔 판매
  // 상태(예: 판매중)를 그대로 유지하며, 자동으로 바꾸지 않습니다.
  const room = DB.rooms.find(r=>r.id===p.roomId);
  if(room && !roomHasActiveResident(room)){
    if(!STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
    }
    room.needsCleaning = true;
    room.needsRetouch = false;
    room.needsExtraCleaning = false;
    room.maintenanceDate = nextMonWedFri(todayISO());
    room.maintenanceMemo = '퇴실청소';
  }
}
function restoreFromHistory(h){
  const room = DB.rooms.find(r=>r.id===h.roomId);
  if(!room){ showAlert('해당 호실을 찾을 수 없습니다. (삭제된 호실일 수 있어요)'); return; }
  const cap = occupancyCapacity(room);
  const currentCount = DB.residents.filter(p=>p.roomId===room.id).length;
  if(currentCount >= cap){
    showAlert(`이 호실은 이미 정원(${cap}인)이 가득 차 있어 복원할 수 없습니다. 먼저 자리를 비워주세요.`);
    return;
  }
  showConfirm(`"${h.name}" 님의 정보를 이 호실의 입실자로 복원할까요?`, ()=>{
    const usedSlots = new Set(DB.residents.filter(p=>p.roomId===room.id).map(p=>p.slotIndex||0));
    let freeSlot = 0;
    while(usedSlots.has(freeSlot)) freeSlot++;
    const p = {
      id: uid('p'), roomId: room.id, name: h.name, phone: h.phone,
      channel: '독립생활', resStatus:'', contractType:'신규',
      moveIn: h.moveIn, moveOut: h.moveOut, originalMoveIn: h.moveIn, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex: freeSlot
    };
    p.resStatus = computeResStatus(p);
    DB.residents.push(p);
    DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
    UI.historyOpen[room.id] = false;
    logChange(`"${h.name}" 님을 ${room.number}호 입실자로 복원`);
    scheduleSave(); render();
  });
}
function processScheduledLeaves(){
  const today = todayISO();
  const toLeave = DB.residents.filter(p => p.scheduledToLeave && p.moveOut && p.moveOut < today);
  if(toLeave.length===0) return;
  toLeave.forEach(p => moveResidentToHistory(p));
  scheduleSave();
}
function roomHasActiveResident(room){
  return DB.residents.some(p => p.roomId===room.id && occupiesRoom(p));
}
function branchActiveCarResidents(branchId){
  const roomIds = new Set(DB.rooms.filter(r=>r.branchId===branchId).map(r=>r.id));
  return DB.residents
    .filter(p => roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && isCurrentlyResiding(p))
    .map(p => {
      const room = DB.rooms.find(r=>r.id===p.roomId);
      return { roomNumber: room ? room.number : '-', name: maskViewerName(p.name) || '(이름 미입력)', carNumber: p.carNumber };
    });
}
function branchActiveCarCount(branchId, excludeResidentId){
  const roomIds = new Set(DB.rooms.filter(r=>r.branchId===branchId).map(r=>r.id));
  return DB.residents.filter(p =>
    p.id !== excludeResidentId && roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && isCurrentlyResiding(p)
  ).length;
}
function effectiveRoomStatus(room){
  // "이용중"/"이용중판매"/"단기판매"는 오늘 날짜 기준 재실·예약 여부로 자동 판정하며 수동 설정 불가.
  // 재실(또는 예약) 중에 관리자가 판매 상태를 "판매중"으로 지정해두면, 지금 실제로 거주 중인
  // 입실자가 있으면 "이용중판매", 미래 입실예정자만 있으면 "단기판매"로 표시됩니다.
  // 단기판매는 입실예정일이 SHORT_SALE_SOON_DAYS일 이내로 다가오면 실제로 "이용중"으로 전환됩니다.
  if(roomHasActiveResident(room)){
    if(room.saleStatus !== '판매중') return '이용중';
    const hasCurrent = DB.residents.some(p => p.roomId===room.id && isCurrentlyResiding(p));
    if(hasCurrent) return '이용중판매';
    return shortSaleMoveInSoon(room) ? '이용중' : '단기판매';
  }
  return room.saleStatus;
}

  const maintDateSuffix = room.maintenanceDate ? ` · ${room.maintenanceDate.slice(5)}` : '';
  const headerRight = `
    <span class="badge" style="background:${meta.bg};color:${meta.fg}">${effStatus}</span>
    ${maintBadgeHtml(roomMaintKind(room), maintDateSuffix)}
  `;

  const header = document.createElement('div');
  header.className = 'rc-header';
  header.innerHTML = `
    <div class="rc-header-top">
      <div class="rc-title"><span class="roomno">${esc(room.number)}</span><span class="roomtype">${esc(room.type)}</span><span class="room-price">${formatWon(room.price)}</span></div>
    </div>
    <div class="rc-header-badges">${headerRight}</div>
  `;
  const historyOpen = !!UI.historyOpen[room.id];
  const historyBtn = document.createElement('button');
  historyBtn.className = 'history-btn' + (historyOpen ? ' active' : '');
  historyBtn.textContent = '히스토리';
  historyBtn.title = '퇴실한 입실자 이력 보기';
  historyBtn.onclick = ()=>{ UI.historyOpen[room.id] = !historyOpen; render(); };
  header.querySelector('.rc-header-badges').prepend(historyBtn);
  const contractBtn = document.createElement('button');
  const contractMismatch = contractEndDateMismatch(room);
  contractBtn.className = 'history-btn' + (contractMismatch ? ' contract-mismatch' : '');
  contractBtn.textContent = '계약현황';
  contractBtn.title = contractMismatch
    ? '최근 계약의 계약종료일과 입실자의 퇴실예정일이 달라요. 계약 정보를 확인해주세요.'
    : '계약 이력 보기';
  contractBtn.onclick = ()=> showContractHistoryModal(room);
  header.querySelector('.rc-header-badges').prepend(contractBtn);
  const pencil = document.createElement('button');
  pencil.className = 'iconbtn' + (roomEditOn ? ' active' : '');
  pencil.innerHTML = roomEditOn ? '&#10003;' : '&#9998;';
  pencil.title = roomEditOn ? '수정 완료' : '방 정보 수정';
  pencil.onclick = ()=>{
    if(!roomEditOn){ UI.roomSnapshots[room.id] = Object.assign({}, room); }
    else { delete UI.roomSnapshots[room.id]; }
    UI.roomEditMode[room.id] = !roomEditOn; render();
  };
  if(canEdit()) header.querySelector('.rc-header-top').appendChild(pencil);
  card.appendChild(header);

  if(historyOpen){
    const hist = DB.residentHistory.filter(h=>h.roomId===room.id).sort((a,b)=> (b.moveOut||'').localeCompare(a.moveOut||'')).slice(0,3);
    const roomOccupied = roomHasActiveResident(room);
    const histBox = document.createElement('div');
    histBox.className = 'history-panel';
    if(hist.length===0){
      histBox.appendChild(el('div','history-empty','이 호실에는 아직 퇴실 이력이 없습니다.'));
    } else {
      hist.forEach((h, idx)=>{
        const entry = document.createElement('div');
        entry.className = 'history-entry';
        const topRow = document.createElement('div');
        topRow.className = 'history-top';
        topRow.innerHTML = `<span class="nm">${esc(maskViewerName(h.name))}</span><span class="ph">${esc(h.phone||'-')}</span>`;
        if(canEdit() && !roomOccupied){
          if(idx === 0){
            const restoreBtn = document.createElement('button');
            restoreBtn.className = 'btn small';
            restoreBtn.textContent = '복원';
            restoreBtn.title = '이 입실자 정보를 다시 입실자로 복원';
            restoreBtn.onclick = ()=> restoreFromHistory(h);
            topRow.appendChild(restoreBtn);
          }
          const delHistBtn = document.createElement('button');
          delHistBtn.className = 'iconbtn del';
          delHistBtn.innerHTML = '&times;';
          delHistBtn.title = '이 히스토리 항목 삭제';
          delHistBtn.onclick = ()=>{
            showConfirm(`"${h.name}" 님의 히스토리 기록을 완전히 삭제할까요? 이 작업은 되돌릴 수 없습니다.`, ()=>{
              DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
              logChange(`"${h.name}" 히스토리 기록 삭제`);
              scheduleSave(); render();
            });
          };
          topRow.appendChild(delHistBtn);
        }
        entry.appendChild(topRow);
        const periodRow = document.createElement('div');
        periodRow.className = 'history-period';
        periodRow.textContent = `${h.moveIn || '-'} ~ ${h.moveOut || '-'}`;
        entry.appendChild(periodRow);
        histBox.appendChild(entry);
      });
    }
    card.appendChild(histBox);
  }

  if(!roomEditOn && room.note){
    const chip = document.createElement('div');
    chip.className = 'rc-note-chip';
    chip.textContent = room.note;
    chip.title = room.note;
    chip.style.color = MEMO_COLORS[room.noteColor] || MEMO_COLORS.black;
    if(room.noteBold) chip.style.fontWeight = '700';
    card.appendChild(chip);
  }

  card.appendChild(document.createElement('hr')).className = 'rc-divider';

  const body = document.createElement('div');
  body.className = 'rc-body';

  if(roomEditOn){
    body.appendChild(renderRoomEditForm(room));
    body.appendChild(document.createElement('hr')).className = 'rc-divider';
    body.lastChild.style.margin = '4px 0 12px';
  }

  if(residents.length===0 && !draft){
    const emptyRow = document.createElement('div');
    emptyRow.className = 'empty-residents';
    emptyRow.innerHTML = `<span class="msg">이용 중인 입실자가 없습니다.</span>`;
    if(canEdit()){
      const addBtn = document.createElement('button');
      addBtn.className = 'btn small primary pill';
      addBtn.textContent = '+ 입실자 추가';
      addBtn.onclick = ()=> addResidentToRoom(room);
      emptyRow.appendChild(addBtn);
    }
    body.appendChild(emptyRow);
  } else {
    [...residents].sort((a,b)=> (a.slotIndex||0) - (b.slotIndex||0)).forEach((p, idx)=>{
      const isSecondary = (p.slotIndex!=null ? p.slotIndex : idx) > 0;
      if(UI.residentEditMode[p.id]) body.appendChild(renderResidentEditCard(p, isSecondary, false, room));
      else body.appendChild(renderResidentView(p, room, isSecondary));
    });
    if(draft){
      const isSecondary = (draft.slotIndex||0) > 0;
      body.appendChild(renderResidentEditCard(draft, isSecondary, true, room));
    }
  }

  card.appendChild(body);
  return card;
}

    const flagsLine = document.createElement('div');
    flagsLine.className = 'resident-flags';

      ${isOverdue(p) ? '<span class="badge overdue-badge">⚠ 연체</span>' : ''}
      ${isUpcoming(p) ? '<span class="badge res-status upcoming">입실예정</span>' : ''}
      ${p.scheduledToLeave ? '<span class="badge res-status leaving">퇴실예정</span>' : ''}
      ${p.pendingRoomMove ? `<span class="badge res-status moving">방이동예정 (${esc(p.pendingRoomMove.date)})</span>` : ''}
      ${p.channel !== '독립생활' ? `<span class="badge" style="background:#F1EFE8;color:${channelColor(p.channel)}">${esc(p.channel)}</span>` : ''}

  nm.className = 'nm';
  const displayName = (p.paymentProxy && p.actualResidentName) ? p.actualResidentName : p.name;
  nm.textContent = maskViewerName(displayName) || '(이름 미입력)';
  if(canEdit()){
    nm.classList.add('nm-clickable');
    nm.title = '클릭하여 입실자 정보 보기/수정';

    leaveBtn.onclick = ()=> showLeaveChoiceModal(p, room);

    const extendBtn = document.createElement('button');
    extendBtn.className = 'btn small';
    extendBtn.textContent = '연장';
    extendBtn.title = '단기연장 또는 한달연장을 선택합니다';
    extendBtn.onclick = ()=> showExtendChoiceModal(p, room, (newMoveOut)=>{
      p.moveOut = newMoveOut;
      p.scheduledToLeave = false;
      p.contractType = '연장';
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 퇴실예정일 연장: ${newMoveOut}`);
      scheduleSave(); render();
    });

    const moveBtn = document.createElement('button');
    moveBtn.className = 'btn small';
    moveBtn.textContent = '방이동';
    moveBtn.title = '같은 지점의 비어있는 방으로 이동 처리';
    moveBtn.onclick = ()=> showRoomMoveModal(p, room);

    acts.appendChild(leaveBtn); acts.appendChild(extendBtn); acts.appendChild(moveBtn);
  }
  nameLine.appendChild(nameWrap); nameLine.appendChild(acts);
  block.appendChild(nameLine);

  if(!isSecondary){
    const period = document.createElement('div');
    period.className = 'resident-period';
    period.textContent = `${p.moveIn || '-'} ~ ${p.moveOut || '미정'}`;
    block.appendChild(period);

    if(p.carNumber && p.carNumber.trim()){
      const carLine = document.createElement('div');
      carLine.className = 'resident-car';
      carLine.textContent = `차량 ${p.carNumber}`;
      block.appendChild(carLine);
    }

    if(p.memo){
      const memo = document.createElement('div');
      memo.className = 'resident-memo';
      memo.textContent = p.memo;
      memo.title = p.memo;
      memo.style.color = MEMO_COLORS[p.memoColor] || MEMO_COLORS.black;
      if(p.memoBold) memo.style.fontWeight = '700';
      block.appendChild(memo);
    }
  }
  return block;
}

  grid.innerHTML = `
    <div>
      <label class="field-label">판매 상태</label>
      <select data-f="saleStatus">${STATUS_LIST_MANUAL.map(s=>`<option ${s===room.saleStatus?'selected':''}>${s}</option>`).join('')}</select>
    </div>
  `;

  if(saleStatusSel) saleStatusSel.addEventListener('change', (e)=>{ logChange(`${room.number}호 판매상태 변경: ${room.saleStatus} → ${e.target.value}`); room.saleStatus = e.target.value; scheduleSave(); render(); });
  wrap.appendChild(grid);

  const chipRow = document.createElement('div');
  chipRow.style.marginBottom = '10px';
  chipRow.innerHTML = `<label class="field-label">퇴실청소 / 리터치 / 추가청소</label>`;
  const chips = document.createElement('div');
  chips.className = 'maint-chips';
  Object.keys(MAINT_KIND_META).forEach(kind=>{
    const field = MAINT_KIND_FIELD[kind];
    const chip = document.createElement('span');
    chip.className = 'flagchip ' + kind + (room[field] ? ' on' : '');

      room.maintenanceDate = dateInput.value; scheduleSave(); render();

    wrap.appendChild(dateWrap);

    const memoWrap = document.createElement('div');
    memoWrap.style.marginBottom = '10px';
    const memoInput = document.createElement('textarea');
    memoInput.rows = 2;
    memoInput.value = room.maintenanceMemo || '';
    memoInput.placeholder = '예: 변기 물 안 내려감, 방충망 파손 등';
    memoInput.addEventListener('input', ()=>{
      logChange(`${room.number}호 ${kindLabel} 메모 수정`);
      room.maintenanceMemo = memoInput.value; scheduleSave();
    });

  noteArea.placeholder = '예: 204호 정독립 이동 예정';
  noteArea.addEventListener('input', ()=>{ logChange(`${room.number}호 특이사항 메모 수정`); room.note = noteArea.value; scheduleSave(); });
  noteWrap.appendChild(noteArea);
  noteWrap.appendChild(renderMemoStyleControls(room, 'noteColor', 'noteBold'));

function wouldExceedParking(p, candidateMoveIn, candidateMoveOut){
  if(!p.carNumber || !p.carNumber.trim()) return null;
  const room = DB.rooms.find(r=>r.id===p.roomId);
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  if(!branch) return null;
  if(!isCurrentlyResiding({ moveIn: candidateMoveIn, moveOut: candidateMoveOut })) return null;
  const cap = branch.parkingCapacity || 0;
  const others = branchActiveCarCount(branch.id, p.id);
  const projected = others + 1;
  if(projected > cap) return { branch, cap, others, projected };
  return null;
}

function renderResidentEditCard(p, isSecondary, isDraft, room){
  const card = document.createElement('div');
  card.className = 'resident-edit-card';
  const maybeSave = ()=>{ if(!isDraft) scheduleSave(); };

  if(UI.residentFieldEdit[p.id] === undefined) UI.residentFieldEdit[p.id] = !p.firstSaveDone;
  const identityOpen = UI.residentFieldEdit[p.id];

  const top = document.createElement('div');
  top.className = 'redit-top';
  const titleWrap = document.createElement('div');
  titleWrap.style.cssText = 'display:flex; align-items:center; gap:6px;';
  const titleSpan = document.createElement('span');
  titleSpan.className = 'redit-title';
  titleSpan.textContent = isSecondary ? '2번째 입실자' : '입실자 정보';
  titleWrap.appendChild(titleSpan);
  const infoEditBtn = document.createElement('button');
  infoEditBtn.type = 'button';
  infoEditBtn.className = 'iconbtn' + (identityOpen ? ' active' : '');
  infoEditBtn.innerHTML = identityOpen ? '&#10003;' : '&#9998;';
  infoEditBtn.title = identityOpen ? '기본 정보 입력 완료' : '기본 정보 수정';
  infoEditBtn.onclick = ()=>{ UI.residentFieldEdit[p.id] = !identityOpen; render(); };
  titleWrap.appendChild(infoEditBtn);
  top.appendChild(titleWrap);
  const acts = document.createElement('div');
  acts.style.cssText = 'display:flex;gap:5px;';
  const doneBtn = document.createElement('button');
  doneBtn.className = 'iconbtn active'; doneBtn.innerHTML = '&#10003;'; doneBtn.title = '수정 완료';
  doneBtn.onclick = ()=>{
    const missing = residentMissingFields(p, isSecondary);
    if(missing.length){
      showAlert(`필수 항목이 비어 있습니다: ${missing.join(', ')}\n입력을 완료한 뒤 다시 시도해주세요.`);
      return;
    }
    const violation = wouldExceedParking(p, p.moveIn, p.moveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
      return;
    }
    p.firstSaveDone = true;
    if(isDraft){
      p.originalMoveIn = p.moveIn;
      DB.residents.push(p);
      delete UI.draftResident[p.roomId];
      delete UI.residentFieldEdit[p.id];
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 입실자 신규 등록`);
    } else {
      delete UI.residentSnapshots[p.id];
      delete UI.residentFieldEdit[p.id];
      UI.residentEditMode[p.id] = false;
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 입실자 정보 수정`);
    }
    scheduleSave(); render();
  };
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'iconbtn'; cancelBtn.innerHTML = '&#8634;'; cancelBtn.title = '취소';
  cancelBtn.onclick = ()=>{
    if(isDraft){
      // 아직 저장된 적 없는 초안이므로 그냥 버립니다 (DB에는 존재하지 않음)
      delete UI.draftResident[p.roomId];
      delete UI.residentFieldEdit[p.id];
      render();
      return;
    }
    const snap = UI.residentSnapshots[p.id];
    if(snap) Object.assign(p, snap);
    delete UI.residentSnapshots[p.id];
    delete UI.residentFieldEdit[p.id];
    UI.residentEditMode[p.id] = false;
    scheduleSave(); render();
  };
  const delBtn = document.createElement('button');
  delBtn.className = 'iconbtn del'; delBtn.innerHTML = '&times;'; delBtn.title = '입실자 삭제';
  delBtn.onclick = ()=>{
    if(isDraft){
      delete UI.draftResident[p.roomId];
      delete UI.residentFieldEdit[p.id];
      render();
      return;
    }
    showConfirm(`${p.name || '이 입실자'} 정보를 삭제할까요?`, ()=>{
      delete UI.residentSnapshots[p.id];
      delete UI.residentFieldEdit[p.id];
      DB.residents = DB.residents.filter(x=>x.id!==p.id); scheduleSave(); render();
    });
  };
  acts.appendChild(cancelBtn); acts.appendChild(doneBtn); acts.appendChild(delBtn);
  top.appendChild(acts);
  card.appendChild(top);

  const identityGrid = document.createElement('div');
  identityGrid.className = 'redit-grid2';

  function identityCell(label, required, valueText, buildInput){
    const content = identityOpen ? buildInput() : el('div', 'redit-readonly-text' + (valueText ? '' : ' empty'), valueText || '미입력');
    identityGrid.appendChild((required ? labeledReq : labeled)(label, content));
  }

  identityCell('이름', true, p.name, ()=>{
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = '홍길동'; nameInput.value = p.name;
    if(!p.name || !p.name.trim()) nameInput.classList.add('invalid');
    nameInput.addEventListener('input', ()=>{ p.name = nameInput.value; maybeSave(); nameInput.classList.toggle('invalid', !nameInput.value.trim()); });
    if(!p.name) setTimeout(()=> nameInput.focus(), 0);
    return nameInput;
  });

  identityCell('연락처', true, p.phone, ()=>{
    const phoneInput = document.createElement('input');
    phoneInput.type = 'tel'; phoneInput.placeholder = '010-0000-0000'; phoneInput.value = p.phone;
    if(!p.phone || !p.phone.trim()) phoneInput.classList.add('invalid');
    phoneInput.addEventListener('input', ()=>{ p.phone = phoneInput.value; maybeSave(); phoneInput.classList.toggle('invalid', !phoneInput.value.trim()); });
    return phoneInput;
  });

  const proxyRow = document.createElement('div');
  proxyRow.className = 'redit-proxy-row';
  const proxyCheckbox = document.createElement('input');
  proxyCheckbox.type = 'checkbox';
  proxyCheckbox.id = 'proxy-' + p.id;
  proxyCheckbox.checked = !!p.paymentProxy;
  proxyCheckbox.addEventListener('change', ()=>{
    p.paymentProxy = proxyCheckbox.checked;
    if(proxyCheckbox.checked) UI.residentFieldEdit[p.id] = true;
    maybeSave(); render();
  });
  const proxyLabel = document.createElement('label');
  proxyLabel.htmlFor = proxyCheckbox.id;
  proxyLabel.textContent = '대리결제';
  proxyRow.appendChild(proxyCheckbox); proxyRow.appendChild(proxyLabel);
  identityGrid.appendChild(proxyRow);

  if(p.paymentProxy){
    identityCell('실입실자 이름', false, p.actualResidentName, ()=>{
      const input = document.createElement('input');
      input.type = 'text'; input.placeholder = '홍길동'; input.value = p.actualResidentName || '';
      input.addEventListener('input', ()=>{ p.actualResidentName = input.value; maybeSave(); });
      return input;
    });
    identityCell('실입실자 연락처', false, p.actualResidentPhone, ()=>{
      const input = document.createElement('input');
      input.type = 'tel'; input.placeholder = '010-0000-0000'; input.value = p.actualResidentPhone || '';
      input.addEventListener('input', ()=>{ p.actualResidentPhone = input.value; maybeSave(); });
      return input;
    });
  }

  if(isSecondary){
    card.appendChild(identityGrid);
    return card;
  }

  identityCell('유입채널', false, p.channel, ()=>{
    const chSel = document.createElement('select');
    DB.channelList.forEach(c=>{ const o=document.createElement('option'); o.textContent=c; o.selected=c===p.channel; chSel.appendChild(o); });
    chSel.addEventListener('change', ()=>{ p.channel = chSel.value; maybeSave(); render(); });
    return chSel;
  });

  const branchForCar = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  const parkingAvailable = !branchForCar || (branchForCar.parkingCapacity||0) > 0;
  if(parkingAvailable){
    identityCell('차량 번호 (선택)', false, p.carNumber, ()=>{
      const carInput = document.createElement('input');
      carInput.type = 'text'; carInput.placeholder = '12가3456'; carInput.value = p.carNumber || '';
      carInput.addEventListener('change', ()=>{
        const newVal = carInput.value.trim();
        const branch = branchForCar;
        if(newVal && branch && isCurrentlyResiding(p)){
          const cap = branch.parkingCapacity || 0;
          const others = branchActiveCarCount(branch.id, p.id);
          const projected = others + 1;
          if(projected > cap){
            showAlert(`"${branch.name}" 지점의 주차 가능 대수(${cap}대)를 초과합니다.\n(현재 이용중 ${others}대 + 이 입실자 1대 = ${projected}대)\n\n차량번호를 비우거나, 지점 정보에서 주차 가능 대수를 먼저 늘려주세요.`);
            carInput.value = p.carNumber || '';
            return;
          }
        }
        p.carNumber = carInput.value;
        maybeSave();
      });
      return carInput;
    });
  }

  card.appendChild(identityGrid);

  const inDateRow = document.createElement('div');
  inDateRow.className = 'redit-inline-row';
  const inDate = document.createElement('input'); inDate.type='date'; inDate.value = p.moveIn || '';
  if(!p.moveIn) inDate.classList.add('invalid');

    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n입실일을 다시 확인하거나 차량번호를 비운 뒤 저장해주세요.`);
      inDate.value = p.moveIn || '';
      return;

  inDateRow.appendChild(labeledReq('입실일', inDate));
  if(p.firstSaveDone){

  const outDate = document.createElement('input'); outDate.type='date'; outDate.value = p.moveOut || '';
  if(!p.moveOut) outDate.classList.add('invalid');
  outDate.addEventListener('change', ()=>{
    const violation = wouldExceedParking(p, p.moveIn, outDate.value);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n퇴실예정일을 다시 확인하거나 차량번호를 비운 뒤 저장해주세요.`);
      outDate.value = p.moveOut || '';
      return;
    }
    p.moveOut = outDate.value; maybeSave(); render();
  });

  const outDateRow = document.createElement('div');
  outDateRow.className = 'redit-inline-row';
  outDateRow.appendChild(labeledReq('퇴실(예정)일', outDate));
  if(p.firstSaveDone){
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;gap:6px;align-items:flex-end;padding-bottom:1px;';
    const scheduledBtn = document.createElement('button');

    scheduledBtn.onclick = ()=>{ p.scheduledToLeave = !p.scheduledToLeave; maybeSave(); render(); };
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'btn small danger';
    leaveBtn.textContent = '퇴실';

    leaveBtn.onclick = ()=>{

      showConfirm(`${p.name || '이 입실자'}를 오늘(${today}) 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{

  card.appendChild(outDateRow);

  const memo = document.createElement('textarea');

const TIMELINE_BAR_STATUSES = [
  { key:'정상',     fg:'var(--st-occupied)', bg:'var(--st-occupied-bg)' },
  { key:'연체',     fg:'var(--st-hold)',     bg:'var(--st-hold-bg)' },
  { key:'퇴실예정', fg:'var(--st-leaving)',  bg:'var(--st-leaving-bg)' },
  { key:'이용중판매', fg:'var(--st-presell)', bg:'var(--st-presell-bg)' }
];
function residentTimelineMeta(p, room){
  if(isOverdue(p)) return TIMELINE_BAR_STATUSES[1];
  if(p.scheduledToLeave) return TIMELINE_BAR_STATUSES[2];
  if(room){
    const s = effectiveRoomStatus(room);
    if(s==='이용중판매' || s==='단기판매') return TIMELINE_BAR_STATUSES[3];
  }
  return TIMELINE_BAR_STATUSES[0];
}
function buildBar(p, room, monthStart, daysInMonth){
  const monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth(), daysInMonth);
  const inD = new Date(p.moveIn);
  const outD = p.moveOut ? new Date(p.moveOut) : new Date(monthStart.getFullYear(), monthStart.getMonth()+2, 0);
  if(outD < monthStart || inD > monthEnd) return null;
  const clampIn = inD < monthStart ? monthStart : inD;
  const clampOut = outD > monthEnd ? monthEnd : outD;
  const startDay = clampIn.getDate();
  const endDay = clampOut.getDate();
  const leftPct = ((startDay-1)/daysInMonth)*100;
  const widthPct = Math.max(((endDay-startDay+1)/daysInMonth)*100, (1/daysInMonth)*100);
  const bar = document.createElement('div');
  bar.className = 'tl-bar';
  bar.style.left = leftPct + '%';
  bar.style.width = widthPct + '%';
  const meta = residentTimelineMeta(p, room);
  bar.style.background = meta.fg;
  const nameText = esc(maskViewerName(p.name) || p.resStatus);
  const memoText = p.memo ? ` <span class="tl-bar-memo">${esc(p.memo)}</span>` : '';
  bar.innerHTML = `<span class="tl-bar-name">${nameText}</span>${memoText}`;
  bar.title = `${maskViewerName(p.name) || '이름 미입력'} · ${meta.key} · ${p.channel} · ${p.moveIn} ~ ${p.moveOut || '미정'}${p.memo ? ' · ' + p.memo : ''} (클릭 시 호실로 이동)`;
  bar.style.cursor = 'pointer';
  bar.onclick = ()=> scrollToRoomCard(room);
  return bar;
}

function normalizeFlexDate(s){
  const c = String(s||'').trim().replace(/[./]/g,'-');
  const m = c.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  let [, y, mo, d] = m;
  if(y.length===2) y = '20'+y;
  return `${y.padStart(4,'0')}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function parseContractPeriodRange(periodStr){
  const raw = String(periodStr||'').trim();
  if(!raw) return null;
  const parts = raw.split(/[~–—]|\s+to\s+/i).map(s=>s.trim()).filter(Boolean);
  if(parts.length < 2) return null;
  const start = normalizeFlexDate(parts[0]);
  const end = normalizeFlexDate(parts[1]);
  if(!start || !end) return null;
  return { start, end };
}
function roomContractSegments(room){
  const segments = [];
  DB.contracts.filter(c=>c.roomId===room.id).forEach(c=>{
    const range = parseContractPeriodRange(c.contractPeriod);
    if(!range) return;
    segments.push({ start: range.start, end: range.end, contract: c });
  });
  // "가장 최근 계약"은 계약기간의 시작일이 아니라 계약일(계약 등록/연장 시점) 기준으로 판단한다.
  // (예: 같은 계약을 여러 번 나눠 결제/연장 등록하면서 계약기간이 하루짜리로 찍히는 등
  //  기간 자체는 뒤죽박죽일 수 있어도, 계약일은 항상 실제 최신 순서를 반영하기 때문)
  segments.sort((a,b)=> (a.contract.contractDate||'').localeCompare(b.contract.contractDate||'') || a.start.localeCompare(b.start));
  return segments;
}
function contractEndDateMismatch(room){
  const segments = roomContractSegments(room);
  if(segments.length === 0) return false;
  const latestSeg = segments[segments.length - 1];
  const residents = DB.residents.filter(p=>p.roomId===room.id);
  if(residents.length === 0) return false;
  return !residents.some(p=> p.moveOut === latestSeg.end);
}
function buildContractBar(seg, isLatest, rowMeta, room, monthStart, daysInMonth){
  const monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth(), daysInMonth);
  const inD = new Date(seg.start);
  const outD = new Date(seg.end);
  if(outD < monthStart || inD > monthEnd) return null;
  const clampIn = inD < monthStart ? monthStart : inD;
  const clampOut = outD > monthEnd ? monthEnd : outD;
  const startDay = clampIn.getDate();
  const endDay = clampOut.getDate();
  const leftPct = ((startDay-1)/daysInMonth)*100;
  const widthPct = Math.max(((endDay-startDay+1)/daysInMonth)*100, (1/daysInMonth)*100);
  const bar = document.createElement('div');
  bar.className = 'tl-bar';
  bar.style.left = leftPct + '%';
  bar.style.width = widthPct + '%';
  const meta = isLatest ? rowMeta : { fg:'var(--st-vacant)', bg:'var(--st-vacant-bg)' };
  bar.style.background = meta.fg;
  const c = seg.contract;
  const displayName = maskViewerName(c.contractor || c.resident) || '계약자 미입력';
  bar.innerHTML = `<span class="tl-bar-name">${esc(displayName)}</span>`;
  bar.title = `${displayName} · ${isLatest ? '이용중' : '퇴실'} · ${seg.start} ~ ${seg.end} (클릭 시 호실로 이동)`;
  bar.style.cursor = 'pointer';
  bar.onclick = ()=> scrollToRoomCard(room);
  return bar;
}

  '고대 안암역': '고대 안암',
  '잠실 석촌고분역': '잠실'
};
function cleanKeyLoose(s){ return String(s||'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim(); }
function normalizeRoomNo(s){ const c = cleanKeyLoose(s).toLowerCase(); return /^\d+$/.test(c) ? String(parseInt(c,10)) : c; }
function roomNumberPrefix(s){ const m = cleanKeyLoose(s).match(/^\d+/); return m ? String(parseInt(m[0],10)) : null; }

function handleResidentResyncFile(file){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

      const result = { matched:0, vacant:0, branchesCreated:0, roomsCreated:0, overCapacity:[] };
      const newResidents = [];
      const newBranches = [];
      const newRooms = [];
      const slotCounters = {};

      function findOrCreateBranch(branchRaw){
        const resolvedName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
        let branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedName.toLowerCase())
          || newBranches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedName.toLowerCase());
        if(!branch){
          branch = { id: uid('b'), name: resolvedName, address:'', parkingNote:'', parkingCapacity:0, memo:'' };
          newBranches.push(branch);
          result.branchesCreated++;
        }
        return branch;
      }

      function findOrCreateRoom(branch, roomRaw, row){
        let room = DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw))
          || newRooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw));
        if(!room){
          const type = cleanKeyLoose(row['타입']) || '기타';
          const occRaw = cleanKeyLoose(String(row['인실구분']||''));
          const occupancy = (occRaw==='2' || occRaw==='2인실') ? '2인실' : '1인실';
          const price = Number(row['정상입실료(원)']) || Number(row['정상입실료']) || 0;
          room = { id: uid('r'), branchId: branch.id, number: roomRaw, type, occupancy, saleStatus:'공실',
            needsCleaning:false, needsRetouch:false, needsExtraCleaning:false, note:'', price };
          newRooms.push(room);
          result.roomsCreated++;
        }
        return room;
      }

      rows.forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(row['지점명']);
        const roomRaw = cleanKeyLoose(String(row['호실번호']||'')).replace(/호$/,'');
        if(!branchRaw && !roomRaw) return; // 빈 여백 행

        const branch = findOrCreateBranch(branchRaw);
        const room = findOrCreateRoom(branch, roomRaw, row);

        const nameRaw = cleanKeyLoose(row['이름']);
        if(!nameRaw || nameRaw==='-' || nameRaw==='*'){ result.vacant++; return; }

        if(slotCounters[room.id] == null){
          slotCounters[room.id] = DB.residents.filter(p=>p.roomId===room.id).length;
        }
        const cap = occupancyCapacity(room);
        const slot = slotCounters[room.id];
        if(slot >= cap){
          result.overCapacity.push(`[${idx+2}행] ${branch.name} ${room.number}호 "${nameRaw}" (정원 ${cap}명 초과로 제외)`);
          return;
        }
        slotCounters[room.id] = slot + 1;

        let phone = String(row['연락처']||'').trim();
        if(phone.startsWith('=')) phone = phone.slice(1);
        const moveIn = toISODateStr(row['입실일']);
        const moveOut = toISODateStr(row['퇴실예정일']);
        const p = {
          id: uid('p'), roomId: room.id, name: nameRaw,
          channel: '독립생활', resStatus:'', contractType:'신규',
          moveIn, moveOut, originalMoveIn: moveIn, scheduledToLeave:false,
          phone, memo:'', carNumber:'', firstSaveDone:true, slotIndex: slot
        };
        p.resStatus = computeResStatus(p);
        newResidents.push(p);
        result.matched++;
      });

      const problems = [...result.overCapacity];
      showConfirm(
        `엑셀 분석 결과\n`+
        `- 새로 생성될 지점: ${result.branchesCreated}개\n`+
        `- 새로 생성될 호실: ${result.roomsCreated}개\n`+
        `- 추가로 등록될 입실자: ${result.matched}명\n`+
        `- 건너뜀(이름 "-"/"*"): ${result.vacant}건\n`+
        `- 정원 초과 제외: ${result.overCapacity.length}건\n\n`+
        `위 내용을 현재 데이터에 추가할까요? (기존 입실자는 그대로 유지됩니다)`,
        ()=>{
          DB.branches.push(...newBranches);
          DB.rooms.push(...newRooms);
          DB.residents.push(...newResidents);
          logChange(`엑셀 일괄 업로드: 지점 ${result.branchesCreated}개·호실 ${result.roomsCreated}개 생성, 입실자 ${result.matched}명 추가`);
          scheduleSave();
          render();
          if(problems.length){
            showAlert(`업로드 완료 (${result.matched}명 추가). 다만 아래 ${problems.length}건은 반영되지 않았습니다:\n\n` +
              problems.slice(0,30).join('\n') + (problems.length>30 ? `\n...외 ${problems.length-30}건` : ''));
          } else {
            showAlert(`업로드가 완료되었습니다. (${result.matched}명 추가)`);
          }
        }
      );
    }catch(err){
      console.error(err);
      showAlert('엑셀 처리 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function dedupeContracts(){
  const seen = new Set();
  const deduped = [];
  let removed = 0;
  DB.contracts.forEach(c=>{
    const sig = contractSignature(c);
    if(seen.has(sig)){ removed++; return; }
    seen.add(sig);
    deduped.push(c);
  });
  if(removed===0){
    showAlert('중복된 계약 이력이 없습니다.');
    return;
  }
  showConfirm(`완전히 동일한 중복 계약 이력 ${removed}건을 찾았습니다. 각 그룹에서 1건만 남기고 삭제할까요?`, ()=>{
    DB.contracts = deduped;
    logChange(`중복 계약 이력 정리: ${removed}건 삭제`);
    scheduleSave(); render();
    showAlert(`중복 계약 이력 ${removed}건을 삭제했습니다.`);
  });
}

    showAlert('헤더 행과 데이터 행이 포함된 표를 붙여넣어주세요.');
    return;
  }
  const headerCells = lines[0].split('\t');
  const dataRows = lines.slice(1).map(l=> l.split('\t'));
  importContractGrid(headerCells, dataRows, onImported);
}

    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
    }catch(err){
      showAlert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      return;
    }
    if(!grid || grid.length < 2){
      showAlert('헤더 행과 데이터 행이 포함된 엑셀 파일을 업로드해주세요.');
      return;
    }
    const headerCells = grid[0].map(v=> v==null ? '' : String(v));
    const dataRows = grid.slice(1).map(row=> row.map(v=> v==null ? '' : v));
    importContractGrid(headerCells, dataRows, onImported);
  };
  reader.readAsArrayBuffer(file);
}

function contractSignature(c){
  return [
    c.roomId, c.contractDate, c.contractPeriod, c.contractor, c.resident, c.rent, c.paymentAmount,
    c.contractStatus, c.contractType, c.contractCategory, c.paymentCategory, c.deposit, c.depositNote, c.contractContent
  ].join('|');
}
function importContractGrid(headerCells, dataRows, onImported){
  const idx = {};
  headerCells.forEach((h, i)=>{
    const key = CONTRACT_FIELD_BY_HEADER[cleanKeyLoose(h).replace(/\s+/g,'')];
    if(key) idx[key] = i;
  });
  if(idx.branchName==null || idx.roomName==null){
    showAlert('헤더 행에서 "고시원 명"과 "방이름" 열을 찾을 수 없습니다. 첫 줄이 헤더인지 확인해주세요.');
    return;
  }

  const existingSigs = new Set(DB.contracts.map(contractSignature));

  const newContracts = [];
  const unmatched = [];
  let duplicateCount = 0;
  dataRows.forEach((cells, i)=>{
    const get = (key)=> idx[key]!=null ? String(cells[idx[key]]==null ? '' : cells[idx[key]]).trim() : '';
    const branchRaw = cleanKeyLoose(get('branchName'));
    const roomRaw = cleanKeyLoose(get('roomName')).replace(/호$/,'');
    if(!branchRaw && !roomRaw) return;

    const resolvedBranchName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
    let branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedBranchName.toLowerCase());
    let roomSearchName = roomRaw;
    if(!branch){
      // 고시원 명은 동 구분 없이 공통으로 쓰고, 방이름 앞에 "A동"처럼 건물 구분이 붙어 있는 경우
      // (예: "A동 309호 블레스+룸 / 원룸 / 외창") 지점명에 동을 붙인 이름("...A동")으로 다시 찾는다.
      const buildingMatch = roomRaw.match(/^([A-Za-z0-9가-힣]{1,4}동)\s+(.*)$/);
      if(buildingMatch){
        const withBuilding = cleanKeyLoose(`${resolvedBranchName} ${buildingMatch[1]}`);
        const branchWithBuilding = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===withBuilding.toLowerCase());
        if(branchWithBuilding){
          branch = branchWithBuilding;
          roomSearchName = buildingMatch[2];
        }
      }
    }
    let room = branch ? DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomSearchName)) : null;
    if(!room && branch){
      // 방이름에 호실번호 외의 상세 명칭이 붙어 있어도(예: "304 그레이스"), 지점명과 호실번호 앞자리 숫자만 일치하면 매칭
      const prefix = roomNumberPrefix(roomSearchName);
      if(prefix) room = DB.rooms.find(r=> r.branchId===branch.id && roomNumberPrefix(r.number)===prefix);
    }
    if(!room){
      unmatched.push(`[${i+2}행] ${branchRaw} ${roomRaw}호 (${!branch ? '지점' : '호실'} 못 찾음)`);
      return;
    }

    const candidate = {
      id: uid('ct'), roomId: room.id,
      contractDate: get('contractDate'), contractPeriod: get('contractPeriod'), district: get('district'),
      branchName: branchRaw, roomName: roomRaw, contractor: get('contractor'), resident: get('resident'),
      rent: get('rent'), paymentAmount: get('paymentAmount'), contractStatus: get('contractStatus'),
      contractType: get('contractType'), contractCategory: get('contractCategory'), paymentCategory: get('paymentCategory'),
      deposit: get('deposit'), depositNote: get('depositNote'), contractContent: get('contractContent')
    };
    const sig = contractSignature(candidate);
    if(existingSigs.has(sig)){ duplicateCount++; return; }
    existingSigs.add(sig);
    newContracts.push(candidate);
  });

  if(newContracts.length===0){
    showAlert(`가져올 수 있는 계약 데이터가 없습니다.`
      + (duplicateCount ? `\n(이미 등록된 중복 데이터 ${duplicateCount}건 제외)` : '')
      + (unmatched.length ? `\n\n${unmatched.slice(0,20).join('\n')}` : ''));
    return;
  }

  showConfirm(
    `계약 데이터 ${newContracts.length}건을 가져올까요?`
      + (duplicateCount ? `\n(이미 등록된 중복 ${duplicateCount}건은 제외됩니다)` : '')
      + (unmatched.length ? `\n(호실을 찾지 못한 ${unmatched.length}건은 제외됩니다)` : ''),
    ()=>{
      DB.contracts.push(...newContracts);
      logChange(`계약 데이터 가져오기: ${newContracts.length}건 추가${duplicateCount ? ` (중복 ${duplicateCount}건 제외)` : ''}${unmatched.length ? ` (미매칭 ${unmatched.length}건)` : ''}`);
      scheduleSave(); render();
      if(typeof onImported === 'function') onImported();
      showAlert(`${newContracts.length}건을 가져왔습니다.`
        + (duplicateCount ? `\n이미 등록되어 제외된 중복 데이터: ${duplicateCount}건` : '')
        + (unmatched.length ? `\n\n호실을 찾지 못한 항목:\n${unmatched.slice(0,20).join('\n')}${unmatched.length>20 ? `\n...외 ${unmatched.length-20}건` : ''}` : ''));
    }
  );
}

function toISODateStr(v){
  if(v == null || v==='') return '';
  if(v instanceof Date){
    // 엑셀/구글시트 날짜 직렬값에 부동소수점 오차가 섞여 있어(예: 자정이 아닌 23:59:xx)
    // 하루 전날로 잘못 계산되는 경우가 있어, 가장 가까운 날짜로 반올림해 보정합니다.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth()+1).padStart(2,'0'), d = String(rounded.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'number'){
    // 엑셀 날짜 직렬번호(문자열이 아닌 순수 숫자로 남은 경우) 보정
    const parsed = XLSX.SSF && XLSX.SSF.parse_date_code ? XLSX.SSF.parse_date_code(Math.round(v)) : null;
    if(parsed){
      const y = parsed.y, m = String(parsed.m).padStart(2,'0'), d = String(parsed.d).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
  }
  return String(v).trim();
}
