function parseAndImportContracts(text, onImported){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=> l.trim()!=='');
  if(lines.length < 2){
    showAlert('헤더 행과 데이터 행이 포함된 표를 붙여넣어주세요.');
    return;
  }
  const headerCells = lines[0].split('\t');
  // 계약 관리 화면의 "▸ 추가결제 N건"처럼 한 셀 안에 줄바꿈이 들어있는 항목을 그대로
  // 복사하면, 그 셀 내부 줄바꿈이 실제 행 구분자(\n)와 구분되지 않아 계약 한 건이
  // 여러 줄로 쪼개져 붙여넣기되고, 그 결과 열이 하나씩 밀려 계약일/계약기간 등이
  // 엉뚱한 값으로 들어가거나 지점/호실 매칭에 실패한다(도어락 붙여넣기 파서가 이미
  // 겪었던 것과 같은 종류의 문제). 계약일(YY.MM.DD)로 시작하는 줄만 "새 계약 행의
  // 시작"으로 보고, 그렇지 않은 줄은 모두 바로 위 행에 줄바꿈으로 이어붙여 원래
  // 한 셀 안의 값으로 복원한다 — 도어락 파서의 시리얼 넘버 앵커 방식과 같은 원리.
  const ROW_START = /^\d{2}\.\d{2}\.\d{2}(\t|$)/;
  const dataLines = [];
  for(let i=1;i<lines.length;i++){
    const line = lines[i];
    if(dataLines.length===0 || ROW_START.test(line)){
      dataLines.push(line);
    } else {
      dataLines[dataLines.length-1] += '\n' + line;
    }
  }
  const dataRows = dataLines.map(l=> l.split('\t'));
  importContractGrid(headerCells, dataRows, onImported);
}

function handleContractExcelFile(file, onImported){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let grid;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
    }catch(err){
      showAlert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      return;
    }
    if(!grid || grid.length < 2){
      showAlert('헤더 행과 데이터 행이 포함된 엑셀 파일을 업로드해주세요.');
      return;
    }
    const headerCells = grid[0].map(v=> v==null ? '' : String(v));
    const dataRows = grid.slice(1).map(row=> row.map(v=> v==null ? '' : v));
    importContractGrid(headerCells, dataRows, onImported);
  };
  reader.readAsArrayBuffer(file);
}

function normalizeAmountStr(s){
  const digits = String(s||'').replace(/[^0-9]/g,'');
  return digits ? String(parseInt(digits,10)) : '';
}
function contractSignature(c){
  // 계약현황 팝업에 실제로 노출되는 항목(계약일/계약기간/계약자/입실료/결제금액/계약구분)만으로
  // 중복 여부를 판단한다. 나머지 항목(입실자/계약상태/보증금 등)까지 모두 같아야 한다고 보면
  // 스프레드시트 원본의 사소한 차이 때문에 눈에 보이는 완전 중복도 못 잡는 경우가 있었다.
  // 날짜는 "2026-01-15"와 "26.01.15"처럼 표기 형식만 다를 뿐 같은 날짜인 경우가 있어서,
  // 문자열을 그대로 비교하지 않고 정규화한 값으로 비교해야 진짜 중복을 놓치지 않는다.
  // 입실료/결제금액도 원본 스프레드시트의 천단위 콤마·통화기호 유무가 붙여넣을 때마다 달라질 수
  // 있고(예: "450000" vs "450,000"), 계약자명 등 텍스트 항목에는 복사 과정에서 눈에 안 보이는
  // 폭 없는 공백(zero-width space)이 섞여 들어오는 경우가 있어, 그대로 비교하면 완전히 같은
  // 계약을 다른 계약으로 오인해 재붙여넣기할 때마다 중복 등록되는 문제가 있었다.
  const normDate = normalizeFlexDate(c.contractDate) || (c.contractDate || '').trim();
  const range = parseContractPeriodRange(c.contractPeriod);
  const normPeriod = range ? `${range.start}~${range.end}` : (c.contractPeriod || '').trim();
  const normContractor = cleanKeyLoose(c.contractor);
  const normCategory = cleanKeyLoose(c.contractCategory);
  const normRent = normalizeAmountStr(c.rent);
  const normPayment = normalizeAmountStr(c.paymentAmount);
  return [c.roomId, normDate, normPeriod, normContractor, normRent, normPayment, normCategory].join('|');
}
function importContractGrid(headerCells, dataRows, onImported){
  const idx = {};
  headerCells.forEach((h, i)=>{
    const key = CONTRACT_FIELD_BY_HEADER[cleanKeyLoose(h).replace(/\s+/g,'')];
    if(key) idx[key] = i;
  });
  if(idx.branchName==null || idx.roomName==null){
    showAlert('헤더 행에서 "고시원 명"과 "방이름" 열을 찾을 수 없습니다. 첫 줄이 헤더인지 확인해주세요.');
    return;
  }

  const existingSigs = new Set(DB.contracts.map(contractSignature));

  const newContracts = [];
  const unmatched = [];
  let duplicateCount = 0;
  dataRows.forEach((cells, i)=>{
    // "계약내용"처럼 버튼/아이콘만 있고 텍스트가 없는 첫 열은, 표에서 복사할 때 해당 칸의
    // 탭 문자까지 함께 누락되는 경우가 있다. 그러면 데이터 행의 칸 수가 헤더보다 모자라면서
    // 뒤 열들이 통째로 한 칸씩 앞으로 밀려 엉뚱한 값이 매칭된다. 모자란 칸 수만큼 뒤에서부터
    // 맞춰(오른쪽 정렬) 실제 값이 원래 있어야 할 헤더 열에 들어가도록 보정한다.
    const shortBy = Math.max(0, headerCells.length - cells.length);
    const get = (key)=>{
      if(idx[key]==null) return '';
      const pos = idx[key] - shortBy;
      return pos>=0 && cells[pos]!=null ? String(cells[pos]).trim() : '';
    };
    const branchRaw = cleanKeyLoose(get('branchName'));
    const roomRaw = cleanKeyLoose(get('roomName')).replace(/호$/,'');
    if(!branchRaw && !roomRaw) return;

    const resolvedBranchName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
    let branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedBranchName.toLowerCase());
    let roomSearchName = roomRaw;
    if(!branch){
      // 고시원 명은 동 구분 없이 공통으로 쓰고, 방이름 앞에 "A동"처럼 건물 구분이 붙어 있는 경우
      // (예: "A동 309호 블레스+룸 / 원룸 / 외창") 지점명에 동을 붙인 이름("...A동")으로 다시 찾는다.
      const buildingMatch = roomRaw.match(/^([A-Za-z0-9가-힣]{1,4}동)\s+(.*)$/);
      if(buildingMatch){
        const withBuilding = cleanKeyLoose(`${resolvedBranchName} ${buildingMatch[1]}`);
        const branchWithBuilding = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===withBuilding.toLowerCase());
        if(branchWithBuilding){
          branch = branchWithBuilding;
          roomSearchName = buildingMatch[2];
        }
      }
    }
    let room = branch ? DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomSearchName)) : null;
    if(!room && branch){
      // 방이름에 호실번호 외의 상세 명칭이 붙어 있어도(예: "304 그레이스"), 지점명과 호실번호 앞자리 숫자만 일치하면 매칭
      const prefix = roomNumberPrefix(roomSearchName);
      if(prefix) room = DB.rooms.find(r=> r.branchId===branch.id && roomNumberPrefix(r.number)===prefix);
    }
    if(!room){
      unmatched.push(`[${i+2}행] ${branchRaw} ${roomRaw}호 (${!branch ? '지점' : '호실'} 못 찾음)`);
      return;
    }

    const candidate = {
      id: uid('ct'), roomId: room.id,
      contractDate: get('contractDate'), contractPeriod: get('contractPeriod'), district: get('district'),
      branchName: branchRaw, roomName: roomRaw, contractor: get('contractor'), contractorPhone: get('contractorPhone'), resident: get('resident'),
      rent: get('rent'), paymentAmount: get('paymentAmount'), contractStatus: get('contractStatus'),
      contractType: get('contractType'), contractCategory: get('contractCategory'), paymentCategory: get('paymentCategory'),
      deposit: get('deposit'), depositNote: get('depositNote'), contractContent: get('contractContent'),
      // 계약취소/변경으로 같은 계약일에 계약기간만 바뀐 "환불" 계약이 나중에 붙여넣기로 또
      // 들어오면, 어느 쪽이 더 나중에 등록된 것인지 계약일만으로는 구분이 안 된다(계약일이
      // 서로 같으므로) — findSupersedingRefundContract에서 이 실제 등록 시각으로 비교한다.
      importedAt: new Date().toISOString()
    };
    const sig = contractSignature(candidate);
    if(existingSigs.has(sig)){ duplicateCount++; return; }
    existingSigs.add(sig);
    newContracts.push(candidate);
  });

  if(newContracts.length===0){
    showAlert(`가져올 수 있는 계약 데이터가 없습니다.`
      + (duplicateCount ? `\n(이미 등록된 중복 데이터 ${duplicateCount}건 제외)` : '')
      + (unmatched.length ? `\n\n${unmatched.slice(0,20).join('\n')}` : ''));
    return;
  }

  // 결제구분에 "환불"이 포함된 행은 계약(취소/변경) 자체는 그대로 이력에 남기되, 아래의 "빈
  // 방이면 새 입실자 등록" 로직에서는 완전히 제외한다 — 환불 행을 최신 계약으로 잡아 새 입실자를
  // 만들어버리면 안 되기 때문이다. 별도로 refundRows에서만 다룬다.
  const isRefundRow = c=> /환불/.test(c.paymentCategory || '');
  // 호실별로 계약일이 가장 최신인 건 하나만 골라, 빈 방이면 그 계약 정보로 입실자를 새로 등록한다.
  // (한 번에 여러 건의 계약 이력이 붙여넣기 될 수 있으므로, 입실자 등록은 호실당 최신 계약 1건에만 적용)
  // 이미 입실자가 있는 방은 정보를 건드리지 않는다 — 계약 이력만 저장하고, 담당자가 확인할 수 있도록
  // "계약 확인 필요" 표시만 남긴다(최신 계약의 종료일과 퇴실예정일이 다르면 "계약현황" 버튼의
  // 기존 하이라이트도 함께 뜬다). 신규 등록이든 기존 입실자든 지점별로 한 곳에서 모아 볼 수 있다.
  const latestByRoom = new Map();
  newContracts.filter(c=> !isRefundRow(c)).forEach(c=>{
    const prev = latestByRoom.get(c.roomId);
    if(!prev || (c.contractDate||'') >= (prev.contractDate||'')) latestByRoom.set(c.roomId, c);
  });
  const residentSyncActions = [];
  const existingResidentsToFlag = [];
  let residentSkipCount = 0;
  latestByRoom.forEach(c=>{
    const room = DB.rooms.find(r=>r.id===c.roomId);
    if(!room) return;
    const roomResidents = DB.residents.filter(p=>p.roomId===room.id);
    if(roomResidents.length > 0){
      // 기존 입실자가 있으면 정보를 자동으로 덮어쓰지 않고 "계약 확인 필요"로만 표시한다.
      // 담당자가 카드를 열면 해당 호실의 최신 계약(DB.contracts)에서 이름/연락처/입실일/퇴실일을
      // 그때그때 다시 계산해 기존 값과 비교해서 보여주므로, 여기서 따로 값을 저장해둘 필요는 없다.
      existingResidentsToFlag.push(...roomResidents);
      return;
    }
    const range = parseContractPeriodRange(c.contractPeriod);
    const residentName = c.resident || c.contractor;
    if(!range || !residentName){ residentSkipCount++; return; }
    const newResident = {
      id: uid('p'), roomId: room.id, name: residentName, phone: c.contractorPhone || '',
      channel: '독립생활', resStatus:'', contractType: c.contractCategory || '신규',
      moveIn: range.start, moveOut: range.end, originalMoveIn: range.start, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex:0, justImported:true, sourceContractId: c.id
    };
    newResident.resStatus = computeResStatus(newResident);
    residentSyncActions.push({ room, newResident });
  });

  // 환불 행: 그 방에 재실 중이면서 이름이 일치하는 입실자가 있고, 과거(이번에 함께 붙여넣는
  // 행 포함) 같은 방·계약자로 실제 결제금액이 찍힌 계약이 있으면 "환불 처리 필요"로 표시한다.
  // 여기서는 표시만 하고, 실제 퇴실 처리는 담당자가 화면에서 버튼을 눌러 직접 확정해야 한다 —
  // 방/이름이 잘못 매칭되는 경우 실거주자를 실수로 퇴실 처리해버리면 되돌리기 어렵기 때문이다.
  const allContractsForPaymentCheck = [...DB.contracts, ...newContracts];
  const refundFlagActions = [];
  newContracts.filter(isRefundRow).forEach(c=>{
    const room = DB.rooms.find(r=>r.id===c.roomId);
    if(!room) return;
    const refundName = cleanKeyLoose(c.resident || c.contractor);
    if(!refundName) return;
    const matchedResident = DB.residents.find(p=> p.roomId===room.id && cleanKeyLoose(p.name)===refundName);
    if(!matchedResident) return;
    const hasPriorPayment = allContractsForPaymentCheck.some(existing=>
      existing.roomId===room.id && !isRefundRow(existing) &&
      cleanKeyLoose(existing.resident || existing.contractor)===refundName &&
      Number(normalizeAmountStr(existing.paymentAmount)) > 0
    );
    if(!hasPriorPayment) return;
    refundFlagActions.push({ p: matchedResident, room, contractId: c.id, refundDate: normalizeFlexDate(c.contractDate) || c.contractDate || '' });
  });

  showConfirm(
    `계약 데이터 ${newContracts.length}건을 가져올까요?`
      + (duplicateCount ? `\n(이미 등록된 중복 ${duplicateCount}건은 제외됩니다)` : '')
      + (unmatched.length ? `\n(호실을 찾지 못한 ${unmatched.length}건은 제외됩니다)` : '')
      + (residentSyncActions.length ? `\n\n빈 호실 ${residentSyncActions.length}곳에 새 계약자 정보로 입실자를 등록합니다.` : '')
      + (existingResidentsToFlag.length ? `\n기존 입실자가 있는 호실 ${existingResidentsToFlag.length}곳은 계약 이력만 저장하고 "계약 확인 필요"로 표시합니다.` : '')
      + (refundFlagActions.length ? `\n환불 처리된 계약 ${refundFlagActions.length}건은 해당 입실자를 "환불 처리 필요"로 표시합니다(자동으로 퇴실 처리하지 않습니다).` : '')
      + (residentSkipCount ? `\n(계약기간·입실자 정보가 불명확해 입실자 등록을 건너뛴 호실: ${residentSkipCount}곳)` : ''),
    ()=>{
      DB.contracts.push(...newContracts);
      batchWriteDocs(CONTRACTS_COL, newContracts).catch(e=> console.error('계약 데이터 저장 실패:', e));
      refreshContractsCache();
      residentSyncActions.forEach(action=> DB.residents.push(action.newResident));
      existingResidentsToFlag.forEach(p=> p.justImported = true);
      refundFlagActions.forEach(action=>{
        action.p.refundPending = true;
        action.p.refundPendingDate = action.refundDate;
        action.p.refundPendingContractId = action.contractId;
      });
      logChange(`계약 데이터 가져오기: ${newContracts.length}건 추가${duplicateCount ? ` (중복 ${duplicateCount}건 제외)` : ''}${unmatched.length ? ` (미매칭 ${unmatched.length}건)` : ''}${residentSyncActions.length ? ` / 빈 호실 입실자 등록 ${residentSyncActions.length}건` : ''}${existingResidentsToFlag.length ? ` / 계약 확인 필요 표시 ${existingResidentsToFlag.length}건` : ''}${refundFlagActions.length ? ` / 환불 처리 필요 표시 ${refundFlagActions.length}건` : ''}`);
      scheduleSave(); render();
      if(typeof onImported === 'function') onImported();
      showAlert(`${newContracts.length}건을 가져왔습니다.`
        + ((residentSyncActions.length || existingResidentsToFlag.length) ? `\n확인이 필요한 곳: ${residentSyncActions.length + existingResidentsToFlag.length}곳 (신규 등록 ${residentSyncActions.length}곳 + 기존 입실자 ${existingResidentsToFlag.length}곳)\n각 지점 화면의 "계약 확인 필요" 탭 또는 대시보드에서 모아볼 수 있고, 정보를 수정하면 목록에서 사라집니다.` : '')
        + (refundFlagActions.length ? `\n환불 처리 필요: ${refundFlagActions.length}건 — 대시보드의 "환불 처리 필요" 목록에서 확인 후 퇴실 처리해주세요.` : '')
        + (duplicateCount ? `\n이미 등록되어 제외된 중복 데이터: ${duplicateCount}건` : '')
        + (unmatched.length ? `\n\n호실을 찾지 못한 항목:\n${unmatched.slice(0,20).join('\n')}${unmatched.length>20 ? `\n...외 ${unmatched.length-20}건` : ''}` : ''));
    }
  );
}

function downloadContractTemplate(){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const wb = XLSX.utils.book_new();
  const headers = ['계약내용','계약일','계약기간','고시원 명','방이름','계약자','계약자 연락처','입실자','입실료','결제금액','계약구분','결제구분','보증금','보증금 안내'];
  const example = {
    계약내용:'', 계약일:'2026-01-15', 계약기간:'2026-01-15~2027-01-14', '고시원 명':'먼슬리브 성수', 방이름:'304',
    계약자:'홍길동', '계약자 연락처':'010-1234-5678', 입실자:'홍길동', 입실료:450000, 결제금액:450000, 계약구분:'일반',
    결제구분:'카드', 보증금:0, '보증금 안내':''
  };
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([example], { header: headers }), 'Sheet1');
  XLSX.writeFile(wb, 'monthliv_계약데이터_양식.xlsx');
}

const CONTRACT_HISTORY_PAGE_SIZE = 10;
function showContractHistoryModal(room){
  // 계약취소/변경으로 계약일은 같은데 계약기간만 바뀐 환불 계약이 나중에 등록되면 계약일만으로는
  // 어느 쪽이 최신인지 구분이 안 된다 — 실제 등록 시각(importedAt)을 2차 기준으로 써서, 같은
  // 계약일이면 나중에 붙여넣은(환불로 대체하는) 쪽이 항상 먼저(최신으로) 오도록 한다. 이 필드가
  // 없는 옛날 계약은 동점 처리되어 원래 순서(등록 순서)를 그대로 유지한다.
  const contracts = DB.contracts.filter(c=>c.roomId===room.id)
    .slice()
    .sort((a,b)=> (b.contractDate||'').localeCompare(a.contractDate||'') || (b.importedAt||'').localeCompare(a.importedAt||''));
  const totalPages = Math.max(1, Math.ceil(contracts.length / CONTRACT_HISTORY_PAGE_SIZE));
  let page = 1;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.style.maxWidth = '820px';
  const close = ()=> overlay.remove();
  const roomResidents = DB.residents.filter(p=>p.roomId===room.id);
  const latestContract = contracts[0] || null; // 가장 나중에 생성된(계약일 기준 최신) 계약만 대상
  // 입실자가 있는 방은 최신 계약이 "신규"일 때만 교체 대상으로 본다. "연장"은 같은 입실자의
  // 계약 기간만 늘어난 것이라 퇴실 처리할 대상이 없으므로 아이콘을 아예 노출하지 않는다.
  // (빈 방은 애초에 퇴실 처리할 기존 입실자가 없으므로 이 조건과 무관하게 노출한다.)
  // 이미 이 계약으로 입실자 정보를 반영한 적이 있으면(appliedResident) 같은 계약으로
  // 중복 처리하지 않도록 아이콘을 다시 노출하지 않는다.
  const canApplyUpdate = canEdit() && !!latestContract && !latestContract.appliedResident
    && (roomResidents.length===0 || latestContract.contractCategory === '신규');

  function markContractApplied(c){
    c.appliedResident = true;
    CONTRACTS_COL.doc(c.id).set(c).catch(e=> console.error('계약 데이터 갱신 실패:', e));
    refreshContractsCache();
  }

  function buildResidentFromContract(pu, range, c){
    const newResident = {
      id: uid('p'), roomId: room.id, name: pu.name, phone: pu.phone,
      channel: '독립생활', resStatus:'', contractType: c.contractCategory || '신규',
      moveIn: range.start, moveOut: range.end, originalMoveIn: range.start, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex:0, sourceContractId: c.id
    };
    newResident.resStatus = computeResStatus(newResident);
    return newResident;
  }

  function replaceResidentsWithContract(c){
    const pu = contractProposedResidentData(c);
    const range = parseContractPeriodRange(c.contractPeriod);
    if(!pu.name || !range){
      showAlert('이 계약에는 입실자 이름 또는 계약기간 정보가 없어 처리할 수 없습니다.');
      return;
    }
    const detail = `이름: ${pu.name}\n연락처: ${pu.phone || '-'}\n입실일: ${pu.moveIn || '-'}\n퇴실일: ${pu.moveOut || '-'}`;

    if(roomResidents.length===0){
      // 기존 입실자가 없는 빈 방: 새 계약자 정보로 바로 입실 처리
      showConfirm(
        `이 계약 내용으로 신규 입실자를 등록할까요?\n\n${detail}`,
        ()=>{
          DB.residents.push(buildResidentFromContract(pu, range, c));
          markContractApplied(c);
          logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 신규 입실자 등록: ${pu.name}`);
          scheduleSave(); render(); close();
        }
      );
      return;
    }

    const oldNames = roomResidents.map(p=> p.name || '(이름 미입력)').join(', ');
    const anyNotYetDue = roomResidents.some(p=> !isOverdue(p));

    if(anyNotYetDue){
      // 기존 입실자의 퇴실일이 아직 지나지 않은 경우: 기존 입실자는 퇴실예정으로 두고, 신규 계약자는 입실예정자로 등록
      showConfirm(
        `기존 입실자(${oldNames})의 퇴실일이 아직 지나지 않았습니다.\n`
        + `기존 입실자는 퇴실확정으로 표시하고, 새 계약 내용으로 입실예정자를 등록할까요?\n\n${detail}`,
        ()=>{
          roomResidents.forEach(p=>{ p.scheduledToLeave = true; });
          DB.residents.push(buildResidentFromContract(pu, range, c));
          markContractApplied(c);
          logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 입실예정자 등록 (기존 입실자 ${oldNames} 퇴실확정 처리)`);
          scheduleSave(); render(); close();
        }
      );
      return;
    }

    // 기존 입실자의 퇴실일이 이미 지난 경우: 즉시 퇴실 처리 후 신규 입실자 등록
    showConfirm(
      `기존 입실자(${oldNames})를 퇴실 처리하고, 새 계약 내용으로 신규 입실자를 등록할까요?\n\n${detail}`,
      ()=>{
        roomResidents.forEach(p=> moveResidentToHistory(p));
        DB.residents.push(buildResidentFromContract(pu, range, c));
        markContractApplied(c);
        logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 입실자 교체: ${oldNames} → ${pu.name}`);
        scheduleSave(); render(); close();
      }
    );
  }

  function deleteContract(c){
    // 이 계약으로 자동 생성됐던 입실자(현재 입실자 또는 이미 퇴실해 히스토리로 넘어간 기록)가
    // 있으면 계약과 함께 정리한다 — 계약만 지우고 그 계약으로 만들어진 입실자는 그대로 남아
    // 타임라인 등에 계속 노출되는 문제를 막기 위함.
    const linkedResident = DB.residents.find(p=>p.sourceContractId===c.id) || null;
    const linkedHistory = !linkedResident ? (DB.residentHistory.find(h=>h.sourceContractId===c.id) || null) : null;
    const linkedName = linkedResident ? (linkedResident.name || '이름 미입력') : (linkedHistory ? (linkedHistory.name || '이름 미입력') : null);
    const linkedNote = linkedName ? `\n\n이 계약으로 등록된 입실자 "${linkedName}" 님도 함께 삭제됩니다.` : '';
    showConfirm(
      `이 계약 이력을 삭제할까요?\n\n계약일: ${c.contractDate || '-'}\n계약기간: ${c.contractPeriod || '-'}\n계약자: ${c.contractor || '-'}${linkedNote}\n\n삭제 후에는 되돌릴 수 없습니다.`,
      ()=>{
        DB.contracts = DB.contracts.filter(x=>x.id!==c.id);
        CONTRACTS_COL.doc(c.id).delete().catch(e=> console.error('계약 데이터 삭제 실패:', e));
        refreshContractsCache();
        if(linkedResident){
          DB.residents = DB.residents.filter(x=>x.id!==linkedResident.id);
        } else if(linkedHistory){
          DB.residentHistory = DB.residentHistory.filter(x=>x.id!==linkedHistory.id);
          RESIDENT_HISTORY_COL.doc(linkedHistory.id).delete().catch(e=> console.error('퇴실 이력 삭제 실패:', e));
          refreshHistoryCache();
        }
        logChange(`${room.number}호 계약(${c.contractDate || '-'} / ${c.contractor || '-'}) 이력 삭제${linkedName ? ` (연결된 입실자 "${linkedName}" 함께 삭제)` : ''}`);
        scheduleSave();
        close();
        showContractHistoryModal(room);
      }
    );
  }

  function renderBody(){
    box.innerHTML = '';
    const title = el('div', 'modal-msg', `${room.number}호 계약현황 (${contracts.length}건)`, 'margin-bottom:10px;font-weight:700;');
    box.appendChild(title);
    if(canApplyUpdate){
      box.appendChild(el('div', null, '가장 최근 계약 옆의 ↻ 버튼으로 신규 계약자 정보를 반영합니다. 빈 방이면 바로 입실 처리되고, 기존 입실자가 있으면 퇴실일이 지난 경우 즉시 퇴실 후 신규 입실자를 등록하며, 퇴실일 전이면 기존 입실자를 퇴실확정으로 두고 신규 계약자를 입실예정자로 등록합니다.', 'font-size:12px;color:var(--ink-soft);margin-bottom:10px;'));
    }

    if(contracts.length===0){
      box.appendChild(el('div', null, '등록된 계약 이력이 없습니다.', 'font-size:12.5px;color:var(--ink-soft);padding:12px 0;'));
    } else {
      const tableWrap = document.createElement('div');
      tableWrap.style.cssText = 'overflow-x:auto;';
      const table = document.createElement('table');
      table.className = 'contract-table';
      table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px;';
      table.innerHTML = `
        <thead><tr>
          ${canEdit() ? '<th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);"></th>' : ''}
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약일</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약기간</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">입실자</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">연락처</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약자</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">입실료</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">결제금액</th>

function toISODateStr(v){
  if(v == null || v==='') return '';
  if(v instanceof Date){
    // 엑셀/구글시트 날짜 직렬값에 부동소수점 오차가 섞여 있어(예: 자정이 아닌 23:59:xx)
    // 하루 전날로 잘못 계산되는 경우가 있어, 가장 가까운 날짜로 반올림해 보정합니다.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth()+1).padStart(2,'0'), d = String(rounded.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'number'){
    // 엑셀 날짜 직렬번호(문자열이 아닌 순수 숫자로 남은 경우) 보정
    const parsed = XLSX.SSF && XLSX.SSF.parse_date_code ? XLSX.SSF.parse_date_code(Math.round(v)) : null;
    if(parsed){
      const y = parsed.y, m = String(parsed.m).padStart(2,'0'), d = String(parsed.d).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
  }
  return String(v).trim();
}

function renderUserManagePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';

  USERS_COL.get().then(snap=>{
    body.innerHTML = '';
    const users = [];
    snap.forEach(doc=> users.push({ id: doc.id, ...doc.data() }));
    const order = { pending:0, viewer:1, editor:2, superadmin:3 };
    users.sort((a,b)=> (order[a.role] ?? 9) - (order[b.role] ?? 9) || (a.email||'').localeCompare(b.email||''));
    if(users.length===0){ body.textContent = '등록된 사용자가 없습니다.'; return; }

    users.forEach(u=>{

        badge.textContent = '승인 대기';

      if(u.name || u.phone){
        const info = document.createElement('span');

        const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[u.requestedRole];
        info.textContent = [u.name, u.phone, isPending && roleLabel ? `희망: ${roleLabel}` : null].filter(Boolean).join(' · ');
        row.appendChild(info);
      }

      const roleSel = document.createElement('select');
      const defaultRole = isPending ? (u.requestedRole || 'viewer') : u.role;
      [['viewer','조회 전용'], ['editor','수정 가능'], ['superadmin','슈퍼어드민']].forEach(([val,label])=>{
        const o = document.createElement('option');
        o.value = val; o.textContent = label; o.selected = defaultRole === val;
        roleSel.appendChild(o);
      });
      row.appendChild(roleSel);

      const scopeSel = document.createElement('select');
      scopeSel.title = '이 계정이 접근할 수 있는 지점 범위';
      [['all','전체 지점'], ['selected','지점 선택']].forEach(([val,label])=>{
        const o = document.createElement('option');
        o.value = val; o.textContent = label; o.selected = (u.branchScope || 'all') === val;
        scopeSel.appendChild(o);
      });
      row.appendChild(scopeSel);

      const branchChecks = document.createElement('div');
      branchChecks.className = 'user-branch-checks';
      const checkInputs = DB.branches.map(b=>{
        const lbl = document.createElement('label');
        lbl.className = 'user-branch-check-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = b.id;
        cb.checked = Array.isArray(u.branchIds) && u.branchIds.includes(b.id);
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(branchLabel(b)));
        branchChecks.appendChild(lbl);
        return cb;
      });

      function syncScopeVisibility(){
        const isSuper = roleSel.value === 'superadmin';
        scopeSel.style.display = isSuper ? 'none' : '';
        branchChecks.style.display = (!isSuper && scopeSel.value === 'selected') ? '' : 'none';
      }
      roleSel.addEventListener('change', syncScopeVisibility);
      scopeSel.addEventListener('change', syncScopeVisibility);
      syncScopeVisibility();

      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn small primary';
      approveBtn.textContent = isPending ? '승인' : '역할 변경';
      approveBtn.onclick = ()=>{
        const newRole = roleSel.value;
        const branchScope = newRole === 'superadmin' ? 'all' : scopeSel.value;
        const branchIds = branchScope === 'selected' ? checkInputs.filter(cb=>cb.checked).map(cb=>cb.value) : [];
        if(branchScope === 'selected' && branchIds.length===0){
          showAlert('지점을 1개 이상 선택해주세요.');
          return;
        }
        USERS_COL.doc(u.id).set({ email: u.email, role: newRole, branchScope, branchIds, approvedBy: CURRENT_USER.email, approvedAt: new Date().toISOString() }, { merge:true })
          .then(()=>{
            const scopeLabel = branchScope === 'selected'
              ? ` (${branchIds.map(id=> DB.branches.find(b=>b.id===id)?.name || id).join(', ')})`
              : '';
            writeChangeLog(`${u.email} 계정 권한을 "${newRole}"(으)로 설정${scopeLabel}`);
            render();
          })
          .catch(e=> showAlert('처리 실패: ' + e.message));
      };
      row.appendChild(approveBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'iconbtn del';
      delBtn.innerHTML = '&times;';
      delBtn.title = isPending ? '요청 거절' : '계정 접근 차단 (대기 상태로 전환)';
      delBtn.onclick = ()=>{
        showConfirm(isPending ? `${u.email} 계정 요청을 거절할까요?` : `${u.email} 계정의 접근을 차단할까요? (승인 대기 상태로 전환됩니다)`, ()=>{
          USERS_COL.doc(u.id).set({ email: u.email, role:'pending' }, { merge:true })
            .then(()=>{ writeChangeLog(`${u.email} 계정 접근 차단/거절`); render(); });
        });
      };
      row.appendChild(delBtn);

      entryWrap.appendChild(row);
      entryWrap.appendChild(branchChecks);
      body.appendChild(entryWrap);
    });
  }).catch(e=>{ body.textContent = '사용자 목록을 불러오지 못했습니다: ' + e.message; });

  return box;
}

const CHANGELOG_PAGE_SIZE = 10;
function renderChangeLogPanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>변경 로그</h3>`;

  const toolbar = document.createElement('div');
  toolbar.className = 'log-toolbar';
  const dateWrap = document.createElement('div');
  const dateLabel = document.createElement('label');
  dateLabel.className = 'field-label'; dateLabel.textContent = '날짜 조회 (하루 단위)';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateWrap.appendChild(dateLabel); dateWrap.appendChild(dateInput);
  const searchBtn = document.createElement('button');
  searchBtn.className = 'btn small primary'; searchBtn.textContent = '조회';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn small'; resetBtn.textContent = '최근 50건 보기';
  toolbar.appendChild(dateWrap); toolbar.appendChild(searchBtn); toolbar.appendChild(resetBtn);
  box.appendChild(toolbar);

  const body = document.createElement('div');
  body.style.cssText = 'font-size:12px;color:var(--ink-soft);';
  box.appendChild(body);
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  box.appendChild(pager);

  let currentLogs = [];
  let currentPage = 1;

  function renderPage(){
    body.innerHTML = '';
    pager.innerHTML = '';
    if(currentLogs.length === 0){ body.textContent = '기록된 변경 로그가 없습니다.'; return; }
    const totalPages = Math.ceil(currentLogs.length / CHANGELOG_PAGE_SIZE);
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * CHANGELOG_PAGE_SIZE;
    currentLogs.slice(start, start + CHANGELOG_PAGE_SIZE).forEach(d=>{
      const time = (d.timestamp || '').replace('T',' ').slice(0,16);
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <span class="log-time">${esc(time)}</span>
        <span class="log-email">${esc(d.email || '-')}</span>
        <span class="log-summary">${esc(d.summary || '')}</span>
      `;
      body.appendChild(row);
    });
    if(currentLogs.length > CHANGELOG_PAGE_SIZE){
      for(let p=1; p<=totalPages; p++){
        const pBtn = document.createElement('button');
        pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
        pBtn.textContent = String(p);
        pBtn.onclick = ()=>{ currentPage = p; renderPage(); };
        pager.appendChild(pBtn);
      }
    }
  }

  function loadDefault(){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    CHANGELOG_COL.orderBy('timestamp','desc').limit(50).get().then(snap=>{
      currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
      currentPage = 1;
      renderPage();
    }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  function loadByDate(dateStr){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    const dayStart = dateStr + 'T00:00:00.000Z';
    const dayEnd = dateStr + 'T23:59:59.999Z';
    CHANGELOG_COL.where('timestamp','>=',dayStart).where('timestamp','<=',dayEnd)
      .orderBy('timestamp','desc').limit(500).get().then(snap=>{
        currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
        currentPage = 1;
        renderPage();
      }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  searchBtn.onclick = ()=>{
    if(!dateInput.value){ showAlert('조회할 날짜를 선택해주세요.'); return; }
    loadByDate(dateInput.value);
  };
  resetBtn.onclick = ()=>{ dateInput.value = ''; loadDefault(); };

  loadDefault();
  return box;
}

    addBtn.className = 'btn small primary';
    addBtn.textContent = '+ 바로가기 추가';

      if(!name || !url){ showAlert('기능명과 링크 주소를 모두 입력해주세요.'); return; }
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

      DB.shortcuts.push(s);
      UI.shortcutSelectedId = s.id;
      logChange(`"${name}" 바로가기 추가`);
      scheduleSave(); render();
    };
    addBtn.onclick = doAdd;
    urlInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });

    lnb.appendChild(addRow);
  }

  wrap.appendChild(lnb);

  const frameWrap = document.createElement('div');

    frameWrap.appendChild(frameHead);

    frameWrap.appendChild(el('div','shortcuts-empty','왼쪽에서 바로가기를 선택하거나 추가해주세요.'));
  }

}

function renderStatsView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';

  if(USER_ROLE !== 'viewer'){
    wrap.appendChild(renderOverdueStatsCard());
    wrap.appendChild(renderPendingMoveStatsCard());
    wrap.appendChild(renderJustImportedStatsCard());
    wrap.appendChild(renderRefundPendingStatsCard());
  }

  const branchSection = document.createElement('div');
  branchSection.className = 'stat-section';
  branchSection.innerHTML = `<h3 style="margin:0 0 12px;font-size:19px;">지점별 현황 (${localDateKey().replace(/-/g,'/')})</h3>`;
  const table = document.createElement('table');
  table.className = 'branch-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>호실수</th><th>이용중</th><th>판매중</th><th>입실율</th><th>예약</th><th>판매보류</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  const totals = { total:0, occupied:0, forSale:0, hold:0, reserved:0 };
  allowedBranches().forEach(b=>{
    const rms = DB.rooms.filter(r=>r.branchId===b.id);
    const total = rms.length;
    let occupied=0, forSale=0;
    const holdRooms = [];
    rms.forEach(r=>{
      const tabs = roomTabs(r);
      if(tabs.includes('이용중')) occupied++;
      if(tabs.includes('판매중')) forSale++;
      if(tabs.includes('판매보류')) holdRooms.push(r);
    });
    // roomsInFilterTab의 "예약" 정의(예약 플래그 + 입실확정)와 항상 일치하도록 같은 함수를
    // 재사용한다 — 대시보드 숫자를 클릭해 들어간 방 목록과 여기 숫자가 어긋나면 안 된다.
    const reserved = roomsInFilterTab(rms, '예약').length;
    // 입실율 = 이용중 / 호실수 * 100. "입실확정"(입실예정일이 많이 남아 이용중과 별도로
    // 구분되는 상태, effectiveRoomStatus 참고)이나 roomHasActiveResident(입실확정 포함)
    // 기준으로 계산하면 "이용중" 칸의 숫자와 입실율이 서로 안 맞아 보이는 문제가 있었다.
    const occRate = total ? Math.round((occupied/total)*100) : 0;
    totals.total += total; totals.occupied += occupied; totals.forSale += forSale;
    totals.hold += holdRooms.length; totals.reserved += reserved;
    const occColor = occRate >= 90 ? 'var(--ink)' : (occRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
    const holdText = holdRooms.length
      ? holdRooms.map(r=> esc(r.note ? `${r.number}: ${r.note}` : `${r.number}`)).join('<br>')
      : '-';
    const tabCell = (tab, content)=> `<td><a href="#" data-goto="${b.id}" data-tab="${tab}" class="stat-cell-link">${content}</a></td>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="#" data-goto="${b.id}" data-tab="전체" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(b))}</a></td>
      <td>${total}</td>${tabCell('이용중', occupied)}${tabCell('판매중', forSale)}<td style="color:${occColor};font-weight:700;">${occRate}%</td>${tabCell('예약', reserved)}${tabCell('판매보류', holdText)}`;
    tbody.appendChild(tr);
  });
  const totalOccRate = totals.total ? Math.round((totals.occupied/totals.total)*100) : 0;
  const totalOccColor = totalOccRate >= 90 ? 'var(--ink)' : (totalOccRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
  const totalTr = document.createElement('tr');
  totalTr.className = 'branch-table-total';
  totalTr.innerHTML = `<td>전체</td>
    <td>${totals.total}</td><td>${totals.occupied}</td><td>${totals.forSale}</td><td style="color:${totalOccColor};font-weight:700;">${totalOccRate}%</td><td>${totals.reserved}</td><td>${totals.hold}</td>`;
  tbody.insertBefore(totalTr, tbody.firstChild);
  table.appendChild(tbody);
  branchSection.appendChild(table);
  wrap.appendChild(branchSection);

  wrap.querySelectorAll('[data-goto]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); UI.view='branch'; UI.branchId = a.dataset.goto; UI.branchTab='rooms'; UI.roomStatusFilter=a.dataset.tab || '전체'; render(); });
  });

  return wrap;
}

/* 지점/호실/입실자 등 핵심 데이터만 하루 1건씩 자동 스냅샷으로 남긴다. 계약·퇴실 이력은
   제외한다 — 이미 건별 문서로 저장되어 있어 별도 백업 없이도 안전하고, 통째로 백업하면
   예전처럼 문서 용량 제한에 다시 걸릴 수 있다. 최근 3일치만 남기고 오래된 건 정리한다. */
async function maybeCreateDailyBackup(){
  const today = todayISO();
  try{
    const existing = await BACKUPS_COL.doc(today).get();
    if(existing.exists) return;
    const core = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
    await BACKUPS_COL.doc(today).set({ json: JSON.stringify(core), backedUpAt: new Date().toISOString() });
    const allBackups = await BACKUPS_COL.get();
    const dates = allBackups.docs.map(d=>d.id).sort(); // 오래된 날짜부터
    const toDelete = dates.slice(0, Math.max(0, dates.length - 3));
    if(toDelete.length) await batchDeleteDocs(BACKUPS_COL, toDelete);
  }catch(e){ console.error('자동 백업 실패:', e); }
}

function downloadFullBackup(){
  const backup = {
    branches: DB.branches, rooms: DB.rooms, residents: DB.residents,
    contracts: DB.contracts, residentHistory: DB.residentHistory,
    channelList: DB.channelList, shortcuts: DB.shortcuts,
    doorlocks: DB.doorlocks, doorlockPrevSnapshot: DB.doorlockPrevSnapshot, doorlockImportDate: DB.doorlockImportDate,
    doorlockBranchNameOverrides: DB.doorlockBranchNameOverrides, doorlockActionTags: DB.doorlockActionTags,
    doorlockBranchNotes: DB.doorlockBranchNotes, doorlockHistory: DB.doorlockHistory,
    doorlockBranchLinks: DB.doorlockBranchLinks,
    backedUpAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `monthliv_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function restoreLatestBackup(){
  let snap;
  try{
    snap = await BACKUPS_COL.get();
  }catch(e){
    console.error(e);
    showAlert('백업 목록을 불러오지 못했습니다: ' + e.message);
    return;
  }
  if(snap.empty){ showAlert('저장된 자동 백업이 없습니다.'); return; }
  const docs = snap.docs.map(d=>({ id:d.id, data:d.data() })).sort((a,b)=> b.id.localeCompare(a.id));
  const latest = docs[0];
  let core;
  try{ core = JSON.parse(latest.data.json); }catch(e){ showAlert('백업 데이터를 읽지 못했습니다.'); return; }

  showConfirm(
    `"${latest.id}" 날짜 백업을 가져올까요?\n\n` +
    `백업 데이터: 지점 ${core.branches.length}개 · 호실 ${core.rooms.length}개 · 입실자 ${core.residents.length}명\n` +
    `현재 데이터: 지점 ${DB.branches.length}개 · 호실 ${DB.rooms.length}개 · 입실자 ${DB.residents.length}명\n\n` +
    `⚠ 현재 화면의 지점·호실·입실자 정보가 백업 시점 내용으로 완전히 대체됩니다(계약·퇴실 이력은 영향 없음). 되돌릴 수 없으니 신중히 확인해주세요.`,
    async ()=>{
      DB.branches = core.branches;
      DB.rooms = core.rooms;
      DB.residents = core.residents;
      if(Array.isArray(core.channelList)) DB.channelList = core.channelList;
      if(Array.isArray(core.shortcuts)) DB.shortcuts = core.shortcuts;
      try{
        const newCore = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
        await FIRESTORE_DOC.set({ json: JSON.stringify(newCore), updatedAt: new Date().toISOString() });
        logChange(`"${latest.id}" 백업으로 복원`);
        render();
        showAlert('백업 데이터로 복원되었습니다.');
      }catch(e){
        console.error(e);
        showAlert('복원 중 저장에 실패했습니다: ' + e.message);
      }
    }
  );
}

function renderBranchOrderBody(){
  const box = document.createElement('div');
  box.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
      드래그해서 순서를 바꾸면 지점 선택 목록, 지점별 현황 표 등 모든 화면에 반영됩니다.
    </div>`;

  const list = document.createElement('div');
  list.className = 'branch-order-list';
  let dragRow = null;

  DB.branches.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'branch-order-row';
    row.draggable = true;
    row.dataset.id = b.id;
    row.innerHTML = `<span class="branch-order-handle">&#9776;</span><span class="branch-order-name" title="클릭 시 해당 지점으로 이동">${b.shortName ? esc(b.shortName)+' · ' : ''}${esc(b.name)}</span>`;
    row.querySelector('.branch-order-name').addEventListener('click', ()=>{
      UI.view = 'branch'; UI.branchId = b.id; UI.branchTab = 'rooms'; UI.roomStatusFilter = '전체'; render();
    });
    const editBtn = document.createElement('button');
    editBtn.className = 'btn small';
    editBtn.textContent = '수정';
    editBtn.draggable = false;
    editBtn.onclick = ()=>{ UI.editingBranchId = b.id; UI.addingBranch=false; UI.addingRoom=false; UI.managingRoom=false; render(); };
    row.appendChild(editBtn);

    row.addEventListener('dragstart', ()=>{
      dragRow = row;
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      dragRow = null;
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!dragRow || dragRow===row) return;
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      list.insertBefore(dragRow, before ? row : row.nextSibling);
    });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      const newOrder = [...list.children].map(el=>el.dataset.id);
      DB.branches.sort((a,b2)=> newOrder.indexOf(a.id) - newOrder.indexOf(b2.id));
      logChange('지점 노출 순서 변경');
      scheduleSave(); render();
    });

    list.appendChild(row);
  });

  box.appendChild(list);
  return box;
}

      const branch = DB.branches.find(b=>b.id===branchSel.value);
      listWrap.innerHTML = '';
      if(!branch) return;
      const rms = DB.rooms.filter(r=>r.branchId===branch.id)
        .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));
      if(rms.length===0){
        listWrap.appendChild(el('div', null, '등록된 호실이 없습니다.', 'font-size:12.5px;color:var(--ink-soft);padding:8px 0;'));
        return;
      }
      const types = branchRoomTypes(branch);
      const listBox = document.createElement('div');
      listBox.style.cssText = 'display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto;';
      rms.forEach(r=>{
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);';

        const label = document.createElement('span');
        label.style.cssText = 'width:64px;flex-shrink:0;font-weight:600;';
        label.textContent = r.number + '호';
        row.appendChild(label);

        const sel = document.createElement('select');
        sel.style.flex = '1';
        // 등록된 타입 목록에 없는 값(오타·미등록 등)이면 맨 앞에 "(미등록)"으로 표시해 눈에 띄게 한다
        const optionHtml = types.map(t=>`<option ${t===r.type?'selected':''}>${esc(t)}</option>`).join('');
        sel.innerHTML = types.includes(r.type)
          ? optionHtml
          : `<option value="${esc(r.type||'')}" selected>${esc(r.type || '(타입 없음)')} — 미등록</option>${optionHtml}`;
        row.appendChild(sel);

        const priceHint = document.createElement('span');
        priceHint.style.cssText = 'font-size:11.5px;color:var(--ink-soft);white-space:nowrap;min-width:80px;text-align:right;';
        priceHint.textContent = formatWon((branch.typePrices && branch.typePrices[r.type]) || 0);
        row.appendChild(priceHint);

        sel.addEventListener('change', ()=>{
          if(sel.value === r.type) return;
          logChange(`${r.number}호 타입 변경: ${r.type} → ${sel.value}`);
          r.type = sel.value;
          scheduleSave();
          renderList();
        });

        listBox.appendChild(row);
      });
      listWrap.appendChild(listBox);
    };
    renderList();
    branchSel.onchange = renderList;
    document.getElementById('rtCancel').onclick = ()=>{ UI.matchingRoomType=false; render(); };
  },0);
  return form;
}

function renderTypePriceManageForm(){
  const form = document.createElement('div');
  form.className = 'admin-add-form';
  if(DB.branches.length===0){
    form.innerHTML = `<div class="fld">등록된 지점이 없습니다.</div>`;
    return form;
  }
  form.innerHTML = `
    <div class="fld" style="grid-column:1/-1;"><label class="field-label">지점 *</label>
      <select id="tpBranch">${DB.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>
    <div id="tpPriceFields" style="grid-column:1/-1;"></div>
    <div style="grid-column:1/-1;font-size:11.5px;color:var(--ink-soft);">같은 지점·같은 타입 호실은 모두 이 가격을 사용합니다. 개별 호실마다 다른 가격을 지정할 수는 없습니다. 타입은 지점마다 자유롭게 추가/삭제할 수 있습니다.</div>
    <div class="btn-row">
      <button class="btn" id="tpCancel">닫기</button>
    </div>
  `;
  setTimeout(()=>{
    const branchSel = document.getElementById('tpBranch');
    const fieldsWrap = document.getElementById('tpPriceFields');
    const renderFields = ()=>{
      const branch = DB.branches.find(b=>b.id===branchSel.value);
      fieldsWrap.innerHTML = '';
      if(!branch) return;

      const list = document.createElement('div');
      list.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:12px;';
      branchRoomTypes(branch).forEach(t=>{
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;align-items:flex-end;';
        const fld = document.createElement('div');
        fld.className = 'fld';
        fld.style.flex = '1';
        fld.innerHTML = `<label class="field-label">${esc(t)}</label><input type="number" min="0" step="10000">`;
        const input = fld.querySelector('input');
        input.value = (branch.typePrices && branch.typePrices[t]) || 0;
        input.addEventListener('change', ()=>{
          const newPrice = Number(input.value) || 0;
          const oldPrice = (branch.typePrices && branch.typePrices[t]) || 0;
          if(newPrice===oldPrice) return;
          logChange(`"${branch.name}" ${t} 타입 가격 변경: ${formatWon(oldPrice)} → ${formatWon(newPrice)}`);
          branch.typePrices = Object.assign({}, branch.typePrices, { [t]: newPrice });
          scheduleSave();
        });
        row.appendChild(fld);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'iconbtn del';
        delBtn.innerHTML = '&times;';
        delBtn.title = '이 타입 삭제';
        delBtn.onclick = ()=>{
          const inUse = DB.rooms.some(r=> r.branchId===branch.id && r.type===t);
          const msg = inUse
            ? `"${t}" 타입을 삭제할까요?\n이미 이 타입으로 등록된 호실이 있습니다. 그 호실들의 타입 값은 그대로 남지만, 이 목록에서 사라지고 방 가격도 0원으로 표시됩니다.`
            : `"${t}" 타입을 삭제할까요?`;
          showConfirm(msg, ()=>{
            branch.roomTypes = branchRoomTypes(branch).filter(x=>x!==t);
            logChange(`"${branch.name}" 타입 삭제: ${t}`);
            scheduleSave();
            renderFields();
          });
        };
        row.appendChild(delBtn);
        list.appendChild(row);
      });
      fieldsWrap.appendChild(list);

      const addRow = document.createElement('div');
      addRow.style.cssText = 'display:flex;gap:8px;';
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = '새 타입 이름 (예: 디럭스룸)';
      nameInput.style.flex = '1';
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn small primary';
      addBtn.textContent = '+ 타입 추가';
      const doAdd = ()=>{
        const name = nameInput.value.trim();
        if(!name) return;
        if(branchRoomTypes(branch).some(x=>x.toLowerCase()===name.toLowerCase())){
          showAlert('이미 있는 타입명입니다.');
          return;
        }
        registerRoomType(branch, name);
        logChange(`"${branch.name}" 타입 추가: ${name}`);
        scheduleSave();
        nameInput.value = '';
        renderFields();
      };
      addBtn.onclick = doAdd;
      nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });
      addRow.appendChild(nameInput); addRow.appendChild(addBtn);
      fieldsWrap.appendChild(addRow);
    };
    renderFields();
    branchSel.onchange = renderFields;
    document.getElementById('tpCancel').onclick = ()=>{ UI.managingTypePrice=false; render(); };
  },0);
  return form;
}

function renderOverdueStatsCard(){
  const items = [];
  DB.rooms.filter(room=> hasBranchAccess(room.branchId)).forEach(room=>{
    const branch = DB.branches.find(b=>b.id===room.branchId);
    DB.residents.filter(p=>p.roomId===room.id && isOverdue(p)).forEach(p=>{
      items.push({ room, branch, resident:p });
    });
  });

  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card overdue-stats-card';

  if(items.length===0){
    card.innerHTML = `<h3>연체 중인 호실 <span class="cnt-badge overdue-cnt-badge">${items.length}</span></h3>`;
    card.appendChild(el('div','cleaning-empty','전체 지점에 연체 중인 호실이 없습니다.'));
    return card;
  }

  const groupMap = new Map();
  items.forEach(item=>{
    const key = item.branch ? item.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { key, branch: item.branch, entries: [] });
    groupMap.get(key).entries.push(item);
  });
  const groups = [...groupMap.values()];
  groups.forEach(g=> g.entries.sort((a,b)=> a.room.number.localeCompare(b.room.number,'ko',{numeric:true})));
  groups.sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  if(!groups.some(g=> g.key===UI.overdueTabKey)) UI.overdueTabKey = groups[0].key;
  const activeGroup = groups.find(g=> g.key===UI.overdueTabKey);

  card.innerHTML = `<h3>연체 중인 호실 <span class="cnt-badge overdue-cnt-badge">${items.length}</span></h3>`;

  const tabs = document.createElement('div');
  tabs.className = 'subnav';
  tabs.style.margin = '0 0 12px';
  groups.forEach(group=>{
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = group.key===UI.overdueTabKey ? 'active' : '';
    tab.textContent = `${group.branch ? branchLabel(group.branch) : '(지점 정보 없음)'} (${group.entries.length})`;
    tab.onclick = ()=>{ UI.overdueTabKey = group.key; render(); };
    tabs.appendChild(tab);
  });
  card.appendChild(tabs);

  const today = todayISO();
  const chipRow = document.createElement('div');
  chipRow.className = 'overdue-room-chips overdue-tab-chips';
  activeGroup.entries.forEach(item=>{
    const days = Math.max(1, Math.round((new Date(today) - new Date(item.resident.moveOut)) / 86400000));
    const chip = document.createElement('span');
    chip.className = 'badge overdue-badge overdue-room-chip';
    chip.textContent = `${item.room.number}호 ${days}일 연체`;
    chip.title = '해당 호실로 이동';
    chip.onclick = ()=>{
      if(!item.branch) return;
      UI.view = 'branch';
      UI.branchId = item.branch.id;
      scrollToRoomCard(item.room);
    };
    chipRow.appendChild(chip);
  });
  card.appendChild(chipRow);

  return card;
}

function renderPendingMoveStatsCard(){
  const items = [];
  DB.residents.forEach(p=>{
    if(!p.pendingRoomMove) return;
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(room && !hasBranchAccess(room.branchId)) return;
    const toRoom = DB.rooms.find(r=>r.id===p.pendingRoomMove.toRoomId);
    const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
    items.push({ p, room, toRoom, branch, date: p.pendingRoomMove.date });
  });
  if(items.length===0) return document.createDocumentFragment();

  const groupMap = new Map();
  items.forEach(item=>{
    const key = item.branch ? item.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { branch: item.branch, entries: [] });
    groupMap.get(key).entries.push(item);
  });
  const groups = [...groupMap.values()].sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card';
  card.style.borderColor = 'var(--st-presell)';
  card.innerHTML = `<h3 style="color:var(--st-presell);">방이동 예정 <span class="cnt-badge" style="background:var(--st-presell-bg);color:var(--st-presell);">${items.length}</span></h3>`;

  groups.forEach(group=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'overdue-branch-group';
    const branchName = document.createElement('div');
    branchName.className = 'overdue-branch-name';
    branchName.textContent = group.branch ? branchLabel(group.branch) : '(지점 정보 없음)';
    if(group.branch){
      branchName.style.cursor = 'pointer';
      branchName.title = '해당 지점으로 이동';
      branchName.onclick = ()=>{ UI.view = 'branch'; UI.branchId = group.branch.id; render(); };
    }
    groupWrap.appendChild(branchName);

    const chipRow = document.createElement('div');
    chipRow.className = 'overdue-room-chips';
    group.entries.forEach(item=>{
      const chip = document.createElement('span');
      chip.className = 'badge overdue-room-chip';
      chip.style.background = 'var(--st-presell-bg)'; chip.style.color = 'var(--st-presell)';
      chip.textContent = `${item.room ? item.room.number : '-'}호 → ${item.toRoom ? item.toRoom.number : '-'}호 (${item.date})`;
      chip.title = '해당 호실로 이동';
      chip.onclick = ()=>{
        if(!item.branch || !item.room) return;
        UI.view = 'branch';
        UI.branchId = item.branch.id;
        scrollToRoomCard(item.room);
      };
      chipRow.appendChild(chip);
    });

  });

  return card;
