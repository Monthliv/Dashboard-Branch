  box.appendChild(body);
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  box.appendChild(pager);

  let currentLogs = [];
  let currentPage = 1;

  function renderPage(){
    body.innerHTML = '';
    pager.innerHTML = '';
    if(currentLogs.length === 0){ body.textContent = '기록된 변경 로그가 없습니다.'; return; }
    const totalPages = Math.ceil(currentLogs.length / CHANGELOG_PAGE_SIZE);
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * CHANGELOG_PAGE_SIZE;
    currentLogs.slice(start, start + CHANGELOG_PAGE_SIZE).forEach(d=>{
      const time = (d.timestamp || '').replace('T',' ').slice(0,16);
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <span class="log-time">${esc(time)}</span>
        <span class="log-email">${esc(d.email || '-')}</span>
        <span class="log-summary">${esc(d.summary || '')}</span>
      `;
      body.appendChild(row);
    });
    if(currentLogs.length > CHANGELOG_PAGE_SIZE){
      for(let p=1; p<=totalPages; p++){
        const pBtn = document.createElement('button');
        pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
        pBtn.textContent = String(p);
        pBtn.onclick = ()=>{ currentPage = p; renderPage(); };
        pager.appendChild(pBtn);
      }
    }
  }

  function loadDefault(){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    CHANGELOG_COL.orderBy('timestamp','desc').limit(50).get().then(snap=>{
      currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
      currentPage = 1;
      renderPage();
    }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  function loadByDate(dateStr){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    const dayStart = dateStr + 'T00:00:00.000Z';
    const dayEnd = dateStr + 'T23:59:59.999Z';
    CHANGELOG_COL.where('timestamp','>=',dayStart).where('timestamp','<=',dayEnd)
      .orderBy('timestamp','desc').limit(500).get().then(snap=>{
        currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
        currentPage = 1;
        renderPage();
      }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }

  searchBtn.onclick = ()=>{
    if(!dateInput.value){ showAlert('조회할 날짜를 선택해주세요.'); return; }
    loadByDate(dateInput.value);
  };
  resetBtn.onclick = ()=>{ dateInput.value = ''; loadDefault(); };

  loadDefault();
  return box;
}

/* ---------------- stats view ---------------- */
function renderStatsView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';

  if(USER_ROLE !== 'viewer'){
    wrap.appendChild(renderOverdueStatsCard());
    wrap.appendChild(renderPendingMoveStatsCard());
  }

  const branchSection = document.createElement('div');
  branchSection.className = 'stat-section';
  branchSection.innerHTML = `<h3>지점별 현황</h3>`;
  const table = document.createElement('table');
  table.className = 'branch-table';
  table.innerHTML = `<thead><tr><th>지점</th><th>호실수</th><th>이용중</th><th>판매중</th><th>입실율</th><th>예약</th><th>판매보류</th></tr></thead>`;
  const today = todayISO();
  const tbody = document.createElement('tbody');
  const totals = { total:0, occupied:0, forSale:0, hold:0, reserved:0, activeCount:0 };
  allowedBranches().forEach(b=>{
    const rms = DB.rooms.filter(r=>r.branchId===b.id);
    const roomIds = new Set(rms.map(r=>r.id));
    const total = rms.length;
    let occupied=0, forSale=0, activeCount=0;
    const holdRooms = [];
    rms.forEach(r=>{
      const tabs = roomTabs(r);
      if(tabs.includes('이용중')) occupied++;
      if(tabs.includes('판매중')) forSale++;
      if(tabs.includes('판매보류')) holdRooms.push(r);
      if(roomHasActiveResident(r)) activeCount++;
    });
    const reserved = DB.residents.filter(p => roomIds.has(p.roomId) && p.moveIn && p.moveIn > today).length;
    const occRate = total ? Math.round((activeCount/total)*100) : 0;
    totals.total += total; totals.occupied += occupied; totals.forSale += forSale;
    totals.hold += holdRooms.length; totals.reserved += reserved; totals.activeCount += activeCount;
    const occColor = occRate >= 90 ? 'var(--ink)' : (occRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
    const holdText = holdRooms.length
      ? holdRooms.map(r=> esc(r.note ? `${r.number}: ${r.note}` : `${r.number}`)).join('<br>')
      : '-';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="#" data-goto="${b.id}" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(b))}</a></td>
      <td>${total}</td><td>${occupied}</td><td>${forSale}</td><td style="color:${occColor};font-weight:700;">${occRate}%</td><td>${reserved}</td><td>${holdText}</td>`;
    tbody.appendChild(tr);
  });
  const totalOccRate = totals.total ? Math.round((totals.activeCount/totals.total)*100) : 0;
  const totalOccColor = totalOccRate >= 90 ? 'var(--ink)' : (totalOccRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
  const totalTr = document.createElement('tr');
  totalTr.className = 'branch-table-total';
  totalTr.innerHTML = `<td>전체</td>
    <td>${totals.total}</td><td>${totals.occupied}</td><td>${totals.forSale}</td><td style="color:${totalOccColor};font-weight:700;">${totalOccRate}%</td><td>${totals.reserved}</td><td>${totals.hold}</td>`;
  tbody.insertBefore(totalTr, tbody.firstChild);
  table.appendChild(tbody);
  branchSection.appendChild(table);
  wrap.appendChild(branchSection);

  wrap.querySelectorAll('[data-goto]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); UI.view='branch'; UI.branchId = a.dataset.goto; UI.branchTab='rooms'; UI.roomStatusFilter='이용중'; render(); });
  });

  return wrap;
}

const ADMIN_PANEL_TOGGLE_FLAGS = ['addingBranch','addingRoom','managingRoom'];
function renderBranchRoomManagePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>지점 · 호실 관리</h3>`;

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;';

  function toggleBtn(flag, onLabel, offLabel, variant){
    const btn = document.createElement('button');
    btn.className = 'btn small' + (variant ? ' '+variant : '');
    btn.textContent = UI[flag] ? offLabel : onLabel;
    btn.onclick = ()=>{
      const turningOn = !UI[flag];
      ADMIN_PANEL_TOGGLE_FLAGS.forEach(f=> UI[f] = false);
      UI.editingBranchId = null;
      UI[flag] = turningOn;
      render();
    };
    return btn;
  }
  btnRow.appendChild(toggleBtn('addingBranch', '+ 지점 추가', '지점 추가 취소', 'primary'));
  btnRow.appendChild(toggleBtn('addingRoom', '+ 호실 추가', '호실 추가 취소', 'primary'));
  btnRow.appendChild(toggleBtn('managingRoom', '호실 정보 수정 · 삭제', '호실 정보 수정 취소', 'danger'));
  box.appendChild(btnRow);

  if(UI.addingBranch) box.appendChild(renderAdminAddBranchForm());
  else if(UI.addingRoom) box.appendChild(renderAdminAddRoomForm());
  else if(UI.managingRoom) box.appendChild(renderAdminRoomManageForm());
  else if(UI.editingBranchId) box.appendChild(renderAdminEditBranchForm(DB.branches.find(b=>b.id===UI.editingBranchId)));
  else box.appendChild(renderBranchOrderBody());

  return box;
}

function renderBranchOrderBody(){
  const box = document.createElement('div');
  box.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
      드래그해서 순서를 바꾸면 지점 선택 목록, 지점별 현황 표 등 모든 화면에 반영됩니다.
    </div>`;

  const list = document.createElement('div');
  list.className = 'branch-order-list';
  let dragRow = null;

  DB.branches.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'branch-order-row';
    row.draggable = true;
    row.dataset.id = b.id;
    row.innerHTML = `<span class="branch-order-handle">&#9776;</span><span class="branch-order-name" title="클릭 시 해당 지점으로 이동">${b.shortName ? esc(b.shortName)+' · ' : ''}${esc(b.name)}</span>`;
    row.querySelector('.branch-order-name').addEventListener('click', ()=>{
      UI.view = 'branch'; UI.branchId = b.id; UI.branchTab = 'rooms'; UI.roomStatusFilter = '이용중'; render();
    });
    const editBtn = document.createElement('button');
    editBtn.className = 'btn small';
    editBtn.textContent = '수정';
    editBtn.draggable = false;
    editBtn.onclick = ()=>{ UI.editingBranchId = b.id; UI.addingBranch=false; UI.addingRoom=false; UI.managingRoom=false; render(); };
    row.appendChild(editBtn);

    row.addEventListener('dragstart', ()=>{
      dragRow = row;
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      dragRow = null;
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!dragRow || dragRow===row) return;
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      list.insertBefore(dragRow, before ? row : row.nextSibling);
    });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      const newOrder = [...list.children].map(el=>el.dataset.id);
      DB.branches.sort((a,b2)=> newOrder.indexOf(a.id) - newOrder.indexOf(b2.id));
      logChange('지점 노출 순서 변경');
      scheduleSave(); render();
    });

    list.appendChild(row);
  });

  box.appendChild(list);
  return box;
}

function renderAdminRoomManageForm(){

  form.innerHTML = `
    <div class="fld"><label class="field-label">지점 *</label>
      <select id="drBranch">${DB.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>

      <button class="btn danger" id="drSubmit">호실 삭제</button>
      <button class="btn" id="drCancel">취소</button>
    </div>
  `;
  setTimeout(()=>{
    const branchSel = document.getElementById('drBranch');
    const roomSel = document.getElementById('drRoom');
    const priceInput = document.getElementById('drPrice');
    const fillRooms = ()=>{
      const rms = DB.rooms.filter(r=>r.branchId===branchSel.value)
        .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));
      roomSel.innerHTML = rms.length
        ? rms.map(r=>`<option value="${r.id}">${esc(r.number)}호 (${esc(r.type)})</option>`).join('')
        : `<option value="">호실 없음</option>`;
      updatePrice();
    };
    const updatePrice = ()=>{
      const room = DB.rooms.find(r=>r.id===roomSel.value);
      priceInput.value = room ? (room.price || 0) : '';
    };
    fillRooms();
    branchSel.onchange = fillRooms;
    roomSel.onchange = updatePrice;
    document.getElementById('drCancel').onclick = ()=>{ UI.managingRoom=false; render(); };
    document.getElementById('drSave').onclick = ()=>{
      const room = DB.rooms.find(r=>r.id===roomSel.value);
      if(!room){ showAlert('호실을 선택해주세요.'); return; }
      const branch = DB.branches.find(b=>b.id===room.branchId);
      const newPrice = Number(priceInput.value) || 0;
      logChange(`${branch ? branch.name + ' ' : ''}${room.number}호 입실료 변경: ${formatWon(room.price)} → ${formatWon(newPrice)}`);
      room.price = newPrice;
      scheduleSave();
      showAlert('입실료가 저장되었습니다.');
    };
    document.getElementById('drSubmit').onclick = ()=>{
      const room = DB.rooms.find(r=>r.id===roomSel.value);
      if(!room){ showAlert('삭제할 호실을 선택해주세요.'); return; }
      const branch = DB.branches.find(b=>b.id===room.branchId);
      showConfirm(`${branch ? branch.name + ' ' : ''}${room.number}호를 삭제할까요? 입실자 정보도 함께 삭제됩니다.`, ()=>{
        DB.residents = DB.residents.filter(p=>p.roomId!==room.id);
        DB.rooms = DB.rooms.filter(r=>r.id!==room.id);
        logChange(`${branch ? branch.name + ' ' : ''}${room.number}호 삭제`);
        UI.managingRoom = false;
        scheduleSave(); render();
      });
    };
  },0);
  return form;
}

        showAlert(`이 지점에는 이미 "${number}" 호실이 있습니다. 호실은 지점당 1개씩만 등록할 수 있어요.`);
        numberEl.focus(); return;
      }
      const room = {
        id: uid('r'), branchId, number,
        type: document.getElementById('nrType').value,
        occupancy: document.getElementById('nrOccupancy').value,
        saleStatus: document.getElementById('nrStatus').value,
        needsCleaning:false, needsRetouch:false, needsExtraCleaning:false, maintenanceDate:'', preSelling:false, note:'',
        price: Number(document.getElementById('nrPrice').value) || 0
      };
      DB.rooms.push(room);
      UI.addingRoom = false;
      logChange(`${branch ? branch.name + ' ' : ''}${room.number}호 신규 등록`);
      scheduleSave(); render();
    };
  },0);
  return form;
}

/* 청소 관리 대시보드(상단 카드·주간표)가 공유하는 단일 데이터 소스.
   퇴실청소: 계약만기일 등으로 퇴실이 확정된(scheduledToLeave) 입실자는, 청소 인력이
   나오는 월/수/금 중 퇴실일 이후 가장 빠른 날짜를 청소일로 잡는다(예: 8/9(일) 만기 →
   8/10(월)). 이미 퇴실청소가 필요로 표시된 호실은 그 날짜를 그대로 쓴다. 리터치/추가청소는
   수동 관리이며 예정일을 입력하지 않았으면 date를 null로 둔다(카드 목록엔 "오늘"로
   표시되지만, 날짜가 없어 주간표에는 올릴 수 없음 — 소비하는 쪽에서 구분해서 처리한다). */
function collectCleaningEntries(){
  const entries = [];
  DB.rooms.filter(r=> (r.needsCleaning || r.needsRetouch || r.needsExtraCleaning) && hasBranchAccess(r.branchId)).forEach(r=>{
    const branch = DB.branches.find(b=>b.id===r.branchId);
    const kind = roomMaintKind(r);
    entries.push({ type:kind, branch, room:r, date: r.maintenanceDate || (kind==='moveout' ? todayISO() : null) });
  });
  DB.residents.filter(p=> p.scheduledToLeave && p.moveOut).forEach(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room || roomMaintKind(room) || !hasBranchAccess(room.branchId)) return;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    entries.push({ type:'moveout', branch, room, date: nextMonWedFri(p.moveOut) });
  });
  return entries;
}

function goToBranchRooms(branchId){
  UI.view='branch'; UI.branchId = branchId; UI.branchTab='rooms'; UI.roomStatusFilter='이용중'; render();

function mondayOf(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function renderCleaningWeekMatrix(){
  if(!UI.cleanWeekStart) UI.cleanWeekStart = mondayOf(todayISO());

  const box = document.createElement('div');
  box.className = 'stat-section';

  const weekDates = [0,1,2,3,4,5,6].map(i=> addDaysISO(UI.cleanWeekStart, i));
  const today = todayISO();

  const head = document.createElement('div');
  head.className = 'cal-head';
  const spacer = document.createElement('div');
  spacer.className = 'cal-head-spacer';
  const nav = document.createElement('div');
  nav.className = 'cal-head-nav';
  const prevBtn = document.createElement('button'); prevBtn.className='btn small'; prevBtn.textContent='◀';
  const nextBtn = document.createElement('button'); nextBtn.className='btn small'; nextBtn.textContent='▶';
  const title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = `${weekDates[0].slice(0,4)}년 ${Number(weekDates[0].slice(5,7))}월 청소 필요 현황`;
  prevBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, -7); render(); };
  nextBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, 7); render(); };
  nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
  head.appendChild(spacer); head.appendChild(nav);
  box.appendChild(head);

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML = `<span class="cal-legend-item">클릭 시 계약/입실관리의 해당 지점으로 이동 · 해당 없는 항목은 표시하지 않음</span>`;
  box.appendChild(legend);

  const branches = allowedBranches();
  if(branches.length===0){
    box.appendChild(el('div','cleaning-empty','지점이 없습니다.'));
    return box;
  }

  const entries = collectCleaningEntries().filter(e=> e.date && weekDates.includes(e.date));
  const grid = new Map(); // branchId -> date -> {moveout:[room번호...], retouch:[...], extra:[...]}
  entries.forEach(e=>{
    const bkey = e.branch ? e.branch.id : '__none__';
    if(!grid.has(bkey)) grid.set(bkey, new Map());
    const dmap = grid.get(bkey);
    if(!dmap.has(e.date)) dmap.set(e.date, { moveout:[], retouch:[], extra:[] });
    dmap.get(e.date)[e.type].push(e.room.number);
  });

  function chipsHtml(dayEntry, branchName, dateLabel){
    return Object.keys(MAINT_KIND_META).filter(k=> dayEntry[k] && dayEntry[k].length).map(k=>{
      const rooms = dayEntry[k];
      const roomsText = rooms.map(n=> n+'호').join(', ');
      const tip = `${branchName} · ${roomsText} · ${MAINT_KIND_META[k].label} · 청소예정일 ${dateLabel}`;
      return `<span class="cal-chip ${k}" title="${esc(tip)}">${MAINT_KIND_META[k].label}(${rooms.length})</span>`;
    }).join('');
  }

  const DOW = ['월','화','수','목','금','토','일'];
  const table = document.createElement('table');
  table.className = 'branch-table week-matrix';
  const theadCells = weekDates.map((d,i)=> `<th${d===today?' class="wk-today"':''}>${DOW[i]}<br><span class="wk-date">${d.slice(5)}</span></th>`).join('');
  table.innerHTML = `<thead><tr><th>지점</th>${theadCells}</tr></thead>`;
  const tbody = document.createElement('tbody');

  branches.forEach(branch=>{
    const dmap = grid.get(branch.id);
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.innerHTML = `<a href="#" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(branch))}</a>`;
    nameTd.querySelector('a').onclick = (e)=>{ e.preventDefault(); goToBranchRooms(branch.id); };
    tr.appendChild(nameTd);

    weekDates.forEach(d=>{
      const counts = dmap ? dmap.get(d) : null;
      const td = document.createElement('td');
      td.className = 'wk-cell' + (d===today?' wk-today':'') + (counts ? '' : ' wk-empty');
      td.innerHTML = counts ? `<div class="wk-chips">${chipsHtml(counts, branchLabel(branch), d.slice(5))}</div>` : '-';
      if(counts){
        td.style.cursor = 'pointer';
        td.onclick = ()=> goToBranchRooms(branch.id);
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  scrollWrap.appendChild(table);
  box.appendChild(scrollWrap);
  return box;
}

function renderCleaningCards(){
  const wrap = document.createElement('div');
  wrap.className = 'cleaning-cards-grid';

  const today = todayISO();
  const weekAhead = addDaysISO(today, 7);
  const entries = collectCleaningEntries();

    .sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));
  const futureList = entries.filter(x=> x.date && x.date>today && x.date<=weekAhead)
    .sort((a,b)=> a.date.localeCompare(b.date));

  wrap.appendChild(renderTodayCleaningCard(todayList));
  wrap.appendChild(renderCleaningCard('청소 예정방 (7일 이내)', futureList, true));
  return wrap;
}

const CLEANING_CARD_PAGE_SIZE = 4;
function paginateCleaningList(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / CLEANING_CARD_PAGE_SIZE));
  const clamped = Math.min(Math.max(page, 1), totalPages);
  const start = (clamped - 1) * CLEANING_CARD_PAGE_SIZE;
  return { pageList: list.slice(start, start + CLEANING_CARD_PAGE_SIZE), totalPages, page: clamped };
}
function appendCleaningPager(header, totalPages, currentPage, onPage){
  if(totalPages <= 1) return;
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  pager.style.marginTop = '0';
  for(let p=1; p<=totalPages; p++){
    const pBtn = document.createElement('button');
    pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
    pBtn.textContent = String(p);
    pBtn.onclick = ()=> onPage(p);
    pager.appendChild(pBtn);
  }
  header.appendChild(pager);
}

/* ---------------- custom alert/confirm (샌드박스 iframe에서 window.alert/confirm이
   막히는 경우를 대비해 네이티브 다이얼로그 대신 사용) ---------------- */
function showAlert(message){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.style.color = 'var(--st-hold)';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  okBtn.onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}
function showConfirm(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn';
  cancelBtn.textContent = '취소';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn danger';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  cancelBtn.onclick = close;
  okBtn.onclick = ()=>{ close(); onConfirm(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}

function showExtendChoiceModal(p, room, onApply){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  function tryApply(newMoveOut, confirmMsg){
    const violation = wouldExceedParking(p, p.moveIn, newMoveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
      return;
    }
    const apply = ()=>{ close(); onApply(newMoveOut); };
    if(confirmMsg) showConfirm(confirmMsg, apply);
    else apply();
  }

  function renderChoices(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 연장</div>`;
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    const oneMonthBtn = document.createElement('button');
    oneMonthBtn.className = 'btn';
    oneMonthBtn.textContent = '한달연장 (퇴실예정일 기준 1개월 뒤)';
    oneMonthBtn.onclick = ()=>{
      const newMoveOut = addOneMonth(p.moveOut || p.moveIn || todayISO());
      tryApply(newMoveOut, `퇴실예정일을 ${newMoveOut}로 연장할까요? (기존 퇴실예정일 기준 1개월 뒤)`);
    };

    const shortBtn = document.createElement('button');
    shortBtn.className = 'btn';
    shortBtn.textContent = '단기연장 (날짜 지정)';
    shortBtn.onclick = renderShortStep;

    btnCol.appendChild(oneMonthBtn); btnCol.appendChild(shortBtn);
    box.appendChild(btnCol);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }

  function renderShortStep(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 단기연장 - 날짜 지정</div>`;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = p.moveOut || todayISO();
    dateInput.style.width = '100%';
    const dateRow = labeledReq('연장할 퇴실예정일', dateInput);
    dateRow.style.marginBottom = '14px';
    box.appendChild(dateRow);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn'; backBtn.textContent = '뒤로';
    backBtn.onclick = renderChoices;
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '확인';
    okBtn.onclick = ()=>{
      const chosen = dateInput.value;
      if(!chosen){ showAlert('연장할 날짜를 선택해주세요.'); return; }
      tryApply(chosen, null);
    };
    btnRow.appendChild(backBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
  }

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  renderChoices();
}

function showLeaveChoiceModal(p, room){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  function renderChoices(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 퇴실 처리</div>`;
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    const expireBtn = document.createElement('button');
    expireBtn.className = 'btn';
    expireBtn.textContent = `만기퇴실 (계약 종료일: ${p.moveOut || '미정'})`;
    expireBtn.title = '계약 종료일 기준으로 퇴실 처리합니다';
    expireBtn.onclick = ()=>{
      if(!p.moveOut){ showAlert('퇴실예정일이 설정되어 있지 않습니다. 먼저 입실자 정보 수정에서 퇴실예정일을 입력해주세요.'); return; }
      showConfirm(`계약기간 종료일(${p.moveOut})로 퇴실 처리할까요?`, ()=>{
        const today = todayISO();
        if(p.moveOut <= today){
          moveResidentToHistory(p, p.moveOut);
        } else {
          p.scheduledToLeave = true;
          logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 만기퇴실 예약 (${p.moveOut})`);
        }
        scheduleSave();
        close(); render();
      });
    };

    const midBtn = document.createElement('button');
    midBtn.className = 'btn';
    midBtn.textContent = '중도퇴실 (날짜 지정)';
    midBtn.onclick = renderMidTermStep;

    const sameDayBtn = document.createElement('button');
    sameDayBtn.className = 'btn danger';
    sameDayBtn.textContent = '당일퇴실 (오늘 날짜로 즉시 처리)';
    sameDayBtn.onclick = ()=>{
      const today = todayISO();
      showConfirm(`${p.name || '이 입실자'}를 오늘(${today}) 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
        moveResidentToHistory(p, today);
        scheduleSave();
        close(); render();
      });
    };

    btnCol.appendChild(expireBtn); btnCol.appendChild(midBtn); btnCol.appendChild(sameDayBtn);
    box.appendChild(btnCol);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }

  function renderMidTermStep(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 중도퇴실 - 날짜 지정</div>`;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = p.moveOut || todayISO();
    dateInput.style.width = '100%';
    const dateRow = labeledReq('퇴실 날짜', dateInput);
    dateRow.style.marginBottom = '14px';
    box.appendChild(dateRow);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn'; backBtn.textContent = '뒤로';
    backBtn.onclick = renderChoices;
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '확인';
    okBtn.onclick = ()=>{
      const chosen = dateInput.value;
      if(!chosen){ showAlert('퇴실 날짜를 선택해주세요.'); return; }
      const today = todayISO();
      if(chosen > today){
        p.moveOut = chosen;
        p.scheduledToLeave = true;
        logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 중도퇴실 예약 (${chosen})`);
        scheduleSave();
        close(); render();
      } else {
        showConfirm(`${p.name || '이 입실자'}를 ${chosen} 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
          moveResidentToHistory(p, chosen);
          scheduleSave();
          close(); render();
        });
      }
    };
    btnRow.appendChild(backBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
  }

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  renderChoices();
}

function showRoomMoveModal(p, room){
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  const candidates = (branch ? DB.rooms.filter(r=> r.branchId===branch.id && r.id!==room.id && !roomHasActiveResident(r)) : [])
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 방이동</div>`;

  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';

  if(candidates.length===0){
    box.appendChild(el('div','cleaning-empty','같은 지점에 이동 가능한(입실자가 없는) 방이 없습니다.'));
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    return;
  }

  const roomSel = document.createElement('select');
  roomSel.style.width = '100%';
  candidates.forEach(r=>{
    const o = document.createElement('option');
    o.value = r.id;
    o.textContent = `${r.number}호 (${r.type})`;
    roomSel.appendChild(o);
  });
  const roomRow = labeledReq('이동할 방', roomSel);
  roomRow.style.marginBottom = '12px';
  box.appendChild(roomRow);

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = todayISO();
  dateInput.style.width = '100%';
  const dateRow = labeledReq('이동 날짜', dateInput);
  dateRow.style.marginBottom = '14px';
  box.appendChild(dateRow);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = close;
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '확인';
  okBtn.onclick = ()=>{
    const toRoom = DB.rooms.find(r=>r.id===roomSel.value);
    const moveDate = dateInput.value;
    if(!toRoom || !moveDate){ showAlert('이동할 방과 날짜를 선택해주세요.'); return; }
    const today = todayISO();
    if(moveDate > today){
      showConfirm(`${moveDate}에 ${room.number}호 → ${toRoom.number}호로 방이동 예정 등록할까요?`, ()=>{
        p.pendingRoomMove = { toRoomId: toRoom.id, date: moveDate };
        logChange(`${room.number}호 → ${toRoom.number}호 방이동 예약 (${moveDate}) - "${p.name}"`);
        scheduleSave();
        close(); render();
      });
    } else {
      showConfirm(`${room.number}호 → ${toRoom.number}호로 지금 방이동 처리할까요?`, ()=>{
        executeRoomMove(p, room, toRoom, moveDate);
        scheduleSave();
        close(); render();
      });
    }
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function executeRoomMove(p, fromRoom, toRoom, moveDate){
  moveResidentToHistory(p, moveDate);
  const carriedMoveOut = (p.moveOut && p.moveOut > moveDate) ? p.moveOut : '';
  const newP = {
    id: uid('p'), roomId: toRoom.id, name: p.name, channel: p.channel, resStatus:'', contractType:'이동',
    moveIn: moveDate, moveOut: carriedMoveOut, originalMoveIn: moveDate, scheduledToLeave:false,
    phone: p.phone, memo: p.memo, carNumber: p.carNumber, firstSaveDone:true, slotIndex:0
  };
  newP.resStatus = computeResStatus(newP);
  DB.residents.push(newP);
  logChange(`${fromRoom.number}호 → ${toRoom.number}호 방이동 처리 ("${p.name}")`);
}

function processPendingRoomMoves(){
  const today = todayISO();
  const due = DB.residents.filter(p => p.pendingRoomMove && p.pendingRoomMove.date <= today);
  if(due.length===0) return;
  due.forEach(p=>{
    const fromRoom = DB.rooms.find(r=>r.id===p.roomId);
    const toRoom = DB.rooms.find(r=>r.id===p.pendingRoomMove.toRoomId);
    if(!fromRoom || !toRoom){ delete p.pendingRoomMove; return; }
    if(roomHasActiveResident(toRoom)) return; // 대상 방이 그 사이 다시 채워졌으면 보류
    const moveDate = p.pendingRoomMove.date;
    delete p.pendingRoomMove;
    executeRoomMove(p, fromRoom, toRoom, moveDate);
  });
  scheduleSave();
}

function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function initApp(user){
  CURRENT_USER = { uid: user.uid, email: user.email };
  indexEmail(user.email); // 기존 계정(이 색인 기능 도입 이전 가입)도 로그인 시 자동으로 채워 넣습니다.

  let roleDoc;
  try{
    roleDoc = await USERS_COL.doc(user.uid).get();
  }catch(e){
    console.error('사용자 권한 조회 실패:', e);
    showAlert('사용자 정보를 불러오지 못했습니다. 네트워크를 확인하거나 관리자에게 문의해주세요.');
    firebase.auth().signOut();
    return;
  }

  if(!roleDoc.exists){
    // 이전 방식으로 만든 계정 등, users 문서가 없는 경우 안전하게 대기 상태로 생성
    await USERS_COL.doc(user.uid).set({ email: user.email, role:'pending', createdAt: new Date().toISOString() });
    USER_ROLE = 'pending';
  } else {
    const roleData = roleDoc.data();
    USER_ROLE = roleData.role || 'pending';
    USER_BRANCH_SCOPE = roleData.branchScope || 'all';
    USER_BRANCH_IDS = Array.isArray(roleData.branchIds) ? roleData.branchIds : null;
  }

  if(USER_ROLE === 'pending'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'flex';
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[USER_ROLE] || USER_ROLE;
  const loggedInAs = document.getElementById('loggedInAs');
  if(loggedInAs) loggedInAs.textContent = `${user.email} (${roleLabel})`;

  DB = await loadState();
  DB.residentHistory = DB.residentHistory || [];
  DB.contracts = DB.contracts || [];
  DB.channelList = (DB.channelList && DB.channelList.length) ? DB.channelList : [...DEFAULT_CHANNEL_LIST];
  // 과거 버전에서 "완료" 없이 새로고침 등으로 남겨졌을 수 있는 미확정 입실자(이름 미입력 등) 정리
  const beforeCount = DB.residents.length;
  DB.residents = DB.residents.filter(p => p.firstSaveDone !== false);
  if(canEdit() && DB.residents.length !== beforeCount) scheduleSave();
  DB.residents.forEach(p => {
    if(p.originalMoveIn == null) p.originalMoveIn = p.moveIn || '';
    if(p.scheduledToLeave == null) p.scheduledToLeave = false;
    p.resStatus = computeResStatus(p);
  });
  if(canEdit()) processScheduledLeaves();
  if(canEdit()) processPendingRoomMoves();
  let statusFixed = false;
  DB.rooms.forEach(room=>{
    if(!roomHasActiveResident(room) && !STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
      statusFixed = true;
    }
  });
  if(canEdit() && statusFixed) scheduleSave();
  UI.branchId = allowedBranches()[0] ? allowedBranches()[0].id : null;
  if(!isSuperAdmin()) UI.view = 'branch'; // 슈퍼어드민이 아니면 전체 통계 대신 지점 대시보드로 바로 진입
  render();
  document.getElementById('savedNote').textContent = '자동 저장됨 · 이 대시보드를 사용하는 모든 사람에게 공유됩니다';

  if(isSuperAdmin()) checkPendingRequests();
}

async function checkPendingRequests(){
  try{
    const snap = await USERS_COL.where('role','==','pending').get();
    if(snap.empty) return;
    showAlert(`승인 대기 중인 계정 요청이 ${snap.size}건 있습니다.\n"관리자 설정" 화면의 "사용자 관리"에서 확인해주세요.`);
  }catch(e){ console.error('승인 대기 확인 실패:', e); }
}

document.getElementById('loginBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  if(!email || !password){ errBox.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
  firebase.auth().signInWithEmailAndPassword(email, password)
    .catch(err=>{
      const map = {
        'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
        'auth/user-not-found': '등록되지 않은 계정입니다. 관리자에게 계정 생성을 요청해주세요.',
        'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
        'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
        'auth/too-many-requests': '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.'
      };
      errBox.textContent = map[err.code] || ('로그인 실패: ' + err.message);
    });
});

function showRequestAccountModal(prefillEmail){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:12px;font-weight:700;">계정 요청</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
      가입 즉시 사용은 불가하며, 관리자 승인 후 로그인할 수 있습니다.
    </div>
    <label class="field-label">이메일</label>
    <input type="email" id="reqEmail" style="width:100%;margin-bottom:10px;" value="${esc(prefillEmail||'')}">
    <label class="field-label">비밀번호 (6자 이상)</label>
    <input type="password" id="reqPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">비밀번호 확인</label>
    <input type="password" id="reqPw2" style="width:100%;margin-bottom:10px;">
    <label class="field-label">이름</label>
    <input type="text" id="reqName" style="width:100%;margin-bottom:10px;">
    <label class="field-label">연락처</label>
    <input type="tel" id="reqPhone" placeholder="010-0000-0000" style="width:100%;margin-bottom:10px;">
    <label class="field-label">희망 권한</label>
    <select id="reqRole" style="width:100%;">
      <option value="viewer">조회 전용</option>
      <option value="editor">수정 가능</option>
    </select>
    <div class="login-error" id="reqError"></div>
  `;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  btnRow.style.marginTop = '14px';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = ()=> overlay.remove();
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '계정 요청';
  okBtn.onclick = ()=>{
    const email = document.getElementById('reqEmail').value.trim();
    const pw = document.getElementById('reqPw').value;
    const pw2 = document.getElementById('reqPw2').value;
    const name = document.getElementById('reqName').value.trim();
    const phone = document.getElementById('reqPhone').value.trim();
    const requestedRole = document.getElementById('reqRole').value;
    const err = document.getElementById('reqError');
    err.style.color = 'var(--st-hold)';
    if(!email || !pw || !pw2 || !name || !phone){ err.textContent = '모든 항목을 입력해주세요.'; return; }
    if(pw.length < 6){ err.textContent = '비밀번호는 6자 이상이어야 합니다.'; return; }
    if(pw !== pw2){ err.textContent = '비밀번호가 서로 일치하지 않습니다.'; return; }
    suppressAuthHandling = true;
    firebase.auth().createUserWithEmailAndPassword(email, pw)
      .then(cred=> USERS_COL.doc(cred.user.uid).set({ email, role:'pending', requestedRole, name, phone, createdAt: new Date().toISOString() })
        .then(()=> indexEmail(email))
        .then(()=> firebase.auth().signOut()))
      .then(()=>{
        suppressAuthHandling = false;
        overlay.remove();
        showLoginScreen();
        showAlert('계정 요청이 접수되었습니다. 관리자 승인 후 로그인해주세요.');
      })
      .catch(e=>{
        suppressAuthHandling = false;
        const map = {
          'auth/email-already-in-use': '이미 등록된 이메일입니다.',
          'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
          'auth/weak-password': '비밀번호가 너무 약합니다.'
        };
        err.textContent = map[e.code] || ('오류: ' + e.message);
      });
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
document.getElementById('forgotPwLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('loginError');
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ errBox.style.color = 'var(--st-hold)'; errBox.textContent = '먼저 이메일을 입력한 뒤 눌러주세요.'; return; }
  errBox.style.color = 'var(--ink-soft)';
  errBox.textContent = '계정 확인 중…';
  // Firebase의 "이메일 열거 보호"가 켜져 있으면 sendPasswordResetEmail이 존재하지 않는
  // 이메일에도 에러 없이 성공 처리되어(메일은 실제로 발송되지 않음) 혼란을 줍니다.
  // 그래서 자체 emailIndex 컬렉션으로 가입 여부를 먼저 확인합니다.
  EMAIL_INDEX_COL.doc(normalizeEmailKey(email)).get().then(snap=>{
    if(!snap.exists){
      errBox.style.color = 'var(--st-hold)';
      errBox.textContent = `등록되지 않은 이메일입니다. 먼저 "계정 요청"으로 사용 신청을 해주세요.`;
      showRequestAccountModal(email);
      return;
    }
    return firebase.auth().sendPasswordResetEmail(email).then(()=>{
      errBox.style.color = 'var(--st-occupied)';
      errBox.textContent = `${email} 주소로 비밀번호 재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해주세요.`;
    }).catch(err=>{
      errBox.style.color = 'var(--st-hold)';
      errBox.textContent = '오류: ' + err.message;
    });
  }).catch(err=>{
    errBox.style.color = 'var(--st-hold)';
    errBox.textContent = '계정 확인 중 오류가 발생했습니다: ' + err.message;
  });
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  showConfirm('로그아웃할까요?', ()=> firebase.auth().signOut());
});
document.getElementById('changePwBtn').addEventListener('click', showChangePasswordModal);
document.getElementById('homeLink').addEventListener('click', ()=>{ UI.view = 'stats'; render(); });

(function(){
  const searchInput = document.getElementById('globalSearchInput');
  const searchWrap = document.getElementById('headerSearchWrap');
  searchInput.addEventListener('input', ()=> renderGlobalSearchResults(searchInput.value));
  searchInput.addEventListener('focus', ()=>{ if(searchInput.value.trim()) renderGlobalSearchResults(searchInput.value); });
  searchInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      searchInput.value = '';
      document.getElementById('globalSearchResults').style.display = 'none';
      searchInput.blur();
    }
  });
  document.addEventListener('click', (e)=>{
    if(!searchWrap.contains(e.target)) document.getElementById('globalSearchResults').style.display = 'none';
  });
})();

function showChangePasswordModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:12px;font-weight:700;">비밀번호 변경</div>
    <label class="field-label">현재 비밀번호</label>
    <input type="password" id="curPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">새 비밀번호 (6자 이상)</label>
    <input type="password" id="newPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">새 비밀번호 확인</label>
    <input type="password" id="newPw2" style="width:100%;">
    <div class="login-error" id="pwChangeError"></div>
  `;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  btnRow.style.marginTop = '14px';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = ()=> overlay.remove();
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '변경';
  okBtn.onclick = ()=>{
    const curPw = document.getElementById('curPw').value;
    const newPw = document.getElementById('newPw').value;
    const newPw2 = document.getElementById('newPw2').value;
    const err = document.getElementById('pwChangeError');
    err.style.color = 'var(--st-hold)';
    if(!curPw || !newPw || !newPw2){ err.textContent = '모든 항목을 입력해주세요.'; return; }
    if(newPw.length < 6){ err.textContent = '새 비밀번호는 6자 이상이어야 합니다.'; return; }
    if(newPw !== newPw2){ err.textContent = '새 비밀번호가 서로 일치하지 않습니다.'; return; }
    const user = firebase.auth().currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, curPw);
    user.reauthenticateWithCredential(cred)
      .then(()=> user.updatePassword(newPw))
      .then(()=>{
        overlay.remove();
        showAlert('비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용해주세요.');
      })
      .catch(e=>{
        err.textContent = e.code === 'auth/wrong-password' ? '현재 비밀번호가 올바르지 않습니다.' : ('오류: ' + e.message);
      });
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

let suppressAuthHandling = false;
firebase.auth().onAuthStateChanged(user=>{
  if(suppressAuthHandling) return;
  if(user){ initApp(user); }
  else { showLoginScreen(); }
});
</script>
