/* ---------------- rooms section ---------------- */
function roomNumberTaken(branchId, number, excludeRoomId){
  const norm = String(number).replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();
  return DB.rooms.some(r => r.branchId===branchId && r.id!==excludeRoomId && String(r.number).replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase()===norm);
}

function roomHasScheduledLeaveResident(room){
  return DB.residents.some(p => p.roomId===room.id && p.scheduledToLeave && isCurrentlyResiding(p));
}
function roomIsLeavingSoon(room){
  return roomHasScheduledLeaveResident(room) || effectiveRoomStatus(room)==='퇴실확정';
}
function roomHasPaymentProxy(room){
  return DB.residents.some(p=> p.roomId===room.id && p.paymentProxy);
}
function roomHasJustImportedResident(room){
  return DB.residents.some(p=> p.roomId===room.id && p.justImported);
}
function roomHasDoubleOccupancy(room){
  return DB.residents.some(p=> p.roomId===room.id && p.doubleOccupancy);
}
const ROOM_TAB_LIST = ['전체', ...STATUS_LIST_STATS, '대리결제', '예약', '2인 거주'];
function roomsInFilterTab(rooms, s){
  if(s === '전체') return rooms;
  if(s === '퇴실확정') return rooms.filter(roomIsLeavingSoon);
  if(s === '대리결제') return rooms.filter(roomHasPaymentProxy);
  // "예약"에는 스태프가 직접 체크한 예약 플래그뿐 아니라, 입실예정일이 많이 남아 "입실확정"으로
  // 분류된 방(effectiveRoomStatus 참고)도 예약 건으로 합산한다 — 둘 다 "아직 실입주는 없지만
  // 이 방은 향후 특정 입실자에게 배정돼있다"는 같은 의미라, 대시보드 수치와 여기 목록이 항상
  // 일치하도록 같은 조건을 쓴다.
  if(s === '예약') return rooms.filter(r=> r.reserved || roomTabs(r).includes('입실확정'));
  if(s === '계약 확인 필요') return rooms.filter(roomHasJustImportedResident);
  if(s === '2인 거주') return rooms.filter(roomHasDoubleOccupancy);
  return rooms.filter(r=> roomTabs(r).includes(s));
}
function renderRoomsSection(branch){
  const wrap = document.createElement('div');
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);

  const status = UI.roomStatusFilter || '전체';
  const meta = statusMeta(status);

  const toolbar = document.createElement('div');
  toolbar.className = 'room-toolbar';
  const legend = document.createElement('div');
  legend.className = 'legend';
  // "계약 확인 필요"는 계약 데이터 붙여넣기로 새로 등록되었거나 계약 이력이 갱신된 입실자를
  // 담당자가 확인하기 전까지만 임시로 보여주는 탭이라, 해당 지점에 대상이 있을 때만 노출한다.
  const tabList = rooms.some(roomHasJustImportedResident) ? [...ROOM_TAB_LIST, '계약 확인 필요'] : ROOM_TAB_LIST;
  tabList.forEach(s=>{
    const m = statusMeta(s);
    const cnt = roomsInFilterTab(rooms, s).length;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'badge legend-btn' + (status === s ? ' active' : '');
    btn.style.background = m.bg; btn.style.color = m.fg;
    btn.innerHTML = `<span class="dot" style="background:${m.fg}"></span>${s}(${cnt})`;
    btn.title = `${s} 호실만 모아보기`;
    btn.onclick = ()=>{ UI.roomStatusFilter = s; render(); };
    legend.appendChild(btn);
  });
  toolbar.appendChild(legend);
  wrap.appendChild(toolbar);

  if(rooms.length===0){
    wrap.appendChild(el('div','empty-hint','등록된 호실이 없습니다.'));
    return wrap;
  }

  const inStatus = roomsInFilterTab(rooms, status)
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  const section = document.createElement('div');
  section.className = 'status-section';
  const head = document.createElement('div');
  head.className = 'sec-head';
  head.style.borderColor = meta.fg;
  head.innerHTML = `
    <span class="dot" style="background:${meta.fg}"></span>
    <span class="name" style="color:${meta.fg}">${status}</span>
    <span class="count-badge" style="background:${meta.bg};color:${meta.fg};">${inStatus.length}개</span>
  `;
  section.appendChild(head);

  if(inStatus.length===0){
    section.appendChild(el('div','sec-empty', `${status} 상태의 호실이 없습니다.`));
  } else {
    const grid = document.createElement('div');
    grid.className = 'grid-rooms';
    inStatus.forEach(room => grid.appendChild(renderRoomCard(room, status)));
    section.appendChild(grid);
  }
  wrap.appendChild(section);

  return wrap;
}

function addResidentToRoom(room){
  const cap = occupancyCapacity(room);
  const confirmedCount = DB.residents.filter(p=>p.roomId===room.id).length;
  const hasDraft = !!UI.draftResident[room.id];
  if(confirmedCount + (hasDraft?1:0) >= cap){
    showAlert(`이 호실(${room.occupancy || '2인실'})은 최대 ${cap}인까지만 입실 가능합니다.`);
    return;
  }
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: todayISO(), moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex: confirmedCount,
    paymentProxy:false, actualResidentName:'', actualResidentPhone:'' };
  p.resStatus = computeResStatus(p);
  // 최초 입력 중에는 DB에 반영하지 않고 화면(초안) 상태로만 유지합니다.
  // "완료"를 눌러야 실제로 저장되고, 취소/새로고침 시 남지 않습니다.
  UI.draftResident[room.id] = p;
  render();
}
function roomHasVacatingResident(room){
  return DB.residents.some(p=>p.roomId===room.id && (p.scheduledToLeave || p.pendingRoomMove));
}
function roomHasUpcomingResident(room){
  // 이미 등록된 입실예정자가 있어도, 그 사람이 단기 이용 후 퇴실확정된 상태라면 "다음 예약자"를
  // 미리 등록할 수 있어야 하므로, 퇴실확정된 입실예정자는 여기서 제외한다.
  return DB.residents.some(p=>p.roomId===room.id && computeResStatus(p)==='입실예정' && !p.scheduledToLeave);
}
function addUpcomingResidentToRoom(room){
  if(UI.draftResident[room.id]){
    showAlert('이미 등록 중인 입실자가 있습니다. 먼저 완료하거나 취소해주세요.');
    return;
  }
  const leaving = DB.residents.filter(p=>p.roomId===room.id && p.scheduledToLeave);
  const defaultMoveIn = leaving.length===1 ? (leaving[0].moveOut || '') : '';
  // 정원이 이미 찬 방이지만, 현재 입실자가 모두 퇴실예정으로 확정된 경우에 한해
  // 다음 입실자를 미리 등록할 수 있도록 slotIndex 0(주 입실자 자리)을 그대로 사용합니다.
  // 실제 퇴실 처리(moveResidentToHistory)가 되면 기존 입실자만 제거되어 자연스럽게 정리됩니다.
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: defaultMoveIn, moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex:0,
    paymentProxy:false, actualResidentName:'', actualResidentPhone:'' };
  p.resStatus = computeResStatus(p);
  UI.draftResident[room.id] = p;
  render();
}

/* ---------------- room card: view mode ---------------- */
function computeResStatus(p){
  // 입실 시작일 기준 자동 계산 (화면에는 노출하지 않고 내부 데이터로만 사용)
  if(!p.moveIn) return p.resStatus || '입실중';
  const today = todayISO();
  if(p.moveIn > today) return '입실예정';
  if(p.moveIn === today) return '입실중';
  return '퇴실';
}
function isCurrentlyResiding(p){
  // 입실일이 이미 지났고(오늘 포함) 아직 퇴실 처리가 되지 않았다면 "이용중"으로 간주합니다.
  // 퇴실예정일이 지났더라도 실제 퇴실 처리(히스토리 이동) 전까지는 계속 이용중으로 봅니다.
  if(!p.moveIn) return false;
  return p.moveIn <= todayISO();
}
function isOverdue(p){
  return !!(p.moveOut && p.moveOut < todayISO());
}
function isUpcoming(p){
  return !!(p.moveIn && p.moveIn > todayISO());
}
function occupiesRoom(p){
  return isCurrentlyResiding(p) || isUpcoming(p);
}
function roomHasOverdueResident(room){
  return DB.residents.some(p => p.roomId===room.id && isOverdue(p));
}
// 만기/중도 퇴실 예약(아직 실제로 퇴실 처리되진 않은 미래 날짜)과 실제 퇴실 처리(당일퇴실,
// 또는 예약일이 지나 처리되는 경우) 둘 다 이 방이 앞으로 비게 될 예정이면 퇴실청소 날짜를
// 같은 방식으로 미리 표시해준다. sourceResidentId를 남겨두면, 그 입실자가 나중에 연장으로
// 마음을 바꿨을 때 이 플래그가 그 사람 때문에 걸린 것인지 알 수 있어 안전하게 되돌릴 수 있다
// (실제로 퇴실 처리된 경우처럼 되돌릴 대상이 없을 땐 생략한다).
// AUTO_CLEANING_EXCLUDED_BRANCH_NAMES(제주·오산 등)는 일반 고시원과 다르게 운영되어(현장에서
// 별도로 청소를 관리), 퇴실확정되어도 청소필요 플래그를 자동으로 걸지 않는다 — 이 함수 하나만
// 막으면 실제 퇴실 처리·만기퇴실 예약·중도퇴실 예약(호출부 3곳) 모두 자동으로 제외된다.
function flagUpcomingCleaning(room, cleaningBaseDate, sourceResidentId){
  if(isAutoCleaningExcludedBranch(roomBranch(room))) return;
  room.needsCleaning = true;
  room.needsRetouch = false;
  room.needsExtraCleaning = false;
  room.maintenanceDate = nextMonWedFri(cleaningBaseDate);
  room.maintenanceMemo = '';
  room.cleaningFlagSourceId = sourceResidentId || null;
}
// 이 입실자(excludeId)가 빠지고 나서도 그 방에 남아있는 재실/입실예정 입실자가 있는지 확인한다.
// roomHasActiveResident와 달리, 아직 DB.residents에서 빠지지 않은(=아직 퇴실 예약 상태인)
// 입실자 본인은 셈에서 제외해야 "이 사람이 나가면 방이 비는지"를 정확히 판단할 수 있다.
function roomWouldBeVacantExcept(room, excludeId){
  return !DB.residents.some(x=> x.roomId===room.id && x.id!==excludeId && occupiesRoom(x));
}
// 퇴실 예약 때문에 미리 걸어둔 퇴실청소 플래그를, 정작 그 입실자가 연장해서 계속 거주하기로
// 하면 취소한다. cleaningFlagSourceId로 "이 사람 때문에" 걸린 플래그인지 확인하므로, 다른
// 이유(2인실의 다른 입실자가 실제로 퇴실한 경우 등)로 이미 걸려있는 플래그는 건드리지 않는다.
function clearCleaningFlagIfSourcedFrom(room, residentId){
  if(room && room.cleaningFlagSourceId && room.cleaningFlagSourceId === residentId){
    room.needsCleaning = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
  }
}
function moveResidentToHistory(p, moveOutOverride){
  logChange(`${p.name || '입실자'} 퇴실 처리`);
  const historyEntry = {
    id: uid('h'), roomId: p.roomId,
    name: p.name || '(이름 미입력)', phone: p.phone || '',
    // 연장/직접 수정 등으로 입실일이 최초 등록 시점 이후 바뀌었을 수 있으므로, 항상 카드에
    // 남아있는 "지금" 값(p.moveIn)을 남긴다 — 최초 등록 당시 값(originalMoveIn)을 쓰면 그
    // 사이의 수정 내역이 무시되고 이전 기간으로 되돌아가 버린다.
    moveIn: p.moveIn || '', moveOut: moveOutOverride || p.moveOut || todayISO(),
    sourceContractId: p.sourceContractId || null,
    // 퇴실 처리 시점까지 입실자 카드에서 수정된 내용을 그대로 이력에 남긴다 — memo/대리결제/
    // 2인 거주 여부 등은 카드가 저장하고 있는 최신 값이 곧 여기서 남겨야 할 값이다.
    channel: p.channel || '', carNumber: p.carNumber || '',
    memo: p.memo || '', memoColor: p.memoColor || 'black', memoBold: !!p.memoBold,
    paymentProxy: !!p.paymentProxy, actualResidentName: p.actualResidentName || '', actualResidentPhone: p.actualResidentPhone || '',
    doubleOccupancy: !!p.doubleOccupancy
  };
  DB.residentHistory.push(historyEntry);
  RESIDENT_HISTORY_COL.doc(historyEntry.id).set(historyEntry).catch(e=> console.error('퇴실 이력 저장 실패:', e));
  refreshHistoryCache();
  DB.residents = DB.residents.filter(x=>x.id!==p.id);
  delete UI.residentEditMode[p.id];
  delete UI.residentSnapshots[p.id];
  // 마지막 재실 입실자가 퇴실한 뒤에도 저장된 상태값이 "이용중"처럼 더 이상 유효하지 않게
  // 남아있으면(과거 데이터 등) 공실로 정리합니다. 그 외에는 관리자가 이미 설정해둔 판매
  // 상태(예: 판매중)를 그대로 유지하며, 자동으로 바꾸지 않습니다.
  const room = DB.rooms.find(r=>r.id===p.roomId);
  if(room && !roomHasActiveResident(room)){
    if(!STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
    }
    flagUpcomingCleaning(room, todayISO());
  }
}
function restoreFromHistory(h){
  const room = DB.rooms.find(r=>r.id===h.roomId);
  if(!room){ showAlert('해당 호실을 찾을 수 없습니다. (삭제된 호실일 수 있어요)'); return; }
  const cap = occupancyCapacity(room);
  const currentCount = DB.residents.filter(p=>p.roomId===room.id).length;
  if(currentCount >= cap){
    showAlert(`이 호실은 이미 정원(${cap}인)이 가득 차 있어 복원할 수 없습니다. 먼저 자리를 비워주세요.`);
    return;
  }
  showConfirm(`"${h.name}" 님의 정보를 이 호실의 입실자로 복원할까요?`, ()=>{
    const usedSlots = new Set(DB.residents.filter(p=>p.roomId===room.id).map(p=>p.slotIndex||0));
    let freeSlot = 0;
    while(usedSlots.has(freeSlot)) freeSlot++;
    const p = {
      id: uid('p'), roomId: room.id, name: h.name, phone: h.phone,
      channel: h.channel || '독립생활', resStatus:'', contractType:'신규',
      moveIn: h.moveIn, moveOut: h.moveOut, originalMoveIn: h.moveIn, scheduledToLeave:false,
      carNumber: h.carNumber || '', memo: h.memo || '', memoColor: h.memoColor || 'black', memoBold: !!h.memoBold,
      paymentProxy: !!h.paymentProxy, actualResidentName: h.actualResidentName || '', actualResidentPhone: h.actualResidentPhone || '',
      doubleOccupancy: !!h.doubleOccupancy,
      firstSaveDone:true, slotIndex: freeSlot
    };
    p.resStatus = computeResStatus(p);
    DB.residents.push(p);
    DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
    RESIDENT_HISTORY_COL.doc(h.id).delete().catch(e=> console.error('퇴실 이력 삭제 실패:', e));
    refreshHistoryCache();
    UI.historyOpen[room.id] = false;
    // "복원" 버튼은 이 방에 재실 입실자가 하나도 없을 때만 나타나므로, 지금 복원하는 것 자체가
    // 그 공실 상태(=이 방의 현재 퇴실청소 플래그를 만든 바로 그 퇴실)를 되돌리는 것이다. 즉시
    // 퇴실 처리는 예약 퇴실과 달리 cleaningFlagSourceId를 남기지 않으므로, 여기서는 무조건
    // 지운다.
    room.needsCleaning = false;
    room.needsRetouch = false;
    room.needsExtraCleaning = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
    logChange(`"${h.name}" 님을 ${room.number}호 입실자로 복원`);
    scheduleSave(); render();
  });
}
function processScheduledLeaves(){
  const today = todayISO();
  const toLeave = DB.residents.filter(p => p.scheduledToLeave && p.moveOut && p.moveOut < today);
  if(toLeave.length===0) return;
  toLeave.forEach(p => moveResidentToHistory(p));
  scheduleSave();
}
function roomHasActiveResident(room){
  return DB.residents.some(p => p.roomId===room.id && occupiesRoom(p));
}
function branchParkingCombineGroup(branch){
  // 신대방삼거리역 A동/B동은 물리적으로 주차 공간을 나눠 쓰지 않고 하나로 관리하므로,
  // 이 지점들만 예외적으로 이용 현황(대수)을 항상 합산해서 보여준다. (다른 지점은 해당 없음)
  if(!branch || !cleanKeyLoose(branch.name).includes('신대방삼거리역')) return [branch].filter(Boolean);
  return DB.branches.filter(b=> cleanKeyLoose(b.name).includes('신대방삼거리역'));
}
function branchParkingCapCeiling(branch){
  // 합산 대상 지점끼리는 실제 물리적 주차 대수를 관리하는 B동 지점의 설정값을 초과 여부 판단 기준으로 쓴다.
  const group = branchParkingCombineGroup(branch);
  if(group.length <= 1) return branch.parkingCapacity || 0;
  const bBranch = group.find(b=> cleanKeyLoose(b.name).includes('B동'));
  return (bBranch || branch).parkingCapacity || 0;
}
function branchParkingGroupSuffix(branch){
  const group = branchParkingCombineGroup(branch);
  if(group.length <= 1) return '';
  return ` (${group.map(b=>branchLabel(b)).join('+')} 합산)`;
}
function branchActiveCarResidents(branch){
  const group = branchParkingCombineGroup(branch);
  const branchIds = new Set(group.map(b=>b.id));
  const isGrouped = group.length > 1;
  const roomIds = new Set(DB.rooms.filter(r=>branchIds.has(r.branchId)).map(r=>r.id));
  return DB.residents
    .filter(p => roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && occupiesRoom(p))
    .map(p => {
      const room = DB.rooms.find(r=>r.id===p.roomId);
      const roomBranch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
      return {
        roomNumber: room ? room.number : '-', name: maskViewerName(p.name) || '(이름 미입력)', carNumber: p.carNumber,
        branchLabel: (isGrouped && roomBranch) ? branchLabel(roomBranch) : ''
      };
    });
}
function branchActiveCarCount(branch, excludeResidentId){
  const group = branchParkingCombineGroup(branch);
  const branchIds = new Set(group.map(b=>b.id));
  const roomIds = new Set(DB.rooms.filter(r=>branchIds.has(r.branchId)).map(r=>r.id));
  const residentCount = DB.residents.filter(p =>
    p.id !== excludeResidentId && roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && occupiesRoom(p)
  ).length;
  return residentCount + branchExternalParkingCount(branch);
}
function branchExternalParkingList(branch){
  // 입실자와 무관하게 등록하는 외부 주차(직원·방문자 등). 지점의 전체 주차 대수에 함께 집계된다.
  const group = branchParkingCombineGroup(branch);
  const isGrouped = group.length > 1;
  const items = [];
  group.forEach(b=>{
    (b.externalParking||[]).forEach(item=>{
      items.push({ id: item.id, label: item.label || '외부', carNumber: item.carNumber, branchId: b.id, branchLabel: isGrouped ? branchLabel(b) : '' });
    });
  });
  return items;
}
function branchExternalParkingCount(branch){
  return branchExternalParkingList(branch).length;
}
// 오늘 날짜와 ISO 날짜 문자열(YYYY-MM-DD) 사이의 일수 차이. 미래 날짜면 양수.
function daysUntilISO(dateStr){
  return Math.round((new Date(dateStr) - new Date(todayISO())) / 86400000);
}
function effectiveRoomStatus(room){
  // "이용중"/"입실확정"/"이용중판매"/"단기판매"는 오늘 날짜 기준 재실·예약 여부로 자동 판정하며
  // 수동 설정 불가. 실제로 거주 중인 입실자가 있으면 기본은 "이용중"입니다. 다만 그 입실자가
  // 퇴실 예정(scheduledToLeave) 상태이고 판매 상태가 "판매중"이면 다음 입실자를 미리 구하는
  // 중이라는 뜻이므로 "이용중판매"로 표시합니다(이용중/판매중 탭 모두에 노출, roomTabs 참고).
  // 실거주자 없이 입실예정자만 있는 경우(판매중이 아닐 때), 입실예정일이 오늘 기준 5일 이내
  // (D-5 이내)면 임박한 입실이라 "이용중"으로, 6일 이상 남았으면(D-6 이상) 아직 임박하지 않은
  // 예약이라는 뜻으로 "입실확정"으로 구분합니다 — 한참 남은 예약 건까지 "이용중" 집계에 섞이지
  // 않도록 하기 위함입니다. 판매중으로 지정해두면 입실예정일이 임박했더라도(단기판매) 계속
  // "판매중" 집계(이용중/판매중 탭 모두에 노출)에 포함됩니다 — 아직 실제로 입실 전이라 판매중
  // 상태를 그대로 반영합니다. 단, 제주점은 예외입니다: 당일 기준 실제 재실 입실자가 없으면
  // (입실예정자만 있어도) "이용중"/"입실확정"으로 자동 전환하지 않고 지정해둔 판매 상태를
  // 그대로 보여줍니다.
  if(roomHasActiveResident(room)){
    const hasCurrent = DB.residents.some(p => p.roomId===room.id && isCurrentlyResiding(p));
    if(hasCurrent){
      if(room.saleStatus === '판매중' && roomHasScheduledLeaveResident(room)) return '이용중판매';
      return '이용중';
    }
    if(room.saleStatus !== '판매중'){
      if(isJejuBranch(roomBranch(room))) return room.saleStatus;
      const nearestUpcoming = DB.residents.filter(p=> p.roomId===room.id && isUpcoming(p))
        .sort((a,b)=> a.moveIn.localeCompare(b.moveIn))[0];
      if(nearestUpcoming && daysUntilISO(nearestUpcoming.moveIn) >= 6) return '입실확정';
      return '이용중';
    }
    return '단기판매';
  }
  return room.saleStatus;
}

function renderRoomCard(room, sectionStatus){
  const card = document.createElement('div');
  const effStatus = effectiveRoomStatus(room);
  const meta = statusMeta(effStatus);
  card.className = 'room-card';
  card.id = 'room-card-' + room.id;
  card.style.borderLeftColor = meta.fg;

  const residents = DB.residents.filter(p=>p.roomId===room.id);
  const draft = UI.draftResident[room.id] || null;
  const cap = occupancyCapacity(room);
  const atCapacity = (residents.length + (draft?1:0)) >= cap;
  const roomEditOn = !!UI.roomEditMode[room.id];

  const maintDateForBadge = room.maintenanceDate || roomUpcomingLeaveDate(room);
  const maintDateSuffix = maintDateForBadge ? ` · ${maintDateForBadge.slice(5)}` : '';
  const reserveMeta = statusMeta('예약');
  const isDouble = roomHasDoubleOccupancy(room);
  const priceBranch = DB.branches.find(b=>b.id===room.branchId);
  const priceTitle = isDouble
    ? `기존 방 가격 ${formatWon((priceBranch && priceBranch.typePrices && priceBranch.typePrices[room.type]) || 0)} + 1인 추가금 ${formatWon(branchDoubleOccupancyFee(priceBranch))}`
    : '';
  const headerRight = `
    <span class="badge" style="background:${meta.bg};color:${meta.fg}">${effStatus}</span>
    ${maintBadgeHtml(roomCardMaintKind(room), maintDateSuffix)}
    ${room.reserved ? `<span class="badge" style="background:${reserveMeta.bg};color:${reserveMeta.fg}">예약${room.reservationMoveIn ? ' · '+room.reservationMoveIn.slice(5) : ''}</span>` : ''}
  `;

  const header = document.createElement('div');
  header.className = 'rc-header';
  header.innerHTML = `
    <div class="rc-header-top">
      <div class="rc-title"><span class="roomno">${esc(room.number)}</span><span class="roomtype">${esc(room.type)}</span><span class="room-price"${priceTitle ? ` title="${esc(priceTitle)}"` : ''}>${formatWon(roomPrice(room))}</span></div>
    </div>
    <div class="rc-header-badges">${headerRight}</div>
  `;
  // 원격 출입문 제어 시스템(잇소키) 연동 여부 토글. 값이 아예 없으면(과거 데이터, 신규 호실)
  // 정상(연동)으로 간주해서, 실제로 미연결인 곳만 담당자가 따로 체크해서 표시하면 되도록 한다.
  const doorLinked = room.doorLinked !== false;
  const doorLockBtn = document.createElement('button');
  doorLockBtn.type = 'button';
  doorLockBtn.className = 'rc-door-lock' + (doorLinked ? '' : ' unlocked') + (canEdit() ? ' editable' : '');
  doorLockBtn.title = doorLinked
    ? '잇소키 연결됨 (정상)' + (canEdit() ? ' · 클릭 시 미연결로 표시' : '')
    : '잇소키 미연결 (확인 필요)' + (canEdit() ? ' · 클릭 시 연결로 표시' : '');
  doorLockBtn.innerHTML = doorLinked
    ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V7a4 4 0 0 1 7.3-2.2" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
  if(canEdit()){
    doorLockBtn.onclick = ()=>{
      const next = !doorLinked;
      logChange(`${room.number}호 잇소키 ${next ? '연결' : '미연결'}로 표시`);
      room.doorLinked = next;
      scheduleSave(); render();
    };
  }
  header.querySelector('.rc-title').appendChild(doorLockBtn);

  const historyOpen = !!UI.historyOpen[room.id];
  const historyBtn = document.createElement('button');
  historyBtn.className = 'history-btn' + (historyOpen ? ' active' : '');
  historyBtn.textContent = '히스토리';
  historyBtn.title = '퇴실한 입실자 이력 보기';
  historyBtn.onclick = ()=>{ UI.historyOpen[room.id] = !historyOpen; render(); };
  header.querySelector('.rc-header-badges').prepend(historyBtn);
  const contractBtn = document.createElement('button');
  const contractMismatch = contractEndDateMismatch(room);
  contractBtn.className = 'history-btn' + (contractMismatch ? ' contract-mismatch' : '');
  contractBtn.textContent = '계약현황';
  contractBtn.title = contractMismatch
    ? '최근 계약의 계약종료일과 입실자의 퇴실예정일이 달라요. 계약 정보를 확인해주세요.'
    : '계약 이력 보기';
  contractBtn.onclick = ()=> showContractHistoryModal(room);
  header.querySelector('.rc-header-badges').prepend(contractBtn);
  const cleanHistBtn = document.createElement('button');
  cleanHistBtn.className = 'history-btn';
  cleanHistBtn.textContent = '청소이력';
  cleanHistBtn.title = '청소/리터치 완료 이력 보기';
  cleanHistBtn.onclick = ()=> showCleaningHistoryModal(room);
  header.querySelector('.rc-header-badges').prepend(cleanHistBtn);
  const pencil = document.createElement('button');
  pencil.className = 'iconbtn' + (roomEditOn ? ' active' : '');
  pencil.innerHTML = roomEditOn ? '&#10003;' : '&#9998;';
  pencil.title = roomEditOn ? '수정 완료' : '방 정보 수정';
  pencil.onclick = ()=>{
    if(!roomEditOn){ UI.roomSnapshots[room.id] = Object.assign({}, room); }
    else { delete UI.roomSnapshots[room.id]; scheduleSave(); }
    UI.roomEditMode[room.id] = !roomEditOn; render();
  };
  if(canEdit()) header.querySelector('.rc-header-top').appendChild(pencil);
  card.appendChild(header);

  if(historyOpen){
    const hist = DB.residentHistory.filter(h=>h.roomId===room.id).sort((a,b)=> (b.moveOut||'').localeCompare(a.moveOut||'')).slice(0,3);
    const roomOccupied = roomHasActiveResident(room);
    const histBox = document.createElement('div');
    histBox.className = 'history-panel';
    if(hist.length===0){
      histBox.appendChild(el('div','history-empty','이 호실에는 아직 퇴실 이력이 없습니다.'));
    } else {
      hist.forEach((h, idx)=>{
        const entry = document.createElement('div');
        entry.className = 'history-entry';
        const topRow = document.createElement('div');
        topRow.className = 'history-top';
        // 대리결제였던 기록은 이름 하나로 실거주자만 대신 보여주지 않고, 계약자(h.name/h.phone)와
        // 실입실자를 각각 텍스트로 그대로 나열한다 — 색이 있는 플래그(배지)는 쓰지 않는다.
        topRow.innerHTML = `<span class="nm">${esc(maskViewerName(h.name))}</span><span class="ph">${esc(h.phone||'-')}</span>`;
        if(canEdit() && !roomOccupied){
          if(idx === 0){
            const restoreBtn = document.createElement('button');
            restoreBtn.className = 'btn small';
            restoreBtn.textContent = '복원';
            restoreBtn.title = '이 입실자 정보를 다시 입실자로 복원';
            restoreBtn.onclick = ()=> restoreFromHistory(h);
            topRow.appendChild(restoreBtn);
          }
          const delHistBtn = document.createElement('button');
          delHistBtn.className = 'iconbtn del';
          delHistBtn.innerHTML = '&times;';
          delHistBtn.title = '이 히스토리 항목 삭제';
          delHistBtn.onclick = ()=>{
            showConfirm(`"${h.name}" 님의 히스토리 기록을 완전히 삭제할까요? 이 작업은 되돌릴 수 없습니다.`, ()=>{
              DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
              RESIDENT_HISTORY_COL.doc(h.id).delete().catch(e=> console.error('퇴실 이력 삭제 실패:', e));
              refreshHistoryCache();
              logChange(`"${h.name}" 히스토리 기록 삭제`);
              scheduleSave(); render();
            });
          };
          topRow.appendChild(delHistBtn);
        }
        entry.appendChild(topRow);
        if(h.paymentProxy){
          const actualLine = document.createElement('div');
          actualLine.className = 'history-sub';
          actualLine.textContent = `실입실자 ${maskViewerName(h.actualResidentName) || '-'} ${h.actualResidentPhone || '-'}`;
          entry.appendChild(actualLine);
        }
        if(h.doubleOccupancy){
          const doubleLine = document.createElement('div');
          doubleLine.className = 'history-sub';
          doubleLine.textContent = '2인 거주';
          entry.appendChild(doubleLine);
        }
        const periodRow = document.createElement('div');
        periodRow.className = 'history-period';
        periodRow.textContent = `${h.moveIn || '-'}~${h.moveOut || '-'}`;
        entry.appendChild(periodRow);
        if(h.memo){
          // 메모 원본의 색상/굵기 서식은 적용하지 않고, 다른 이력 항목들과 같은 일반 텍스트로 보여준다.
          const memo = document.createElement('div');
          memo.className = 'history-sub';
          memo.textContent = h.memo;
          entry.appendChild(memo);
        }
        histBox.appendChild(entry);
      });
    }
    card.appendChild(histBox);
  }

  if(!roomEditOn && room.reserved){
    const parts = [];
    if(room.reservationName) parts.push(room.reservationName);
    if(room.reservationPhone) parts.push(room.reservationPhone);
    if(room.reservationMoveIn) parts.push(`입실예정 ${room.reservationMoveIn}${room.reservationMoveOut ? '~'+room.reservationMoveOut : ''}`);
    if(room.reservationMemo) parts.push(room.reservationMemo);
    const chip = document.createElement('div');
    chip.className = 'rc-note-chip';
    chip.textContent = parts.length ? `예약: ${parts.join(' · ')}` : '예약';
    chip.title = chip.textContent;
    card.appendChild(chip);
  }

  if(!roomEditOn && room.note){
    const chip = document.createElement('div');
    chip.className = 'rc-note-chip';
    chip.textContent = room.note;
    chip.title = room.note;
    chip.style.color = MEMO_COLORS[room.noteColor] || MEMO_COLORS.black;
    if(room.noteBold) chip.style.fontWeight = '700';
    card.appendChild(chip);
  }

  const cardMaintKind = roomCardMaintKind(room);
  if(!roomEditOn && cardMaintKind && room.maintenanceMemo){
    const chip = document.createElement('div');
    chip.className = 'rc-note-chip';
    chip.textContent = `${MAINT_KIND_META[cardMaintKind].label} 메모: ${room.maintenanceMemo}`;
    chip.title = room.maintenanceMemo;
    card.appendChild(chip);
  }

  card.appendChild(document.createElement('hr')).className = 'rc-divider';

  const body = document.createElement('div');
  body.className = 'rc-body';
  // 방 정보(상단 헤더)는 색을 넣지 않고, 입실자 카드가 놓이는 하단 영역만 상태 색상을 옅게
  // 깔아서 "전체" 탭처럼 여러 상태가 섞여 보일 때 이용중이 아닌 호실을 한눈에 구분할 수 있게
  // 한다. 기존 배지/탭에 쓰는 -bg 색보다 한 번 더 흐리게 보이도록 흰색과 50%씩 섞는다.
  if(effStatus !== '이용중') body.style.background = `color-mix(in srgb, ${meta.bg} 50%, white)`;

  if(roomEditOn){
    body.appendChild(renderRoomEditForm(room));
    body.appendChild(document.createElement('hr')).className = 'rc-divider';
    body.lastChild.style.margin = '4px 0 12px';
  }

  if(residents.length===0 && !draft){
    const emptyRow = document.createElement('div');
    emptyRow.className = 'empty-residents';
    emptyRow.innerHTML = `<span class="msg">이용 중인 입실자가 없습니다.</span>`;
    if(canEdit()){
      const addBtn = document.createElement('button');
      addBtn.className = 'btn small primary pill';
      addBtn.textContent = '+ 입실자 추가';
      addBtn.onclick = ()=> addResidentToRoom(room);
      emptyRow.appendChild(addBtn);
    }
    body.appendChild(emptyRow);
  } else {
    [...residents].sort((a,b)=> (a.slotIndex||0) - (b.slotIndex||0)).forEach((p, idx)=>{
      const isSecondary = (p.slotIndex!=null ? p.slotIndex : idx) > 0;
      if(UI.residentEditMode[p.id]) body.appendChild(renderResidentEditCard(p, isSecondary, false, room));
      else body.appendChild(renderResidentView(p, room, isSecondary));
    });
    if(draft){
      const isSecondary = (draft.slotIndex||0) > 0;
      body.appendChild(renderResidentEditCard(draft, isSecondary, true, room));
    }
  }

  card.appendChild(body);
  return card;
}

function renderResidentView(p, room, isSecondary){
  const block = document.createElement('div');
  block.className = 'resident-block';

  if(!isSecondary && (p.channel !== '독립생활' || isOverdue(p) || p.scheduledToLeave || isUpcoming(p) || p.pendingRoomMove || p.justImported || p.refundPending || p.doubleOccupancy)){
    const doubleMeta = statusMeta('2인 거주');
    const flagsLine = document.createElement('div');
    flagsLine.className = 'resident-flags';
    flagsLine.innerHTML = `
      ${isOverdue(p) ? '<span class="badge overdue-badge">⚠ 연체</span>' : ''}
      ${isUpcoming(p) ? '<span class="badge res-status upcoming">입실예정</span>' : ''}
      ${p.scheduledToLeave ? '<span class="badge res-status leaving">퇴실확정</span>' : ''}
      ${p.pendingRoomMove ? `<span class="badge res-status moving">방이동예정 (${esc(p.pendingRoomMove.date)})</span>` : ''}
      ${p.justImported ? `<span class="badge" style="background:var(--st-imported-bg);color:var(--st-imported)">계약 확인 필요</span>` : ''}
      ${p.refundPending ? `<span class="badge" style="background:var(--st-hold-bg);color:var(--st-hold)">⚠ 환불 처리 필요</span>` : ''}
      ${p.doubleOccupancy ? `<span class="badge" style="background:${doubleMeta.bg};color:${doubleMeta.fg}">2인 거주</span>` : ''}
      ${p.channel !== '독립생활' ? `<span class="badge" style="background:#F1EFE8;color:${channelColor(p.channel)}">${esc(p.channel)}</span>` : ''}
    `;
    block.appendChild(flagsLine);
  }

  const nameLine = document.createElement('div');
  nameLine.className = 'resident-name-row';
  const nameWrap = document.createElement('div');
  nameWrap.style.cssText = 'display:flex;align-items:center;gap:4px;min-width:0;';
  const nm = document.createElement('span');
  nm.className = 'nm';
  const displayName = residentDisplayName(p);
  nm.textContent = maskViewerName(displayName) || '(이름 미입력)';
  if(canEdit()){
    nm.classList.add('nm-clickable');
    nm.title = '클릭하여 입실자 정보 보기/수정';
    nm.onclick = ()=>{
      UI.residentSnapshots[p.id] = Object.assign({}, p);
      UI.residentEditMode[p.id] = true; render();
    };
  }
  nameWrap.appendChild(nm);
  const acts = document.createElement('div');
  acts.className = 'acts';
  if(!isSecondary && p.firstSaveDone && canEdit()){
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'btn small danger';
    leaveBtn.textContent = '퇴실';
    leaveBtn.title = '퇴실 유형을 선택해 처리합니다';
    leaveBtn.onclick = ()=> showLeaveChoiceModal(p, room);

    const extendBtn = document.createElement('button');
    extendBtn.className = 'btn small';
    extendBtn.textContent = '연장';
    extendBtn.title = '단기연장 또는 한달연장을 선택합니다';
    extendBtn.onclick = ()=> showExtendChoiceModal(p, room, (newMoveOut)=>{
      p.moveOut = newMoveOut;
      p.scheduledToLeave = false;
      p.contractType = '연장';
      clearCleaningFlagIfSourcedFrom(room, p.id);
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 퇴실예정일 연장: ${newMoveOut}`);
      scheduleSave(); render();
    });

    const moveBtn = document.createElement('button');
    moveBtn.className = 'btn small';
    moveBtn.textContent = '방이동';
    moveBtn.title = '같은 지점의 비어있는 방으로 이동 처리';
    moveBtn.onclick = ()=> showRoomMoveModal(p, room);

    acts.appendChild(leaveBtn); acts.appendChild(extendBtn); acts.appendChild(moveBtn);
  }
  nameLine.appendChild(nameWrap); nameLine.appendChild(acts);
  block.appendChild(nameLine);

  const displayPhone = residentDisplayPhone(p);
  if(displayPhone && displayPhone.trim()){
    const phoneLine = document.createElement('div');
    phoneLine.className = 'resident-phone';
    phoneLine.textContent = displayPhone;
    block.appendChild(phoneLine);
  }

  if(!isSecondary){
    const period = document.createElement('div');
    period.className = 'resident-period';
    period.textContent = `${p.moveIn || '-'} ~ ${p.moveOut || '미정'}`;
    block.appendChild(period);

    if(p.carNumber && p.carNumber.trim()){
      const carLine = document.createElement('div');
      carLine.className = 'resident-car';
      carLine.textContent = `차량 ${p.carNumber}`;
      block.appendChild(carLine);
    }

    if(p.memo){
      const memo = document.createElement('div');
      memo.className = 'resident-memo';
      memo.textContent = p.memo;
      memo.title = p.memo;
      memo.style.color = MEMO_COLORS[p.memoColor] || MEMO_COLORS.black;
      if(p.memoBold) memo.style.fontWeight = '700';
      block.appendChild(memo);
    }
  }
  return block;
}

/* ---------------- room info: edit mode (방 정보만) ---------------- */
// 이 편집 패널 안의 필드들은 더 이상 값이 바뀔 때마다 바로 저장하지 않는다. 방 카드 헤더의
// 연필(✎) 아이콘을 눌러 들어왔다가 체크(✓) 아이콘을 눌러 나가는 시점에 한 번만 저장한다
// (renderRoomCard의 pencil.onclick 참고). 여기서는 render()만 호출해 화면엔 바로 반영하고,
// scheduleSave()는 호출하지 않는다.
function renderRoomEditForm(room){
  const wrap = document.createElement('div');

  const grid = document.createElement('div');
  grid.className = 'edit-grid';
  grid.innerHTML = `
    <div>
      <label class="field-label">판매 상태</label>
      <select data-f="saleStatus">${STATUS_LIST_MANUAL.map(s=>`<option ${s===room.saleStatus?'selected':''}>${s}</option>`).join('')}</select>
    </div>
  `;
  const saleStatusSel = grid.querySelector('[data-f="saleStatus"]');
  if(saleStatusSel) saleStatusSel.addEventListener('change', (e)=>{ logChange(`${room.number}호 판매상태 변경: ${room.saleStatus} → ${e.target.value}`); room.saleStatus = e.target.value; render(); });
  wrap.appendChild(grid);

  const chipRow = document.createElement('div');
  chipRow.style.marginBottom = '10px';
  chipRow.innerHTML = `<label class="field-label">퇴실청소 / 리터치 / 추가청소</label>`;
  const chips = document.createElement('div');
  chips.className = 'maint-chips';
  Object.keys(MAINT_KIND_META).forEach(kind=>{
    const field = MAINT_KIND_FIELD[kind];
    // needsCleaning 등 원본 필드뿐 아니라, 퇴실확정 입실자로 인해 배지가 자동 표시된 상태(fallback)도
    // "켜짐"으로 보여줘야 클릭했을 때 의도대로 꺼짐(취소) 처리가 된다.
    const isOn = roomCardMaintKind(room) === kind;
    const chip = document.createElement('span');
    chip.className = 'flagchip ' + kind + (isOn ? ' on' : '');
    chip.textContent = MAINT_KIND_META[kind].label;
    chip.onclick = ()=>{
      const turningOn = !isOn;
      Object.values(MAINT_KIND_FIELD).forEach(f=> room[f]=false);
      room[field] = turningOn;
      if(turningOn){
        if(!room.maintenanceDate) room.maintenanceDate = nextMonWedFri(todayISO());
        room.cleaningDismissedMoveOut = '';
      } else {
        room.maintenanceDate=''; room.maintenanceMemo='';
        // moveout을 껐는데도 아직 퇴실확정된 입실자가 남아있으면, 다음 렌더에서 fallback이
        // 같은 배지를 곧바로 다시 켜버린다. 그 입실자의 퇴실일을 "취소함"으로 기억해서,
        // 그 퇴실일이 바뀌기 전까지는 배지가 다시 뜨지 않게 한다.
        if(kind==='moveout'){
          room.cleaningDismissedMoveOut = roomEarliestLeaverMoveOut(room) || '';
        }
      }
      logChange(`${room.number}호 ${MAINT_KIND_META[kind].label} ${turningOn?'설정':'해제'}`);
      render();
    };
    chips.appendChild(chip);
  });
  chipRow.appendChild(chips);
  wrap.appendChild(chipRow);

  const currentMaintKind = roomMaintKind(room);
  if(currentMaintKind){
    const kindLabel = MAINT_KIND_META[currentMaintKind].label;
    const dateWrap = document.createElement('div');
    dateWrap.style.marginBottom = '10px';
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = room.maintenanceDate || '';
    dateInput.addEventListener('change', ()=>{
      logChange(`${room.number}호 ${kindLabel} 예정일 변경: ${dateInput.value || '미정'}`);
      room.maintenanceDate = dateInput.value; render();
    });
    dateWrap.appendChild(labeled(`${kindLabel} 예정일`, dateInput));
    wrap.appendChild(dateWrap);

    const memoWrap = document.createElement('div');
    memoWrap.style.marginBottom = '10px';
    const memoInput = document.createElement('textarea');
    memoInput.rows = 2;
    memoInput.value = room.maintenanceMemo || '';
    memoInput.placeholder = '예: 변기 물 안 내려감, 방충망 파손 등';
    memoInput.addEventListener('input', ()=>{
      logChange(`${room.number}호 ${kindLabel} 메모 수정`);
      room.maintenanceMemo = memoInput.value;
    });
    memoWrap.appendChild(labeled(`${kindLabel} 메모`, memoInput));
    wrap.appendChild(memoWrap);
  }

  const reserveChipRow = document.createElement('div');

    }

  };
  reserveChips.appendChild(reserveChip);
  reserveChipRow.appendChild(reserveChips);

  if(room.reserved){

    nameInput.placeholder = '예약자명';

    wrap.appendChild(labeled('예약자명', nameInput));

    const phoneInput = document.createElement('input');

    phoneInput.value = room.reservationPhone || '';
    phoneInput.placeholder = '연락처';

    wrap.appendChild(labeled('연락처', phoneInput));

    const moveInInput = document.createElement('input');
    moveInInput.type = 'date';
    moveInInput.value = room.reservationMoveIn || '';
    moveInInput.addEventListener('change', ()=>{
      logChange(`${room.number}호 예약 입실예정일 변경: ${moveInInput.value || '미정'}`);
      room.reservationMoveIn = moveInInput.value;
    });
    wrap.appendChild(labeled('입실예정일', moveInInput));

    const moveOutInput = document.createElement('input');
    moveOutInput.type = 'date';
    moveOutInput.value = room.reservationMoveOut || '';
    moveOutInput.addEventListener('change', ()=>{
      logChange(`${room.number}호 예약 퇴실예정일 변경: ${moveOutInput.value || '미정'}`);
      room.reservationMoveOut = moveOutInput.value;

    const reserveMemoInput = document.createElement('textarea');

  noteWrap.appendChild(renderMemoStyleControls(room, 'noteColor', 'noteBold', true));

  return wrap;
}

function wouldExceedParking(p, candidateMoveIn, candidateMoveOut){
  if(!p.carNumber || !p.carNumber.trim()) return null;
  const room = DB.rooms.find(r=>r.id===p.roomId);
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  if(!branch) return null;
  if(!occupiesRoom({ moveIn: candidateMoveIn, moveOut: candidateMoveOut })) return null;
  const cap = branchParkingCapCeiling(branch);
  const others = branchActiveCarCount(branch, p.id);
  const projected = others + 1;
  if(projected > cap) return { branch, cap, others, projected };
  return null;
}

const MEMO_COLORS = { black:'#1E2A32', red:'#C0473F', blue:'#2F6FED' };
// deferSave가 true면 저장을 미루고 render()만 한다 — 방/입실자 카드의 편집 패널처럼 체크(✓)
// 아이콘을 누를 때 한 번에 저장하는 화면에서 쓴다. 지점 정보 메모처럼 필드별로 바로바로
// 저장하는 화면에서는 기존대로 deferSave 없이 호출한다.
function renderMemoStyleControls(obj, colorField, boldField, deferSave){
  const row = document.createElement('div');
  row.className = 'memo-style-row';
  Object.keys(MEMO_COLORS).forEach(key=>{
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'color-swatch' + ((obj[colorField]||'black')===key ? ' active' : '');
    sw.style.background = MEMO_COLORS[key];
    sw.title = key==='black' ? '검정' : (key==='red' ? '빨강' : '파랑');
    sw.onclick = ()=>{ obj[colorField] = key; if(!deferSave) scheduleSave(); render(); };
    row.appendChild(sw);
  });
  const boldBtn = document.createElement('button');
  boldBtn.type = 'button';
  boldBtn.className = 'bold-toggle-btn' + (obj[boldField] ? ' active' : '');
  boldBtn.textContent = 'B';
  boldBtn.title = '굵게';
  boldBtn.onclick = ()=>{ obj[boldField] = !obj[boldField]; if(!deferSave) scheduleSave(); render(); };
  row.appendChild(boldBtn);
  return row;
}

function labeled(text, elm){
  const wrap = document.createElement('div');
  const lbl = document.createElement('label');
  lbl.className = 'field-label'; lbl.textContent = text;
  wrap.appendChild(lbl); wrap.appendChild(elm);
  return wrap;
}
function labeledReq(text, elm){
  const wrap = document.createElement('div');
  const lbl = document.createElement('label');
  lbl.className = 'field-label'; lbl.innerHTML = `${text} <span class="req">*</span>`;
  wrap.appendChild(lbl); wrap.appendChild(elm);
  return wrap;
}
function fullRow(elm){
  const wrap = document.createElement('div');
  wrap.style.marginBottom = '8px';
  wrap.appendChild(elm);
  return wrap;
}
function residentMissingFields(p, isSecondary){
  const missing = [];
  if(!p.name || !p.name.trim()) missing.push('이름');
  if(!p.phone || !p.phone.trim()) missing.push('연락처');
  if(!isSecondary){
    if(!p.moveIn) missing.push('입실일');
    if(!p.moveOut) missing.push('퇴실(예정)일');
  }
  return missing;
}
function el(tag, cls, text, style){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text!=null) e.textContent = text;
  if(style) e.style.cssText = style;
  return e;
}

    </div>
    <div class="sub" style="font-size:11.5px;color:var(--ink-soft);">막대 = 입실~퇴실 기간 · 회색 막대는 이번 달과 겹치는 과거 퇴실자 · 라벨만 있는 행은 현재/과거 입실자 없음</div>
  `;
  wrap.appendChild(toolbar);

  const tlLegend = document.createElement('div');
  tlLegend.className = 'tl-legend';
  tlLegend.innerHTML = TIMELINE_BAR_STATUSES.map(m=>
    `<span class="badge" style="background:${m.bg};color:${m.fg}"><span class="dot" style="background:${m.fg}"></span>${m.key}</span>`
  ).join('');
  wrap.appendChild(tlLegend);

  const monthStart = new Date(UI.tlYear, UI.tlMonth, 1);
  const daysInMonth = new Date(UI.tlYear, UI.tlMonth+1, 0).getDate();
  const monthEnd = new Date(UI.tlYear, UI.tlMonth, daysInMonth);

  const tlWrap = document.createElement('div');
  tlWrap.className = 'tl-wrap';
  const gridWrap = document.createElement('div');
  gridWrap.className = 'tl-grid';
  gridWrap.style.gridTemplateColumns = '1fr';

  const headRow = document.createElement('div');
  headRow.className = 'tl-headrow';
  const headLabel = document.createElement('div');
  headLabel.className = 'tl-label'; headLabel.style.fontWeight = '700'; headLabel.textContent = '호실 · 입실자';
  headRow.appendChild(headLabel);
  const headDays = document.createElement('div');
  headDays.className = 'tl-days';
  headDays.style.gridTemplateColumns = `repeat(${daysInMonth}, minmax(24px,1fr))`;
  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(UI.tlYear, UI.tlMonth, d).getDay();
    const cell = document.createElement('div');
    cell.className = 'tl-daycell' + ((dow===0||dow===6) ? ' weekend' : '');
    cell.textContent = d;
    headDays.appendChild(cell);
  }
  headRow.appendChild(headDays);
  gridWrap.appendChild(headRow);

  const rooms = DB.rooms.filter(r=>r.branchId===branch.id)
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  if(rooms.length===0){
    const none = document.createElement('div');
    none.className = 'empty-hint'; none.style.margin = '16px';
    none.textContent = '등록된 호실이 없습니다. "호실 현황" 탭에서 먼저 호실을 추가하세요.';
    gridWrap.appendChild(none);
  }

  function buildDayCells(){
    const days = document.createElement('div');
    days.className = 'tl-days';
    days.style.gridTemplateColumns = `repeat(${daysInMonth}, minmax(24px,1fr))`;
    for(let d=1; d<=daysInMonth; d++){
      const dow = new Date(UI.tlYear, UI.tlMonth, d).getDay();
      const cell = document.createElement('div');
      cell.className = 'tl-daycell' + ((dow===0||dow===6) ? ' weekend' : '');
      days.appendChild(cell);
    }
    return days;
  }

  function appendRow(meta, labelHtml, bars, onLabelClick){
    const row = document.createElement('div');
    row.className = 'tl-row';
    const lbl = document.createElement('div');
    lbl.className = 'tl-label';
    lbl.style.borderLeft = `4px solid ${meta.fg}`;
    lbl.style.background = meta.bg;
    lbl.innerHTML = labelHtml;
    if(onLabelClick){ lbl.style.cursor = 'pointer'; lbl.onclick = onLabelClick; }
    row.appendChild(lbl);
    const days = buildDayCells();
    bars.forEach(bar=>{ if(bar) days.appendChild(bar); });
    row.appendChild(days);
    gridWrap.appendChild(row);
  }
  // 타임라인 왼쪽 라벨(호실번호가 표시되는 영역)은 입실자/계약 상태가 아니라 방 자체의 상태
  // (이용중/판매중/판매보류/공실)를 보여준다 — 개별 입실자·계약의 상태는 오른쪽 막대 쪽에서
  // 확인한다.
  function roomStatusRowMeta(room){
    const effStatus = effectiveRoomStatus(room);
    const roomOverdue = roomHasOverdueResident(room);
    const label = roomOverdue ? '연체중' : effStatus;
    const meta = roomOverdue ? { fg:'var(--st-hold)', bg:'var(--st-hold-bg)' } : statusMeta(effStatus);
    return { meta, label };
  }
  function appendEmptyRoomRow(room){
    const { meta, label } = roomStatusRowMeta(room);
    appendRow(meta,
      `<span class="rm">${esc(room.number)}</span>
       <span class="nm" style="color:${meta.fg};font-weight:700;"><span class="tl-status-dot" style="background:${meta.fg}"></span>${esc(label)}</span>`,
      [], null);
  }
  // 계약/입실자/과거 퇴실자 세 가지 출처를 전부 {range, meta, name, memo, room}로 통일해서 다루고,
  // 같은 호실번호의 항목들은 (아래에서) 한 행 안에 막대 여러 개로 이어 붙인다.
  function contractTimelineEntry(x, group){
    const c = x.contract, range = x.range;
    const room = group.rooms.find(r=> r.id===c.roomId) || group.rooms[0];
    // 이 계약으로 생성/연결된 입실자 레코드가 있으면(sourceContractId) 우선 쓰고, 없어도(기존
    // 입실자에게 계약만 추가로 등록된 경우가 훨씬 흔함) 같은 방에서 이 계약 기간과 거주 기간이
    // 겹치는 입실자를 찾아 그 카드의 실거주자명·메모·퇴실예정 여부를 그대로 따른다. 아무도
    // 못 찾으면 계약 데이터의 입실자/계약자명만으로 표시한다.
    let matched = DB.residents.find(p=>p.sourceContractId===c.id) || null;
    if(!matched){
      const candidates = DB.residents.filter(p=>{
        if(!group.roomIds.has(p.roomId) || !p.moveIn) return false;
        const pOut = p.moveOut || '9999-12-31';
        return p.moveIn <= range.end && pOut >= range.start;
      });
      // 2인실처럼 같은 기간에 겹치는 입실자가 둘 이상이면, 날짜만으로는 이 계약이 누구 것인지
      // 알 수 없다 — 계약서에 적힌 이름과 일치하는 실입실자를 우선 찾아 정확히 짚어낸다.
      const declaredName = String(c.resident || c.contractor || '').trim();
      matched = (declaredName && candidates.find(p=> p.name===declaredName || p.actualResidentName===declaredName))
        || candidates[0] || null;
    }
    const today = todayISO();
    let meta;
    if(range.end < today) meta = timelineStatusMeta('퇴실');
    else if(range.start > today) meta = timelineStatusMeta('입실예정');
    else if(matched && isOverdue(matched)) meta = timelineStatusMeta('연체');
    else if(matched && matched.scheduledToLeave) meta = timelineStatusMeta('퇴실확정');
    else meta = timelineStatusMeta('이용중');
    const rawName = matched ? residentDisplayName(matched) : (c.resident || c.contractor);
    // "오늘 이용중인 사람이 미리 등록해 둔 연장 계약"인지 나중에 판별하기 위한 식별자.
    // 연장 계약은 아직 입실자 레코드의 moveIn/moveOut이 새 계약 기간으로 갱신되기 전이라
    // matched(입실자 레코드) 기준으로는 서로 다른 사람처럼 보일 수 있어서, 입실자가 아니라
    // 계약서에 적힌 입실자/계약자명 자체를 기준으로 같은 사람 여부를 비교한다.
    const contractOccupantName = String(c.resident || c.contractor || '').trim();
    const matchKey = contractOccupantName ? ('n:'+contractOccupantName) : (matched ? ('id:'+matched.id) : null);
    return { range, meta, name: maskViewerName(rawName) || '이름 미입력', memo: matched ? (matched.memo||'') : '', room, matchKey };
  }
  function residentTimelineEntry(p, room){
    return {
      range: { start: p.moveIn, end: p.moveOut || '9999-12-31' },
      meta: residentTimelineMeta(p, room),
      name: maskViewerName(residentDisplayName(p)) || '이름 미입력',
      memo: p.memo || '',
      room
    };
  }
  function historyTimelineEntry(h, room){
    return {
      range: { start: h.moveIn, end: h.moveOut || h.moveIn },
      meta: timelineStatusMeta('퇴실'),
      name: maskViewerName(h.name) || '이름 미입력',
      memo: '',
      room
    };
  }
  function buildTimelineBar(entry){
    const inD = new Date(entry.range.start);
    const outD = new Date(entry.range.end);
    if(outD < monthStart || inD > monthEnd) return null;
    const clampIn = inD < monthStart ? monthStart : inD;
    const clampOut = outD > monthEnd ? monthEnd : outD;
    const startDay = clampIn.getDate();
    const endDay = clampOut.getDate();
    const leftPct = ((startDay-1)/daysInMonth)*100;
    const widthPct = Math.max(((endDay-startDay+1)/daysInMonth)*100, (1/daysInMonth)*100);
    const bar = document.createElement('div');
    bar.className = 'tl-bar';
    bar.style.left = leftPct + '%';
    bar.style.width = widthPct + '%';
    bar.style.background = entry.meta.fg;
    const memoText = entry.memo ? ` <span class="tl-bar-memo">${esc(entry.memo)}</span>` : '';
    bar.innerHTML = `<span class="tl-bar-name">${esc(entry.name)}</span>${memoText}`;
    bar.title = `${entry.name} · ${entry.meta.key} · ${entry.range.start} ~ ${entry.range.end}${entry.memo ? ' · ' + entry.memo : ''} (클릭 시 호실로 이동)`;
    bar.style.cursor = 'pointer';
    bar.onclick = ()=> scrollToRoomCard(entry.room);
    return bar;
  }

  // 같은 호실번호를 쓰는 방 레코드가 여러 건 존재해도(예: 호실 삭제 후 재등록 등) 타임라인에는
  // 호실당 정확히 한 행만 나와야 하므로, DB.rooms의 id가 아니라 화면에 보이는 호실번호로 묶는다.
  const roomGroups = [];
  const groupMap = new Map();
  rooms.forEach(room=>{
    let g = groupMap.get(room.number);
    if(!g){ g = { number: room.number, rooms: [], roomIds: new Set() }; groupMap.set(room.number, g); roomGroups.push(g); }
    g.rooms.push(room);
    g.roomIds.add(room.id);
  });

  roomGroups.forEach(group=>{
    const primaryRoom = group.rooms[0];
    // 계약현황(DB.contracts)에 이 호실의 계약 기록이 하나라도 있으면 계약 기준으로 표시하고,
    // 계약 기록이 전혀 없는 호실만 입실자 카드(DB.residents/History) 기준으로 대체 표시한다.
    // 시작일=종료일(하루도 안 되는 기간)인 계약과, 환불로 대체되어 더 이상 유효하지 않은 계약
    // (findSupersedingRefundContract)은 타임라인에 표시하지 않는다.
    const roomContracts = DB.contracts
      .filter(c=> group.roomIds.has(c.roomId))
      .map(c=> ({ contract:c, range: parseContractPeriodRange(c.contractPeriod) }))
      .filter(x=> x.range && x.range.start !== x.range.end && !findSupersedingRefundContract(x.contract));

    let entries;
    if(roomContracts.length > 0){
      // 한 계약 기간이 다른 계약 기간에 완전히 포함되면(예: 9/1~9/30 계약이 있는데 9/3 하루짜리
      // 단기 계약이 그 안에 또 있는 경우), 포함되는 더 짧은 쪽은 표시하지 않는다.
      const visible = roomContracts.filter(x=>
        !roomContracts.some(y=> y!==x
          && y.range.start <= x.range.start && y.range.end >= x.range.end
          && (y.range.start < x.range.start || y.range.end > x.range.end))
      );
      // 이미 이용중인 입실자가 미리 등록해 둔 연장 계약(미래 시작)은 새 입실 예정자가 아니라
      // 같은 사람이 계속 거주하는 것인데, 그 연장 계약만 보이는 미래 달을 보고 있으면 "오늘"
      // 걸쳐 있는 원래 계약은 이번 달 표시 대상(monthContracts)에서 이미 빠져 있어 비교 대상이
      // 없어진다. 그래서 이번 달로 자르기 전, 호실의 계약 전체를 기준으로 먼저 판별한다.
      const allContractEntries = visible
        .map(x=> contractTimelineEntry(x, group))
        .sort((a,b)=> a.range.start.localeCompare(b.range.start));
      const today0 = todayISO();
      const activeToday = allContractEntries.find(e=> e.matchKey && e.range.start<=today0 && e.range.end>=today0);
      if(activeToday){
        allContractEntries.forEach(e=>{
          if(e!==activeToday && e.matchKey===activeToday.matchKey && e.range.start>today0){
            e.meta = activeToday.meta;
          }
        });
      }
      entries = allContractEntries.filter(e=> new Date(e.range.end) >= monthStart && new Date(e.range.start) <= monthEnd);
    } else {
      // 현재 입실자가 퇴실예정으로 확정되면 다음 입실자를 미리 등록해둘 수 있어서(관리자 설정과
      // 무관하게 언제나 가능), 실제로는 동시에 거주하지 않는데도 DB.residents에 그 방 레코드가
      // 2건(퇴실예정 중인 사람 + 아직 입실 전인 예정자) 존재하는 경우가 있다. 실제로 지금 그
      // 자리에 있는 사람은 하나뿐이므로, "지금 이미 입실한(이용중/퇴실예정)" 레코드가 있으면
      // 그것만 보여주고 아직 입실 전인 예정자는 그 사람이 실제로 입실할 때(=더 이상 예정자가
      // 아니게 될 때)까지는 별도로 노출하지 않는다.
      const allResidents = DB.residents.filter(p=> group.roomIds.has(p.roomId));
      const currentResidents = allResidents.filter(p=> !isUpcoming(p));
      const residents = currentResidents.length > 0 ? currentResidents : allResidents;
      // 과거 퇴실자는 이번 달과 겹치는 기간의 기록만 보여준다 — 그렇지 않으면 오래 운영한 방일수록
      // 목록이 한없이 길어진다.
      const history = DB.residentHistory.filter(h=>{
        if(!group.roomIds.has(h.roomId) || !h.moveIn) return false;
        const hIn = new Date(h.moveIn);
        const hOut = new Date(h.moveOut || h.moveIn);
        return hOut >= monthStart && hIn <= monthEnd;
      });
      entries = [
        ...residents.map(p=> residentTimelineEntry(p, group.rooms.find(r=>r.id===p.roomId) || primaryRoom)),
        ...history.map(h=> historyTimelineEntry(h, group.rooms.find(r=>r.id===h.roomId) || primaryRoom))
      ].sort((a,b)=> a.range.start.localeCompare(b.range.start));
    }

    if(entries.length===0){ appendEmptyRoomRow(primaryRoom); return; }

    // 같은 호실의 여러 항목(계약 갱신, 입실자 교체 등)은 한 행 안에 막대 여러 개로 이어 붙인다.
    const bars = entries.map(e=> buildTimelineBar(e));
    const { meta, label } = roomStatusRowMeta(primaryRoom);

    appendRow(meta,
      `<span class="rm">${esc(group.number)}</span>
       <span class="nm"><span class="tl-status-dot" style="background:${meta.fg}"></span>${esc(label)}</span>`,
      bars,
      ()=> scrollToRoomCard(primaryRoom)
    );
  });

  tlWrap.appendChild(gridWrap);
  wrap.appendChild(tlWrap);

  setTimeout(()=>{
    const prevBtn = document.getElementById('tlPrev');
    const nextBtn = document.getElementById('tlNext');
    if(prevBtn) prevBtn.onclick = ()=>{ UI.tlMonth--; if(UI.tlMonth<0){ UI.tlMonth=11; UI.tlYear--; } render(); };
    if(nextBtn) nextBtn.onclick = ()=>{ UI.tlMonth++; if(UI.tlMonth>11){ UI.tlMonth=0; UI.tlYear++; } render(); };
  },0);

  return wrap;
}

// 타임라인 라벨/막대에 쓰는 입실자 상태별 색상. 이용중/퇴실예정/입실예정/퇴실 4가지를 기본으로
// 구분하고, 연체는 그중 이용중인데 실제로는 퇴실일이 지났는데도 처리가 안 된 특히 위급한
// 경우라 별도 색을 유지한다.
const TIMELINE_BAR_STATUSES = [
  { key:'이용중',   fg:'var(--st-occupied)', bg:'var(--st-occupied-bg)' },
  { key:'연체',     fg:'var(--st-hold)',     bg:'var(--st-hold-bg)' },
  { key:'퇴실확정', fg:'var(--st-leaving)',  bg:'var(--st-leaving-bg)' },
  { key:'입실예정', fg:'var(--st-forsale)',  bg:'var(--st-forsale-bg)' },
  { key:'퇴실',     fg:'var(--st-vacant)',   bg:'var(--st-vacant-bg)' }
];
function timelineStatusMeta(key){ return TIMELINE_BAR_STATUSES.find(s=>s.key===key) || TIMELINE_BAR_STATUSES[0]; }
function residentTimelineMeta(p, room){
  if(isOverdue(p)) return timelineStatusMeta('연체');
  if(p.scheduledToLeave) return timelineStatusMeta('퇴실확정');
  if(isUpcoming(p)) return timelineStatusMeta('입실예정');
  return timelineStatusMeta('이용중');
}
function normalizeFlexDate(s){
  const c = String(s||'').trim().replace(/[./]/g,'-');
  const m = c.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  let [, y, mo, d] = m;
  if(y.length===2) y = '20'+y;
  return `${y.padStart(4,'0')}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function parseContractPeriodRange(periodStr){
  const raw = String(periodStr||'').trim();
  if(!raw) return null;
  const parts = raw.split(/[~–—]|\s+to\s+/i).map(s=>s.trim()).filter(Boolean);
  if(parts.length < 2) return null;
  const start = normalizeFlexDate(parts[0]);
  const end = normalizeFlexDate(parts[1]);
  if(!start || !end) return null;
  return { start, end };
}
// 계약취소/중도퇴실로 계약기간이 짧아지고 결제구분이 "환불"로 바뀐 계약이 나중에 붙여넣기로
// 추가되면, 같은 계약일에 원래(더 긴 기간) 계약이 그대로 남아있어 정보가 서로 어긋난다.
// 같은 방·계약일·계약자(또는 입실자) 이름을 가진 계약 중 결제구분에 "환불"이 포함되고 실제
// 등록 시각(importedAt)이 이 계약보다 나중인 게 있으면 그 계약이 이 계약을 "대체"한 것으로
// 본다. 계약일만으로는 둘을 구분할 수 없다(정의상 계약일이 서로 같으므로) importedAt으로
// 판단한다 — 이 필드가 없는 옛날 계약(이 기능 도입 전 붙여넣은 것)은 항상 매칭에서 제외된다.
function findSupersedingRefundContract(c){
  if(/환불/.test(c.paymentCategory || '')) return null;
  const name = cleanKeyLoose(c.resident || c.contractor);
  if(!name || !c.contractDate || !c.importedAt) return null;
  return DB.contracts.find(other=>
    other.id !== c.id &&
    other.roomId === c.roomId &&
    (other.contractDate || '') === c.contractDate &&
    cleanKeyLoose(other.resident || other.contractor) === name &&
    /환불/.test(other.paymentCategory || '') &&
    other.importedAt && other.importedAt > c.importedAt
  ) || null;
}
function contractProposedResidentData(c){
  if(!c) return null;
  const range = parseContractPeriodRange(c.contractPeriod);
  return { contractId: c.id, name: c.resident || c.contractor || '', phone: c.contractorPhone || '', moveIn: range ? range.start : '', moveOut: range ? range.end : '' };
}
function roomContractSegments(room){
  const segments = [];
  DB.contracts.filter(c=>c.roomId===room.id).forEach(c=>{
    const range = parseContractPeriodRange(c.contractPeriod);
    if(!range) return;
    segments.push({ start: range.start, end: range.end, contract: c });
  });
  // "가장 최근 계약"은 계약기간의 시작일이 아니라 계약일(계약 등록/연장 시점) 기준으로 판단한다.
  // (예: 같은 계약을 여러 번 나눠 결제/연장 등록하면서 계약기간이 하루짜리로 찍히는 등
  //  기간 자체는 뒤죽박죽일 수 있어도, 계약일은 항상 실제 최신 순서를 반영하기 때문)
  segments.sort((a,b)=> (a.contract.contractDate||'').localeCompare(b.contract.contractDate||'') || a.start.localeCompare(b.start));
  return segments;
}
function contractEndDateMismatch(room){
  const segments = roomContractSegments(room);
  if(segments.length === 0) return false;
  // 계약이 여러 건으로 나뉘어 있어도(연장/분할결제 등) 실제 비교 대상은
  // 그 중 계약만료일(종료일)이 가장 늦은 날짜 하나면 충분하다.
  const latestEnd = segments.reduce((max, seg)=> seg.end > max ? seg.end : max, segments[0].end);
  const residents = DB.residents.filter(p=>p.roomId===room.id);
  if(residents.length === 0) return false;
  return !residents.some(p=> p.moveOut === latestEnd);
}

const BRANCH_NAME_ALIASES = {
  '가산디지털 독산역': '가산독산',
  '마곡 발산역': '마곡 발산',
  '방배 이수역': '방배 이수',

  '고대 안암역': '고대 안암',
  '잠실 석촌고분역': '잠실'
};
function cleanKeyLoose(s){ return String(s||'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim(); }
function normalizeRoomNo(s){ const c = cleanKeyLoose(s).toLowerCase(); return /^\d+$/.test(c) ? String(parseInt(c,10)) : c; }
function roomNumberPrefix(s){ const m = cleanKeyLoose(s).match(/^\d+/); return m ? String(parseInt(m[0],10)) : null; }

function handleBranchRoomBulkUpdateFile(file){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const get = (row, key)=> String(row[key]==null ? '' : row[key]).trim();
      const sheetRows = (name)=>{
        const sheet = wb.Sheets[name];
        return sheet ? XLSX.utils.sheet_to_json(sheet, { defval:'' }) : [];
      };

      const result = { branchesCreated:0, branchesUpdated:0, roomsCreated:0, roomsUpdated:0, pricesUpdated:0 };
      const newBranches = [];
      const newRooms = [];
      const pendingBranchUpdates = [];
      const pendingRoomUpdates = [];
      const pendingTypePrices = new Map(); // branchId -> { branch, patch:{type:price} }
      const roomTypesToRegister = new Map(); // branchId -> { branch, types:Set }
      const touchedBranches = new Set();
      const touchedRooms = new Set();
      const invalidRows = [];
      const unmatchedBranchRows = [];

      function trackRoomType(branch, type){
        if(!branch || !type) return;
        if(!roomTypesToRegister.has(branch.id)) roomTypesToRegister.set(branch.id, { branch, types: new Set() });
        roomTypesToRegister.get(branch.id).types.add(type);
      }

      function findBranch(nameRaw){
        const resolvedName = BRANCH_NAME_ALIASES[nameRaw] || nameRaw;
        return DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedName.toLowerCase())
          || newBranches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedName.toLowerCase());
      }

      // ---- 1) 지점정보: 지점당 1행 ----
      sheetRows('지점정보').forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(get(row,'지점명'));
        const shortNameRaw = get(row,'지점단축명');
        if(!branchRaw && !shortNameRaw) return; // 완전히 빈 행

        const missing = [];
        if(!branchRaw) missing.push('지점명');
        if(!shortNameRaw) missing.push('지점단축명');
        if(missing.length){
          invalidRows.push(`[지점정보 ${idx+2}행] 필수 항목 누락(${missing.join('/')})으로 제외`);
          return;
        }

        const resolvedName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
        let branch = findBranch(branchRaw);
        const isNewBranch = !branch;
        if(!branch){
          branch = { id: uid('b'), name: resolvedName, shortName: shortNameRaw, address:'', elevator:'', heatingType:'', hairDryer:'',
            cleaningFee:0, doubleOccupancyFee:'', sharedKitchenLocation:'', trashBagLocation:'', parkingCapacity:0, parkingFee:'', doorPasscode:'', memo:'', typePrices:{}, roomTypes:[...ROOM_TYPE_LIST], externalParking:[] };
          newBranches.push(branch);
          result.branchesCreated++;
        } else {
          if(!touchedBranches.has(branch.id)) result.branchesUpdated++;
          pendingBranchUpdates.push({ branch, field:'shortName', value: shortNameRaw });
        }
        touchedBranches.add(branch.id);

        const setBranchField = (field, key, isNum)=>{
          const v = get(row,key);
          if(v==='') return;
          const value = isNum ? (Number(v)||0) : v;
          if(isNewBranch) branch[field] = value;
          else pendingBranchUpdates.push({ branch, field, value });
        };
        setBranchField('address','주소'); setBranchField('elevator','엘리베이터');
        setBranchField('heatingType','난방방식'); setBranchField('hairDryer','헤어드라이기');
        setBranchField('cleaningFee','청소비', true); setBranchField('doubleOccupancyFee','1인추가금');
        setBranchField('sharedKitchenLocation','공용주방위치'); setBranchField('trashBagLocation','종량제봉투보관위치');
        setBranchField('parkingCapacity','주차가능대수', true); setBranchField('parkingFee','주차비용');
        setBranchField('doorPasscode','출입문비번'); setBranchField('memo','지점특이사항');
      });

      // ---- 2) 타입별가격: 지점당 1행, 타입별 열 ----
      sheetRows('타입별가격').forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(get(row,'지점명'));
        if(!branchRaw) return;
        const branch = findBranch(branchRaw);
        if(!branch){
          unmatchedBranchRows.push(`[타입별가격 ${idx+2}행] ${branchRaw} (지점 못 찾음)`);
          return;
        }
        if(!pendingTypePrices.has(branch.id)) pendingTypePrices.set(branch.id, { branch, patch:{} });
        const entry = pendingTypePrices.get(branch.id);
        // 타입은 고정 열이 아니라 지점마다 자유롭게 추가할 수 있으므로, "지점명"을 제외한
        // 모든 열을 타입명으로 보고 그대로 반영한다(엑셀에서 열을 추가/삭제해도 그대로 동작).
        Object.keys(row).forEach(t=>{
          if(t==='지점명') return;
          const v = get(row, t);
          if(v==='') return;
          entry.patch[t] = Number(v)||0;
          result.pricesUpdated++;
          trackRoomType(branch, t);
        });
      });

      // ---- 3) 호실정보: 호실당 1행 ----
      sheetRows('호실정보').forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(get(row,'지점명'));
        const roomRaw = cleanKeyLoose(get(row,'호실번호')).replace(/호$/,'');
        const typeRaw = get(row,'타입');
        const occRaw = cleanKeyLoose(get(row,'인실구분'));
        if(!branchRaw && !roomRaw && !typeRaw && !occRaw) return; // 완전히 빈 행

        const missing = [];
        if(!branchRaw) missing.push('지점명');
        if(!roomRaw) missing.push('호실번호');
        if(!typeRaw) missing.push('타입');
        if(!occRaw) missing.push('인실구분');
        if(missing.length){
          invalidRows.push(`[호실정보 ${idx+2}행] 필수 항목 누락(${missing.join('/')})으로 제외`);
          return;
        }
        const branch = findBranch(branchRaw);
        if(!branch){
          unmatchedBranchRows.push(`[호실정보 ${idx+2}행] ${branchRaw} ${roomRaw}호 (지점 못 찾음)`);
          return;
        }
        const occValue = (occRaw==='2' || occRaw==='2인실') ? '2인실' : '1인실';
        trackRoomType(branch, typeRaw);

        let room = DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw))
          || newRooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw));
        const isNewRoom = !room;
        if(!room){
          room = { id: uid('r'), branchId: branch.id, number: roomRaw, type: typeRaw, occupancy: occValue, saleStatus:'공실',
            needsCleaning:false, needsRetouch:false, needsExtraCleaning:false, note:'', reserved:false };
          newRooms.push(room);
          result.roomsCreated++;
        } else {
          if(!touchedRooms.has(room.id)) result.roomsUpdated++;
          pendingRoomUpdates.push({ room, field:'type', value: typeRaw });
          pendingRoomUpdates.push({ room, field:'occupancy', value: occValue });
        }
        touchedRooms.add(room.id);

        const setRoomField = (field, key)=>{
          const v = get(row,key);
          if(v==='') return;
          if(isNewRoom) room[field] = v;
          else pendingRoomUpdates.push({ room, field, value: v });
        };
        setRoomField('saleStatus','판매상태'); setRoomField('note','호실특이사항');
      });

      if(newBranches.length===0 && newRooms.length===0 && pendingBranchUpdates.length===0
        && pendingRoomUpdates.length===0 && pendingTypePrices.size===0){
        showAlert(`반영할 내용이 없습니다.`
          + (invalidRows.length ? `\n\n${invalidRows.slice(0,20).join('\n')}` : '')
          + (unmatchedBranchRows.length ? `\n\n${unmatchedBranchRows.slice(0,20).join('\n')}` : ''));
        return;
      }

      showConfirm(
        `엑셀 분석 결과\n`+
        `- 새로 생성될 지점: ${result.branchesCreated}개\n`+
        `- 정보가 업데이트될 기존 지점: ${result.branchesUpdated}개\n`+
        `- 새로 생성될 호실: ${result.roomsCreated}개\n`+
        `- 정보가 업데이트될 기존 호실: ${result.roomsUpdated}개\n`+
        `- 타입별 가격 업데이트: ${result.pricesUpdated}건\n`+
        (invalidRows.length ? `- 필수 항목 누락으로 제외된 행: ${invalidRows.length}건\n` : '') +
        (unmatchedBranchRows.length ? `- 지점을 찾지 못해 제외된 행: ${unmatchedBranchRows.length}건\n` : '') +
        `\n위 내용을 반영할까요?`,
        ()=>{
          DB.branches.push(...newBranches);
          DB.rooms.push(...newRooms);
          pendingBranchUpdates.forEach(u=> u.branch[u.field] = u.value);
          pendingRoomUpdates.forEach(u=> u.room[u.field] = u.value);
          // 새로 등장한 타입은 지점의 타입 목록에 먼저 등록해둔다(가격이 없으면 0원으로).
          // 그 다음 "타입별가격" 시트에 실제 값이 있었다면 그 값으로 덮어쓴다.
          roomTypesToRegister.forEach(({branch, types})=> types.forEach(t=> registerRoomType(branch, t)));
          pendingTypePrices.forEach(({branch, patch})=>{
            branch.typePrices = Object.assign({}, branch.typePrices, patch);
          });
          logChange(`지점/호실 엑셀 일괄 업데이트: 지점 생성 ${result.branchesCreated}개·수정 ${result.branchesUpdated}개, 호실 생성 ${result.roomsCreated}개·수정 ${result.roomsUpdated}개, 타입별 가격 ${result.pricesUpdated}건`);
          scheduleSave();
          render();
          const noteLines = [];
          if(invalidRows.length) noteLines.push(`필수 항목 누락으로 제외된 행:\n` + invalidRows.slice(0,30).join('\n') + (invalidRows.length>30 ? `\n...외 ${invalidRows.length-30}건` : ''));
          if(unmatchedBranchRows.length) noteLines.push(`지점을 찾지 못해 제외된 행:\n` + unmatchedBranchRows.slice(0,30).join('\n') + (unmatchedBranchRows.length>30 ? `\n...외 ${unmatchedBranchRows.length-30}건` : ''));
          showAlert('지점/호실 정보가 업데이트되었습니다.' + (noteLines.length ? '\n\n' + noteLines.join('\n\n') : ''));
        }
      );
    }catch(err){
      console.error(err);
      showAlert('엑셀 처리 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------------- 계약관리: 스프레드시트에서 복사한 표를 붙여넣어 호실별 계약 이력으로 저장 ---------------- */
const CONTRACT_FIELD_BY_HEADER = {
  '계약일':'contractDate', '계약기간':'contractPeriod', '지역구':'district', '고시원명':'branchName', '방이름':'roomName',
  '계약자':'contractor', '계약자연락처':'contractorPhone', '입실자':'resident', '입실료':'rent', '결제금액':'paymentAmount',
  '계약상태':'contractStatus', '계약유형':'contractType', '계약구분':'contractCategory', '결제구분':'paymentCategory',
  '보증금':'deposit', '보증금안내':'depositNote', '계약내용':'contractContent'
};

function dedupeContracts(){
  const seen = new Set();
  const deduped = [];
  const removedContracts = [];
  DB.contracts.forEach(c=>{
    const sig = contractSignature(c);
    if(seen.has(sig)){ removedContracts.push(c); return; }
    seen.add(sig);
    deduped.push(c);
  });
  if(removedContracts.length===0){
    showAlert('중복된 계약 이력이 없습니다.');
    return;
  }
  showConfirm(`완전히 동일한 중복 계약 이력 ${removedContracts.length}건을 찾았습니다. 각 그룹에서 1건만 남기고 삭제할까요?`, ()=>{
    DB.contracts = deduped;
    batchDeleteDocs(CONTRACTS_COL, removedContracts.map(c=>c.id)).catch(e=> console.error('중복 계약 삭제 실패:', e));
    refreshContractsCache();
    logChange(`중복 계약 이력 정리: ${removedContracts.length}건 삭제`);
    scheduleSave(); render();
    showAlert(`중복 계약 이력 ${removedContracts.length}건을 삭제했습니다.`);
  });
}
