function renderJustImportedStatsCard(){
  const items = [];
  DB.residents.filter(p=>p.justImported).forEach(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room || !hasBranchAccess(room.branchId)) return;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    items.push({ p, room, branch });
  });
  if(items.length===0) return document.createDocumentFragment();

  const groupMap = new Map();
  items.forEach(item=>{
    const key = item.branch ? item.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { branch: item.branch, entries: [] });
    groupMap.get(key).entries.push(item);
  });
  const groups = [...groupMap.values()].sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card';
  card.style.borderColor = 'var(--st-imported)';
  card.innerHTML = `<h3 style="color:var(--st-imported);">계약 가져오기로 계약현황이 업데이트된 입실자 확인 필요 <span class="cnt-badge" style="background:var(--st-imported-bg);color:var(--st-imported);">${items.length}</span></h3>`;

  groups.forEach(group=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'overdue-branch-group';
    const branchName = document.createElement('div');
    branchName.className = 'overdue-branch-name';
    branchName.textContent = group.branch ? branchLabel(group.branch) : '(지점 정보 없음)';
    if(group.branch){
      branchName.style.cursor = 'pointer';
      branchName.title = '해당 지점의 "계약 확인 필요" 탭으로 이동';
      branchName.onclick = ()=>{ UI.view = 'branch'; UI.branchId = group.branch.id; UI.roomStatusFilter = '계약 확인 필요'; render(); };
    }
    groupWrap.appendChild(branchName);

    const chipRow = document.createElement('div');
    chipRow.className = 'overdue-room-chips';
    group.entries.forEach(item=>{
      const chip = document.createElement('span');
      chip.className = 'badge overdue-room-chip';
      chip.style.background = 'var(--st-imported-bg)'; chip.style.color = 'var(--st-imported)';
      chip.textContent = `${item.room.number}호 ${item.p.name || '(이름 미입력)'}`;
      chip.title = '해당 호실로 이동';
      chip.onclick = ()=>{
        if(!item.branch) return;
        UI.view = 'branch';
        UI.branchId = item.branch.id;
        scrollToRoomCard(item.room);
      };
      chipRow.appendChild(chip);
    });
    groupWrap.appendChild(chipRow);
    card.appendChild(groupWrap);
  });

  return card;
}
/* ---------------- 정산 반환 금액 계산기 ---------------- */
// 지점별 정산 설정(수수료율/보증금/환불계좌)을 엑셀 표에서 한 번에 등록하기 위한 헤더 매핑.
// 헤더는 공백을 모두 지운 뒤 정확히 일치하는 것만 인식한다("보증금관리"와 "보증금"이 서로
// 다른 열로 구분되어야 하므로 접두어 매칭은 쓰지 않는다).
const SETTLEMENT_FIELD_BY_HEADER = {
  '고시원명':'branchName', '고시원':'branchName', '고시원이름':'branchName',
  '지점명':'branchName', '지점':'branchName',
  '수수료율':'commissionRate', '수수료':'commissionRate', '정산수수료율':'commissionRate',
  '보증금관리':'managesDeposit', '보증금관리여부':'managesDeposit',
  '보증금':'depositAmount', '보증금금액':'depositAmount',
  '환불계좌':'refundAccount', '환부계좌':'refundAccount', '환급계좌':'refundAccount',
  '계좌':'refundAccount', '계좌번호':'refundAccount'
};
function parseSettlementBool(s){
  const v = cleanKeyLoose(s).toUpperCase();
  if(!v) return false;
  return ['O','Y','YES','TRUE','1','V','관리','관리함','관리O','있음','예'].includes(v);
}
function importSettlementGrid(headerCells, dataRows, onImported){
  const idx = {};
  headerCells.forEach((h, i)=>{
    const key = SETTLEMENT_FIELD_BY_HEADER[cleanKeyLoose(h).replace(/\s+/g,'')];
    if(key) idx[key] = i;
  });
  if(idx.branchName == null){
    showAlert('헤더 행에서 "고시원명"(또는 지점명) 열을 찾을 수 없습니다.\n첫 줄이 헤더인지 확인해주세요.');
    return;
  }
  const updates = [];
  const unmatched = [];
  dataRows.forEach((cells, i)=>{
    const get = (k)=> (idx[k]!=null && cells[idx[k]]!=null) ? String(cells[idx[k]]).trim() : '';
    const nameRaw = cleanKeyLoose(get('branchName'));
    if(!nameRaw) return;
    const resolved = BRANCH_NAME_ALIASES[nameRaw] || nameRaw;
    const branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase() === resolved.toLowerCase());
    if(!branch){ unmatched.push(`[${i+2}행] ${nameRaw}`); return; }
    const patch = {};
    if(idx.commissionRate != null){
      const raw = get('commissionRate').replace(/[^0-9.]/g,'');
      if(raw !== ''){
        let rate = Number(raw) || 0;
        // "0.07"처럼 비율로 적힌 경우도 7%로 받아들인다 — 실제 운영상 1% 미만 수수료율은
        // 쓰이지 않으므로, 0과 1 사이 값은 소수 비율로 보고 100을 곱한다.
        if(rate > 0 && rate < 1) rate = rate * 100;
        patch.commissionRate = rate;
      }
    }
    if(idx.managesDeposit != null) patch.managesDeposit = parseSettlementBool(get('managesDeposit'));
    if(idx.depositAmount != null){
      const raw = get('depositAmount').replace(/[^0-9]/g,'');
      if(raw !== '') patch.depositAmount = Number(raw);
    }
    if(idx.refundAccount != null){
      const raw = get('refundAccount');
      if(raw && raw !== '-') patch.refundAccount = raw;
    }
    updates.push({ branch, patch });
  });
  if(updates.length === 0){
    showAlert('등록할 지점을 찾지 못했습니다.'
      + (unmatched.length ? `\n\n이름이 일치하는 지점이 없는 행:\n${unmatched.slice(0,20).join('\n')}` : ''));
    return;
  }
  showConfirm(
    `${updates.length}개 지점의 정산 설정을 업데이트할까요?`
      + (unmatched.length ? `\n(지점을 찾지 못한 ${unmatched.length}건은 제외됩니다)` : ''),
    ()=>{
      updates.forEach(u=> Object.assign(u.branch, u.patch));
      logChange(`지점 정산 설정 일괄 등록: ${updates.length}건`);
      scheduleSave(); render();
      if(typeof onImported === 'function') onImported();
      showAlert(`${updates.length}개 지점의 정산 설정을 업데이트했습니다.`
        + (unmatched.length ? `\n\n지점을 찾지 못해 제외된 행:\n${unmatched.slice(0,20).join('\n')}` : ''));
    }
  );
}
function showSettlementPasteModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.style.maxWidth = '640px';
  const close = ()=> overlay.remove();
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:10px;font-weight:700;">지점 정산 설정 붙여넣기</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6;">
      엑셀에서 헤더 행을 포함해 복사한 표를 붙여넣어주세요.<br>
      인식하는 열: <b>고시원명</b>(필수), 수수료율, 보증금관리, 보증금, 환불계좌<br>
      보증금관리는 O / X (또는 Y/N, 관리/미관리)로 적어주세요.
    </div>`;
  const textarea = document.createElement('textarea');
  textarea.rows = 10;
  textarea.style.cssText = 'width:100%;font-family:monospace;font-size:11.5px;';
  textarea.placeholder = '고시원명\t수수료율\t보증금관리\t보증금\t환불계좌';
  box.appendChild(textarea);
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소'; cancelBtn.onclick = close;
  const importBtn = document.createElement('button');
  importBtn.className = 'btn primary'; importBtn.textContent = '가져오기';
  importBtn.onclick = ()=>{
    const lines = textarea.value.replace(/\r/g,'').split('\n').filter(l=> l.trim()!=='');
    if(lines.length < 2){ showAlert('헤더 행과 데이터 행이 포함된 표를 붙여넣어주세요.'); return; }
    importSettlementGrid(lines[0].split('\t'), lines.slice(1).map(l=> l.split('\t')), close);
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(importBtn);
  box.appendChild(btnRow);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> textarea.focus(), 0);
}
function renderSettlementView(){
  const wrap = document.createElement('div');
  const state = UI.settlementCalc || (UI.settlementCalc = { branchId:'', gross:'', ownerCoupon:'', platformCoupon:'', deduction:'' });
  const branches = allowedBranches();

  const card = document.createElement('div');
  card.className = 'stat-section';
  card.appendChild(el('h3', null, '정산 반환 금액 계산기'));
  card.appendChild(el('div', null,
    '이미 정산이 끝난 뒤 환불이 발생한 경우, 원장에게서 회수할 금액(원장 반환액)을 계산합니다. 선차감했던 수수료 중 환불분에 해당하는 몫은 회사가 부담하고 나머지만 회수합니다.',
    'font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px;'));

  const form = document.createElement('div');
  form.style.cssText = 'display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:14px;';

  // 고시원 선택
  const branchWrap = document.createElement('div');
  branchWrap.style.cssText = 'flex:1 1 200px;';
  branchWrap.appendChild(el('label', 'field-label', '고시원'));
  const branchSel = document.createElement('select');
  branchSel.style.width = '100%';
  branchSel.innerHTML = `<option value="">(직접 입력)</option>` +
    branches.map(b=> `<option value="${b.id}">${esc(branchLabel(b))}</option>`).join('');
  branchSel.value = state.branchId || '';
  branchWrap.appendChild(branchSel);
  form.appendChild(branchWrap);

  // 수수료율
  const rateWrap = document.createElement('div');
  rateWrap.style.cssText = 'flex:0 0 110px;';
  rateWrap.appendChild(el('label', 'field-label', '수수료율(%)'));
  const rateInput = document.createElement('input');
  rateInput.type = 'number'; rateInput.min = '0'; rateInput.max = '100'; rateInput.step = '0.1';
  rateInput.style.width = '100%';
  rateWrap.appendChild(rateInput);
  form.appendChild(rateWrap);

  // 정산 로직에 필요한 금액 입력값들(운영팀 계산 로직 기준)
  [
    ['gross',          '총 판매가',         '예: 1000000'],
    ['ownerCoupon',    '원장님 쿠폰',        '예: 0'],
    ['platformCoupon', '플랫폼 쿠폰/포인트', '예: 0'],
    ['deduction',      '차감액',            '예: 565000']
  ].forEach(([key, label, ph])=>{
    const w = document.createElement('div');
    w.style.cssText = 'flex:1 1 150px;';
    w.appendChild(el('label', 'field-label', label));
    const input = document.createElement('input');
    input.type = 'text'; input.inputMode = 'numeric'; input.placeholder = ph;
    input.style.width = '100%';
    input.value = state[key] || '';
    input.addEventListener('input', ()=>{ state[key] = input.value; renderResult(); });
    w.appendChild(input);
    form.appendChild(w);
  });

  card.appendChild(form);
  const resultBox = document.createElement('div');
  card.appendChild(resultBox);

  function selectedBranch(){ return branches.find(b=> b.id === state.branchId) || null; }

  function syncBranchDependentInputs(){
    const branch = selectedBranch();
    // 지점을 고르면 그 지점의 수수료율을 기본값으로 채운다(여기서 직접 고쳐 계산해볼 수도 있다).
    if(branch && state.rate == null) state.rate = branchCommissionRate(branch);
    if(state.rate == null) state.rate = SETTLEMENT_DEFAULT_COMMISSION_RATE;
    rateInput.value = state.rate;
  }

  function renderResult(){
    const branch = selectedBranch();
    const r = calcSettlementReturn({
      gross: state.gross, ownerCoupon: state.ownerCoupon,
      platformCoupon: state.platformCoupon, deduction: state.deduction, rate: state.rate
    });
    resultBox.innerHTML = '';
    if(r.gross <= 0){
      resultBox.appendChild(el('div', null, '총 판매가를 입력하면 계산됩니다.',
        'font-size:12px;color:var(--ink-soft);padding:10px 0;'));
      return;
    }
    const rows = [
      ['정산 기준 금액  (총 판매가 − 원장님 쿠폰)', formatWon(r.settlementBase), ''],
      ['실결제금  (총 판매가 − 쿠폰/포인트)', formatWon(r.actualPaid), ''],
      ['고객 환불액  (실결제금 − 차감액)', formatWon(r.customerRefund), 'color:var(--st-forsale);font-weight:700;'],
      ['반환 기준 금액  (총 판매가 − 차감액)', formatWon(r.ownerReturnBase), 'border-top:1px solid var(--line);'],
      [`반환 수수료 (${r.rate}%)`, '− ' + formatWon(r.commissionBack), 'color:var(--st-hold);'],
      ['원장 반환액', formatWon(r.ownerReturn), 'font-weight:800;color:var(--accent-ink);border-top:1px solid var(--line);']
    ];
    const table = document.createElement('table');
    table.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;';
    table.innerHTML = rows.map(([label, value, style])=>
      `<tr><td style="padding:7px 4px;${style}">${esc(label)}</td>
           <td style="padding:7px 4px;text-align:right;font-family:'JetBrains Mono',monospace;${style}">${esc(value)}</td></tr>`
    ).join('');
    resultBox.appendChild(table);
    // 전달받은 로직은 원장 반환액을 "총 판매가 − 차감액" 기준으로 계산하는데, 원장에게 실제로
    // 정산해준 돈은 정산 기준 금액(총 판매가 − 원장님 쿠폰) 기준이라, 원장님 쿠폰이 있으면
    // 두 기준이 갈려 회수액이 원장님 쿠폰만큼 부풀려진다. 원장님 쿠폰이 0인 일반적인 경우엔
    // 두 계산이 완전히 같으므로, 값이 있을 때만 확인이 필요하다고 눈에 띄게 알린다.
    if(r.ownerCoupon > 0){
      const altBase = Math.max(0, r.settlementBase - r.deduction);
      const altReturn = altBase - Math.round(altBase * r.rate / 100);
      resultBox.appendChild(el('div', null,
        `⚠ 원장님 쿠폰이 있어 확인이 필요합니다. 전달주신 로직 그대로 총 판매가 기준으로 계산해 ${formatWon(r.ownerReturn)}이 나왔습니다. 만약 정산 기준 금액(총 판매가 − 원장님 쿠폰)을 기준으로 계산해야 한다면 ${formatWon(altReturn)}이 됩니다. 어느 쪽이 맞는지 알려주세요.`,
        'font-size:11.5px;color:var(--st-hold);background:var(--st-hold-bg);padding:9px 11px;border-radius:6px;margin-top:10px;line-height:1.7;'));
    }
    if(branch && branch.refundAccount){
      resultBox.appendChild(el('div', null, `환불계좌: ${branch.refundAccount}`,
        'font-size:12px;color:var(--ink-soft);margin-top:8px;'));
    }
  }

  branchSel.addEventListener('change', ()=>{
    state.branchId = branchSel.value;
    state.rate = null; // 지점이 바뀌면 그 지점의 기본 수수료율로 다시 채운다
    syncBranchDependentInputs();
    renderResult();
  });
  rateInput.addEventListener('input', ()=>{ state.rate = rateInput.value === '' ? 0 : Number(rateInput.value); renderResult(); });

  // 운영팀 계산 로직 설명을 화면에도 그대로 남겨둔다(수치 검증용).
  const logicBox = document.createElement('div');
  logicBox.style.cssText = 'margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--ink-soft); line-height:1.9;';
  logicBox.innerHTML = `<b style="color:var(--ink);">계산 로직</b><br>
    · <b>정산 기준 금액</b> = 총 판매가 − 원장님 쿠폰 <span style="opacity:.85">(플랫폼 쿠폰/포인트는 정산 기준에서 제외되지 않음)</span><br>
    · <b>고객 환불액</b> = 실결제금 − 차감액 <span style="opacity:.85">(실결제금 = 총 판매가 − 쿠폰/포인트)</span><br>
    · <b>원장 반환액</b> = (총 판매가 − 차감액) × (1 − 수수료율) <span style="opacity:.85">(정산 완료 시에만 계산)</span><br>
    · 보증금은 원장에게 청구하는 항목이 아니므로 계산에서 제외합니다.`;
  card.appendChild(logicBox);

  syncBranchDependentInputs();
  renderResult();
  wrap.appendChild(card);

  // 지점별 정산 설정 현황(엑셀 일괄 등록 결과를 여기서 바로 확인/수정할 수 있다)
  const settingsCard = document.createElement('div');
  settingsCard.className = 'stat-section';
  const settingsHead = document.createElement('div');
  settingsHead.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;';
  settingsHead.appendChild(el('h3', null, '지점별 정산 설정', 'margin:0;'));
  if(canEdit()){
    const pasteBtn = document.createElement('button');
    pasteBtn.className = 'btn small primary';
    pasteBtn.textContent = '엑셀 붙여넣기';
    pasteBtn.onclick = showSettlementPasteModal;
    settingsHead.appendChild(pasteBtn);
  }
  settingsCard.appendChild(settingsHead);
  settingsCard.appendChild(el('div', null, '각 지점의 값은 지점 화면 상단 "지점 정보"에서도 직접 수정할 수 있습니다.',
    'font-size:11.5px;color:var(--ink-soft);margin:6px 0 10px;'));
  const sTable = document.createElement('table');
  sTable.className = 'branch-table';
  sTable.innerHTML = `<thead><tr><th>지점</th><th>수수료율</th><th>보증금 관리</th><th>보증금</th><th>환불계좌</th></tr></thead>`;
  const sBody = document.createElement('tbody');
  branches.forEach(b=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="font-weight:700;">${esc(branchLabel(b))}</td>
      <td>${branchCommissionRate(b)}%</td>
      <td>${b.managesDeposit ? '관리함' : '<span style="color:var(--ink-soft);">-</span>'}</td>
      <td>${b.managesDeposit && b.depositAmount ? esc(formatWon(b.depositAmount)) : '<span style="color:var(--ink-soft);">-</span>'}</td>
      <td>${b.refundAccount ? esc(b.refundAccount) : '<span style="color:var(--ink-soft);">-</span>'}</td>`;
    sBody.appendChild(tr);
  });
  sTable.appendChild(sBody);
  settingsCard.appendChild(sTable);
  wrap.appendChild(settingsCard);

  return wrap;
}
// 계약 가져오기에서 결제구분이 "환불"인 행이 감지되고, 그 방에 재실 중인 입실자와 이름이
// 일치하며 과거 결제 이력도 있으면(importContractGrid 참고) 여기에 표시된다. 실거주자를
// 잘못 퇴실 처리하는 사고를 막기 위해 자동으로는 표시만 하고, 담당자가 "퇴실 처리" 버튼을
// 눌러야 실제로 퇴실(moveResidentToHistory)이 진행된다 — 오매칭이면 "무시"로 표시만 지운다.
function renderRefundPendingStatsCard(){
  const items = [];
  DB.residents.filter(p=>p.refundPending).forEach(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room || !hasBranchAccess(room.branchId)) return;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    items.push({ p, room, branch });
  });
  if(items.length===0) return document.createDocumentFragment();

  const groupMap = new Map();
  items.forEach(item=>{
    const key = item.branch ? item.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { branch: item.branch, entries: [] });
    groupMap.get(key).entries.push(item);
  });
  const groups = [...groupMap.values()].sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card';
  card.style.borderColor = 'var(--st-hold)';
  card.innerHTML = `<h3 style="color:var(--st-hold);">⚠ 환불 처리 필요 <span class="cnt-badge" style="background:var(--st-hold-bg);color:var(--st-hold);">${items.length}</span></h3>
    <div style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">계약이 환불 처리되어 해당 입실자의 퇴실 처리가 필요할 수 있습니다. 확인 후 처리해주세요.</div>`;

  groups.forEach(group=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'overdue-branch-group';
    const branchName = document.createElement('div');
    branchName.className = 'overdue-branch-name';
    branchName.textContent = group.branch ? branchLabel(group.branch) : '(지점 정보 없음)';
    groupWrap.appendChild(branchName);

    group.entries.forEach(item=>{
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:4px 0;';
      const refundDate = item.p.refundPendingDate || todayISO();
      // 환불(계약취소) 시점에 아직 입실일이 오지 않은 "입실예정" 상태였다면, 실제로 거주한 적이
      // 없으므로 "퇴실 처리"(moveIn~환불일을 이용 기간으로 이력에 남김)는 의미가 없을 뿐 아니라
      // 입실일보다 이른 퇴실일이 남아 "9월2일~8월31일"처럼 역순 기간이 기록되는 오류가 생긴다.
      // 이 경우는 애초에 입실이 없었던 것이므로 이력 없이 "예약 취소"(그냥 삭제)로 처리한다.
      const neverMovedIn = !!(item.p.moveIn && item.p.moveIn > refundDate);
      const info = document.createElement('span');
      info.className = 'badge';
      info.style.cssText = 'background:var(--st-hold-bg); color:var(--st-hold); cursor:pointer;';
      info.textContent = `${item.room.number}호 ${item.p.name || '(이름 미입력)'} (환불일: ${item.p.refundPendingDate || '미상'})${neverMovedIn ? ' · 입실 전 취소' : ''}`;
      info.title = '해당 호실로 이동';
      info.onclick = ()=>{
        if(!item.branch) return;
        UI.view = 'branch';
        UI.branchId = item.branch.id;
        scrollToRoomCard(item.room);
      };
      row.appendChild(info);
      if(canEdit()){
        const leaveBtn = document.createElement('button');
        leaveBtn.className = 'btn small danger';
        leaveBtn.textContent = neverMovedIn ? '예약 취소' : '퇴실 처리';
        leaveBtn.title = neverMovedIn
          ? '입실 전에 계약이 취소된 경우입니다. 입실자 정보를 삭제합니다(이용 기간이 없으므로 퇴실 이력에는 남기지 않습니다)'
          : '이 입실자를 환불 계약일 기준으로 퇴실 처리합니다';
        leaveBtn.onclick = ()=>{
          if(neverMovedIn){
            showConfirm(`"${item.p.name || '이 입실자'}"는 입실 예정일(${item.p.moveIn}) 전에 계약이 취소되었습니다.\n실제 이용한 적이 없으므로 퇴실 이력을 남기지 않고 입실자 정보를 삭제할까요?`, ()=>{
              delete UI.residentSnapshots[item.p.id];
              delete UI.residentFieldEdit[item.p.id];
              logChange(`"${item.p.name || '입실자'}" 입실 전 계약 취소로 삭제`);
              DB.residents = DB.residents.filter(x=>x.id!==item.p.id);
              scheduleSave(); render();
            });
          } else {
            showConfirm(`"${item.p.name || '이 입실자'}"를 환불 계약일(${item.p.refundPendingDate || '미상'}) 기준으로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
              moveResidentToHistory(item.p, item.p.refundPendingDate || todayISO());
              scheduleSave(); render();
            });
          }
        };
        const dismissBtn = document.createElement('button');
        dismissBtn.className = 'btn small';
        dismissBtn.textContent = '무시';
        dismissBtn.title = '오매칭이거나 처리가 필요 없으면 표시만 지웁니다(입실자 정보는 그대로 유지)';
        dismissBtn.onclick = ()=>{
          delete item.p.refundPending;
          delete item.p.refundPendingDate;
          delete item.p.refundPendingContractId;
          logChange(`"${item.p.name}" 환불 처리 필요 표시 해제(무시)`);
          scheduleSave(); render();
        };
        row.appendChild(leaveBtn); row.appendChild(dismissBtn);
      }
      groupWrap.appendChild(row);
    });
    card.appendChild(groupWrap);
  });

  return card;
}

function renderCleaningView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';
  wrap.appendChild(renderCleaningCards());
  wrap.appendChild(renderCleaningWeekMatrix());
  return wrap;
}

/* 청소 관리 대시보드(상단 카드·주간표)가 공유하는 단일 데이터 소스.
   퇴실청소: 계약만기일 등으로 퇴실이 확정된(scheduledToLeave) 입실자는, 청소 인력이
   나오는 월/수/금 중 퇴실일 이후 가장 빠른 날짜를 청소일로 잡는다(예: 8/9(일) 만기 →
   8/10(월)). 이미 퇴실청소가 필요로 표시된 호실은 그 날짜를 그대로 쓴다. 리터치는
   autoFlagDueRetouch()가 조건에 맞으면 자동으로 needsRetouch/maintenanceDate를 걸어주므로
   여기서는 그렇게 이미 걸린 값을 그대로 읽기만 한다(필요하면 수동으로도 계속 켤 수 있다).
   추가청소는 수동 관리이며 예정일을 입력하지 않았으면 date를 null로 둔다(카드 목록엔 "오늘"로
   표시되지만, 날짜가 없어 주간표에는 올릴 수 없음 — 소비하는 쪽에서 구분해서 처리한다). */
function collectCleaningEntries(){
  const entries = [];
  DB.rooms.filter(r=> (r.needsCleaning || r.needsRetouch || r.needsExtraCleaning) && hasBranchAccess(r.branchId)).forEach(r=>{
    const branch = DB.branches.find(b=>b.id===r.branchId);
    const kind = roomMaintKind(r);
    entries.push({ type:kind, branch, room:r, date: r.maintenanceDate || (kind==='moveout' ? todayISO() : null) });
  });
  // roomUpcomingLeaveDate는 방 카드 배지와 동일한 기준(퇴실확정된 입실자 유무 + 방 카드에서
  // "퇴실청소" 칩으로 취소한 적이 있는지)을 쓰므로, 방 카드에서 취소하면 여기서도 함께 사라진다.
  // 이 미리보기는 room.needsCleaning을 실제로 걸지 않고 계산만 하므로, 청소/리터치 자동 지정
  // 제외 지점(isAutoCleaningExcludedBranch)의 방은 여기서도 제외해야 한다 — 안 그러면 목록에는
  // 뜨는데 needsCleaning이 걸린 적이 없어(자동 지정 자체가 막혀 있으므로) "청소완료" 버튼이 영영
  // 나타나지 않는 상태로 남는다(제주 A202호 등에서 보고된 증상).
  DB.rooms.filter(r=> !roomMaintKind(r) && hasBranchAccess(r.branchId) && !isAutoCleaningExcludedBranch(roomBranch(r))).forEach(r=>{
    const date = roomUpcomingLeaveDate(r);
    if(!date) return;
    const branch = DB.branches.find(b=>b.id===r.branchId);
    entries.push({ type:'moveout', branch, room:r, date });
  });
  return entries;
}

// 리터치 자동 예약 기준일(입실예정일 기준 며칠 이내에 청소 이력이 없으면 리터치가 필요한지).
const RETOUCH_RECENT_CLEAN_DAYS = 10;
function roomCleanedWithin(room, beforeDateStr, windowDays){
  const from = addDaysISO(beforeDateStr, -windowDays);
  return (room.cleaningHistory || []).some(h=> h.date && h.date >= from && h.date < beforeDateStr);
}
/* 리터치 자동 예약: 지금 아무도 살고 있지 않고(이용중인 입실자 없음), 입실예정자가 있는 방인데
   그 입실예정일 기준 RETOUCH_RECENT_CLEAN_DAYS일 이내에 청소(퇴실청소/리터치/추가청소 무엇이든)
   이력이 없으면, 입실예정일 전 가장 가까운 월/수/금으로 리터치를 자동으로 건다. 예: 입실예정일이
   10/11이고 직전 퇴실청소가 9/30(11일 전이라 기준일 밖)이면 10/9(가장 가까운 금)에 리터치.
   이미 청소/리터치/추가청소가 걸려 있는 방, 공실 방은 건드리지 않는다(수동 관리 유지).
   AUTO_CLEANING_EXCLUDED_BRANCH_NAMES(제주·오산 등)는 일반 고시원과 다르게 운영되어 이 자동
   예약 대상에서 제외한다. */
function autoFlagDueRetouch(){
  let changed = false;
  DB.rooms.forEach(room=>{
    if(isAutoCleaningExcludedBranch(roomBranch(room))) return;
    if(roomMaintKind(room)) return;
    if(effectiveRoomStatus(room) === '공실') return;
    if(DB.residents.some(p=> p.roomId===room.id && isCurrentlyResiding(p))) return;
    const upcoming = DB.residents.filter(p=> p.roomId===room.id && isUpcoming(p))
      .sort((a,b)=> a.moveIn.localeCompare(b.moveIn))[0];
    if(!upcoming) return;
    if(roomCleanedWithin(room, upcoming.moveIn, RETOUCH_RECENT_CLEAN_DAYS)) return;
    room.needsRetouch = true;
    room.maintenanceDate = prevMonWedFri(addDaysISO(upcoming.moveIn, -1));
    room.maintenanceMemo = '';
    changed = true;
  });
  if(changed) scheduleSave();
}
// 청소/리터치가 예정된 방에 "새로운" 입실자가 들어와 살기 시작하면 그 예정은 더 이상 의미가
// 없다고 보고 자동으로 초기화한다 — 입실 전에 이미 청소가 끝났다고 보는 게 자연스럽고, 직원이
// "청소완료"/"리터치완료" 버튼 누르는 걸 잊었을 때를 위한 안전장치이기도 하다. 추가청소
// (needsExtraCleaning)는 별개로 수동 관리되는 항목이라 건드리지 않는다.
// 주의: 재실 중인 입실자가 있다고 해서 무조건 초기화하면 안 된다 — 퇴실확정(scheduledToLeave)
// 상태로 청소 예정을 미리 걸어둔 그 사람 본인은, 실제 퇴실 처리(모두 퇴실 처리 버튼을 누르기
// 전)가 될 때까지 여전히 "재실 중"으로 간주된다(moveIn<=오늘). 이 경우까지 "새 입실자가
// 들어왔다"고 오인해 청소 예정을 지워버리면, 정작 퇴실일 당일에 청소완료 버튼이 사라져버리는
// 문제가 생긴다(신삼B동 402호 등에서 보고됨). room.cleaningFlagSourceId(청소 예정을 만든
// 원인 입실자 id, flagUpcomingCleaning 참고)가 지금 재실 중인 바로 그 사람과 같으면 "그 사람
// 본인이 아직 안 나간 것"이므로 건드리지 않고, 다르면(또는 원래 없었으면, 즉 실제 퇴실 처리
// 시점에 걸린 경우) 진짜 새 입실자로 보고 초기화한다.
function clearCleaningFlagsOnMoveIn(){
  let changed = false;
  DB.rooms.forEach(room=>{
    if(!(room.needsCleaning || room.needsRetouch)) return;
    const currentResident = DB.residents.find(p=> p.roomId===room.id && isCurrentlyResiding(p));
    if(!currentResident) return;
    if(room.cleaningFlagSourceId && room.cleaningFlagSourceId === currentResident.id) return;
    room.needsCleaning = false;
    room.needsRetouch = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
    changed = true;
  });
  if(changed) scheduleSave();
}
// 청소/리터치 자동 지정에서 제외된 지점(autoCleaningExcluded)의 방에 이미 청소/리터치 예정이
// 걸려 있으면(제외 설정 이전에 걸렸거나, 체크박스를 막 켠 시점 등) 지워준다. 체크박스를 켜는
// 순간 즉시 한 번(그 지점만) + 로그인 시·매시간 전체 지점을 대상으로 다시 확인해서, 어떤
// 경로로 걸렸든 계속 남아있지 않게 한다.
function clearCleaningFlagsForExcludedBranches(){
  let changed = false;
  DB.rooms.forEach(room=>{
    if(!isAutoCleaningExcludedBranch(roomBranch(room))) return;
    if(!(room.needsCleaning || room.needsRetouch)) return;
    room.needsCleaning = false;
    room.needsRetouch = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
    changed = true;
  });
  if(changed) scheduleSave();
}

/* 청소 관리 주간표에 "완료" 플래그로 표시할, 이미 처리된 청소 이력(room.cleaningHistory) 목록. */
function collectCleaningDoneEntries(){
  const entries = [];
  DB.rooms.filter(r=> hasBranchAccess(r.branchId) && Array.isArray(r.cleaningHistory) && r.cleaningHistory.length).forEach(r=>{
    const branch = DB.branches.find(b=>b.id===r.branchId);
    r.cleaningHistory.forEach(h=> entries.push({ type:h.type, branch, room:r, date:h.date, label:h.label }));
  });
  return entries;
}

function completeCleaningEntry(room, type){
  const field = MAINT_KIND_FIELD[type];
  if(!field || !room[field]) return;
  const label = MAINT_KIND_META[type].label;
  const doneLabel = MAINT_DONE_LABEL[type] || `${label}완료`;
  const scheduledDate = room.maintenanceDate || '';
  const memo = room.maintenanceMemo || '';
  room[field] = false;
  room.maintenanceDate = '';
  room.maintenanceMemo = '';
  if(!Array.isArray(room.cleaningHistory)) room.cleaningHistory = [];
  room.cleaningHistory.unshift({ id: uid('cl'), type, label: doneLabel, date: todayISO(), scheduledDate, memo });
  room.cleaningHistory = room.cleaningHistory.slice(0, CLEANING_HISTORY_MAX);
  logChange(`${room.number}호 ${label} 완료 처리`);
  scheduleSave(); render();
}

function goToBranchRooms(branchId){
  UI.view='branch'; UI.branchId = branchId; UI.branchTab='rooms'; UI.roomStatusFilter='전체'; render();
}

function mondayOf(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function renderCleaningWeekMatrix(){
  if(!UI.cleanWeekStart) UI.cleanWeekStart = mondayOf(todayISO());

  const box = document.createElement('div');
  box.className = 'stat-section';

  const weekDates = [0,1,2,3,4,5,6].map(i=> addDaysISO(UI.cleanWeekStart, i));
  const today = todayISO();

  const head = document.createElement('div');
  head.className = 'cal-head';
  const spacer = document.createElement('div');
  spacer.className = 'cal-head-spacer';
  const nav = document.createElement('div');
  nav.className = 'cal-head-nav';
  const prevBtn = document.createElement('button'); prevBtn.className='btn small'; prevBtn.textContent='◀';
  const nextBtn = document.createElement('button'); nextBtn.className='btn small'; nextBtn.textContent='▶';
  const title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = `${weekDates[0].slice(0,4)}년 ${Number(weekDates[0].slice(5,7))}월 청소 필요 현황`;
  prevBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, -7); render(); };
  nextBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, 7); render(); };
  nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
  head.appendChild(spacer); head.appendChild(nav);
  box.appendChild(head);

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML = `<span class="cal-legend-item">클릭 시 계약/입실관리의 해당 지점으로 이동 · 해당 없는 항목은 표시하지 않음 · 흐리게 표시된 항목은 완료 처리됨</span>`;
  box.appendChild(legend);

  const branches = allowedBranches();
  if(branches.length===0){
    box.appendChild(el('div','cleaning-empty','지점이 없습니다.'));
    return box;
  }

  const entries = collectCleaningEntries().filter(e=> e.date && weekDates.includes(e.date));
  const doneEntries = collectCleaningDoneEntries().filter(e=> e.date && weekDates.includes(e.date));
  const grid = new Map(); // branchId -> date -> {moveout:[room번호...], retouch:[...], extra:[...], moveoutDone:[...], retouchDone:[...], extraDone:[...]}
  function dayEntrySlot(dmap, date){
    if(!dmap.has(date)) dmap.set(date, { moveout:[], retouch:[], extra:[], moveoutDone:[], retouchDone:[], extraDone:[] });
    return dmap.get(date);
  }
  entries.forEach(e=>{
    const bkey = e.branch ? e.branch.id : '__none__';
    if(!grid.has(bkey)) grid.set(bkey, new Map());
    dayEntrySlot(grid.get(bkey), e.date)[e.type].push(e.room.number);
  });
  doneEntries.forEach(e=>{
    const bkey = e.branch ? e.branch.id : '__none__';
    if(!grid.has(bkey)) grid.set(bkey, new Map());
    dayEntrySlot(grid.get(bkey), e.date)[e.type+'Done'].push(e.room.number);
  });

  function chipsHtml(dayEntry, branchName, dateLabel){
    const pending = Object.keys(MAINT_KIND_META).filter(k=> dayEntry[k] && dayEntry[k].length).map(k=>{
      const rooms = dayEntry[k];
      const roomsText = rooms.map(n=> n+'호').join(', ');
      const tip = `${branchName} · ${roomsText} · ${MAINT_KIND_META[k].label} · 청소예정일 ${dateLabel}`;
      return `<span class="cal-chip ${k}" title="${esc(tip)}">${MAINT_KIND_META[k].label}(${rooms.length})</span>`;
    });
    const done = Object.keys(MAINT_KIND_META).filter(k=> dayEntry[k+'Done'] && dayEntry[k+'Done'].length).map(k=>{
      const rooms = dayEntry[k+'Done'];
      const roomsText = rooms.map(n=> n+'호').join(', ');
      const doneLabel = MAINT_DONE_LABEL[k] || `${MAINT_KIND_META[k].label}완료`;
      const tip = `${branchName} · ${roomsText} · ${doneLabel} · ${dateLabel}`;
      return `<span class="cal-chip ${k} done" title="${esc(tip)}">${doneLabel}(${rooms.length})</span>`;
    });
    return pending.concat(done).join('');
  }

  const DOW = ['월','화','수','목','금','토','일'];
  const table = document.createElement('table');
  table.className = 'branch-table week-matrix';
  const theadCells = weekDates.map((d,i)=> `<th${d===today?' class="wk-today"':''}>${DOW[i]}<br><span class="wk-date">${d.slice(5)}</span></th>`).join('');
  table.innerHTML = `<thead><tr><th>지점</th>${theadCells}</tr></thead>`;
  const tbody = document.createElement('tbody');

  branches.forEach(branch=>{
    const dmap = grid.get(branch.id);
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.innerHTML = `<a href="#" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(branch))}</a>`;
    nameTd.querySelector('a').onclick = (e)=>{ e.preventDefault(); goToBranchRooms(branch.id); };
    tr.appendChild(nameTd);

    weekDates.forEach(d=>{
      const counts = dmap ? dmap.get(d) : null;
      const td = document.createElement('td');
      td.className = 'wk-cell' + (d===today?' wk-today':'') + (counts ? '' : ' wk-empty');
      td.innerHTML = counts ? `<div class="wk-chips">${chipsHtml(counts, branchLabel(branch), d.slice(5))}</div>` : '-';
      if(counts){
        td.style.cursor = 'pointer';
        td.onclick = ()=> goToBranchRooms(branch.id);
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  scrollWrap.appendChild(table);
  box.appendChild(scrollWrap);
  return box;
}

function renderCleaningCards(){
  const wrap = document.createElement('div');
  wrap.className = 'cleaning-cards-grid';

  const today = todayISO();
  const weekAhead = addDaysISO(today, 7);
  const entries = collectCleaningEntries();
  const todayList = entries.filter(x=> !x.date || x.date<=today)
    .sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));
  const futureList = entries.filter(x=> x.date && x.date>today && x.date<=weekAhead)
    .sort((a,b)=> a.date.localeCompare(b.date));

  wrap.appendChild(renderTodayCleaningCard(todayList));
  wrap.appendChild(renderCleaningCard('청소 예정방 (7일 이내)', futureList, true));
  return wrap;
}

const CLEANING_CARD_PAGE_SIZE = 4;
function paginateCleaningList(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / CLEANING_CARD_PAGE_SIZE));
  const clamped = Math.min(Math.max(page, 1), totalPages);
  const start = (clamped - 1) * CLEANING_CARD_PAGE_SIZE;
  return { pageList: list.slice(start, start + CLEANING_CARD_PAGE_SIZE), totalPages, page: clamped };
}
function appendCleaningPager(header, totalPages, currentPage, onPage){
  if(totalPages <= 1) return;
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  pager.style.marginTop = '0';
  for(let p=1; p<=totalPages; p++){
    const pBtn = document.createElement('button');
    pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
    pBtn.textContent = String(p);
    pBtn.onclick = ()=> onPage(p);
    pager.appendChild(pBtn);
  }
  header.appendChild(pager);
}

      entry.className = 'cleaning-entry';

      row.className = 'cleaning-row';
      const kindBadge = maintBadgeHtml(x.type);
      row.innerHTML = `<span class="rm">${esc(x.room.number)}호</span>`;
      const kindSpan = document.createElement('span');
      kindSpan.className = 'kind';
      kindSpan.innerHTML = kindBadge;
      // "오늘 청소방"에는 정확히 오늘 예정인 방뿐 아니라, 예전에 청소/리터치가 걸렸는데 아직
      // 완료 처리되지 않은 방(지연)과 애초에 예정일이 없던 방(추가청소 등)도 함께 섞여 들어온다

      // 화면에서 전혀 구분되지 않았으므로, 오늘이 아닌 경우 실제 예정일(또는 미정 여부)을
      // 배지로 보여준다 — 지연은 눈에 띄도록 빨간색으로 표시한다.
      if(!x.date){

        noteSpan.className = 'mdate';

        noteSpan.title = '예정일이 지정되지 않았습니다.';
        kindSpan.appendChild(noteSpan);
      } else if(x.date < today){
        const noteSpan = document.createElement('span');
        noteSpan.className = 'mdate';
        noteSpan.style.color = 'var(--st-hold)';
        noteSpan.textContent = `${x.date} 지연`;
        noteSpan.title = `원래 예정일: ${x.date} (아직 완료 처리되지 않았습니다)`;
        kindSpan.appendChild(noteSpan);
      }
      if(canEdit() && x.room[MAINT_KIND_FIELD[x.type]]){
        const doneBtn = document.createElement('button');
        doneBtn.className = 'btn small primary';
        doneBtn.textContent = '청소완료';

      row.appendChild(kindSpan);

/* ---------------- 도어락 관리: 원격 도어락 업체 페이지에서 복사한 표를 붙여넣어 지점·호실별
   연결 현황으로 정리한다. 계약 데이터 붙여넣기와 같은 방식(헤더 포함 표 붙여넣기)을 쓰되,
   원본 표의 "마지막 연결" 칸이 날짜와 연결상태(연결/미연결) 두 줄로 이루어져 있어 탭/줄바꿈
   위치가 불규칙할 수 있으므로, 칸 위치가 아니라 일련번호(hex)·날짜·연결상태 같은 값 자체의
   패턴을 기준(anchor)으로 각 행을 인식한다. */
// 신대방삼거리역은 소속명만으로는 A동/B동이 구분되지 않지만 실제로는 서로 다른 건물이라,
// 기기명에 남아있는 "A동"/"B동" 표기를 찾아 지점 그룹명에 붙여 구분한다(공간명은 쓰지 않는다.
// branchParkingCombineGroup과 같은 이유로 이 지점만 예외 처리 — 다른 지점은 해당 없음).
function applyDoorlockBuildingSplit(branchGroup, deviceName){
  if(!branchGroup.replace(/\s+/g,'').includes('신대방삼거리')) return branchGroup;
  const m = deviceName.match(/([A-Za-z0-9]{1,3})동/);
  if(!m) return branchGroup;
  const marker = m[1].toUpperCase() + '동';
  // branchGroup을 뽑아낸 조각에 이미 건물 표기가 붙어있으면(예: "신대방삼거리역A동") 중복으로
  // 또 붙이지 않는다.
  if(branchGroup.toUpperCase().includes(marker)) return branchGroup;
  return `${branchGroup} ${marker}`;
}
// 여러 지점에 공통으로 붙어 지점 구분에 의미가 없는 명칭들. 길이가 긴 것부터 지워야
// "호텔스테이"처럼 짧은 단어("스테이")를 포함하는 합성어도 통째로 지워진다.
const DOORLOCK_GENERIC_WORDS = ['먼슬리브','레지던스','원룸텔','호텔스테이','스테이'].sort((a,b)=> b.length-a.length);
function doorlockStripGenericWords(s){
  // "스테이"/"호텔스테이"는 먼슬리브 소속 기기의 일반적인 명칭 표기(예: "먼슬리브강남스테이"
  // -> "강남")일 때만 지운다. "먼슬리브"가 아예 없는 곳(다른 업체·건물의 고유 명칭)에 들어있는
  // "스테이"는 그 이름의 일부이므로 그대로 유지한다.
  const hasMonthliv = s.includes('먼슬리브');
  let cleaned = s;
  DOORLOCK_GENERIC_WORDS.forEach(w=>{
    if((w === '스테이' || w === '호텔스테이') && !hasMonthliv) return;
    // 바로 뒤에 숫자가 오면(예: "스테이79") 일반 명칭이 아니라 그 지점 고유의 이름 일부일
    // 수 있어 지우지 않는다.
    const re = new RegExp(w + '(?!\\d)', 'g');
    cleaned = cleaned.replace(re, '');
  });
  return cleaned.trim();
}
// 기기명의 "가장 마지막" 밑줄(_)을 기준으로 앞부분을 지점명, 뒷부분을 방 이름으로 나눈다.
// 지점명 쪽은 띄어쓰기(및 안쪽에 남아있는 밑줄)를 무시하고 붙여서 정리한 뒤 "먼슬리브"처럼
// 여러 지점에 공통으로 붙는 명칭을 지운다 — 표기가 살짝 달라도(공백 유무 등) 안전하게 지워진다.
function doorlockSplitDeviceName(deviceName){
  const name = String(deviceName||'').trim();
  const idx = name.lastIndexOf('_');
  if(idx === -1){
    const compact = doorlockStripGenericWords(name.replace(/\s+/g,''));
    return { branch: compact || name, room: name };
  }
  const branchRaw = name.slice(0, idx);
  const room = name.slice(idx + 1).trim();
  const branchCompact = branchRaw.replace(/[\s_]+/g, '');
  const branch = doorlockStripGenericWords(branchCompact) || branchCompact || branchRaw;
  return { branch, room };
}
function parseDoorlockPaste(text){
  const tokens = String(text||'').split(/[\t\n]/).map(t=> t.trim()).filter(t=> t!=='');
  const SERIAL_RE = /^[0-9A-Fa-f]{10,20}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}(:\d{2})?$/;
  const records = [];
  let i = 0;
  while(i < tokens.length){
    while(i < tokens.length && !SERIAL_RE.test(tokens[i])) i++;
    if(i >= tokens.length) break;
    const serial = tokens[i];
    const deviceName = tokens[i-1] || '';
    let j = i+1;
    const affiliation = tokens[j++] || '';
    const spaceName = tokens[j++] || '';
    const ssid = tokens[j++] || '';
    const battery = tokens[j++] || '';
    let lastConnected = '';
    if(j < tokens.length && DATE_RE.test(tokens[j])){ lastConnected = tokens[j]; j++; }
    let connected = true;
    if(j < tokens.length && (tokens[j]==='연결' || tokens[j]==='미연결')){
      connected = tokens[j] === '연결';
      j++;
    }
    let owner = '';
    if(j < tokens.length && !SERIAL_RE.test(tokens[j])){ owner = tokens[j]; j++; }
    // 기기명을 밑줄 기준으로 앞(지점명)/뒤(방 이름)로 나눈다. 방 이름에 숫자+"호"가 있으면
    // 배지에는 숫자만 보여준다(roomNumber). "호"가 안 붙고 숫자만 있는 경우(예: "먼슬리브오산_805",
    // "호" 없이 등록된 기기명)도 있어, 방 이름 전체가 숫자뿐이면 그것도 방 번호로 인정한다 —
    // 안 그러면 실제 지점 연결 시 방 번호로 매칭이 안 돼 입실자 유무를 확인할 수 없다("3층현관"처럼
    // 숫자 외 다른 글자가 섞인 공용구역은 여전히 매칭되지 않는다).
    const parts = doorlockSplitDeviceName(deviceName);
    const branchGroup = applyDoorlockBuildingSplit(parts.branch, deviceName);
    const roomMatch = parts.room.match(/(\d+)\s*호/) || parts.room.match(/^(\d+)$/);
    const roomNumber = roomMatch ? roomMatch[1] : '';
    records.push({ id: serial, deviceName, serial, affiliation, spaceName, ssid, battery, lastConnected, connected, owner, branchGroup, roomText: parts.room, roomNumber });
    i = j;
  }
  return records;
}
function importDoorlockRecords(records, onImported){
  if(!records || records.length===0){
    showAlert('인식된 도어락 데이터가 없습니다. 표 전체(헤더 포함)를 그대로 붙여넣었는지 확인해주세요.');
    return;
  }
  const prevRecords = DB.doorlocks || [];
  // 이전에 붙여넣은 데이터가 있으면(최초 등록이 아니면) 비교 기준으로 남겨둔다 — 매번 새로
  // 붙여넣을 때마다 "지난 붙여넣기 대비" 스냅샷이 한 단계씩 앞으로 이동한다.
  if(prevRecords.length > 0){
    DB.doorlockPrevSnapshot = { date: DB.doorlockImportDate || '이전', records: prevRecords };
  }
  // 상단 "처리 방법별 방 목록"(아톡/청소방/현장출동)은 새 데이터를 붙여넣을 때마다 통째로
  // 초기화한다 — 예전엔 미연결->연결로 정상화된 기기의 태그만 선택적으로 지웠지만, 매번
  // 새로 붙여넣는 시점에 이전 처리 방법 표시는 모두 리셋해달라는 요청으로 전체 초기화로
  // 바뀌었다. 지점명 수정(doorlockBranchNameOverrides)·특이사항 메모(doorlockBranchNotes)는
  // 이 초기화 대상이 아니며 기존 규칙대로 계속 유지된다.
  DB.doorlockActionTags = {};
  DB.doorlocks = records;
  DB.doorlockImportDate = localDateKey();
  // 최근 5일치 히스토리를 남겨서 화살표로 지난 날짜를 넘겨볼 수 있게 한다(오래된 순).
  // 같은 날 여러 번 붙여넣으면 그날 기록만 최신 내용으로 갱신한다.
  if(!DB.doorlockHistory) DB.doorlockHistory = [];
  const lastEntry = DB.doorlockHistory[DB.doorlockHistory.length - 1];
  // 특이사항 메모(doorlockBranchNotes)는 actionTags와 달리 붙여넣기로 초기화되지 않고 계속
  // 이어지는 값이지만, "그날의 메모가 무엇이었는지"도 actionTags처럼 그날 히스토리 항목에
  // 얼려서 남겨둔다 — 그래야 화살표로 지난 날짜를 봐도 그날 실제로 적혀 있던 메모를 보여줄 수
  // 있고, 오늘 메모를 고쳐도 이미 지나간 날짜의 기록은 그대로 유지된다.
  if(lastEntry && lastEntry.date === DB.doorlockImportDate){
    lastEntry.records = records;
    lastEntry.actionTags = DB.doorlockActionTags;
    lastEntry.branchNotes = DB.doorlockBranchNotes || {};
  } else {
    DB.doorlockHistory.push({ date: DB.doorlockImportDate, records, actionTags: DB.doorlockActionTags, branchNotes: DB.doorlockBranchNotes || {} });
    if(DB.doorlockHistory.length > 5) DB.doorlockHistory.shift();
  }
  logChange(`도어락 데이터 붙여넣기: ${records.length}건 갱신`);
  saveDoorlockState();
  syncDoorlockPublicMirror();
  render();
  if(onImported) onImported();
}
// 도어락 데이터의 실제 저장소(DOORLOCK_DOC)에 지금 DB에 있는 도어락 관련 필드를 통째로 쓴다.
// FIRESTORE_DOC(지점/호실/입실자)와 분리된 별도 문서라 트랜잭션 충돌 검사는 두지 않았다 — 도어락
// 데이터는 보통 한 번에 한 사람이 붙여넣고, 마지막에 쓴 내용이 이기는 정도로 충분하다. 실패하면

// 히스토리에서 offsetFromLatest(0=최신)만큼 과거로 이동한 스냅샷과, 그 비교 기준(하루 전)이 될
// 스냅샷을 함께 반환한다. 히스토리가 비어 있으면 null.
function getDoorlockSnapshotAt(offsetFromLatest){
  const hist = DB.doorlockHistory || [];
  if(hist.length === 0) return null;
  const idx = hist.length - 1 - offsetFromLatest;
  if(idx < 0 || idx >= hist.length) return null;
  const current = hist[idx];
  const prev = idx > 0 ? hist[idx-1] : null;
  // 오늘(offsetFromLatest===0)은 항상 DB.doorlockActionTags(라이브 값)를 우선한다 — 히스토리
  // 항목의 actionTags는 원래 그 라이브 값을 그대로 미러링해두는 캐시일 뿐인데, 오래된 탭이
  // 배포 전 코드로 태그만 바꾸고 히스토리 쪽 동기화를 안 하는 경우(코드가 그 동기화 호출을
  // 아직 모르는 상태) 등으로 어긋날 수 있다. 과거 날짜는 그 시점의 값 외엔 알 방법이 없으므로
  // current.actionTags를 그대로 쓴다.
  const actionTags = offsetFromLatest === 0 ? (DB.doorlockActionTags || {}) : (current.actionTags || {});
  // 특이사항 메모도 actionTags와 같은 이유로 오늘은 항상 라이브 값(DB.doorlockBranchNotes)을
  // 우선한다 — 히스토리 항목의 branchNotes는 얼려둔 캐시일 뿐이라, 오늘 메모를 수정한 직후에는
  // (동기화 호출 전이거나 옛 코드가 실행 중인 탭이면) 캐시가 아직 갱신 전일 수 있다. 지나간
  // 날짜는 그 시점에 얼려둔 값 외엔 알 방법이 없으므로 current.branchNotes를 그대로 쓴다.
  const branchNotes = offsetFromLatest === 0 ? (DB.doorlockBranchNotes || {}) : (current.branchNotes || {});
  return { date: current.date, records: current.records, prevRecords: prev ? prev.records : null, actionTags, branchNotes };
}

// 다음 붙여넣기에도 같은 기기를 계속 추적할 수 있고, 연결이 정상화되면 자동으로 해제된다

// Firestore 저장/로딩을 거치면 DB.doorlockBranchNotes와 히스토리 항목의 branchNotes가 서로
// 다른 객체가 되므로, 메모를 수정할 때마다 명시적으로 다시 동기화해야 한다.
function syncDoorlockBranchNotesToTodayHistory(){

// 마지막 연결(lastConnected, "YYYY-MM-DD HH:MM:SS")로부터 오늘까지 며칠 지났는지. 연결 기록이
// 아예 없거나 날짜를 못 읽으면 가장 오래된 것으로 취급한다(Infinity) — 기록이 없다는 것 자체가
// 이미 한참 방치됐다는 뜻이므로.
function doorlockDaysSinceLastConnected(record){
  if(!record.lastConnected) return Infinity;
  const parsed = new Date(record.lastConnected.slice(0, 10));
  if(isNaN(parsed.getTime())) return Infinity;
  return Math.round((new Date(todayISO()) - parsed) / 86400000);
}
const DOORLOCK_LONG_OVERDUE_DAYS = 30;
// 직전 붙여넣기(doorlockPrevSnapshot) 대비 현재 미연결 기기의 상태를 분류한다.
// existing: 그때도 미연결·지금도 미연결 / new: 그때는 괜찮았는데 지금 미연결(또는 신규 기기) /
// longOverdue: existing인데 마지막 연결로부터 30일 이상 지난 것(장기 미연결, 회색으로 구분).
// "정상 연결됨"(그때 미연결이었는데 지금은 연결됨)은 이 목록에 섞지 않고 상단의 별도
// 카드(renderDoorlockResolvedSection)에서 하루만 보여준 뒤 자연히 빠진다.
function computeDoorlockChipList(records, prevRecords){
  const prevBySerial = new Map((prevRecords || []).map(r=>[r.serial, r]));
  const chips = [];
  records.forEach(r=>{
    if(!r.connected){
      const prev = prevBySerial.get(r.serial);
      const isExisting = !!(prev && prev.connected===false);
      let status;
      if(isExisting && doorlockDaysSinceLastConnected(r) >= DOORLOCK_LONG_OVERDUE_DAYS) status = 'longOverdue';
      else status = isExisting ? 'existing' : 'new';
      chips.push({ record: r, status });
    }
  });
  return chips;
}
// 기존(existing)과 신규(new)가 둘 다 따뜻한 톤(amber/red)이라 구분이 잘 안 된다는 피드백으로,
// 기존은 차가운 톤(cyan)으로 바꿔 신규(red)와 뚜렷이 대비되게 했다. 장기 미연결은 회색
// (--st-vacant, 공실 배지와 같은 색을 재사용 — 새 CSS 변수를 추가하지 않아도 됨).
const DOORLOCK_STATUS_COLORS = {

  new: { bg:'var(--st-hold-bg)', fg:'var(--st-hold)' },
